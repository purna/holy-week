<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
  <title id="title">Holy Week solved seal</title>
  <desc id="desc">A deep red wax seal impressed with the gold cross from the Holy Week emblem.</desc>
  <defs>
    <radialGradient id="wax" cx="31%" cy="25%" r="91%">
      <stop offset="0" stop-color="#b62d35"/>
      <stop offset=".46" stop-color="#81141a"/>
      <stop offset="1" stop-color="#3b0508"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0bd"/>
      <stop offset=".42" stop-color="#f5c842"/>
      <stop offset="1" stop-color="#b67822"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#130103" flood-opacity=".62"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation=".75"/>
    </filter>
    <path id="wax-edge" d="M100 15c19-3 29 10 43 3 15-8 29 5 26 25-3 16 15 22 18 40 3 19-15 28-5 44 8 14-8 28-22 24-9-2-13 16-31 20-16 3-22 18-40 11-14-5-10-22-28-24-16-2-26 10-34-8-8-16 6-26-4-42-8-14 6-24 2-42-4-18 14-22 18-38 4-14 20-8 34-14 10-4 16 3 23 1Z"/>
  </defs>

  <g filter="url(#shadow)">
    <use href="#wax-edge" fill="url(#wax)"/>
    <path d="M47 46c23-23 65-31 96-9" fill="none" stroke="#ffd8c1" stroke-width="9" stroke-linecap="round" opacity=".13" filter="url(#soft)"/>
    <path d="M153 145c-22 24-63 31-94 10" fill="none" stroke="#190204" stroke-width="12" stroke-linecap="round" opacity=".25" filter="url(#soft)"/>

    <circle cx="100" cy="100" r="61" fill="url(#wax)" stroke="#4c080c" stroke-width="4"/>
    <circle cx="100" cy="100" r="55" fill="none" stroke="#f5c842" stroke-width="2.5" opacity=".68"/>
    <circle cx="100" cy="100" r="49" fill="none" stroke="#2a0306" stroke-width="2" opacity=".7"/>

    <g transform="rotate(5 100 100)">
      <path d="M97 59h9v29h25v10h-25v45H97V98H72V88h25Z" fill="#230306" opacity=".55" transform="translate(2.5 3.5)"/>
      <path d="M97 59h9v29h25v10h-25v45H97V98H72V88h25Z" fill="url(#gold)"/>
      <path d="M99 62h3v28H74v3h28v47h3V95h23v-3h-23V62Z" fill="#fff5d4" opacity=".48"/>
    </g>

    <path d="M58 127c-7-8-11-17-13-27m18 34c-7-3-13-7-18-12m12-29-10-5m13 17-13 1m19 10-11 6" fill="none" stroke="#dcae4c" stroke-width="3" stroke-linecap="round" opacity=".75"/>
    <path d="M142 127c7-8 11-17 13-27m-18 34c7-3 13-7 18-12m-12-29 10-5m-13 17 13 1m-19 10 11 6" fill="none" stroke="#dcae4c" stroke-width="3" stroke-linecap="round" opacity=".75"/>
  </g>
</svg>
