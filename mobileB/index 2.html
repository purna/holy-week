    <style>
        /* Compact Action Buttons Styling */
        #panel-actions {
            position: fixed !important;
            bottom: 33.33vh;
            left: 50%;
            top: auto !important;
            right: auto !important;
            background: none !important;
            backdrop-filter: none !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin: 0 !important;
            overflow: visible !important;
            width: auto !important;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            transform: translateX(-50%) scale(0.9) !important;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 1100;
        }
        #panel-actions.open {
            opacity: 1;
            transform: translateX(-50%) scale(1) !important;
            pointer-events: auto;
        }
        #panel-actions h3 {
            display: none; /* Hide 'ACTIONS' title to keep it clean */
        }
        #actions-list {
            display: flex;
            
            flex-direction: row;
            gap: 8px;
            padding: 0;
        }
        .action-item-btn {
            width: 48px;
            height: 48px;
            position: relative;
            background: var(--panel-bg);
            border: 1px solid rgba(100, 255, 218, 0.4);
            color: #64ffda;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(100, 255, 218, 0.1);
        }
        .action-item-btn:hover {
            background: rgba(100, 255, 218, 0.2);
            border-color: #64ffda;
            transform: translateY(-2px);
        }

        /* ═══════════════════════════════════════════
           MOBILE CONTROLLER STYLES
        ═══════════════════════════════════════════ */
        :root {
            --btn-sz: clamp(44px, 10vmin, 56px);
        }

        #mobile-ctrl {
            position: fixed;
            bottom: 40px;
            left: 40px;
            width: 160px;
            height: 160px;
            z-index: 1000;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(100, 255, 218, 0.05);
            border-radius: 50%;
            display: none; /* Hidden on desktop by default */
        }

        @media (max-width: 1024px) {
            #mobile-ctrl.visible { display: block; }
        }

        @media (max-width: 480px) {
            #mobile-ctrl {
                left: auto;
                right: 20px;
                bottom: 80px;
            }
        }

        #mobile-ctrl .ui-toggle {
            position: absolute;
            pointer-events: auto;
            margin: 0;
            width: var(--btn-sz);
            height: var(--btn-sz);
            background: rgba(8, 6, 4, 0.85);
            border: 1px solid rgba(100, 255, 218, 0.18);
            color: #64ffda;
            cursor: pointer;
            font-size: 1.15em;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s;
            box-shadow: 0 0 10px rgba(100, 255, 218, 0.25);
        }

        #ctrl-up { top: 0; left: calc(50% - (var(--btn-sz) / 2)); }
        #ctrl-down { bottom: 0; left: calc(50% - (var(--btn-sz) / 2)); }
        #ctrl-left { left: 0; top: calc(50% - (var(--btn-sz) / 2)); }
        #ctrl-right { right: 0; top: calc(50% - (var(--btn-sz) / 2)); }
        #ctrl-jump { 
            top: calc(50% - (var(--btn-sz) / 2)); 
            left: calc(50% - (var(--btn-sz) / 2)); 
            background: rgba(100, 255, 218, 0.15); 
        }

        #mobile-ctrl .ui-toggle.active {
            background: rgba(100, 255, 218, 0.2);
            border-color: #64ffda;
        }
    </style>
</head>

<body>

    <!-- Import Map for Three.js and Cannon-es -->

    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",

    <script type="module">
        // Mobile control setup and Point-and-Click integration
        // Derived from tests/mobile.html to bridge the UI with main game logic
        
        window.gameKeys = window.gameKeys || {};

        window.setupMobileControls = () => {
            const ctrl = document.getElementById('mobile-ctrl');
            if (ctrl) ctrl.classList.add('visible');

            if (!window.gameKeys) window.gameKeys = {};
            const bind = (id, code) => {
                const el = document.getElementById(id);
                if (!el) return;
                const start = (e) => { 
                    e.preventDefault(); e.stopPropagation(); 
                    if(window.gameKeys) window.gameKeys[code] = true; 
                    el.classList.add('active'); 
                };
                const end = (e) => { 
                    e.preventDefault(); e.stopPropagation(); 
                    if(window.gameKeys) delete window.gameKeys[code]; 
                    el.classList.remove('active'); 
                    // Stop any point-and-click movement when WASD interaction stops
                    window.mouseTarget = null;
                };
                el.addEventListener('touchstart', start); el.addEventListener('touchend', end);
                el.addEventListener('mousedown', start); el.addEventListener('mouseup', end); el.addEventListener('mouseleave', end);
            };
            
            bind('ctrl-up', 'KeyW'); bind('ctrl-down', 'KeyS');
            bind('ctrl-left', 'KeyA'); bind('ctrl-right', 'KeyD');

            const jEl = document.getElementById('ctrl-jump');
            if (jEl) {
                const jumpStart = (e) => { 
                    e.preventDefault(); e.stopPropagation(); 
                    if(window.gameKeys) window.gameKeys['Space'] = true; 
                    window.dispatchEvent(new CustomEvent('game-jump'));
                    jEl.classList.add('active'); 
                };
                const jumpEnd = (e) => { 
                    e.preventDefault(); e.stopPropagation(); 
                    if(window.gameKeys) delete window.gameKeys['Space']; 
                    jEl.classList.remove('active'); 
                };
                jEl.addEventListener('touchstart', jumpStart);
                jEl.addEventListener('touchend', jumpEnd);
                jEl.addEventListener('mousedown', jumpStart);
                jEl.addEventListener('mouseup', jumpEnd);
            }
        };

        // Point and Click Interaction Logic
        const handleInteraction = (x, y, target) => {
            // Filter out interactions on UI overlays or buttons
            if (target.closest('button, a, .ui-toggle, .panel, .overlay, .interact-prompt, .npc-bubble, #local-dialogue-box, #board-overlay, #level-select-overlay, #mobile-ctrl')) return;

            // Dispatch event for main.js to perform raycasting against the planet
            window.dispatchEvent(new CustomEvent('world-click', { detail: { x, y } }));
        };

        window.addEventListener('mousedown', e => handleInteraction(e.clientX, e.clientY, e.target));
        window.addEventListener('touchstart', e => {
            if (e.touches.length > 0) handleInteraction(e.touches[0].clientX, e.touches[0].clientY, e.target);
        }, { passive: false });

        // Auto-initialize when START button is clicked
        document.getElementById('btn-start')?.addEventListener('click', () => {
            // Delay slightly to match the start transition timing
            setTimeout(window.setupMobileControls, 1000);
        });
    </script>
