<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API.Bible Sandbox Engine</title>
    <!-- FontAwesome for standard UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #121214;
            --bg-surface: #1e1e24;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-success: #10b981;
            --accent-error: #ef4444;
            --border: #334155;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Mock Canvas/HUD Environment Layout */
        .sandbox-container {
            text-align: center;
            padding: 40px;
            border: 1px dashed var(--border);
            border-radius: 8px;
            background: #18181b;
            max-width: 500px;
            width: 90%;
        }

        .controls-row {
            margin: 15px 0 25px 0;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        select, .trigger-btn {
            background: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:focus, .trigger-btn:hover {
            border-color: var(--accent);
        }

        .trigger-btn {
            background: var(--accent);
            border-color: var(--accent);
            font-weight: 500;
        }

        .trigger-btn:hover {
            background: var(--accent-hover);
        }

        /* Modal Overlay Engine Styles */
        .overlay-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: none; /* Controlled via JS */
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .modal-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 90%;
            max-width: 550px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            animation: modalSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes modalSlideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .badge {
            background: var(--border);
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 8px;
        }

        .close-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
        }

        .close-icon-btn:hover {
            color: var(--accent-error);
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
        }

        /* Verse Streaming Classes */
        .current-v {
            font-size: 1.05rem;
            line-height: 1.6;
            margin: 0 0 16px 0;
        }

        .context-v {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-muted);
            border-left: 2px solid var(--accent-success);
            padding-left: 12px;
            margin: 0 0 12px 0;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-4px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .terminal-btn {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .terminal-btn:hover:not(:disabled) {
            background: rgba(59, 130, 246, 0.1);
        }

        .terminal-btn:disabled {
            color: var(--text-muted);
            border-color: var(--border);
            cursor: not-allowed;
        }

        /* Loading Spinner Animation */
        .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Target Sandbox Workspace Dashboard -->
    <div class="sandbox-container">
        <h2 style="margin-top:0; font-size:1.3rem;">Prophecy Gateway Simulation</h2>
        <p style="color:var(--text-muted); font-size:0.85rem;">Select your parameters to fetch structural runtime data from API.Bible servers.</p>
        
        <div class="controls-row">
            <select id="translation-selector" onchange="window.AppEngine.updateTranslation(this.value)">
                <option value="NIV">New International Version (NIV)</option>
                <option value="GNT">Good News Translation (GNT)</option>
            </select>
            
            <button class="trigger-btn" onclick="window.AppEngine.displayDeepPassage('ZECH_9_9')">
                Read More (Zechariah 9:9)
            </button>
        </div>
    </div>

    <!-- Context Modal Overlay -->
    <div id="passage-overlay" class="overlay-mask" onclick="window.AppEngine.closeOverlay(event)">
        <div class="modal-panel" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div>
                    <span id="passage-ref-title">Verse Reference</span>
                    <span id="passage-version-lbl" class="badge">NIV</span>
                </div>
                <button class="close-icon-btn" onclick="window.AppEngine.closeOverlay(null)">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="passage-body" class="modal-body">
                <div id="passage-text-content">
                    <!-- Dynamic Stream Content Injector Target Matrix -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global API Configuration System Map
        const BIBLE_API_CONFIG = {
            apiKey: '40uwrV5VD_g7dxygwU-WK',
            baseUrl: 'https://api.bible/v1',
            translations: {
                NIV: 'de4e12af7c28f528-02', // API ID for New International Version
                GNT: 'c3154be53a35ca34-01'  // API ID for Good News Translation
            }
        };

        // Complete Application Processing Engine
        window.AppEngine = {
            selectedBibleTranslation: 'NIV',

            updateTranslation: function(val) {
                this.selectedBibleTranslation = val;
            },

            closeOverlay: function(event) {
                // If clicked out or explicitly via close button, drop layout visibility
                if (!event || event.target === document.getElementById('passage-overlay')) {
                    document.getElementById('passage-overlay').style.display = 'none';
                }
            },

            displayDeepPassage: async function(pKey) {
                // 1. Prepare UI State & Window References
                const contentArea = document.getElementById('passage-text-content');
                const titleArea = document.getElementById('passage-ref-title');
                const versionLabel = document.getElementById('passage-version-lbl');
                const overlay = document.getElementById('passage-overlay');

                titleArea.innerText = "Connecting to API.Bible...";
                versionLabel.innerText = this.selectedBibleTranslation;
                contentArea.innerHTML = `
                    <div style="text-align:center; padding:30px; color:var(--text-muted);">
                        <i class="fa-solid fa-circle-notch spinner" style="font-size:1.5rem; margin-bottom:10px; color:var(--accent);"></i>
                        <div>Fetching context trail...</div>
                    </div>
                `;
                overlay.style.display = 'flex';

                // Formats custom keys (e.g., 'ZECH_9_9') to standard API structures ('ZECH.9.9')
                const formattedVerseId = pKey.replace(/_/g, '.');
                const targetBibleId = BIBLE_API_CONFIG.translations[this.selectedBibleTranslation] || BIBLE_API_CONFIG.translations.NIV;

                // Track context position chain in processing memory closure
                let nextVerseId = null;

                try {
                    // 2. Query initial passage frame
                    const response = await fetch(`${BIBLE_API_CONFIG.baseUrl}/bibles/${targetBibleId}/verses/${formattedVerseId}?content-type=text`, {
                        method: 'GET',
                        headers: { 'api-key': BIBLE_API_CONFIG.apiKey }
                    });

                    if (!response.ok) throw new Error(`Server returned code verification status: ${response.status}`);
                    const result = await response.json();
                    
                    const currentData = result.data;
                    titleArea.innerText = currentData.reference; 
                    nextVerseId = currentData.next?.id; // Grab the target ID for sequential chaining

                    // Render dynamic DOM frame wrapper mapping inside viewport
                    contentArea.innerHTML = `
                        <p class="current-v">
                            <strong>${currentData.reference}</strong> ${currentData.content}
                        </p>
                        <div id="extended-verses"></div>
                        
                        ${nextVerseId ? `
                            <button id="btn-load-next-verse" class="terminal-btn">
                                <i class="fa-solid fa-arrow-down"></i> Read Next Verse
                            </button>
                        ` : ''}
                    `;

                    // 3. Chain handling sequence logic thread block
                    if (nextVerseId) {
                        document.getElementById('btn-load-next-verse').onclick = async (e) => {
                            const targetButton = e.currentTarget;
                            targetButton.disabled = true;
                            targetButton.innerHTML = `<i class="fa-solid fa-circle-notch spinner"></i> Streaming...`;

                            try {
                                // Request sequential verse via captured target frame parameter
                                const nextResponse = await fetch(`${BIBLE_API_CONFIG.baseUrl}/bibles/${targetBibleId}/verses/${nextVerseId}?content-type=text`, {
                                    method: 'GET',
                                    headers: { 'api-key': BIBLE_API_CONFIG.apiKey }
                                });

                                if (!nextResponse.ok) throw new Error("Chaining failure exception.");
                                const nextResult = await nextResponse.json();
                                const nextData = nextResult.data;

                                // Build sub-element block and append safely
                                const extendedArea = document.getElementById('extended-verses');
                                const paragraph = document.createElement('p');
                                paragraph.className = 'context-v';
                                paragraph.innerHTML = `<strong>${nextData.reference}</strong> ${nextData.content}`;
                                extendedArea.appendChild(paragraph);

                                // Update pointer assignment reference to check for further continuity
                                nextVerseId = nextData.next?.id;

                                if (!nextVerseId) {
                                    targetButton.remove(); // End of text node array boundary met
                                } else {
                                    targetButton.disabled = false;
                                    targetButton.innerHTML = `<i class="fa-solid fa-arrow-down"></i> Read Next Verse`;
                                }

                            } catch (err) {
                                console.error("Pipeline breakdown:", err);
                                targetButton.innerHTML = `<span style="color:var(--accent-error);">Error loading verse</span>`;
                                targetButton.disabled = false;
                            }
                        };
                    }

                } catch (error) {
                    console.error("API Context Exception:", error);
                    contentArea.innerHTML = `
                        <div style="color:var(--accent-error); padding:10px; text-align:center; border:1px solid rgba(239,68,68,0.2); border-radius:6px; background:rgba(239,68,68,0.05);">
                            <i class="fa-solid fa-triangle-exclamation" style="font-size:1.2rem; margin-bottom:6px;"></i>
                            <p style="margin:4px 0; font-size:0.9rem;">Failed to fetch live content.</p>
                            <small style="color:var(--text-muted); font-size:0.75rem;">${error.message}</small>
                        </div>
                    `;
                }
            }
        };
    </script>
</body>
</html>
