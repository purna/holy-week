<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earth + City Model Test</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --btn-sz: clamp(44px, 10vmin, 56px);
    }

    body {
      margin: 0;
      background-color: #050505;
      overflow: hidden;
      font-family: 'Source Code Pro', monospace;
      user-select: none;
    }

    #info {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: #00ffaa;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(0, 255, 170, 0.5);
      letter-spacing: 2px;
      font-size: 0.8rem;
      z-index: 100;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 1000;
      text-align: center;
      background: rgba(0, 0, 0, 0.95);
    }

    #start-screen h1 {
      color: #00f2ff;
      font-size: 3em;
      margin: 0;
      letter-spacing: 8px;
    }

    #start-screen p {
      color: #00f2ff;
      font-size: 1.1em;
      margin-bottom: 30px;
      opacity: 0.6;
      letter-spacing: 3px;
    }

    button#btn-start {
      background: #00f2ff;
      border: none;
      padding: 15px 40px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.2em;
      color: black;
    }

    #wipe-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #050505;
      z-index: 2000;
      pointer-events: none;
      transform: translateX(-100%);
    }

    #wipe-overlay.active {
      animation: wipe-in 1s ease-in-out forwards;
    }

    @keyframes wipe-in {
      0%   { transform: translateX(-100%); }
      50%  { transform: translateX(0); }
      100% { transform: translateX(100%); }
    }

    /* ═══════════════════════════════════════════
       MOBILE COMPASS CONTROLLER
    ═══════════════════════════════════════════ */
    #mobile-ctrl {
      position: fixed;
      bottom: 40px;
      left: 40px;
      width: 160px;
      height: 160px;
      z-index: 1000;
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(0, 242, 255, 0.05);
      border-radius: 50%;
    }

    .ctrl-btn {
      position: absolute;
      width: var(--btn-sz);
      height: var(--btn-sz);
      min-width: 44px;
      min-height: 44px;
      background: rgba(5, 5, 5, 0.85);
      border: 1px solid rgba(0, 242, 255, 0.18);
      color: #00f2ff;
      cursor: pointer;
      font-size: 1.15em;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
      box-shadow: 0 0 10px rgba(0, 242, 255, 0.15);
      pointer-events: auto;
      margin: 0;
      touch-action: none;
    }

    .ctrl-btn:active,
    .ctrl-btn.active {
      background: rgba(0, 242, 255, 0.2);
      border-color: #00f2ff;
      transform: scale(0.9);
    }

    #ctrl-up    { top: 0;    left: calc(50% - (var(--btn-sz) / 2)); }
    #ctrl-down  { bottom: 0; left: calc(50% - (var(--btn-sz) / 2)); }
    #ctrl-left  { left: 0;   top:  calc(50% - (var(--btn-sz) / 2)); }
    #ctrl-right { right: 0;  top:  calc(50% - (var(--btn-sz) / 2)); }
    #ctrl-jump  {
      top:  calc(50% - (var(--btn-sz) / 2));
      left: calc(50% - (var(--btn-sz) / 2));
      background: rgba(0, 242, 255, 0.15);
    }
  </style>
</head>
<body>
  <div id="start-screen" class="overlay">
    <h1>EARTH + CITY</h1>
    <p>WALK THE GLOBE · EXPLORE THE CITY</p>
    <button id="btn-start">START</button>
  </div>

  <div id="info">LOADING ARTWORK/earth.glb &amp; artwork/city.glb ...</div>
  <div id="wipe-overlay"></div>

  <!-- ══════════════ MOBILE CONTROLLER ══════════════ -->
  <div id="mobile-ctrl">
    <button id="ctrl-up"    class="ctrl-btn"><i class="fas fa-chevron-up"></i></button>
    <button id="ctrl-left"  class="ctrl-btn"><i class="fas fa-chevron-left"></i></button>
    <button id="ctrl-jump"  class="ctrl-btn"><i class="fas fa-circle"></i></button>
    <button id="ctrl-down"  class="ctrl-btn"><i class="fas fa-chevron-down"></i></button>
    <button id="ctrl-right" class="ctrl-btn"><i class="fas fa-chevron-right"></i></button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import * as CANNON from 'cannon-es';

    // ───────────── Renderer / Camera / Scene ─────────────
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 20000);
    camera.position.set(0, 0, 500);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const sun = new THREE.DirectionalLight(0xffffff, 2.5);
    sun.position.set(5, 10, 5);
    sun.castShadow = true;
    scene.add(sun);

    // ───────────── Physics World ─────────────
    const world = new CANNON.World();
    world.gravity.set(0, 0, 0);
    world.solver.iterations = 15;

    // ───────────── Game State ─────────────
    let started = false;
    const keys = {};
    let mouseTarget = null;
    let playerForward = new THREE.Vector3(0, 0, 1); // Represents player's forward direction
    let canJump = true;
    
    // Will be set after GLB measurement
    let nativePlanetRadius = null;   // exact radius from earth.glb Sphere.001

    // ───────────── Player ─────────────
    const playerMesh = new THREE.Group();
    const playerVisual = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, 1.8, 0.8),
      new THREE.MeshStandardMaterial({ color: 0x00ffcc })
    );
    playerVisual.castShadow = true;
    playerMesh.add(playerVisual);
    scene.add(playerMesh);

    // Body is small — planet shape is the ground.
    const pBody = new CANNON.Body({
      mass: 1,
      shape: new CANNON.Box(new CANNON.Vec3(0.4, 0.9, 0.4)),
      fixedRotation: true,
      linearDamping: 0.85
    });
    world.addBody(pBody);

    // ───────────── HELPERS ─────────────
    function measureMesh(obj) {
      const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      return {
        box,
        size,
        center,
        diameter: maxDim,
        radius: maxDim / 2
      };
    }

    // ───────────── Load earth.glb ─────────────
    const info = document.getElementById('info');
    const loader = new GLTFLoader();
    let earthModel = null;
    let cityModel = null;
    let planetBody = null;

    loader.load('../artwork/earth.glb', (gltfEarth) => {
      info.innerText = 'artwork/earth.glb LOADED — measuring...';
      earthModel = gltfEarth.scene;
      scene.add(earthModel);
      earthModel.updateMatrixWorld(true);

      // Find the mesh named Sphere.001
      let sphereMesh = null;
      earthModel.traverse((c) => {
        if (c.isMesh && (!c.name || c.name === '' || c.name === 'Sphere.001')) {
          sphereMesh = c;
        }
      });

      if (!sphereMesh) {
        // Fallback: measure first mesh
        earthModel.traverse((c) => { if (c.isMesh && !sphereMesh) sphereMesh = c; });
      }

      const m = measureMesh(sphereMesh);
      nativePlanetRadius = m.radius;
      console.log('[earth] center:', m.center.toArray().map(v => v.toFixed(4)).join(', '));
      console.log('[earth] size:', m.size.toArray().map(v => v.toFixed(4)).join(', '));

      info.innerText = `EARTH measured — native radius = ${nativePlanetRadius.toFixed(4)} units. Loading city...`;

      // Build CANNON.Sphere at native size
      planetBody = new CANNON.Body({
        mass: 0,
        shape: new CANNON.Sphere(nativePlanetRadius)
      });
      world.addBody(planetBody);

      // ───────────── Load city.glb ─────────────
      loader.load('../artwork/city.glb', (gltfCity) => {
        info.innerText = 'artwork/city.glb LOADED — building trimesh colliders';
        cityModel = gltfCity.scene;
        cityModel.updateMatrixWorld(true);
        scene.add(cityModel);

        let colliderCount = 0;
        let totalVerts = 0;

        cityModel.traverse((child) => {
          if (!child.isMesh) return;
          const geom = child.geometry;
          if (!geom.index) {
            console.warn('City mesh missing index, skipping:', child.name);
            return;
          }

          // Clone geometry and bake world transform
          const baked = geom.clone();
          child.updateWorldMatrix(true, false);
          baked.applyMatrix4(child.matrixWorld);
          baked.computeVertexNormals();

          const pos = baked.attributes.position;
          const idx = baked.index;
          totalVerts += pos.count;

          const verts = new Float32Array(pos.count * 3);
          for (let i = 0; i < pos.count * 3; i++) {
            verts[i] = pos.array[i];
          }

          const triMesh = new CANNON.Trimesh(
            verts,
            new Uint32Array(idx.array)
          );

          const body = new CANNON.Body({ mass: 0 });
          body.addShape(triMesh);
          world.addBody(body);
          colliderCount++;
        });

        console.log(`[city] ${colliderCount} Trimesh colliders, ${totalVerts} total vertices`);

        // ── Choose a safe spawn point on the planet surface ──
        const raycaster = new THREE.Raycaster();
        const outward = new THREE.Vector3();

        function isSurfaceClear(candidate) {
          outward.copy(candidate).normalize();
          raycaster.set(candidate, outward);
          raycaster.near = 2;
          raycaster.far = 25;
          const hits = raycaster.intersectObjects(cityModel.children, true);
          return hits.length === 0;
        }

        const candidates = []; const numCandidates = 48; const phi = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < numCandidates; i++) { const y = 1 - (i / (numCandidates - 1)) * 2; const rAtY = Math.sqrt(1 - y * y); const theta = phi * i;
          candidates.push(new THREE.Vector3(
            Math.cos(theta) * rAtY,
            y,
            Math.sin(theta) * rAtY
          ).multiplyScalar(nativePlanetRadius));
        }

        let startPos = candidates[0];
        for (const cand of candidates) {
          if (isSurfaceClear(cand)) {
            startPos = cand;
            break;
          }
        }

        startPos.normalize().multiplyScalar(nativePlanetRadius + 3);
        pBody.position.set(startPos.x, startPos.y, startPos.z);
        playerMesh.position.copy(startPos);
        console.log('[spawn] player start:', startPos.toArray().map(v => v.toFixed(4)).join(', '));

        info.innerText = 'READY — click START to walk the Earth &amp; explore the city';
        animate();
      }, undefined, (err) => {
        console.error('city.glb load failed:', err);
        info.innerText = 'ERROR loading city.glb — check console';
      });

    }, undefined, (err) => {
      console.error('earth.glb load failed:', err);
      info.innerText = 'ERROR loading earth.glb — check console';
    });

    // ───────────── Animation Loop ─────────────
    function animate() {
      requestAnimationFrame(animate);

      if (!started || !nativePlanetRadius || !planetBody) {
        renderer.render(scene, camera);
        return;
      }

      world.step(1 / 60);

      // Gravity: toward planet center
      const pPos = new THREE.Vector3(pBody.position.x, pBody.position.y, pBody.position.z);
      const planetCenterCannon = planetBody.position;
      const toPlanet = new CANNON.Vec3(
        planetCenterCannon.x - pPos.x,
        planetCenterCannon.y - pPos.y,
        planetCenterCannon.z - pPos.z
      );
      const dist = toPlanet.length();
      toPlanet.normalize();

      // Apply sticky gravity force directly to player
      pBody.applyForce(toPlanet.clone().scale(75), pBody.position);

      // Ground check on native planet surface
      if (dist < nativePlanetRadius + 1.5) {
        canJump = true;
      }

      // Ensure playerForward is always projected onto the tangent plane
      playerForward.projectOnPlane(up).normalize();

      let moveInput = new THREE.Vector3(0, 0, 0); // Desired movement direction from input
      let rotationAmount = 0; // For A/D rotation
      const playerSpeed = 18;
      const up = pPos.clone().sub(new THREE.Vector3(planetBody.position.x, planetBody.position.y, planetBody.position.z)).normalize();

      const rotationSpeed = 0.05; // Adjust as needed

      // Handle A/D for rotation
      if (keys['KeyA'] || keys['ArrowLeft']) {
        rotationAmount += rotationSpeed;
      }
      if (keys['KeyD'] || keys['ArrowRight']) {
        rotationAmount -= rotationSpeed;
      }

      if (rotationAmount !== 0) {
        const quaternion = new THREE.Quaternion().setFromAxisAngle(up, rotationAmount);
        playerForward.applyQuaternion(quaternion).normalize();
      }

      // Handle W/S for forward/backward movement
      if (keys['KeyW'] || keys['ArrowUp']) {
        moveInput.add(playerForward);
      }
      if (keys['KeyS'] || keys['ArrowDown']) {
        moveInput.sub(playerForward);
      }

      // Point-and-click movement (overrides WASD if active)
      if (mouseTarget) {
        const tm = mouseTarget.clone().sub(pPos).projectOnPlane(up);
        if (tm.length() > 2) {
          moveInput.add(tm.normalize());
          // If moving by click, also orient playerForward towards the target
          playerForward.lerp(tm.normalize(), 0.1).normalize();
        } else {
          mouseTarget = null;
        }
      }

      if (moveInput.lengthSq() > 0) {
        moveInput.normalize();

        // Stickier movement: set velocity directly, preserving radial (gravity/jump) velocity
        const radialVel = new THREE.Vector3(pBody.velocity.x, pBody.velocity.y, pBody.velocity.z).dot(up);
        const tangentVel = moveInput.clone().multiplyScalar(playerSpeed);
        pBody.velocity.set(
          tangentVel.x + up.x * radialVel,
          tangentVel.y + up.y * radialVel,
          tangentVel.z + up.z * radialVel
        );
      } else {
        // If no movement input, apply damping to horizontal velocity to stop sliding
        const currentVel = new THREE.Vector3().copy(pBody.velocity);
        const currentRadialVel = currentVel.dot(up);
        const currentTangentVel = currentVel.clone().projectOnPlane(up);
        currentTangentVel.multiplyScalar(0.9); // Apply damping to horizontal movement
        pBody.velocity.set(
            currentTangentVel.x + up.x * currentRadialVel,
            currentTangentVel.y + up.y * currentRadialVel,
            currentTangentVel.z + up.z * currentRadialVel
        );
      }

      playerMesh.position.copy(pBody.position);
      playerMesh.up.copy(up);
      playerMesh.lookAt(pPos.clone().add(playerForward)); // Player looks in its forward direction

      camera.up.copy(up);
      // Camera target should be slightly behind and above the player, looking at the player
      const cameraOffset = playerForward.clone().multiplyScalar(-30).add(up.clone().multiplyScalar(16));
      const targetCamPos = pPos.clone().add(cameraOffset);

      if (!isNaN(targetCamPos.x)) camera.position.lerp(targetCamPos, 0.05);
      camera.lookAt(pPos.clone().add(playerForward.clone().multiplyScalar(5))); // Camera looks slightly ahead of player

      renderer.render(scene, camera);
    }

    // ───────────── Input ─────────────
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const beep = (f, t='sine', d=0.1) => {
      if (audioCtx.state === 'suspended') return;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = t; osc.frequency.setValueAtTime(f, audioCtx.currentTime);
      g.gain.setValueAtTime(0.05, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + d);
    };

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space' && canJump && started) {
        const pPos = new THREE.Vector3(pBody.position.x, pBody.position.y, pBody.position.z);
        const up = pPos.clone().sub(new THREE.Vector3(planetBody.position.x, planetBody.position.y, planetBody.position.z)).normalize();
        const jumpImpulse = 12;
        pBody.applyImpulse(new CANNON.Vec3(up.x * jumpImpulse, up.y * jumpImpulse, up.z * jumpImpulse), pBody.position);
        canJump = false;
        beep(320, 'sine', 0.05);
      }
    });
    window.addEventListener('keyup', e => delete keys[e.code]);

    // ───────────── Touch / click to move ─────────────
    const handleInteraction = (x, y, target) => {
      if (!started || !earthModel) return;
      if (target.closest('button, .overlay, #mobile-ctrl')) return;
      const mouseV = new THREE.Vector2((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouseV, camera);
      const hits = raycaster.intersectObject(earthModel);
      if (hits.length) mouseTarget = hits[0].point.clone();
    };

    window.addEventListener('mousedown', e => handleInteraction(e.clientX, e.clientY, e.target));
    window.addEventListener('touchstart', e => {
      if (e.touches.length > 0) handleInteraction(e.touches[0].clientX, e.touches[0].clientY, e.target);
    }, { passive: false });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ───────────── Mobile Controls ─────────────
    function setupMobileControls() {
      const bind = (id, code) => {
        const el = document.getElementById(id);
        const start = (e) => { e.preventDefault(); e.stopPropagation(); keys[code] = true; el.classList.add('active'); };
        const end = (e) => { e.preventDefault(); e.stopPropagation(); delete keys[code]; el.classList.remove('active'); };
        el.addEventListener('touchstart', start, { passive: false }); el.addEventListener('touchend', end, { passive: false });
        el.addEventListener('mousedown', start); el.addEventListener('mouseup', end); el.addEventListener('mouseleave', end);
      };
      bind('ctrl-up', 'KeyW'); bind('ctrl-down', 'KeyS');
      bind('ctrl-left', 'KeyA'); bind('ctrl-right', 'KeyD');
    
      const jEl = document.getElementById('ctrl-jump');
      const jStart = (e) => {
        e.preventDefault(); e.stopPropagation(); jEl.classList.add('active');
        if (canJump && started) {
          const up = new THREE.Vector3().copy(pBody.position).normalize();
          pBody.applyImpulse(new CANNON.Vec3(up.x * 12, up.y * 12, up.z * 12), pBody.position);
          canJump = false; beep(320, 'sine', 0.05);
        }
      };
      const jEnd = (e) => { e.preventDefault(); e.stopPropagation(); jEl.classList.remove('active'); };
      jEl.addEventListener('touchstart', jStart, { passive: false }); jEl.addEventListener('touchend', jEnd, { passive: false });
      jEl.addEventListener('mousedown', jStart); jEl.addEventListener('mouseup', jEnd); jEl.addEventListener('mouseleave', jEnd);
    }

    // ───────────── Start Screen ─────────────
    document.getElementById('btn-start').onclick = () => {
      const wipe = document.getElementById('wipe-overlay');
      wipe.classList.add('active');
      audioCtx.resume();
      setTimeout(() => { document.getElementById('start-screen').style.display = 'none'; }, 500);
      setTimeout(() => {
        started = true;
        setupMobileControls();
        info.innerText = 'EXPLORE: WASD / D-PAD to walk, SPACE / ● to jump, tap to move';
      }, 1000);
    };
  </script>
</body>
</html>
