<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miracle Maker — Jerusalem Investigation</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Source+Code+Pro:wght@300;400;600&display=swap"
    rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════ */
    :root {
      --bg: #080604;
      --panel-bg: rgba(8, 6, 4, 0.92);
      --accent: #64ffda;
      --gold: #ffb74d;
      --red: #ff6b6b;
      --dim: #8696a0;
      --text: #e9edef;
      --border: rgba(100, 255, 218, 0.18);
      --glow-sm: 0 0 10px rgba(100, 255, 218, 0.25);
      --glow-md: 0 0 22px rgba(100, 255, 218, 0.5);
      --btn-sz: clamp(44px, 10vmin, 56px);
    }

    /* ═══════════════════════════════════════════
   BASE
═══════════════════════════════════════════ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Source Code Pro', 'Courier New', monospace;
      text-transform: uppercase;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ═══════════════════════════════════════════
   OVERLAYS
═══════════════════════════════════════════ */
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text);
      z-index: 2000;
      background: rgba(0, 0, 0, 0.95);
      text-align: center;
    }

    .overlay.hidden {
      display: none;
    }

    #start-screen h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 8vw, 5rem);
      color: var(--gold);
      margin: 0;
      letter-spacing: 8px;
      text-shadow: 0 0 40px rgba(255, 183, 77, 0.5);
    }

    #start-screen .sub {
      color: var(--dim);
      font-size: .8rem;
      letter-spacing: 4px;
      margin: 12px 0 36px;
    }

    #start-screen .hint {
      color: var(--dim);
      font-size: .65rem;
      letter-spacing: 2px;
      margin-top: 18px;
      opacity: 0.6;
    }

    #win-screen h1 {
      font-family: 'Cinzel', serif;
      color: var(--accent);
      font-size: 3rem;
      letter-spacing: 6px;
    }

    #win-screen p {
      color: var(--accent);
      opacity: .7;
      letter-spacing: 2px;
    }

    .btn-primary {
      background: var(--gold);
      border: none;
      padding: 14px 44px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      font-family: inherit;
      color: #000;
      letter-spacing: 2px;
      transition: opacity .2s;
    }

    .btn-primary:hover {
      opacity: .85;
    }

    .btn-replay {
      background: var(--accent);
      color: #000;
    }

    /* ═══════════════════════════════════════════
   HUD PANELS
═══════════════════════════════════════════ */
    #right-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
      pointer-events: none;
      z-index: 500;
    }

    #sidebar-top,
    #sidebar-bottom {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      pointer-events: auto;
    }

    .sidebar-row {
      display: flex;
      gap: 8px;
    }

    .panel {
      color: var(--text);
      background: var(--panel-bg);
      padding: 12px;
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      width: 210px;
      transform-origin: right center;
      transform: scale(0.85);
      opacity: 0;
      pointer-events: none;
      transition: transform .25s, opacity .2s;
      box-shadow: var(--glow-sm);
      font-size: .75rem;
    }

    .panel.open {
      transform: scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .panel h3 {
      margin: 0 0 8px;
      font-size: .65rem;
      color: var(--gold);
      opacity: .7;
      letter-spacing: 3px;
      border-bottom: 1px solid #222;
      padding-bottom: 6px;
    }

    #panel-quest {
      border-right: 3px solid var(--accent);
    }

    #panel-inv {
      border-right: 3px solid var(--gold);
    }

    #inv-anchor {
      position: relative;
    }

    #panel-inv {
      position: absolute;
      bottom: calc(100% + 10px);
      right: calc(100% + 8px);
    }

    .q-item {
      margin: 8px 0;
      border-bottom: 1px solid #111;
      padding-bottom: 6px;
    }

    .q-item b {
      color: var(--accent);
      display: block;
      margin-bottom: 3px;
    }

    .q-item small {
      color: var(--dim);
      font-size: .68rem;
    }

    .q-done b {
      color: var(--dim);
      text-decoration: line-through;
    }

    .item {
      margin: 4px 0;
      color: var(--gold);
      border-left: 2px solid var(--gold);
      padding-left: 5px;
      font-size: .72rem;
    }

    /* ═══════════════════════════════════════════
   UI TOGGLE BUTTONS
═══════════════════════════════════════════ */
    .ui-toggle {
      width: var(--btn-sz);
      height: var(--btn-sz);
      min-width: 44px;
      min-height: 44px;
      background: rgba(8, 6, 4, 0.85);
      border: 1px solid var(--border);
      color: var(--accent);
      cursor: pointer;
      font-size: 1.15em;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
      box-shadow: var(--glow-sm);
      pointer-events: auto;
    }

    .ui-toggle:hover {
      background: rgba(100, 255, 218, 0.15);
      box-shadow: var(--glow-md);
    }

    .ui-toggle:active {
      transform: scale(.9);
    }

    .ui-toggle.active {
      background: rgba(100, 255, 218, 0.2);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ═══════════════════════════════════════════
   LOCATION BOX
═══════════════════════════════════════════ */
    #loc-box {
      position: fixed;
      bottom: 22%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      display: none;
      z-index: 300;
      animation: locFadeIn .5s ease;
    }

    @keyframes locFadeIn {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(12px)
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0)
      }
    }

    #loc-name {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.5rem, 4vw, 2.8rem);
      color: var(--gold);
      margin: 0;
      text-shadow: 0 0 24px rgba(255, 183, 77, 0.6), 0 2px 8px rgba(0, 0, 0, 0.8);
      letter-spacing: 4px;
    }

    #act-label {
      color: var(--accent);
      font-size: .65rem;
      letter-spacing: 4px;
      margin: 0 0 4px;
    }

    /* ═══════════════════════════════════════════
   NPC BUBBLES & PROMPTS
═══════════════════════════════════════════ */
    #npc-indicator-container {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      width: 100%;
      height: 100%;
      z-index: 400;
    }

    .interact-prompt {
      position: absolute;
      background: var(--gold);
      color: #000;
      padding: 7px 16px;
      font-weight: 700;
      font-size: .72rem;
      border-radius: 3px;
      display: none;
      cursor: pointer;
      pointer-events: auto;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 18px rgba(255, 183, 77, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.3);
      z-index: 410;
      letter-spacing: 1px;
    }

    .npc-bubble {
      position: absolute;
      background: rgba(8, 6, 4, 0.96);
      color: var(--accent);
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 2px;
      font-size: .78rem;
      text-align: center;
      transform: translate(-50%, -100%);
      display: none;
      width: 200px;
      box-shadow: 0 0 12px rgba(100, 255, 218, 0.2);
      z-index: 350;
      text-transform: none;
    }

    .npc-bubble::after {
      content: '';
      position: absolute;
      bottom: -9px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-top: 9px solid var(--border);
    }

    /* ═══════════════════════════════════════════
   VN DIALOGUE BOX (vn.html style)
═══════════════════════════════════════════ */
    #local-dialogue-box {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(820px, 55vw);
      height: 80vh;
      background: #0b141a;
      border: 1px solid rgba(100, 255, 218, 0.15);
      border-radius: 12px;
      display: none;
      flex-direction: row;
      z-index: 1200;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }

    #chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0b141a;
      background-image: radial-gradient(rgba(100, 255, 218, 0.025) 1px, transparent 0);
      background-size: 24px 24px;
    }

    .chat-hdr {
      background: #111b21;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-hdr .npc-n {
      font-family: 'Cinzel', serif;
      color: var(--text);
      font-size: .95rem;
    }

    .chat-hdr .npc-s {
      color: var(--accent);
      font-size: .65rem;
      margin-top: 3px;
      letter-spacing: 2px;
    }

    #btn-close-dlg {
      background: rgba(255, 107, 107, .12);
      border: 1px solid rgba(255, 107, 107, .35);
      color: var(--red);
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: .72rem;
      letter-spacing: 1px;
    }

    #btn-close-dlg:hover {
      background: rgba(255, 107, 107, .28);
    }

    #bub-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 22px 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #bub-scroll::-webkit-scrollbar {
      width: 5px;
    }

    #bub-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .08);
      border-radius: 3px;
    }

    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: .88rem;
      line-height: 1.5;
      text-transform: none;
      letter-spacing: 0;
      animation: mIn .22s ease-out both;
    }

    @keyframes mIn {
      from {
        opacity: 0;
        transform: translateY(7px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .msg.npc {
      align-self: flex-start;
      background: #202c33;
      color: var(--text);
      border-top-left-radius: 2px;
    }

    .msg.player {
      align-self: flex-end;
      background: #005c4b;
      color: var(--text);
      border-top-right-radius: 2px;
    }

    .msg.system {
      align-self: center;
      background: #182229;
      color: var(--dim);
      font-size: .68rem;
      padding: 5px 12px;
      border-radius: 6px;
    }

    .msg.evidence {
      align-self: flex-start;
      background: rgba(100, 255, 218, 0.06);
      border: 1px dashed rgba(100, 255, 218, .3);
      color: var(--accent);
      font-size: .75rem;
      font-style: italic;
      padding: 7px 14px;
      border-radius: 8px;
    }

    .typing-row {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 10px 14px;
      background: #202c33;
      border-radius: 12px;
      border-top-left-radius: 2px;
      align-self: flex-start;
      animation: mIn .2s ease-out;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: var(--dim);
      border-radius: 50%;
      animation: blink 1.4s infinite both;
    }

    .dot:nth-child(2) {
      animation-delay: .2s;
    }

    .dot:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes blink {

      0%,
      80%,
      100% {
        opacity: .2;
        transform: scale(.8)
      }

      40% {
        opacity: 1;
        transform: scale(1.15)
      }
    }

    #bar-choices {
      border-top: 1px solid rgba(255, 255, 255, .04);
      background: #111b21;
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      min-height: 72px;
    }

    #bar-choices.hide {
      display: none;
    }

    .choice-btn {
      background: rgba(0, 168, 132, .08);
      border: 1px solid rgba(0, 168, 132, .35);
      color: #fff;
      padding: 8px 18px;
      border-radius: 24px;
      cursor: pointer;
      font-family: inherit;
      font-size: .8rem;
      letter-spacing: .5px;
      transition: all .2s;
      text-transform: none;
    }

    .choice-btn:hover {
      background: #00a884;
      color: #000;
      transform: translateY(-1px);
      box-shadow: 0 2px 10px rgba(0, 168, 132, .35);
    }

    /* ═══════════════════════════════════════════
   PHASE INTRO CARD
═══════════════════════════════════════════ */
    .phase-intro-card {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .94);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      opacity: 0;
      transition: opacity .6s;
      cursor: pointer;
    }

    .phase-intro-card.visible {
      opacity: 1;
    }

    .phase-intro-inner {
      text-align: center;
      color: var(--text);
      max-width: 600px;
      padding: 2rem;
    }

    .phase-act {
      color: var(--accent);
      font-size: .68rem;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .phase-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      margin: 8px 0;
      color: var(--gold);
    }

    .phase-sub {
      color: var(--dim);
      font-size: .9rem;
      text-transform: none;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .phase-loc {
      color: var(--accent);
      font-size: .72rem;
      letter-spacing: 2px;
    }

    .phase-hint {
      color: var(--dim);
      font-size: .6rem;
      letter-spacing: 2px;
      margin-top: 20px;
      opacity: .5;
    }

    /* ═══════════════════════════════════════════
   PHASE COMPLETE BANNER
═══════════════════════════════════════════ */
    .phase-complete-banner {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #005c4b;
      color: #fff;
      padding: 11px 28px;
      border-radius: 28px;
      font-size: .85rem;
      letter-spacing: 2px;
      z-index: 2500;
      opacity: 0;
      transition: all .4s;
    }

    .phase-complete-banner.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ═══════════════════════════════════════════
   EVIDENCE TOAST
═══════════════════════════════════════════ */
    .evidence-toast {
      position: fixed;
      top: 72px;
      right: 18px;
      background: #111b21;
      border: 1px solid rgba(100, 255, 218, .4);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: .8rem;
      z-index: 2500;
      opacity: 0;
      transform: translateX(16px);
      transition: all .35s;
      max-width: 260px;
    }

    .evidence-toast.visible {
      opacity: 1;
      transform: none;
    }

    .ev-tag {
      display: block;
      font-size: .6rem;
      color: var(--accent);
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    /* ═══════════════════════════════════════════
   EVIDENCE BOARD OVERLAY
═══════════════════════════════════════════ */
    #board-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .92);
      z-index: 4000;
      overflow-y: auto;
      padding: 2rem;
      display: none;
    }

    #inv-board {
      max-width: 820px;
      margin: 0 auto;
      color: var(--text);
    }

    #inv-board h2 {
      font-family: 'Cinzel', serif;
      color: var(--accent);
      letter-spacing: 4px;
      margin-bottom: 2rem;
      font-size: 1.4rem;
    }

    .board-cat {
      margin-bottom: 2rem;
    }

    .board-cat h3 {
      color: var(--gold);
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      border-bottom: 1px solid #1a2a30;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .board-cat ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .board-cat li {
      padding: 10px 0;
      border-bottom: 1px solid #111;
    }

    .board-cat li strong {
      display: block;
      margin-bottom: 4px;
      font-size: .85rem;
    }

    .board-cat li p {
      color: var(--dim);
      font-size: .78rem;
      margin: 0;
      text-transform: none;
      line-height: 1.5;
    }

    #btn-board-close {
      background: #005c4b;
      border: none;
      color: #fff;
      padding: 12px 32px;
      border-radius: 24px;
      cursor: pointer;
      margin-top: 2rem;
      font-size: .85rem;
      font-family: inherit;
      letter-spacing: 1px;
    }

    /* ═══════════════════════════════════════════
   WIPE OVERLAY
═══════════════════════════════════════════ */
    #wipe-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9000;
      pointer-events: none;
      transform: translateX(-100%);
    }

    #wipe-overlay.active {
      animation: wipeIn 1s ease-in-out forwards;
    }

    @keyframes wipeIn {
      0% {
        transform: translateX(-100%);
      }

      50% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(100%);
      }
    }

    /* ═══════════════════════════════════════════
   LEVEL SELECT MODAL STYLES (injected by class)
═══════════════════════════════════════════ */
    @keyframes hintFade {

      0%,
      60% {
        opacity: .6
      }

      100% {
        opacity: 0
      }
    }

    @keyframes nodePulse {

      0%,
      100% {
        transform: scale(1);
        opacity: .8
      }

      50% {
        transform: scale(1.4);
        opacity: 1
      }
    }

    .lsm-node-label {
      position: absolute;
      pointer-events: none;
      z-index: 15;
      transform: translate(-50%, -100%);
      background: rgba(11, 20, 26, .88);
      border: 1px solid rgba(100, 255, 218, .2);
      border-radius: 3px;
      padding: 3px 8px;
      font-family: 'Source Code Pro', 'Courier New', monospace;
      font-size: .58rem;
      letter-spacing: 1px;
      white-space: nowrap;
      color: var(--text);
      transition: opacity .2s;
    }

    .lsm-node-dot {
      position: absolute;
      pointer-events: none;
      z-index: 14;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      transition: box-shadow .3s;
    }

    .lsm-node-dot.pulse {
      animation: nodePulse 1.8s ease-in-out infinite;
    }

    #lsm-close:hover {
      background: rgba(255, 107, 107, .3) !important;
    }

    /* Level tree sidebar inside modal */
    #lsm-tree {
      width: 240px;
      flex-shrink: 0;
      background: rgba(0, 0, 0, .4);
      border-right: 1px solid rgba(100, 255, 218, .08);
      overflow-y: auto;
      padding: 16px 0;
    }

    #lsm-tree::-webkit-scrollbar {
      width: 4px;
    }

    #lsm-tree::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .07);
    }

    .tree-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all .2s;
      text-decoration: none;
    }

    .tree-item:hover {
      background: rgba(100, 255, 218, .06);
    }

    .tree-item.active-phase {
      border-left-color: var(--accent);
      background: rgba(100, 255, 218, .08);
    }

    .tree-item.complete {
      border-left-color: var(--gold);
    }

    .tree-item.locked {
      opacity: .35;
      cursor: not-allowed;
    }

    .tree-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--dim);
    }

    .tree-item.complete .tree-dot {
      background: var(--gold);
    }

    .tree-item.available .tree-dot {
      background: var(--accent);
    }

    .tree-item.active-phase .tree-dot {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .tree-info {
      flex: 1;
      min-width: 0;
    }

    .tree-act {
      color: var(--dim);
      font-size: .55rem;
      letter-spacing: 2px;
    }

    .tree-title {
      color: var(--text);
      font-size: .7rem;

    class VFXSystem {
      constructor(scene, planetR) {
        this.scene = scene; this.planetR = planetR;
        const max = 2000;
        this.geom = new THREE.BufferGeometry();
        this.pos = new Float32Array(max * 3);
        this.col = new Float32Array(max * 3);
        this.life = new Float32Array(max);
        this.vel = [];
        for (let i = 0; i < max; i++) {
          this.pos[i * 3] = 99999; this.vel.push(new THREE.Vector3()); this.life[i] = 0;
        }
        this.geom.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
        this.geom.setAttribute('color', new THREE.BufferAttribute(this.col, 3));
        this.mesh = new THREE.Points(this.geom, new THREE.PointsMaterial({ size: 1.4, vertexColors: true, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false }));
        scene.add(this.mesh);
        // Birds
        this.birds = new THREE.Group();
        const bGeo = new THREE.ConeGeometry(0.4, 1.2, 3); bGeo.rotateX(Math.PI / 2);
        const bMat = new THREE.MeshBasicMaterial({ color: 0x64ffda });
        this.birdData = [];
        for (let i = 0; i < 12; i++) {
          const b = new THREE.Mesh(bGeo, bMat);
          const p = new THREE.Vector3().setFromSphericalCoords(planetR + 28 + Math.random() * 8, Math.random() * Math.PI, Math.random() * Math.PI * 2);
          b.position.copy(p); this.birds.add(b);
          this.birdData.push({ mesh: b, vel: new THREE.Vector3().randomDirection().multiplyScalar(14), phase: Math.random() * Math.PI * 2 });
        }
        scene.add(this.birds);
      }
      spawn(p, v, c, l) {
        for (let i = 0; i < this.life.length; i++) {
          if (this.life[i] <= 0) {
            this.life[i] = l;
            this.pos[i * 3] = p.x; this.pos[i * 3 + 1] = p.y; this.pos[i * 3 + 2] = p.z;
            this.col[i * 3] = c.r; this.col[i * 3 + 1] = c.g; this.col[i * 3 + 2] = c.b;
            this.vel[i].copy(v);
            this.geom.attributes.color.needsUpdate = true;
            return;
          }
        }
      }
      emitDust(pos, up) {
        const c = new THREE.Color(0x554433);
        for (let i = 0; i < 2; i++) {
          const v = new THREE.Vector3().randomDirection().multiplyScalar(3).add(up.clone().multiplyScalar(2));
          const p = pos.clone().add(new THREE.Vector3().randomDirection().multiplyScalar(0.5)).sub(up.clone().multiplyScalar(1));
          this.spawn(p, v, c, 0.35 + Math.random() * 0.4);
        }
      }
      emitAmbient(playerPos) {
        if (Math.random() > 0.08) return;
        const c = new THREE.Color(0xffcc44);
        const offset = new THREE.Vector3().randomDirection().multiplyScalar(14 + Math.random() * 10);
        this.spawn(playerPos.clone().add(offset), new THREE.Vector3().randomDirection().multiplyScalar(0.4), c, 6 + Math.random() * 4);
      }
      emitFirework(pos, up) {
        const cols = [new THREE.Color(0xffaa00), new THREE.Color(0x64ffda), new THREE.Color(0xffffff)];
        const c = cols[Math.floor(Math.random() * cols.length)];
        const origin = pos.clone().add(up.clone().multiplyScalar(6));
        for (let i = 0; i < 180; i++) {
          const v = new THREE.Vector3().randomDirection().multiplyScalar(14 + Math.random() * 18);
          this.spawn(origin, v, c, 1.5 + Math.random() * 1.5);
        }
      }
      update(dt, playerPos, playerVel, grounded) {
        const pa = this.geom.attributes.position; let nu = false;
        for (let i = 0; i < this.life.length; i++) {
          if (this.life[i] > 0) {
            this.life[i] -= dt;
            const p = new THREE.Vector3(pa.array[i * 3], pa.array[i * 3 + 1], pa.array[i * 3 + 2]);
            const up = p.clone().normalize();
            this.vel[i].add(up.multiplyScalar(-18 * dt));
            p.add(this.vel[i].clone().multiplyScalar(dt));
            pa.array[i * 3] = p.x; pa.array[i * 3 + 1] = p.y; pa.array[i * 3 + 2] = p.z;
            if (this.life[i] <= 0) pa.array[i * 3] = 99999;
            nu = true;
          }
        }
        if (nu) pa.needsUpdate = true;
        if (grounded && playerVel.lengthSq() > 10 && Math.random() > 0.5) this.emitDust(playerPos, playerPos.clone().normalize());
        this.emitAmbient(playerPos);
        this.birdData.forEach(b => {
          b.phase += dt * 10;
          const bPos = b.mesh.position;
          const up = bPos.clone().normalize();
          const alt = bPos.length(), tAlt = this.planetR + 28;
          if (alt > tAlt) b.vel.add(up.clone().multiplyScalar(-5 * dt));
          if (alt < tAlt) b.vel.add(up.clone().multiplyScalar(5 * dt));
          bPos.add(b.vel.clone().multiplyScalar(dt)).add(up.clone().multiplyScalar(Math.sin(b.phase) * 0.08));
          b.mesh.position.copy(bPos); b.mesh.up.copy(up);
          if (b.vel.lengthSq() > 0.01) b.mesh.lookAt(bPos.clone().add(b.vel));
        });
      }
    }

      _buildCity() {

        const bCols = [0xc4a882, 0xb8956a, 0xd4b896, 0xa08060, 0xc8aa78];

          const th = Math.random() * Math.PI * 0.55, ph = Math.random() * Math.PI * 2, h = 3 + Math.random() * 12, w = 2 + Math.random() * 3;
          const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), new THREE.MeshStandardMaterial({ color: bCols[Math.floor(Math.random() * bCols.length)], roughness: 0.9 }));
          const pos = new THREE.Vector3().setFromSphericalCoords(R, th, ph);

        const tp = new THREE.Mesh(new THREE.BoxGeometry(10, 20, 10), new THREE.MeshStandardMaterial({ color: 0xf0e0c0, roughness: 0.7 }));

        this.scene.add(new THREE.Mesh(new THREE.SphereGeometry(R * 1.02, 32, 32), new THREE.MeshBasicMaterial({ color: 0x221100, transparent: true, opacity: 0.25, side: THREE.BackSide })));

          const orb = new THREE.Mesh(new THREE.SphereGeometry(1.6, 16, 16), new THREE.MeshBasicMaterial({ color: d.color }));
          orb.position.copy(pos); this.scene.add(orb);

          const line = new THREE.Line(lg, new THREE.LineBasicMaterial({ color: d.color, transparent: true, opacity: 0.3 }));

      _buildHTMLNodes() {
        this._htmlNodes = LEVEL_TREE.map((d, i) => {
          const dot = document.createElement('div'); dot.className = 'lsm-node-dot'; dot.dataset.phase = d.phase;
          dot.style.cssText = `width:13px;height:13px;background:${this._hex(d.color)};`;
          this._canvasWrap.appendChild(dot);
          const lbl = document.createElement('div'); lbl.className = 'lsm-node-label'; lbl.textContent = `${d.phase}. ${d.landmark}`;
          this._canvasWrap.appendChild(lbl);
          dot.addEventListener('mouseenter', () => this._onHover(d, dot));
          dot.addEventListener('mouseleave', () => this._onLeave());
          dot.addEventListener('click', () => this._onClick(d));

      }
      _buildTreeSidebar() {
        this._treeEl.innerHTML = '';
        const hdr = document.createElement('div');
        hdr.style.cssText = 'padding:16px 16px 8px;color:#64ffda;font-size:.58rem;letter-spacing:3px;';
        hdr.textContent = 'INVESTIGATION PHASES'; this._treeEl.appendChild(hdr);
        LEVEL_TREE.forEach((d, i) => {
          if (i > 0) { const cn = document.createElement('div'); cn.className = 'tree-connector'; this._treeEl.appendChild(cn); }
          const item = document.createElement('div'); item.className = 'tree-item'; item.dataset.phase = d.phase;
          const dot = document.createElement('div'); dot.className = 'tree-dot';
          const info = document.createElement('div'); info.className = 'tree-info';
          const act = document.createElement('div'); act.className = 'tree-act'; act.textContent = d.actLabel;
          const title = document.createElement('div'); title.className = 'tree-title'; title.textContent = d.title;
          info.appendChild(act); info.appendChild(title);
          item.appendChild(dot); item.appendChild(info);

          this._treeEl.appendChild(item);
        });
      }
      _buildProgressBar() {
        const done = LEVEL_TREE.filter(d => this._isComplete(d.phase)).length;
        this._progressBar.innerHTML = `<div style="color:#8696a0;font-size:.6rem;letter-spacing:2px;margin-right:10px;white-space:nowrap">${done}/${LEVEL_TREE.length} COMPLETE</div>`;
        LEVEL_TREE.forEach(d => {
          const pip = document.createElement('div');
          const ok = this._isComplete(d.phase), ul = this._isUnlocked(d);
          pip.style.cssText = `width:20px;height:5px;border-radius:3px;background:${ok ? '#ffcc44' : ul ? '#64ffda' : '#1a2530'};transition:background .4s;cursor:${ul ? 'pointer' : 'default'};`;
          pip.title = `Phase ${d.phase}: ${d.title}`;
          if (ul) pip.onclick = () => this._onClick(d);
          this._progressBar.appendChild(pip);
        });
      }
      _isComplete(p) { return this.lm?._phaseComplete?.[p] === true; }
      _isUnlocked(d) { return !d.unlockAfter || d.unlockAfter.length === 0 || d.unlockAfter.every(p => this._isComplete(p)); }
      _syncStates() {
        this._htmlNodes.forEach(({ dot, lbl, data }) => {
          const ok = this._isComplete(data.phase), ul = this._isUnlocked(data);
          const c = ok ? '#ffcc44' : ul ? '#64ffda' : '#556677';
          dot.style.background = c; dot.style.cursor = ul ? 'pointer' : 'not-allowed';
          dot.style.boxShadow = ul ? `0 0 9px ${c},0 0 18px ${c}40` : 'none';
          dot.classList.toggle('pulse', ul && !ok);
          lbl.style.opacity = ul ? '1' : '0.3'; lbl.style.color = ok ? '#ffcc44' : ul ? '#e9edef' : '#445566';
          const n3 = this._nodes3D.find(n => n.data.phase === data.phase);
          if (n3) {
            const hx = ok ? 0xffcc44 : ul ? data.color : 0x2a3942;
            n3.orb.material.color.setHex(hx); n3.ring.material.color.setHex(hx);
            n3.ring.material.opacity = ul ? 0.6 : 0.12; n3.line.material.opacity = ul ? 0.35 : 0.06;
          }
        });
        // Update tree sidebar
        const items = this._treeEl.querySelectorAll('.tree-item');
        items.forEach(item => {
          const p = +item.dataset.phase; const d = LEVEL_TREE[p - 1];
          const ok = this._isComplete(p), ul = this._isUnlocked(d), cur = this.lm?.currentPhase === p;
          item.className = 'tree-item' + (ok ? ' complete' : ul ? ' available' : ' locked') + (cur ? ' active-phase' : '');
        });
        this._buildProgressBar();
      }
      _onHover(data, dot) {
        this._hovered = data;
        const ok = this._isComplete(data.phase), ul = this._isUnlocked(data);
        const rect = dot.getBoundingClientRect(), wRect = this._canvasWrap.getBoundingClientRect();
        this._tooltip.style.opacity = '1';
        this._tooltip.style.left = (rect.left - wRect.left + 20) + 'px';
        this._tooltip.style.top = (rect.top - wRect.top - 10) + 'px';
        const sc = ok ? '#ffcc44' : ul ? '#64ffda' : '#ff6b6b';
        const st = ok ? '✓ COMPLETE' : ul ? '● AVAILABLE' : '🔒 LOCKED';
        const uText = !ul ? `<div style="color:#ff6b6b;font-size:.66rem;margin-top:6px">Requires: ${data.unlockAfter.map(p => `Phase ${p}`).join(', ')}</div>` : '';
        const pHtml = data.prophecies?.length ? `<div style="margin-top:9px;border-top:1px solid rgba(100,255,218,.1);padding-top:7px"><div style="color:#8696a0;font-size:.58rem;letter-spacing:2px;margin-bottom:5px">PROPHECY</div>${data.prophecies.map(p => `<div style="color:#ffb74d;font-size:.7rem;font-style:italic;margin-bottom:3px;text-transform:none">${p}</div>`).join('')}</div>` : '';
        this._tooltip.innerHTML = `<div style="color:${sc};font-size:.62rem;letter-spacing:2px;margin-bottom:5px">${data.actLabel} · ${st}</div><div style="font-family:'Cinzel',serif;color:#e9edef;font-size:.92rem;font-weight:700;margin-bottom:3px">${data.title}</div><div style="color:#8696a0;font-size:.7rem">📍 ${data.location}</div>${uText}${pHtml}${ul && !ok ? '<div style="color:#64ffda;font-size:.65rem;margin-top:8px;letter-spacing:1px">CLICK TO ENTER →</div>' : ''}`;
      }
      _onLeave() { this._hovered = null; this._tooltip.style.opacity = '0'; }
      _onClick(data) {
        if (!this._isUnlocked(data)) return;
        this.close();
        const w = document.getElementById('wipe-overlay');
        if (w) { w.classList.add('active'); setTimeout(() => this.lm?.loadPhase?.(data.phase), 500); }
        else this.lm?.loadPhase?.(data.phase);
      }
      _bindControls(el) {
        el.addEventListener('mousedown', e => { this._dragging = true; this._lastMouse = { x: e.clientX, y: e.clientY }; });
        el.addEventListener('mousemove', e => {
          if (!this._dragging) return;
          const dx = e.clientX - this._lastMouse.x, dy = e.clientY - this._lastMouse.y;
          this._lastMouse = { x: e.clientX, y: e.clientY };
          this._tSph.theta -= dx * 0.006; this._tSph.phi += dy * 0.006;
          this._tSph.phi = Math.max(0.1, Math.min(Math.PI - 0.1, this._tSph.phi));
        });
        el.addEventListener('mouseup', () => this._dragging = false);
        el.addEventListener('mouseleave', () => this._dragging = false);
        el.addEventListener('wheel', e => { this._tSph.radius = Math.max(140, Math.min(360, this._tSph.radius + e.deltaY * 0.3)); });
        let lt = null;
        el.addEventListener('touchstart', e => { if (e.touches.length === 1) lt = { x: e.touches[0].clientX, y: e.touches[0].clientY }; });
        el.addEventListener('touchmove', e => {
          if (e.touches.length === 1 && lt) {
            const dx = e.touches[0].clientX - lt.x, dy = e.touches[0].clientY - lt.y;
            lt = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            this._tSph.theta -= dx * 0.008; this._tSph.phi += dy * 0.008;
            this._tSph.phi = Math.max(0.1, Math.min(Math.PI - 0.1, this._tSph.phi));
          }
        });
        el.addEventListener('touchend', () => lt = null);
      }
      _camFromSph(instant = false) {
        const s = this._sph, t = this._tSph;
        if (!instant) { const lf = 0.07; s.theta += (t.theta - s.theta) * lf; s.phi += (t.phi - s.phi) * lf; s.radius += (t.radius - s.radius) * lf; }
        else { s.theta = t.theta; s.phi = t.phi; s.radius = t.radius; }
        const sp = Math.sin(s.phi);
        this.camera.position.set(s.radius * sp * Math.sin(s.theta), s.radius * Math.cos(s.phi), s.radius * sp * Math.cos(s.theta));
        this.camera.lookAt(0, 0, 0);
      }
      _startRender() {
        const loop = () => {
          this._raf = requestAnimationFrame(loop);
          if (this.overlay.style.display === 'none') return;
          if (!this._dragging) this._tSph.theta += 0.0007;
          this._camFromSph();
          const t = Date.now() * 0.001;
          this._nodes3D.forEach(({ ring }, i) => { ring.rotation.z = t * 0.4 + i * 0.6; ring.scale.setScalar(1 + 0.07 * Math.sin(t * 1.5 + i)); });
          this.renderer.render(this.scene, this.camera);
          this._htmlNodes.forEach(({ dot, lbl, node3d }) => {
            const prj = node3d.pos.clone().project(this.camera);
            const rect = this._canvasWrap.getBoundingClientRect();
            const px = (prj.x * 0.5 + 0.5) * rect.width, py = (prj.y * -0.5 + 0.5) * rect.height;
            const vis = prj.z < 1;
            dot.style.display = vis ? 'block' : 'none'; lbl.style.display = vis ? 'block' : 'none';
            dot.style.left = px + 'px'; dot.style.top = py + 'px';
            lbl.style.left = px + 'px'; lbl.style.top = (py - 12) + 'px';
          });
        };
        loop();
      }
      _stopRender() { if (this._raf) { cancelAnimationFrame(this._raf); this._raf = null; } }
      _onResize() {
        if (!this.renderer || this.overlay.style.display === 'none') return;
        const rect = this._canvasWrap.getBoundingClientRect();
        this.renderer.setSize(rect.width, rect.height);
        this.camera.aspect = rect.width / rect.height; this.camera.updateProjectionMatrix();
      }
      _hex(n) { '#' + (n).toString(16).padStart(6, '0'); return '#' + (n).toString(16).padStart(6, '0'); }
    }

    /* ═══════════════════════════════════════════════════════════════
       LEVEL MANAGER  (simplified inline version)
    ═══════════════════════════════════════════════════════════════ */
    class LevelManager {
      constructor() {
        this.currentPhase = 0; this.currentData = null;
        this._phaseComplete = new Array(11).fill(false);
        this.evidence = [];
      }
      start() { this.loadPhase(1); }
      loadPhase(n) {
        if (n < 1 || n > 10) return;
        this.currentPhase = n;
        this.currentData = LEVELS[n - 1];
        clearLevelScene();
        buildLevelScene(this.currentData);
        currentQuest = { ...this.currentData.quest, completed: false };
        updateUI();
        showPhaseIntroCard(this.currentData);
      }
      collectEvidence(id) {
        const def = this.currentData?.evidence?.find(e => e.id === id);
        if (!def || this.evidence.find(e => e.id === id)) return;
        const token = { ...def, phaseCollected: this.currentPhase };
        this.evidence.push(token);
        showEvidenceToast(token);
        updateUI();
        this._checkObjectives();
      }
      _checkObjectives() {
        const req = this.currentData?.evidence?.filter(e => e.required) ?? [];
        const got = req.filter(e => this.evidence.find(t => t.id === e.id));
        if (req.length > 0 && got.length >= req.length) this._completePhase();
      }
      _completePhase() {
        if (this._phaseComplete[this.currentPhase]) return;
        this._phaseComplete[this.currentPhase] = true;
        const pPos = new THREE.Vector3().copy(pBody.position);
        vfx.emitFirework(pPos, pPos.clone().normalize());
        showPhaseCompleteCard({ phase: this.currentPhase, title: this.currentData.title });
        levelModal?.refresh();
        if (this.currentPhase === 10) { setTimeout(() => triggerWin(), 3500); }
        else { setTimeout(() => levelModal?.open(), 3500); }
      }
      getEvidenceBoard() {
        const b = {};
        for (const t of this.evidence) { if (!b[t.category]) b[t.category] = []; b[t.category].push(t); }
        return b;
      }
      getCurrentData() { return this.currentData; }
    }

    /* ═══════════════════════════════════════════════════════════════
       THREE.JS SCENE SETUP
    ═══════════════════════════════════════════════════════════════ */
    const planetR = 50;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080604);
    scene.fog = new THREE.Fog(0x080604, 22, 90);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 5000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffe5bb, 0.7);
    scene.add(ambientLight);
    const sun = new THREE.DirectionalLight(0xffcc88, 2.0);
    sun.position.set(100, 200, 100); sun.castShadow = true;
    sun.shadow.camera.left = -100; sun.shadow.camera.right = 100;
    sun.shadow.camera.top = 100; sun.shadow.camera.bottom = -100;
    sun.shadow.mapSize.width = 2048; sun.shadow.mapSize.height = 2048;
    scene.add(sun);

    // Stars
    const starGeo = new THREE.BufferGeometry();
    const starPos = [];
    for (let i = 0; i < 1500; i++) { const v = new THREE.Vector3().randomDirection().multiplyScalar(Math.random() * 2000 + 100); starPos.push(v.x, v.y, v.z); }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xcc9966, size: 1.4, transparent: true, opacity: 0.6 })));

    // Planet — sandy Jerusalem
    const planet = new THREE.Mesh(new THREE.IcosahedronGeometry(planetR, 5), new THREE.MeshToonMaterial({ color: 0xc4a060 }));
    planet.receiveShadow = true; scene.add(planet);

    // Permanent decorative buildings (vary across planet surface)
    const bCols = [0xd4b896, 0xb8956a, 0xc4a882, 0xa08060];
    for (let i = 0; i < 18; i++) {
      const h = 3 + Math.random() * 8, w = 2 + Math.random() * 3;
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), new THREE.MeshToonMaterial({ color: bCols[Math.floor(Math.random() * bCols.length)] }));
      const pos = new THREE.Vector3().setFromSphericalCoords(planetR, Math.random() * Math.PI, Math.random() * Math.PI * 2);
      m.position.copy(pos); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), pos.clone().normalize());
      m.castShadow = true; m.receiveShadow = true; scene.add(m);
    }

    /* ═══ PHYSICS ═══ */
    const world = new CANNON.World();
    world.gravity.set(0, 0, 0);
    world.solver.iterations = 12;
    world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetR) }));

    const pBody = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5)), fixedRotation: true, linearDamping: 0.1 });
    pBody.position.set(planetR + 3, 0, 0);
    world.addBody(pBody);

    const playerMesh = new THREE.Group();
    const pVis = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 1.2), new THREE.MeshToonMaterial({ color: 0x4477cc }));
    pVis.castShadow = true; playerMesh.add(pVis);
    scene.add(playerMesh);

    /* ═══ VFX ═══ */
    const vfx = new VFXSystem(scene, planetR);

    /* ═══════════════════════════════════════════════════════════════
       LEVEL SCENE MANAGEMENT
    ═══════════════════════════════════════════════════════════════ */
    let npcMeshes = [];
    let pickupMeshes = [];

    function clearLevelScene() {
      npcMeshes.forEach(n => {
        scene.remove(n.mesh);
        n.mesh.traverse(c => { c.geometry?.dispose(); if (Array.isArray(c.material)) c.material.forEach(m => m.dispose()); else c.material?.dispose(); });
      }); npcMeshes = [];
      pickupMeshes.forEach(m => { scene.remove(m); m.geometry?.dispose(); m.material?.dispose(); }); pickupMeshes = [];
    }

    function buildLevelScene(data) {
      // Atmosphere
      scene.background.setHex(data.sky); scene.fog.color.setHex(data.fog);
      ambientLight.color.setHex(data.ambCol); ambientLight.intensity = data.ambInt;
      sun.color.setHex(data.sunCol);
      // NPCs
      npcMeshes = data.npcs.map(npc => {
        const grp = new THREE.Group();
        const pad = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.4, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0x1a1a1a, emissive: 0x0a0a0a }));
        grp.add(pad);
        const ring = new THREE.Mesh(new THREE.TorusGeometry(2.6, 0.12, 8, 32), new THREE.MeshBasicMaterial({ color: npc.color }));
        ring.rotation.x = Math.PI / 2; grp.add(ring);
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.8, 1.8), new THREE.MeshToonMaterial({ color: npc.color }));
        body.position.y = 1.3; body.castShadow = true; grp.add(body);
        const p = new THREE.Vector3().setFromSphericalCoords(planetR, npc.pos[0] * Math.PI, npc.pos[1] * Math.PI * 2);
        grp.position.copy(p); grp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p.clone().normalize());
        scene.add(grp);
        return { mesh: grp, bodyMesh: body, data: npc };
      });
      // Collectables
      pickupMeshes = []; (data.collectables || []).forEach(c => {
        let geo;
        if (c.primitive === 'oct') geo = new THREE.OctahedronGeometry(c.radius);
        else if (c.primitive === 'sphere') geo = new THREE.SphereGeometry(c.radius);
        else geo = new THREE.BoxGeometry(...(c.size || [0.8, 0.8, 0.8]));
        const m = new THREE.Mesh(geo, new THREE.MeshToonMaterial({ color: c.color, emissive: c.color, emissiveIntensity: 0.3 }));
        m.position.set(...c.pos);
        m._evidenceId = c.evidenceId; m._id = c.id;
        m.castShadow = true; scene.add(m); pickupMeshes.push(m);
      });
      // Location display
      document.getElementById('loc-name').innerText = data.location;
      document.getElementById('act-label').innerText = data.actLabel;
      const lb = document.getElementById('loc-box');
      lb.style.display = 'block'; setTimeout(() => lb.style.display = 'none', 4000);
    }

/* ═══════════════════════════════════════════════════════════════
        GAME STATE
     ═══════════════════════════════════════════════════════════════ */
    let started = false, hasWon = false;
    let isDialogueOpen = false, activeNpc = null;
    let levelMgr = null, levelModal = null;
    let currentQuest = null;
    let keys = {}, mouseTarget = null, camHeading = new THREE.Vector3(0, 0, 1), canJump = true;
    let lastNearId = null;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const beep = (f, t = 'sine', d = 0.1) => {
      if (audioCtx.state === 'suspended') return;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
      g.gain.setValueAtTime(0.04, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
      o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d);
    };

    /* ═══════════════════════════════════════════════════════════════
       UI HELPERS
    ═══════════════════════════════════════════════════════════════ */
    function updateUI() {
      if (!currentQuest) return;
      const ev = levelMgr?.evidence || [];
      const reqCount = levelMgr?.currentData?.evidence?.filter(e => e.required).length || 0;
      const gotCount = levelMgr?.currentData?.evidence?.filter(e => e.required && ev.find(t => t.id === e.id)).length || 0;
      const isDone = currentQuest.completed || gotCount >= reqCount;
      document.getElementById('quest-list').innerHTML = `<div class="q-item ${isDone ? 'q-done' : ''}"><b>${currentQuest.name}</b><small>${currentQuest.task}</small><br><small style="color:var(--accent)">${isDone ? '✓ COMPLETE' : `EVIDENCE: ${gotCount}/${reqCount}`}</small></div>`;
      const invList = document.getElementById('inv-list');
      if (ev.length === 0) { invList.innerHTML = '<span style="color:var(--dim);font-size:.7rem">No evidence yet</span>'; return; }
      invList.innerHTML = ev.map(e => `<div class="item"><i class="fas fa-circle-dot" style="font-size:.6rem;margin-right:4px"></i>${e.label}</div>`).join('');
    }

    function showEvidenceToast(token) {
      const t = document.createElement('div'); t.className = 'evidence-toast';
      t.innerHTML = `<span class="ev-tag">${token.category}</span><strong>${token.label}</strong>`;
      document.body.appendChild(t);
      requestAnimationFrame(() => t.classList.add('visible'));
      setTimeout(() => { t.classList.remove('visible'); setTimeout(() => t.remove(), 500); }, 3200);
      beep(600, 'sine', 0.12); setTimeout(() => beep(800, 'sine', 0.08), 120);
    }

    function showPhaseIntroCard(data) {
      const card = document.createElement('div'); card.className = 'phase-intro-card';
      card.innerHTML = `<div class="phase-intro-inner"><p class="phase-act">${data.actLabel}</p><h1 class="phase-title">${data.title}</h1><p class="phase-sub">${data.subtitle}</p><p class="phase-loc">📍 ${data.location}</p><p class="phase-hint">Click to continue</p></div>`;
      document.body.appendChild(card);
      requestAnimationFrame(() => card.classList.add('visible'));
      const dismiss = () => { card.classList.remove('visible'); setTimeout(() => card.remove(), 600); };
      card.addEventListener('click', dismiss);
      setTimeout(dismiss, 4500);
    }

    function showPhaseCompleteCard(data) {
      const b = document.createElement('div'); b.className = 'phase-complete-banner';
      b.textContent = `✓ Phase ${data.phase} Complete — ${data.title}`;
      document.body.appendChild(b);
      requestAnimationFrame(() => b.classList.add('visible'));
      setTimeout(() => { b.classList.remove('visible'); setTimeout(() => b.remove(), 600); }, 3000);
    }

    function openEvidenceBoard() {
      const board = levelMgr?.getEvidenceBoard() || {};
      const content = document.getElementById('board-content');
      if (Object.keys(board).length === 0) { content.innerHTML = '<p style="color:var(--dim);text-transform:none">No evidence collected yet.</p>'; document.getElementById('board-overlay').style.display = 'block'; return; }
      content.innerHTML = '';
      for (const [cat, tokens] of Object.entries(board)) {
        const sec = document.createElement('div'); sec.className = 'board-cat';
        sec.innerHTML = `<h3>${cat}</h3><ul>${tokens.map(t => `<li><strong>${t.label}</strong><p>${t.description}</p><small style="color:var(--accent);font-size:.62rem">Phase ${t.phaseCollected}</small></li>`).join('')}</ul>`;
        content.appendChild(sec);
      }
      document.getElementById('board-overlay').style.display = 'block';
    }

    function triggerWin() {
      hasWon = true; isDialogueOpen = true; pBody.sleep();
      document.getElementById('win-screen').classList.remove('hidden');
      document.getElementById('win-screen').style.display = 'flex';
    }

    /* ═══════════════════════════════════════════════════════════════
       VN DIALOGUE SYSTEM  (from vn.html)
    ═══════════════════════════════════════════════════════════════ */
    const bubScroll = document.getElementById('bub-scroll');
    const barChoices = document.getElementById('bar-choices');

    function addMsg(cls, text) {
      const el = document.createElement('div'); el.className = 'msg ' + cls;
      el.textContent = text; bubScroll.appendChild(el);
      bubScroll.scrollTop = bubScroll.scrollHeight;
    }

    function addTyping(npcName, cb) {
      const row = document.createElement('div'); row.className = 'typing-row';
      row.innerHTML = `<div class="dot"></div><div class="dot"></div><div class="dot"></div><span style="font-size:.7rem;color:var(--dim);margin-left:4px">${npcName}…</span>`;
      bubScroll.appendChild(row); bubScroll.scrollTop = bubScroll.scrollHeight;
      setTimeout(() => { row.remove(); cb(); }, 550 + Math.random() * 200);
    }

    function showChoices(npcObj, choices) {
      barChoices.classList.toggle('hide', !choices || choices.length === 0);
      barChoices.innerHTML = '';
      if (!choices || choices.length === 0) return;
      choices.forEach(c => {
        const b = document.createElement('button'); b.className = 'choice-btn';
        b.textContent = '→ ' + c.text;
        b.onclick = () => pickChoice(npcObj, c);
        barChoices.appendChild(b);
      });
    }

    function revealNode(npcObj, nodeId) {
      const node = npcObj.data.story?.[nodeId]; if (!node) return;
      showChoices(npcObj, null);
      // Collect evidence on reveal
      if (node.evidenceId) levelMgr?.collectEvidence(node.evidenceId);
      addTyping(npcObj.data.name, () => {
        addMsg('npc', node.text);
        setTimeout(() => {
          if (!node.choices || node.choices.length === 0) {
            // End of dialogue — show close button
            barChoices.classList.remove('hide');
            barChoices.innerHTML = '';
            const b = document.createElement('button'); b.className = 'choice-btn';
            b.textContent = '[ End Conversation ]';
            b.onclick = () => closeDialogue();
            barChoices.appendChild(b);
          } else {
            showChoices(npcObj, node.choices);
          }
        }, 350);
      });
    }

    function pickChoice(npcObj, choice) {
      showChoices(npcObj, null);
      addMsg('player', choice.text);
      beep(400, 'sine', 0.05);
      setTimeout(() => revealNode(npcObj, choice.next), 450);
    }

    function startDialogue(npcObj) {
      isDialogueOpen = true; pBody.sleep(); mouseTarget = null;
      bubScroll.innerHTML = ''; barChoices.innerHTML = '';
      barChoices.classList.add('hide');
      document.getElementById('npc-name-display').innerText = npcObj.data.name;
      document.getElementById('local-dialogue-box').style.display = 'flex';
      addMsg('system', `[ ${npcObj.data.name} — ${levelMgr?.currentData?.location || 'Jerusalem'} ]`);
      setTimeout(() => revealNode(npcObj, 'Start'), 200);
      beep(500, 'sine', 0.08);
    }

    function closeDialogue() {
      document.getElementById('local-dialogue-box').style.display = 'none';
      isDialogueOpen = false; pBody.wakeUp(); pBody.velocity.set(0, 0, 0); mouseTarget = null;
      beep(300, 'sine', 0.06);
    }

    document.getElementById('btn-close-dlg').onclick = closeDialogue;

    /* ═══════════════════════════════════════════════════════════════
       INPUT
    ═══════════════════════════════════════════════════════════════ */
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space' && canJump && started) {
        const up = new THREE.Vector3().copy(pBody.position).normalize();
        pBody.applyImpulse(new CANNON.Vec3(up.x * 12, up.y * 12, up.z * 12), pBody.position);
        canJump = false; beep(320, 'sine', 0.05);
      }
      if (e.code === 'Escape' && isDialogueOpen) closeDialogue();
    });
    window.addEventListener('keyup', e => delete keys[e.code]);

    const raycaster = new THREE.Raycaster();
    const mouse2 = new THREE.Vector2();

    const handleInteraction = (x, y, target) => {
      if (!started || isDialogueOpen) return;
      if (target.closest('button, a, .ui-toggle, .panel, .overlay, .interact-prompt, .npc-bubble, #local-dialogue-box, #board-overlay, #level-select-overlay, #mobile-ctrl')) return;
      mouse2.x = (x / window.innerWidth) * 2 - 1;
      mouse2.y = -(y / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse2, camera);
      const hits = raycaster.intersectObject(planet);
      if (hits.length) mouseTarget = hits[0].point;
    };

    window.addEventListener('mousedown', e => handleInteraction(e.clientX, e.clientY, e.target));
    window.addEventListener('touchstart', e => {
      if (e.touches.length > 0) handleInteraction(e.touches[0].clientX, e.touches[0].clientY, e.target);
    }, { passive: false });

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    /* ═══════════════════════════════════════════════════════════════
       UI WIRING
    ═══════════════════════════════════════════════════════════════ */
    const toggle = (panelId, btnId) => {
      const p = document.getElementById(panelId), b = document.getElementById(btnId);
      const open = p.classList.toggle('open'); b.classList.toggle('active', open);
      if (!open) { ['panel-quest', 'panel-inv'].forEach(id => { if (id !== panelId) document.getElementById(id)?.classList.remove('open'); }); }
    };
    document.getElementById('btn-quest-toggle').onclick = () => toggle('panel-quest', 'btn-quest-toggle');
    document.getElementById('btn-inv-toggle').onclick = () => toggle('panel-inv', 'btn-inv-toggle');
    document.getElementById('btn-board-toggle').onclick = () => openEvidenceBoard();
    document.getElementById('btn-board-close').onclick = () => document.getElementById('board-overlay').style.display = 'none';
    document.getElementById('btn-map-toggle').onclick = () => { if (!started) return; levelModal?.open(); };

    let musicOn = true;
    document.getElementById('btn-sound-toggle').onclick = e => {
      e.stopPropagation(); musicOn = !musicOn;
      document.getElementById('btn-sound-toggle').innerHTML = musicOn ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-off"></i>';
    };

    document.getElementById('btn-replay').onclick = () => location.reload();

    /* ═══════════════════════════════════════════════════════════════
       MOBILE CONTROLS HELPERS
    ═══════════════════════════════════════════════════════════════ */
    function setupMobileControls() {
      const bind = (id, code) => {
        const el = document.getElementById(id);
        const start = (e) => { e.preventDefault(); e.stopPropagation(); keys[code] = true; el.classList.add('active'); };
        const end = (e) => { e.preventDefault(); e.stopPropagation(); delete keys[code]; el.classList.remove('active'); };
        el.addEventListener('touchstart', start); el.addEventListener('touchend', end);
        el.addEventListener('mousedown', start); el.addEventListener('mouseup', end); el.addEventListener('mouseleave', end);
      };
      bind('ctrl-up', 'KeyW'); bind('ctrl-down', 'KeyS');
      bind('ctrl-left', 'KeyA'); bind('ctrl-right', 'KeyD');

      const jEl = document.getElementById('ctrl-jump');
      const jStart = (e) => {
        e.preventDefault(); e.stopPropagation(); jEl.classList.add('active');
        if (canJump && started && !isDialogueOpen) {
          const up = new THREE.Vector3().copy(pBody.position).normalize();
          pBody.applyImpulse(new CANNON.Vec3(up.x * 12, up.y * 12, up.z * 12), pBody.position);
          canJump = false; beep(320, 'sine', 0.05);
        }
      };
      const jEnd = (e) => { e.preventDefault(); e.stopPropagation(); jEl.classList.remove('active'); };
      jEl.addEventListener('touchstart', jStart); jEl.addEventListener('touchend', jEnd);
      jEl.addEventListener('mousedown', jStart); jEl.addEventListener('mouseup', jEnd); jEl.addEventListener('mouseleave', jEnd);
    }

    /* ═══════════════════════════════════════════════════════════════
       START
    ═══════════════════════════════════════════════════════════════ */
    document.getElementById('btn-start').onclick = () => {
      audioCtx.resume();
      const w = document.getElementById('wipe-overlay');
      w.classList.add('active');
      setTimeout(() => { document.getElementById('start-screen').style.display = 'none'; }, 500);
      setTimeout(() => {
        started = true;
        levelMgr = new LevelManager();
        levelModal = new LevelSelectModal(levelMgr);
        levelMgr.start();
        setupMobileControls();
        updateUI();
      }, 1000);
    };

    /* ═══════════════════════════════════════════════════════════════
       GAME LOOP
    ═══════════════════════════════════════════════════════════════ */
    const worldPrompt = document.getElementById('world-prompt');
    const npcBubble = document.getElementById('npc-bubble');

    function loop() {
      requestAnimationFrame(loop);
      world.step(1 / 60);
      const pPos = new THREE.Vector3().copy(pBody.position);
      const up = pPos.clone().normalize();
      const pVel = new THREE.Vector3().copy(pBody.velocity);
      const dt = 1 / 60;

      vfx.update(dt, pPos, pVel, canJump);
      world.gravity.set(up.x * -9.82, up.y * -9.82, up.z * -9.82);
      if (pPos.length() < planetR + 1.7) canJump = true;

      if (!started) { renderer.render(scene, camera); return; }

      // Pickup collection
      if (!isDialogueOpen) {
        for (let i = pickupMeshes.length - 1; i >= 0; i--) {
          const m = pickupMeshes[i];
          m.rotation.y += 0.015; // spin
          if (pPos.distanceTo(m.position) < 3.2) {
            if (m._evidenceId) levelMgr?.collectEvidence(m._evidenceId);
            scene.remove(m); m.geometry?.dispose(); m.material?.dispose();
            pickupMeshes.splice(i, 1);
            beep(550, 'sine', 0.1); setTimeout(() => beep(700, 'sine', 0.08), 100);
          }
        }
      }

      // NPC proximity
      let nearNpc = null, nearDist = Infinity;
      npcMeshes.forEach(n => {
        n.bodyMesh.position.y = 1.3 + Math.sin(Date.now() * 0.0018 + n.data.pos[0] * 10) * 0.18;
        const d = pPos.distanceTo(n.mesh.position);
        if (d < 9 && d < nearDist) { nearDist = d; nearNpc = n; }
      });
      activeNpc = nearNpc;

      if (activeNpc && !isDialogueOpen) {
        worldPrompt.style.display = 'block';
        worldPrompt.textContent = 'SPEAK WITH ' + activeNpc.data.name.toUpperCase();
        const sp = activeNpc.mesh.position.clone().add(up.clone().multiplyScalar(5)).project(camera);
        worldPrompt.style.left = (sp.x * 0.5 + 0.5) * window.innerWidth + 'px';
        worldPrompt.style.top = (sp.y * -0.5 + 0.5) * window.innerHeight + 'px';
        worldPrompt.onclick = () => { if (activeNpc && !isDialogueOpen) startDialogue(activeNpc); };
        // Bubble above NPC
        npcBubble.style.display = 'block';
        npcBubble.textContent = activeNpc.data.bubbleMsg;
        const bp = activeNpc.mesh.position.clone().add(up.clone().multiplyScalar(5.5)).project(camera);
        npcBubble.style.left = (bp.x * 0.5 + 0.5) * window.innerWidth + 'px';
        npcBubble.style.top = (bp.y * -0.5 + 0.5) * window.innerHeight + 'px';
        if (lastNearId !== activeNpc.data.id) { lastNearId = activeNpc.data.id; beep(440, 'sine', 0.06); }
      } else {
        worldPrompt.style.display = 'none'; npcBubble.style.display = 'none';
        if (lastNearId) lastNearId = null;
      }

      // Movement
      if (!isDialogueOpen) {
        const camFwd = new THREE.Vector3().copy(up).cross(camHeading).normalize();
        const camRgt = new THREE.Vector3().crossVectors(up, camFwd).normalize();
        let moveDir = new THREE.Vector3();
        if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(camFwd);
        if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(camFwd);
        if (keys['KeyA'] || keys['ArrowLeft']) moveDir.add(camRgt);
        if (keys['KeyD'] || keys['ArrowRight']) moveDir.sub(camRgt);

        // Override point-and-click target if manual movement keys are pressed
        if (moveDir.lengthSq() > 0) mouseTarget = null;

        if (mouseTarget) {
          const tm = mouseTarget.clone().sub(pPos).projectOnPlane(up);
          if (tm.length() > 2) moveDir.add(tm.normalize()); else mouseTarget = null;
        }
        if (moveDir.length() > 0) {
          moveDir.normalize();
          camHeading.lerp(moveDir.projectOnPlane(up).normalize(), 0.15).normalize();
          const moveForce = 120;
          pBody.applyForce(new CANNON.Vec3(moveDir.x * moveForce, moveDir.y * moveForce, moveDir.z * moveForce), pBody.position);
        }
      } else {
        pBody.velocity.set(0, 0, 0);
      }

      playerMesh.position.copy(pPos); playerMesh.up.copy(up);
      playerMesh.lookAt(pPos.clone().add(camHeading.projectOnPlane(up).normalize()));

      camera.up.copy(up);
      const tCam = pPos.clone().add(camHeading.clone().multiplyScalar(-30)).add(up.clone().multiplyScalar(16));
      if (!isNaN(tCam.x)) camera.position.lerp(tCam, 0.05);
      camera.lookAt(pPos.clone().add(camHeading.clone().multiplyScalar(5)));

      renderer.render(scene, camera);
    }
    loop();
  </script>
</body>
