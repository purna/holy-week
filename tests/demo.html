<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evidence Detective App</title>
  <style>
    * { box-sizing: border-box; }body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f1117;
  color: #f5f5f5;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

header {
  padding: 12px;
  background: #151826;
  border-bottom: 1px solid #2a2f3d;
  font-weight: bold;
  text-align: center;
}

.tabs {
  display: flex;
  justify-content: space-around;
  background: #151826;
  border-bottom: 1px solid #2a2f3d;
}

.tab {
  flex: 1;
  padding: 12px;
  text-align: center;
  cursor: pointer;
}

.tab.active {
  background: #232a3a;
}

.view {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: none;
}

.view.active { display: block; }

.card {
  background: #1b2030;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #2c3244;
  transition: transform 0.15s ease, background 0.15s ease;
}

.card:active {
  transform: scale(0.98);
  background: #242b3f;
}

.evidence-card { cursor: pointer; }

.npc-card { cursor: pointer; }

.chat {
  background: #0b0d14;
  padding: 10px;
  border-radius: 10px;
  min-height: 180px;
  overflow-y: auto;
  border: 1px solid #2a2f3d;
}

.msg { margin-bottom: 8px; animation: fadeIn 0.2s ease; }

.player { color: #7dd3fc; }
.npc { color: #fbbf24; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.lab {
  background: #121622;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #2a2f3d;
}

.slots {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.slot {
  flex: 1;
  padding: 10px;
  background: #1b2030;
  border-radius: 8px;
  text-align: center;
  border: 1px dashed #3a425a;
  min-height: 40px;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}

button {
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #3b82f6;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:active { transform: scale(0.97); }

.result {
  margin-top: 10px;
  padding: 10px;
  border-radius: 10px;
  background: #0b0d14;
  border: 1px solid #2a2f3d;
  min-height: 40px;
}

  </style>
</head>
<body><header>🌍 World Detective Agency</header><div class="tabs">
  <div class="tab active" onclick="switchTab('map')">Map</div>
  <div class="tab active" onclick="switchTab('evidence')">Evidence</div>
  <div class="tab" onclick="switchTab('npc')">NPCs</div>
  <div class="tab" onclick="switchTab('lab')">Lab</div>
  <div class="tab" onclick="switchTab('chat')">Chat</div>
</div><!-- Map --><div id="map" class="view active">
  <div class="card">
    <h3>World Cases</h3>
    <p>Select a mystery location.</p>
  </div>  <div id="caseList"></div>
</div><!-- Evidence --><div id="evidence" class="view"></div><!-- NPC --><div id="npc" class="view"></div><!-- Lab --><div id="lab" class="view">
  <div class="lab">
    <h3>Investigation Lab</h3><div class="slots">
  <div class="slot" id="slotA">Tap Evidence A</div>
  <div class="slot" id="slotB">Tap Evidence B</div>
</div>

<div class="actions">
  <button onclick="compare()">Compare</button>
  <button onclick="linkEvidence()">Link</button>
  <button onclick="timeline()">Timeline</button>
  <button onclick="contradict()">Contradict</button>
</div>

<div class="result" id="result">Select evidence to begin analysis.</div>

  </div>
</div><!-- Chat --><div id="chat" class="view">
  <div class="chat" id="chatBox"></div>
</div><script>
const cases = [
{
  id:'school',
  title:'The Missing Science Trophy',
  location:'London School',
  intro:'Someone stole the school science trophy.',
  evidence:[
    { id:'mud', name:'Muddy Shoes', desc:'Mud stuck to shoes' },
    { id:'finger', name:'Fingerprint', desc:'Matches Alex' },
    { id:'key', name:'Greenhouse Key', desc:'Hidden behind locker' }
  ],
  npcs:[
    {name:'Alex',dialogue:'I was at football practice.'},
    {name:'Mia',dialogue:'I saw muddy footprints.'}
  ]
},
{
  id:'museum',
  title:'The Museum Diamond Mystery',
  location:'Paris Museum',
  intro:'A rare diamond vanished overnight.',
  evidence:[
    { id:'glass', name:'Broken Glass', desc:'Window shattered from outside' },
    { id:'ticket', name:'Train Ticket', desc:'Leads to Rome' },
    { id:'camera', name:'Security Photo', desc:'Shows a masked figure' }
  ],
  npcs:[
    {name:'Curator',dialogue:'The alarm never triggered.'},
    {name:'Guard',dialogue:'I heard glass breaking.'}
  ]
}
];

const state = {
  evidence: [],
  selectedA: null,
  selectedB: null,
  deductions: []
};

let currentCase = cases[0];

let evidenceData = currentCase.evidence;

function renderCases() {
  const el = document.getElementById('caseList');
  el.innerHTML='';

  cases.forEach(c=>{
    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`<h3>${c.title}</h3><p>${c.location}</p><p>${c.intro}</p>`;

    div.onclick=()=>loadCase(c);

    el.appendChild(div);
  });
}

function loadCase(c) {
  currentCase = c;
  evidenceData = c.evidence;

  state.evidence=[];
  state.selectedA=null;
  state.selectedB=null;

  updateSlots();
  renderCases();
renderEvidence();
renderNPCs();

  switchTab('evidence');

  showResult(`Loaded case: ${c.title}`);

  const chatBox=document.getElementById('chatBox');
  chatBox.innerHTML='';
  chatBox.innerHTML += `<div class='msg npc'><b>Agency:</b> ${c.intro}</div>`;
}

function renderEvidence() {
  const el = document.getElementById("evidence");
  el.innerHTML = "";

  evidenceData.forEach(e => {
    const div = document.createElement("div");
    div.className = "card evidence-card";
    div.innerHTML = `<b>${e.name}</b><br>${e.desc}`;

    div.onclick = () => {
      if (!state.evidence.includes(e)) state.evidence.push(e);
      selectEvidence(e);
      renderEvidence();
    };

    if (state.evidence.includes(e)) {
      div.style.border = "1px solid #60a5fa";
    }

    el.appendChild(div);
  });
}

function renderNPCs() {
  const el = document.getElementById('npc');
  el.innerHTML='';

  currentCase.npcs.forEach(n=>{
    const div=document.createElement('div');
    div.className='card npc-card';
    div.innerHTML=`<b>${n.name}</b><p>Tap to question</p>`;

    div.onclick=()=>talk(n.name,n.dialogue);

    el.appendChild(div);
  });
}

function talk(name, msg) {
  switchTab('chat');
  const box = document.getElementById("chatBox");
  box.innerHTML += `<div class='msg npc'><b>${name}:</b> ${msg}</div>`;
}

function selectEvidence(e) {
  if (!state.selectedA) state.selectedA = e;
  else state.selectedB = e;

  updateSlots();
}

function updateSlots() {
  document.getElementById("slotA").innerText = state.selectedA ? state.selectedA.name : "Tap Evidence A";
  document.getElementById("slotB").innerText = state.selectedB ? state.selectedB.name : "Tap Evidence B";
}

function compare() {
  if (state.selectedA && state.selectedB) {
    const result = `Comparison shows a relationship between ${state.selectedA.name} and ${state.selectedB.name}.`;
    showResult(result);
    addDeduction(result);
  }
}

function linkEvidence() {
  if (state.selectedA && state.selectedB) {
    showResult(`Linked ${state.selectedA.name} with ${state.selectedB.name}. New deduction formed.`);
  }
}

function timeline() {
  showResult("Timeline reconstructed from selected evidence.");
}

function contradict() {
  showResult("Contradiction found in suspect statement.");
}

function addDeduction(text) {
  if (!state.deductions.includes(text)) {
    state.deductions.push(text);

    const chat=document.getElementById('chatBox');
    chat.innerHTML += `<div class='msg player'><b>Deduction:</b> ${text}</div>`;
  }
}

function showResult(text) {
  document.getElementById("result").innerText = text;
}

function switchTab(tab) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));

  document.getElementById(tab).classList.add("active");
  event.target.classList.add("active");
}

renderEvidence();
renderNPCs();
</script></body>
</html>
