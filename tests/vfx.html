    <title>Miracle Maker 3D- Atmospheric Particles</title>
    <!--

        CORE CONCEPT
        ------------
        Advanced particle VFX prototype featuring optimized particle pool system.
        Demonstrates efficient GPU-based particle rendering with Three.js Points
        and custom update logic for gravity, lifetime, and color.

        KEY FEATURES
        ------------
        • VFXSystem class (lines 363–550) managing all effects
        • Particle pool: 2500 pre-allocated particles (off-screen initially at 99999)
        • Three particle types:
          - DUST: grey, short-lived (0.4–0.8s), emitted on footfalls
          - AMBIENT: cyan spores, long-lived (5–10s), random emission
          - FIREWORK: explosion of 200 mixed-color particles on quest complete
        • Bird flocking: 20 birds with velocity, altitude maintenance, wing-flap bob
        • Bird AI: flock circles at altitude, random direction changes
        • No decals (decal code removed from this version)

        PARTICLE PHYSICS
        ----------------
        Each particle has: position (Vector3), velocity (Vector3), lifetime (float)
        Gravity: particles pulled toward planet surface (up × -20)
        Update: position += velocity × dt, lifetime -= dt
        Render: PointsMaterial with vertexColors, AdditiveBlending
        Optimization: single BufferGeometry with typed arrays

        BIRD SYSTEM
        -----------
        Bird geometry: ConeGeometry(0.4, 1.2, 3) rotated X 90° (dart shape)
        Flight: random initial velocity, maintain altitude (planetR+30)
        Bobbing: sin(phase) × 0.08 vertical offset
        Orientation: lookAt(mesh.position + velocity)
        Phase: random start + dt×10 for asynchronous flapping

        COMPARISON TO test.html
        -----------------------
        Identical game logic and UI to test.html
        VFX system extracts particle effects into class
        Bird flock added (test.html had no birds)
        Decals removed (only in landing.html)
        No sound effects (audio code stubbed but not initialized)
        No Howler dependency

        WHY THIS VARIANT EXISTS
        -----------------------
        Demonstrates performance-optimized particle rendering versus
        landing.html's decal+VFX hybrid approach. Lower memory footprint
        due to particle pool reuse.

        CONTROLS
        --------
        Identical to test.html (WASD + Space + Mouse)

        TECHNICAL
        ---------
        • Geometry: THREE.BufferGeometry with position + color attributes
        • Material: THREE.PointsMaterial({ size: 1.5, vertexColors: true, blending: AdditiveBlending, depthWrite: false })
        • Update frequency: every frame in loop(): vfx.update(dt, playerPos, playerVel, isGrounded)
        • Bird update: vfx.update() handles flock AI internally

        ASSETS: None external (procedural)

        Known issues: Particles may clump if too many emitted at once; bird collision not implemented
    -->

    <script type="importmap">{ "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        // ===== VFX SYSTEM CLASS =====
        class VFXSystem {
            constructor(scene, planetR) {
                this.scene = scene;
                this.planetR = planetR;

                // --- 1. DUST & FIREWORKS (Optimized Points Pool) ---
                const maxParticles = 2500;
                this.geom = new THREE.BufferGeometry();
                this.positions = new Float32Array(maxParticles * 3);
                this.colors = new Float32Array(maxParticles * 3);
                this.lifetimes = new Float32Array(maxParticles);
                this.velocities = [];

                for (let i = 0; i < maxParticles; i++) {
                    // Hide off-screen initially
                    this.positions[i * 3] = 99999;
                    this.positions[i * 3 + 1] = 99999;
                    this.positions[i * 3 + 2] = 99999;
                    this.velocities.push(new THREE.Vector3());
                    this.lifetimes[i] = 0;
                }

                this.geom.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
                this.geom.setAttribute('color', new THREE.BufferAttribute(this.colors, 3));

                const mat = new THREE.PointsMaterial({
                    size: 1.5,
                    vertexColors: true,
                    transparent: true,
                    opacity: 1.0,
                    blending: THREE.AdditiveBlending, // Makes overlapping particles glow
                    depthWrite: false
                });

                this.particleMesh = new THREE.Points(this.geom, mat);
                this.scene.add(this.particleMesh);

                // --- 2. BIRDS (Flock in the sky) ---
                this.birds = new THREE.Group();
                const birdGeo = new THREE.ConeGeometry(0.4, 1.2, 3);
                birdGeo.rotateX(Math.PI / 2); // Point geometry forward
                const birdMat = new THREE.MeshBasicMaterial({ color: 0x00f2ff }); // Match primary accent

                this.birdData = [];
                for (let i = 0; i < 20; i++) {
                    const b = new THREE.Mesh(birdGeo, birdMat);
                    // Start them high in the sky
                    const p = new THREE.Vector3().setFromSphericalCoords(
                        planetR + 30 + Math.random() * 10,
                        Math.random() * Math.PI,
                        Math.random() * Math.PI * 2
                    );
                    b.position.copy(p);
                    this.birds.add(b);

                    this.birdData.push({
                        mesh: b,
                        vel: new THREE.Vector3().randomDirection().multiplyScalar(15),
                        phase: Math.random() * Math.PI * 2
                    });
                }
                this.scene.add(this.birds);
            }

            spawnParticle(pos, vel, color, life) {
                for (let i = 0; i < this.lifetimes.length; i++) {
                    if (this.lifetimes[i] <= 0) {
                        this.lifetimes[i] = life;
                        this.positions[i * 3] = pos.x;
                        this.positions[i * 3 + 1] = pos.y;
                        this.positions[i * 3 + 2] = pos.z;

                        this.colors[i * 3] = color.r;
                        this.colors[i * 3 + 1] = color.g;
                        this.colors[i * 3 + 2] = color.b;

                        this.velocities[i].copy(vel);

                        // Tell Three.js the colors changed
                        this.geom.attributes.color.needsUpdate = true;
                        return;
                    }
                }
            }

            emitDust(pos, up) {
                const color = new THREE.Color(0x444455);
                for (let i = 0; i < 2; i++) {
                    const vel = new THREE.Vector3()
                        .randomDirection()
                        .multiplyScalar(3)
                        .add(up.clone().multiplyScalar(2));

                    // Offset to player's feet
                    const p = pos.clone().add(new THREE.Vector3().randomDirection().multiplyScalar(0.5));
                    p.sub(up.clone().multiplyScalar(1.0));
                    this.spawnParticle(p, vel, color, 0.4 + Math.random() * 0.4);
                }
            }

            emitAmbientDust(playerPos) {
                // Only emit occasionally to create sparse floating spores
                if (Math.random() > 0.1) return;

                const color = new THREE.Color(0x00f2ff); // Neon blue dust
                const offset = new THREE.Vector3().randomDirection().multiplyScalar(15 + Math.random() * 10);
                const spawnPos = playerPos.clone().add(offset);

                // Very slow drift
                const vel = new THREE.Vector3().randomDirection().multiplyScalar(0.5);

                // Long life (5 to 10 seconds)
                this.spawnParticle(spawnPos, vel, color, 5 + Math.random() * 5);
            }

            emitFirework(pos, up) {
                const colors = [new THREE.Color(0xffaa00), new THREE.Color(0x00f2ff), new THREE.Color(0x00ffaa)];
                const color = colors[Math.floor(Math.random() * colors.length)];
                const origin = pos.clone().add(up.clone().multiplyScalar(6)); // Burst above player

                for (let i = 0; i < 200; i++) {
                    const vel = new THREE.Vector3().randomDirection().multiplyScalar(15 + Math.random() * 20);
                    this.spawnParticle(origin, vel, color, 1.5 + Math.random() * 1.5);
                }
            }

            update(dt, playerPos, playerVel, isGrounded) {
                // --- Update Particles ---
                const posAttr = this.geom.attributes.position;
                let needsUpdate = false;

                for (let i = 0; i < this.lifetimes.length; i++) {
                    if (this.lifetimes[i] > 0) {
                        this.lifetimes[i] -= dt;

                        const p = new THREE.Vector3(posAttr.array[i * 3], posAttr.array[i * 3 + 1], posAttr.array[i * 3 + 2]);
                        const up = p.clone().normalize();

                        // Gravity pulls particles back down
                        this.velocities[i].add(up.multiplyScalar(-20 * dt));
                        p.add(this.velocities[i].clone().multiplyScalar(dt));

                        posAttr.array[i * 3] = p.x;
                        posAttr.array[i * 3 + 1] = p.y;
                        posAttr.array[i * 3 + 2] = p.z;

                        if (this.lifetimes[i] <= 0) posAttr.array[i * 3] = 99999; // Hide when dead
                        needsUpdate = true;
                    }
                }
                if (needsUpdate) posAttr.needsUpdate = true;

                // --- Auto-emit Dust ---
                if (isGrounded && playerVel.lengthSq() > 10) {
                    if (Math.random() > 0.4) {
                        const up = playerPos.clone().normalize();
                        this.emitDust(playerPos, up);
                    }
                }

                // --- Ambient Fog Dust ---
                this.emitAmbientDust(playerPos);

                // --- Update Birds ---
                this.birdData.forEach(bird => {
                    bird.phase += dt * 10;
                    const bPos = bird.mesh.position;
                    const up = bPos.clone().normalize();

                    // Maintain altitude
                    const alt = bPos.length();
                    const targetAlt = this.planetR + 30;
                    if (alt > targetAlt) bird.vel.add(up.clone().multiplyScalar(-5 * dt));
                    if (alt < targetAlt) bird.vel.add(up.clone().multiplyScalar(5 * dt));

                    bPos.add(bird.vel.clone().multiplyScalar(dt));

                    // Flapping/bobbing math
                    bPos.add(up.clone().multiplyScalar(Math.sin(bird.phase) * 0.08));

                    bird.mesh.position.copy(bPos);
                    bird.mesh.up.copy(up);
                    if (bird.vel.lengthSq() > 0.01) {
                        bird.mesh.lookAt(bPos.clone().add(bird.vel));
                    }
                });
            }
        }

        // ===== AUDIO CONFIG (update filenames here) =====
        const basePath = ''; // './assets/sounds/'
        const SOUND = {

            // UI sounds
            panelOpen: basePath + 'panel_open.mp3',
            panelClose: basePath + 'panel_close.mp3',
            buttonClick: basePath + 'button_click.mp3',
            questDone: basePath + 'quest_complete.mp3',
            victory: basePath + 'victory_fanfare.mp3',
            pickup: basePath + 'pickup.mp3',
            // Ambient
            birds: basePath + 'bird_song.mp3',
            // Music
            bgMusic: basePath + 'bg_music.mp3',
            // NPC-specific (by ID)
            npc: {
                1: { enter: basePath + 'echo_enter.mp3', exit: basePath + 'echo_exit.mp3' },
                2: { enter: basePath + 'horizon_enter.mp3', exit: basePath + 'horizon_exit.mp3' },
                3: { enter: basePath + 'spire_enter.mp3', exit: basePath + 'spire_exit.mp3' },
                4: { enter: basePath + 'keeper_enter.mp3', exit: basePath + 'keeper_exit.mp3' }
            }
        };

        let started = false;

            osc.type = t; osc.frequency.setValueAtTime(f, audioCtx.currentTime);
            g.gain.setValueAtTime(0.05, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + d);
        };

        // NPC Configuration (multiple NPCs supported)

        // Load all NPC Ink stories at startup (only for NPCs with dialogue)
        async function loadAllStories() {

        loadAllStories();

        const scene = new THREE.Scene();

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const sun = new THREE.DirectionalLight(0xffffff, 2.5);

        scene.add(new THREE.AmbientLight(0x404040, 1.5));


        const world = new CANNON.World();
        world.solver.iterations = 15;
        const planetR = 50;

        // --- RICHER SCENE ELEMENTS ---

        // 1. Star Field
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for (let i = 0; i < 1500; i++) {
            const v = new THREE.Vector3().randomDirection().multiplyScalar(Math.random() * 2000 + 100);
            starPos.push(v.x, v.y, v.z);

        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x88ccff, size: 1.5, transparent: true, opacity: 0.8 }));
        scene.add(stars);

        // 2. Crystal Clusters
        for (let i = 0; i < 15; i++) {
            const pos = new THREE.Vector3().setFromSphericalCoords(planetR, Math.random() * Math.PI, Math.random() * Math.PI * 2);

        // 3. Relay Towers with Decorative Rings
        for (let i = 0; i < 6; i++) {

            const body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(1.5, 5, 1.5)) });
            body.position.copy(pos); body.quaternion.copy(tower.quaternion);
            world.addBody(body);

        // System Arrays
        const inventory = [];
        const actions = [ // Special actions that can be performed
            { name: "Scan Area", type: "scan", icon: "fas fa-search", consumable: false },
            { name: "Repair Gear", type: "repair", icon: "fas fa-wrench", consumable: true },
            { name: "Hack Terminal", type: "hack", icon: "fas fa-laptop-code", consumable: true },

        ]; // For special actions that can be performed
        const quests = [
            { id: 'RECON', name: 'NORTH_RECON', task: 'Reach the North Spire', cur: 0, tar: 1, completed: false },

            { id: 'SHARDS', name: 'SIGNAL_FRAGMENTS', task: 'Collect Purple Shards', cur: 0, tar: 3, completed: false },

        pVis.receiveShadow = true;

        scene.add(playerMesh);

        const vfx = new VFXSystem(scene, planetR);

        // --- ITEMS: Data Cells & Signal Shards ---
        const pickups = [];
        // Data Cells (orange spheres) - 4
        for (let i = 0; i < 4; i++) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(1), new THREE.MeshToonMaterial({ color: 0xffaa00 }));
            m.name = `CELL_${i + 1}`;
            m.position.setFromSphericalCoords(planetR + 1.2, Math.random() * Math.PI, Math.random() * Math.PI * 2);
            m.castShadow = true; scene.add(m); pickups.push(m);
        }
        // Signal Shards (purple octahedrons) - 4
        for (let i = 0; i < 4; i++) {
            const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.9), new THREE.MeshStandardMaterial({ color: 0xa020f0, emissive: 0x4a0080 }));

        // --- WORLD PRIMITIVES (collidable buildings) with shadows ---
        const buildings = [];
        for (let i = 0; i < 8; i++) {

            const m = new THREE.Mesh(new THREE.BoxGeometry(3, h, 3), new THREE.MeshToonMaterial({ color: 0x333344 }));
            const pos = new THREE.Vector3().setFromSphericalCoords(planetR + h / 2, Math.random() * Math.PI, Math.random() * Math.PI * 2);
            m.position.copy(pos);

            m.castShadow = true;
            m.receiveShadow = true;

            body.quaternion.copy(m.quaternion);
            world.addBody(body);

        // --- NPCS (With Base Pads) ---
        const npcMeshes = npcs.map(npc => {
            const grp = new THREE.Group();

            // Base Pad
            const pad = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0x222222, emissive: 0x111111 }));
            grp.add(pad);

            // NPC Body
            const m = new THREE.Mesh(new THREE.CapsuleGeometry(1, 2), new THREE.MeshToonMaterial({ color: npc.color }));
            m.position.y = 1.5; m.castShadow = true; m.receiveShadow = true;
            grp.add(m);

            const p = new THREE.Vector3().setFromSphericalCoords(planetR, npc.pos[0] * Math.PI, npc.pos[1] * Math.PI * 2);
            grp.position.copy(p);
            grp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p.clone().normalize());
            scene.add(grp);

            return { mesh: grp, bodyMesh: m, data: npc };
        });

        // --- INPUTS & CAMERA CONTROL ---
        const keys = {};
        let mouseTarget = null;
        let camHeading = new THREE.Vector3(0, 0, 1);
        let canJump = true;
        let activeNpc = null;
        let hasWon = false;

        // --- AUDIO ENGINE (uses SOUND config) ---
        let uiSounds = {};
        let ambientSounds = {};
        let npcInteractionSounds = {};

        // Initialize only if Howler is available
        if (typeof Howler !== 'undefined') {
            uiSounds = {
                open: new Howl({ src: [SOUND.panelOpen], volume: 0.4 }),
                close: new Howl({ src: [SOUND.panelClose], volume: 0.3 }),
                click: new Howl({ src: [SOUND.buttonClick], volume: 0.5 }),
                questComplete: new Howl({ src: [SOUND.questDone], volume: 0.7 }),
                victory: new Howl({ src: [SOUND.victory], volume: 0.8 }),
                pickup: new Howl({ src: [SOUND.pickup], volume: 0.5 })
            };

            ambientSounds = {
                birds: new Howl({ src: [SOUND.birds], loop: true, volume: 0, autoplay: false })
            };
        }

        const playNpcSound = (npcId, type) => {
            if (typeof Howler === 'undefined') return;
            const npcCfg = SOUND.npc[npcId];
            if (!npcCfg || !npcCfg[type]) return;
            const key = `${npcId}_${type}`;
            if (!npcInteractionSounds[key]) {
                npcInteractionSounds[key] = new Howl({ src: [npcCfg[type]], volume: 0.6 });
            }
            npcInteractionSounds[key].play();
        };

        // Background Music via Howler (if available)
        let musicEnabled = true;
        let bgMusic = null;
        if (typeof Howler !== 'undefined') {
            bgMusic = new Howl({
                src: [SOUND.bgMusic],
                loop: true,
                volume: 0.35,
                autoplay: false
            });
        }

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            // Jump Logic
            if (e.code === 'Space' && canJump && started) {
                const up = new THREE.Vector3().copy(pBody.position).normalize();
                pBody.applyImpulse(new CANNON.Vec3(up.x * 12, up.y * 12, up.z * 12), pBody.position);
                canJump = false;
                playBeep(300, "sine", 0.05);
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        window.addEventListener('mousedown', e => {
            if (!started) return;
            // Ignore clicks on UI elements
            if (e.target.closest('.ui-toggle') || e.target.closest('.panel') || e.target.closest('.overlay') || e.target.closest('#wipe-overlay')) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObject(planet);
            if (hits.length) mouseTarget = hits[0].point;
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });

        // Ink text processing: strip control markers
        function stripInkMarkers(s) {
            if (!s) return '';
            const rawLines = s.split(/\r?\n/);
            const out = [];
            for (let line of rawLines) {
                let l = (line || '').trim();
                if (l === '#' || l === '/#') continue;
                if (l.startsWith('^')) l = l.slice(1).trim();
                if (l.startsWith('#')) l = l.slice(1).trim();
                if (l) out.push(l);
            }
            return out.join('\n');
        }

        const updateUI = () => {
            document.getElementById('inv-list').innerHTML = inventory.length ? inventory.map(i => `<div class="item">${i}</div>`).join('') : "0_CELLS";
            document.getElementById('actions-list').innerHTML = actions.length ? actions.map(a => `<div class="item"><i class="${a.icon}"></i> ${a.name}</div>`).join('') : "NO_ACTIONS";
            document.getElementById('quest-list').innerHTML = quests.map(q => `<div class="q-item ${q.cur >= q.tar ? 'q-done' : ''}"><b>${q.name}</b><br><small>${q.task} [${q.cur}/${q.tar}]</small></div>`).join('');

            // Check for quest completions (only trigger once per quest)
            quests.forEach(q => {
                if (!q.completed && q.cur >= q.tar) {
                    q.completed = true;
                    if (uiSounds.questComplete) uiSounds.questComplete.play();

                    // TRIGGER FIREWORKS
                    const pPos = new THREE.Vector3().copy(pBody.position);
                    const up = pPos.clone().normalize();
                    vfx.emitFirework(pPos, up);
                }
            });

            checkWinCondition();
        };

        // Check if all quests are complete, trigger win screen
        const checkWinCondition = () => {
            if (hasWon) return;
            const allDone = quests.every(q => q.cur >= q.tar);
            if (allDone) {
                hasWon = true;
                setTimeout(() => triggerWinSequence(), 1500); // 1.5s delay after last quest completes
            }
        };


        const triggerWinSequence = () => {
            // Disable player movement and hide any open UI
            isDialogueOpen = true;
            pBody.sleep();
            mouseTarget = null;
            document.getElementById('local-dialogue-box').style.display = 'none';
            // Hide panels
            panelInv.classList.remove('open');
            panelQuest.classList.remove('open');
            // Pause music
            if (bgMusic) bgMusic.pause();
            // Play victory
            if (uiSounds.victory) uiSounds.victory.play();

            const wipe = document.getElementById('wipe-overlay');
            wipe.classList.add('active'); // wipe in (left → right, 1s)

            // At the moment the wipe fully covers the screen (500ms), reveal win screen behind
            setTimeout(() => {
                document.getElementById('win-screen').style.display = 'flex';
            }, 500);
        };

        const continueStory = () => {
            const textEl = document.getElementById('bubble-text');
            const choiceEl = document.getElementById('bubble-choices');
            let txt = "";
            while (inkStory.canContinue) txt += inkStory.Continue();

            const cleaned = stripInkMarkers(txt);
            console.log('Cleaned:', cleaned);
            textEl.innerHTML = cleaned;
            choiceEl.innerHTML = "";
            inkStory.currentChoices.forEach(c => {
                const b = document.createElement('button');
                b.className = "choice-btn"; b.innerText = c.text;
                b.onclick = () => { inkStory.ChooseChoiceIndex(c.index); continueStory(); };
                choiceEl.appendChild(b);
            });
            if (inkStory.currentChoices.length === 0 && !inkStory.canContinue) {
                const b = document.createElement('button');
                b.className = "choice-btn"; b.innerText = "[CLOSE CONNECTION]";
                b.onclick = () => {
                    document.getElementById('local-dialogue-box').style.display = 'none';
                    isDialogueOpen = false;
                    pBody.wakeUp();
                    pBody.velocity.set(0, 0, 0);
                    mouseTarget = null;
                    // Play NPC onExit sound

                choiceEl.appendChild(b);

        const worldPrompt = document.getElementById('world-prompt');
        worldPrompt.onclick = () => {
            // Detect Ink runtime (inkjs UMD exposes window.inkjs or window.ink)
            const inkLib = (() => {
                if (typeof window.inkjs !== 'undefined' && window.inkjs.Story) return window.inkjs;
                if (typeof window.ink !== 'undefined' && window.ink.Story) return window.ink;
                return null;
            })();
            if (!inkLib) { console.error("INK_RUNTIME_NOT_FOUND", { hasInkjs: !!window.inkjs, hasInk: !!window.ink }); return; }

            if (!activeNpc || !npcStories[activeNpc.data.id]) {
                console.error("No NPC or story data not loaded yet");
                return;
            }

            // Freeze player physics when dialogue starts
            pBody.sleep();
            mouseTarget = null;

            // Track NPC visit for quest (only first time)
            if (activeNpc.data.questId !== undefined && !visitedNpcs.has(activeNpc.data.id)) {
                visitedNpcs.add(activeNpc.data.id);

                } else {
                    npcNameEl.innerText = activeNpc.data.name;

        };

        document.getElementById('btn-start').onclick = () => {
            const wipe = document.getElementById('wipe-overlay');

        // --- UI PANEL INTERACTIONS (Actions Panel) ---
        document.getElementById('actions-list').addEventListener('click', (e) => {

            const actionIndex = Array.from(actionDiv.parentNode.children).indexOf(actionDiv);
            const action = actions[actionIndex];

            if (!action) return;

            // Execute the action
            executeAction(action);
        });

        // Action execution function
        const executeAction = (action) => {
            // Play action sound
            if (uiSounds.click) uiSounds.click.play();

            // Show floating icon effect from player position
            showFloatingActionIcon(action.icon);

            // Check if near an NPC for quest completion
            let questCompleted = false;
            if (activeNpc && activeNpc.data.questId !== undefined) {
                const questId = activeNpc.data.questId;
                const quest = quests[questId];

                // Define which actions complete which quests
                const actionQuestMap = {
                    'scan': 'RECON',      // Scan action completes reconnaissance
                    'repair': 'CELLS',    // Repair action completes cell recovery
                    'hack': 'SHARDS',     // Hack action completes signal fragments
                    'heal': 'VISIT'       // Heal action completes horizon visit
                };

                if (actionQuestMap[action.type] === quest.id && !quest.completed) {
                    // Complete the quest
                    quest.cur = quest.tar;
                    quest.completed = true;
                    questCompleted = true;
                    if (uiSounds.questComplete) uiSounds.questComplete.play();

                    // TRIGGER FIREWORKS
                    const pPos = new THREE.Vector3().copy(pBody.position);
                    const up = pPos.clone().normalize();
                    vfx.emitFirework(pPos, up);

                    // Mark NPC as visited for this quest
                    visitedNpcs.add(activeNpc.data.id);
                }
            }

            // If quest wasn't completed by action, handle normal action logic
            if (!questCompleted) {
                // Handle action-specific logic
                switch (action.type) {
                    case 'scan':
                        performScanAction();
                        break;
                    case 'repair':
                        performRepairAction();
                        break;
                    case 'hack':
                        performHackAction();
                        break;
                    case 'heal':
                        performHealAction();
                        break;
                    default:
                        // Generic action
                        performGenericAction(action);
                        break;
                }
            }

            // Update UI to reflect quest changes
            updateUI();

            // Remove action from list after use (if it's consumable)
            if (action.consumable) {
                const index = actions.indexOf(action);
                if (index > -1) {
                    actions.splice(index, 1);
                    updateUI();
                }
            }
        };

        // Floating action icon effect
        const floatingIcons = [];

        const showFloatingActionIcon = (iconClass) => {
            // Create floating icon element
            const icon = document.createElement('i');
            icon.className = `${iconClass} floating-action-icon`;

            // Get player screen position
            const playerPos = new THREE.Vector3().copy(pBody.position);
            const playerScreenPos = playerPos.project(camera);

            // Set initial position with slight random offset (more on X than Y)
            const startX = (playerScreenPos.x * 0.5 + 0.5) * window.innerWidth + (Math.random() - 0.5) * 60;
            const startY = (playerScreenPos.y * -0.5 + 0.5) * window.innerHeight + (Math.random() - 0.5) * 20;
            icon.style.left = `${startX}px`;
            icon.style.top = `${startY}px`;

            // Initialize transform and opacity
            icon.style.transform = 'translate(0, 0) scale(2)';
            icon.style.opacity = '1';

            document.body.appendChild(icon);

            // Animation parameters
            let startTime = null;
            const duration = 3000; // 3 seconds - slower
            const travelDistance = 500; // pixels to travel upward

            const animate = (timestamp) => {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);

                // Scale: start at 2, end at 1
                const scale = 2 - progress;

                // Vertical movement
                const translateY = -travelDistance * progress;
                icon.style.transform = `translate(0, ${translateY}px) scale(${scale})`;

                // Fade out: fade starts at 20% progress, ends at 60%
                let opacity;
                if (progress < 0.2) {
                    opacity = 1;
                } else if (progress < 0.6) {
                    opacity = 1 - ((progress - 0.2) / 0.4);
                } else {
                    opacity = 0;
                }
                icon.style.opacity = opacity;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    document.body.removeChild(icon);
                }
            };

            requestAnimationFrame(animate);
        };

        // Action implementations
        const performScanAction = () => {
            // Logic for scanning action
            console.log('Performing scan action');
            // Could reveal hidden objects, NPCs, etc.
            if (uiSounds.questComplete) uiSounds.questComplete.play(); // Reuse quest complete sound for now
        };

        const performRepairAction = () => {
            // Logic for repair action
            console.log('Performing repair action');
            // Could repair damaged objects, complete quests
            if (uiSounds.questComplete) uiSounds.questComplete.play();
        };

        const performHackAction = () => {
            // Logic for hack action
            console.log('Performing hack action');
            // Could hack terminals, doors, etc.
            if (uiSounds.questComplete) uiSounds.questComplete.play();
        };

        const performHealAction = () => {
            // Logic for heal action
            console.log('Performing heal action');
            // Could heal player or NPCs
            if (uiSounds.questComplete) uiSounds.questComplete.play();
        };

        const performGenericAction = (action) => {
            // Generic action handler
            console.log(`Performing ${action.name} action`);
            if (uiSounds.questComplete) uiSounds.questComplete.play();
        };


        // Sound toggle button (bottom right)
        const btnSound = document.getElementById('btn-sound-toggle');
        btnSound.onclick = (e) => {
            e.stopPropagation();
            if (uiSounds.click) uiSounds.click.play();
            musicEnabled = !musicEnabled;
            if (bgMusic) {
                bgMusic.mute(!musicEnabled);
                if (musicEnabled) bgMusic.play();
            }
            btnSound.innerHTML = musicEnabled
                ? '<i class="fas fa-volume-up"></i>'
                : '<i class="fas fa-volume-off"></i>';
        };

        // UI Panel Toggle Buttons
        const btnQuest = document.getElementById('btn-quest-toggle');
        const btnInv = document.getElementById('btn-inv-toggle');
        const btnActions = document.getElementById('btn-actions-toggle');
        const panelQuest = document.getElementById('panel-quest');
        const panelInv = document.getElementById('panel-inv');
        const panelActions = document.getElementById('panel-actions');

        btnQuest.onclick = (e) => {
            e.stopPropagation();
            if (uiSounds.click) uiSounds.click.play();
            const isOpen = panelQuest.classList.contains('open');
            panelQuest.classList.toggle('open', !isOpen);
            btnQuest.classList.toggle('active', !isOpen);
            panelInv.classList.remove('open');
            panelActions.classList.remove('open');
            btnInv.classList.remove('active');
            btnActions.classList.remove('active');
            if (!isOpen && uiSounds.open) uiSounds.open.play(); else if (isOpen && uiSounds.close) uiSounds.close.play();
        };

        btnInv.onclick = (e) => {
            e.stopPropagation();
            if (uiSounds.click) uiSounds.click.play();
            const isOpen = panelInv.classList.contains('open');
            panelInv.classList.toggle('open', !isOpen);
            btnInv.classList.toggle('active', !isOpen);
            panelQuest.classList.remove('open');
            panelActions.classList.remove('open');
            btnQuest.classList.remove('active');
            btnActions.classList.remove('active');
            if (!isOpen && uiSounds.open) uiSounds.open.play(); else if (isOpen && uiSounds.close) uiSounds.close.play();
        };

        btnActions.onclick = (e) => {
            e.stopPropagation();
            if (uiSounds.click) uiSounds.click.play();
            const isOpen = panelActions.classList.contains('open');
            panelActions.classList.toggle('open', !isOpen);
            btnActions.classList.toggle('active', !isOpen);
            panelQuest.classList.remove('open');
            panelInv.classList.remove('open');
            btnQuest.classList.remove('active');
            btnInv.classList.remove('active');
            if (!isOpen && uiSounds.open) uiSounds.open.play(); else if (isOpen && uiSounds.close) uiSounds.close.play();
        };

        function loop() {
            requestAnimationFrame(loop);
            world.step(1 / 60);
            const pPos = new THREE.Vector3().copy(pBody.position);
            const up = pPos.clone().normalize();
            const pVel = new THREE.Vector3().copy(pBody.velocity);

            // --- Update VFX ---
            const dt = 1 / 60;
            vfx.update(dt, pPos, pVel, canJump);

            // Gravity
            pBody.applyForce(up.clone().multiplyScalar(-75), pBody.position);

            // Ground check for Jump
            if (pPos.length() < planetR + 1.6) canJump = true;

            if (!started) { renderer.render(scene, camera); return; }

            // 1. NPC Interaction (find nearest, animate bobbing)
            let nearestNpc = null;
            let nearestDist = Infinity;
            for (const npcObj of npcMeshes) {
                // Bobbing animation
                npcObj.bodyMesh.position.y = 1.5 + Math.sin(Date.now() * 0.002 + npcObj.data.id) * 0.2;
                const dist = pPos.distanceTo(npcObj.mesh.position);
                if (dist < 8 && dist < nearestDist) {
                    nearestDist = dist;
                    nearestNpc = npcObj;
                }
            }
            activeNpc = nearestNpc;

            if (activeNpc && !isDialogueOpen && activeNpc.data.hasDialogue) {
                worldPrompt.style.display = 'block';
                worldPrompt.innerText = `CONNECT_TO_${activeNpc.data.name}`;
                if (activeNpc.data.questId !== undefined && quests[activeNpc.data.questId].cur < quests[activeNpc.data.questId].tar) {
                    worldPrompt.innerHTML = `CONNECT_TO_${activeNpc.data.name} <span style="color:var(--accent-success)"> [QUEST]</span>`;
                }
                const up = pPos.clone().normalize();
                const sPos = activeNpc.mesh.position.clone().add(up.clone().multiplyScalar(5)).project(camera);
                worldPrompt.style.left = (sPos.x * 0.5 + 0.5) * window.innerWidth + 'px';
                worldPrompt.style.top = (sPos.y * -0.5 + 0.5) * window.innerHeight + 'px';

                // onEnter sound once when first approaching
                if (lastNearNpcId !== activeNpc.data.id) {
                    playNpcSound(activeNpc.data.id, 'enter');
                    lastNearNpcId = activeNpc.data.id;
                }
            }
            else {
                worldPrompt.style.display = 'none';
                if (lastNearNpcId !== null && !isDialogueOpen) {
                    playNpcSound(lastNearNpcId, 'exit');
                    lastNearNpcId = null;
                }
            }

            // 1a. Location Detection
            let curLoc = null;
            for (const loc of locations) {
                const lp = new THREE.Vector3().setFromSphericalCoords(planetR, loc.pos[0] * Math.PI, loc.pos[1] * Math.PI * 2);
                if (pPos.distanceTo(lp) < loc.r) curLoc = loc;
            }
            if (curLoc && activeLoc !== curLoc) {
                activeLoc = curLoc;
                document.getElementById('loc-name').innerText = curLoc.name.replace('LOC_', '').replace('_', ' ');
                document.getElementById('loc-box').style.display = 'block';
                if (curLoc.questId !== undefined && quests[curLoc.questId].cur < quests[curLoc.questId].tar) {
                    quests[curLoc.questId].cur = 1;
                    updateUI();
                }
            } else if (!curLoc) {
                document.getElementById('loc-box').style.display = 'none';
                activeLoc = null;
            }

            // 1c. Pickup Collection
            for (let i = pickups.length - 1; i >= 0; i--) {
                if (pPos.distanceTo(pickups[i].position) < 3) {
                    const itemName = pickups[i].name; // e.g. "CELL_1" or "SHARD_1"
                    inventory.push(itemName);
                    scene.remove(pickups[i]);
                    pickups.splice(i, 1);

                    // Handle quest progression
                    if (itemName.startsWith('CELL') && quests[1].cur < quests[1].tar) {
                        quests[1].cur++;
                        if (quests[1].cur === quests[1].tar) {
                            if (uiSounds.questComplete) uiSounds.questComplete.play();
                            // TRIGGER FIREWORKS ON ITEM QUEST COMPLETION
                            vfx.emitFirework(pPos, up);
                        }
                    }
                    if (itemName.startsWith('SHARD') && quests[2].cur < quests[2].tar) {
                        quests[2].cur++;
                        if (quests[2].cur === quests[2].tar) {
                            if (uiSounds.questComplete) uiSounds.questComplete.play();
                            // TRIGGER FIREWORKS ON ITEM QUEST COMPLETION
                            vfx.emitFirework(pPos, up);
                        }
                    }

                    if (uiSounds.pickup) uiSounds.pickup.play();
                    updateUI();
                }
            }

            // 1b. Non-Dialogue NPC Bubble (show above NPC)
            const bubbleEl = document.getElementById('npc-bubble');
            let nonDialogueNpc = null;
            for (const npcObj of npcMeshes) {
                if (!npcObj.data.hasDialogue && pPos.distanceTo(npcObj.mesh.position) < 10) {
                    nonDialogueNpc = npcObj;
                    break;
                }
            }
            if (nonDialogueNpc) {
                const up = pPos.clone().normalize();
                const sPos = nonDialogueNpc.mesh.position.clone().add(up.clone().multiplyScalar(4)).project(camera);
                bubbleEl.style.left = (sPos.x * 0.5 + 0.5) * window.innerWidth + 'px';
                bubbleEl.style.top = (sPos.y * -0.5 + 0.5) * window.innerHeight + 'px';
                const txt = nonDialogueNpc.data.bubbleMsg || nonDialogueNpc.data.name.replace('_', ' ');
                bubbleEl.innerHTML = `<b>${txt}</b>`;
                bubbleEl.style.display = 'block';
            } else {
                bubbleEl.style.display = 'none';
            }

            // 2. Movement (Camera-relative or Mouse-targeted)
            let moveDir = new THREE.Vector3(0, 0, 0);
            if (!isDialogueOpen) {
                const camFwd = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
                const camRgt = new THREE.Vector3().crossVectors(up, camFwd).normalize();
                if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(camFwd);
                if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(camFwd);
                if (keys['KeyA'] || keys['ArrowLeft']) moveDir.add(camRgt);
                if (keys['KeyD'] || keys['ArrowRight']) moveDir.sub(camRgt);
                if (mouseTarget) {
                    const toMouse = mouseTarget.clone().sub(pPos).projectOnPlane(up);
                    if (toMouse.length() > 2) moveDir.add(toMouse.normalize());
                    else mouseTarget = null;
                }

                if (moveDir.length() > 0) {
                    moveDir.normalize();
                    camHeading.lerp(moveDir, 0.1).normalize();
                    pBody.velocity.set(moveDir.x * 18, moveDir.y * 18, moveDir.z * 18);
                }
            } else {
                pBody.velocity.set(0, 0, 0);
            }

            // 3. Player Alignment
            playerMesh.position.copy(pPos);
            playerMesh.up.copy(up);
            playerMesh.lookAt(pPos.clone().add(camHeading.projectOnPlane(up).normalize()));

            // 4. Camera Follow (offset from player based on heading)
            camera.up.copy(up);
            const targetCamPos = pPos.clone()
                .add(camHeading.clone().multiplyScalar(-30))
                .add(up.clone().multiplyScalar(16))
                .add(new THREE.Vector3().crossVectors(up, camHeading).multiplyScalar(8));
            camera.position.lerp(targetCamPos, 0.05);
            camera.lookAt(pPos.clone().add(camHeading.clone().multiplyScalar(5)));

            renderer.render(scene, camera);
        }
        loop();
    </script>
</body>
