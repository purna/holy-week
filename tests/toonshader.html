<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Miracle Maker 3Dprototype with cel-shaded toon graphics, black outlines, building window/door details, and gradient map shading. Stylized cartoon aesthetic.">
    <title>Miracle Maker 3D- Toon Shader Edition</title>
    <!--

        CORE CONCEPT
        ------------
        Stylized toon-shaded prototype using cel-shading with black outlines.
        All geometry rendered with MeshToonMaterial and gradient map, plus
        black outline meshes for cartoon effect. Buildings have window/door
        details added as line geometry.

        KEY FEATURES
        ------------
        • Custom createToonGroup() function:
          - Main mesh with MeshToonMaterial + gradientMap
          - Outline mesh: same geometry scaled 1.08x, BackSide, black
        • Planet with latitude/longitude grid lines (detail overlay)
        • Buildings with procedurally placed window frames and doors
        • NPCs and player with toon outlines
        • Pickups (cells/shards) with toon styling
        • All 3D objects use toon shading

        TOON RENDERING
        --------------
        Gradient map: 3-color ramp (Uint8Array [0, 128, 255]) for 2-tone shading
        Outline scaling: 0.08 for planet, 0.1 for NPCs, 0.12 for pickups, 0.05 for buildings
        Outline material: MeshBasicMaterial color 0x000000, side: BackSide

        BUILDING DETAILS
        ----------------
        For each building, addLineDetails() creates vertical window frames
        (two per floor at x = ±0.8) and horizontal cross-bars.
        Door frame added on tall buildings (h > 4).
        All lines are black BoxGeometry with 0.06 thickness.

        VISUAL STYLE
        ------------
        Background: dark space (0x020205)
        Fog: exponential, density 0.008
        Planet color: dark green (0x1a251a)
        Stars: white particles
        Sun: white directional with soft shadows (radius 6)

        DIFFERENCES FROM test.html
        ---------------------------
        • No UI panels (only minimal bottom-right sound toggle)
        • No inventory/actions/quests (hardcoded minimal UI)
        • No dialogue system (just connect prompt)
        • No VFX (no particles, no fireworks)
        • No audio engine (no sound effects, no music)

        CONTROLS
        --------
        WASD: Move
        Space: Jump
        Click planet: Set movement target

        TECHNICAL
        ---------
        • Uses THREE.RGBAFormat + DataTexture for gradient map
        • addon import: importmap includes three/addons/
        • Custom toon helper functions at the top of script
        • Outline rendering uses lookAt() for player orientation

        ASSETS: None external (all procedural)

        Known issues: Lines may Z-fight on some geometries; gradient limited to 3 tones
    -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
    <style>
        /* ===== VARIABLES ===== */
        :root {
            --bg-main: #010105;
            --panel-bg: rgba(0, 10, 20, 0.88);
            --accent-primary: #00f2ff;
            --accent-secondary: #ffaa00;
            --accent-success: #00ffaa;
            --text-main: #ffffff;
            --glow-soft: 0 0 10px rgba(0, 242, 255, 0.3);
            --glow-strong: 0 0 20px rgba(0, 242, 255, 0.6);
            --shadow-panel: 0 8px 25px rgba(0, 0, 0, 0.6);
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg-main);
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            user-select: none;
        }

        .panel {
            color: var(--text-main);
            background: var(--panel-bg);
            padding: 12px;
            border: 1px solid var(--accent-primary);
            backdrop-filter: blur(10px);
            width: 200px;
            transform-origin: right center;
            transform: scale(0.85);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.25s ease, opacity 0.2s ease;
            box-shadow: var(--shadow-panel), var(--glow-soft);
        }

        .panel.open {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        #panel-quest {
            border-right: 4px solid var(--accent-primary);
        }

        #panel-inv {
            border-right: 4px solid var(--accent-secondary);
        }

        #inv-anchor {
            position: relative;
        }

        #panel-inv {
            position: absolute;
            bottom: calc(100% + 10px);
            right: calc(100% + 8px);
        }

        .ui-toggle {
            width: 48px;
            height: 48px;
            padding: 0;
            background: rgba(0, 10, 20, 0.8);
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            cursor: pointer;
            font-size: 1.2em;
            border-radius: 4px;
            transition: transform 0.12s ease, background 0.2s, box-shadow 0.2s;
            box-shadow: var(--glow-soft);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ui-toggle:hover {
            background: rgba(0, 242, 255, 0.2);
            box-shadow: var(--glow-strong);
        }

        .ui-toggle:active {
            transform: scale(0.9);
        }

        .ui-toggle.active {
            background: rgba(0, 242, 255, 0.3);
            border-color: var(--accent-success);
            color: var(--accent-success);
        }

        #right-sidebar {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
            z-index: 500;
        }

        #sidebar-top,
        #sidebar-bottom {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            pointer-events: auto;
            margin-bottom: 40px;
        }

            display: flex;

        .item {
            font-size: 0.8em;
            margin: 5px 0;
            color: var(--accent-secondary);
            border-left: 2px solid var(--accent-secondary);
            padding-left: 5px;
        }

        .q-item {
            font-size: 0.8em;

            border-bottom: 1px solid #111;

        }

        .q-done {

        .interact-prompt {
            position: absolute;
            background: #ffaa00;
            color: black;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 4px;
            font-size: 0.8em;
            transform: translate(-50%, -50%);

            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 0 20px #ffaa00;
            border: 1px solid white;
            z-index: 200;
        }

        .npc-bubble {
            position: absolute;
            background: rgba(0, 5, 10, 0.95);
            color: #00f2ff;
            padding: 12px 18px;
            border: 1px solid #00f2ff;
            border-radius: 2px;
            font-size: 0.85em;
            text-align: center;
            transform: translate(-50%, -100%);
            display: none;
            width: 220px;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
            z-index: 150;
        }

        .npc-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid #00f2ff;
        }

        #local-dialogue-box {
            position: absolute;
            bottom: 40px;
            left: 50%;

            width: 750px;
            max-width: 90%;
            background: rgba(0, 5, 15, 0.98);
            border: 1px solid #00f2ff;
            border-top: 4px solid #00f2ff;

        .npc-name-tag {

        }

        #bubble-text {

            min-height: 60px;
        }

        .choice-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .choice-btn {
            background: rgba(0, 242, 255, 0.05);
            border: 1px solid #00f2ff55;
            color: #00f2ff;
            text-align: left;
            padding: 15px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
            font-size: 0.9em;
        }

        .choice-btn:hover {
            background: rgba(0, 242, 255, 0.2);
            border-color: #00f2ff;
        }

        button#btn-start,
        button#btn-replay {
            background: #ffaa00;
            border: none;
            padding: 15px 40px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2em;
            color: black;
        }

        #wipe-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #010105;
            z-index: 2000;
            pointer-events: none;
            transform: translateX(-100%);
        }

        #wipe-overlay.active {
            animation: wipe-in 1s ease-in-out forwards;
        }

        @keyframes wipe-in {
            0% {
                transform: translateX(-100%);
            }

            50% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(100%);
            }
        }

        #loc-box {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            display: none;
            z-index: 150;
        }

        #loc-name {
            font-size: 2.8em;
            color: var(--accent-secondary);
            margin: 0;
            text-shadow: 0 0 20px #000;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 1000;
            text-align: center;
            background: rgba(0, 0, 0, 0.95);
        }

        .floating-action-icon {
            position: fixed;
            font-size: 24px;
            color: var(--accent-primary);
            z-index: 1000;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform, opacity;
        }
    </style>

    <script src="https://unpkg.com/inkjs@2.2.1/dist/ink.js"></script>
    <script
        type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js" } }</script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        // ===== CONFIG =====
        const SOUND = { panelOpen: 'panel_open.mp3', panelClose: 'panel_close.mp3', buttonClick: 'button_click.mp3', questDone: 'quest_complete.mp3', victory: 'victory_fanfare.mp3', pickup: 'pickup.mp3', bgMusic: 'bg_music.mp3', npc: { 1: { enter: 'echo_enter.mp3', exit: 'echo_exit.mp3' }, 2: { enter: 'horizon_enter.mp3', exit: 'horizon_exit.mp3' } } };
        const npcs = [{ id: 1, name: "UNIT-01 ECHO", color: 0x00f2ff, pos: [0.1, 0.1], storyFile: './assets/dialogue/NPC_UNIT_ECHO_1.json', hasDialogue: true }, { id: 2, name: "UNIT-02 HORIZON", color: 0xffaa00, pos: [0.6, 2.2], storyFile: './assets/dialogue/NPC_UNIT_ECHO_2.json', hasDialogue: true }, { id: 3, name: "SPIRE_MINOR", color: 0x00ffaa, pos: [1.2, 0.3], hasDialogue: false, bubbleMsg: "The Spire awaits..." }, { id: 4, name: "DATA_KEEPER", color: 0xff00ff, pos: [0.8, 1.0], storyFile: './assets/dialogue/NPC_DATA_KEEPER.json', hasDialogue: true, questId: 1 }];
        const locations = [{ name: "LOC_NORTH_SPIRE", pos: [0.1, 0.5], r: 15, questId: 0 }, { name: "LOC_SOUTH_SPIRE", pos: [0.9, 2.5], r: 15 }];
        const quests = [{ id: 'RECON', name: 'NORTH_RECON', task: 'Reach the North Spire', cur: 0, tar: 1, completed: false }, { id: 'CELLS', name: 'CELL_RECOVERY', task: 'Collect Data Cells', cur: 0, tar: 3, completed: false }, { id: 'SHARDS', name: 'SIGNAL_FRAGMENTS', task: 'Collect Purple Shards', cur: 0, tar: 3, completed: false }, { id: 'VISIT', name: 'VISIT_HORIZON', task: 'Contact UNIT-02 HORIZON', cur: 0, tar: 1, completed: false }];
        const inventory = [];
        const actions = [{ name: "Scan Area", type: "scan", icon: "fas fa-search", consumable: false }, { name: "Repair Gear", type: "repair", icon: "fas fa-wrench", consumable: true }, { name: "Hack Terminal", type: "hack", icon: "fas fa-laptop-code", consumable: true }, { name: "Med Kit", type: "heal", icon: "fas fa-first-aid", consumable: true }];

        let started = false, isDialogueOpen = false, activeNpc = null, hasWon = false, lastNearNpcId = null, activeLoc = null;
        const npcStories = {}, visitedNpcs = new Set(), keys = {};
        const planetR = 50;

        // ===== TOON HELPERS =====
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const format = (renderer.capabilities.isWebGL2) ? THREE.RedFormat : THREE.LuminanceFormat;
        const colors = new Uint8Array([0, 128, 255]);
        const gradientMap = new THREE.DataTexture(colors, colors.length, 1, format);
        gradientMap.needsUpdate = true;

        /** Creates a Toon body + Black Outline hull */
        function createToonGroup(geometry, color, outlineSize = 0.08) {
            const group = new THREE.Group();
            const toonMat = new THREE.MeshToonMaterial({ color: color, gradientMap: gradientMap });
            const mainMesh = new THREE.Mesh(geometry, toonMat);
            mainMesh.castShadow = true; mainMesh.receiveShadow = true;
            group.add(mainMesh);
            const outlineMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide });
            const outlineMesh = new THREE.Mesh(geometry, outlineMat);
            outlineMesh.scale.multiplyScalar(1 + outlineSize);
            group.add(outlineMesh);
            return { group, mainMesh };
        }

        /** Adds black line details to a group (for windows/doors/frames) */
        function addLineDetails(group, pos, rotation, config) {
            const detailGroup = new THREE.Group();
            detailGroup.position.copy(pos);
            detailGroup.quaternion.copy(rotation);

            const lineMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const frameDepth = 0.05;

            // Horizontal lines
            if (config.horizontal) {
                config.horizontal.forEach(h => {
                    const hLine = new THREE.Mesh(
                        new THREE.BoxGeometry(h.width, h.thickness || 0.06, frameDepth),
                        lineMat
                    );
                    hLine.position.set(h.x || 0, h.y || 0, h.z || 0);
                    detailGroup.add(hLine);
                });
            }

            // Vertical lines
            if (config.vertical) {
                config.vertical.forEach(v => {
                    const vLine = new THREE.Mesh(
                        new THREE.BoxGeometry(v.thickness || 0.06, v.height, frameDepth),
                        lineMat
                    );
                    vLine.position.set(v.x || 0, v.y || 0, v.z || 0);
                    detailGroup.add(vLine);
                });
            }

            group.add(detailGroup);
        }

        // ===== SCENE SETUP =====
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);
        scene.fog = new THREE.FogExp2(0x020205, 0.008);
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 5000);
        const sun = new THREE.DirectionalLight(0xffffff, 3.5); // High intensity for Toon steps
        sun.position.set(100, 200, 100); sun.castShadow = true;
        scene.add(sun, new THREE.AmbientLight(0x404040, 1.5));

        const world = new CANNON.World();
        world.solver.iterations = 15;

        // Planet with surface detail lines
        const planetObj = createToonGroup(new THREE.IcosahedronGeometry(planetR, 5), 0x1a251a, 0.005);
        const planet = planetObj.mainMesh;
        scene.add(planetObj.group);
        world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetR) }));

        // Add surface detail lines (latitude/longitude grid)
        const planetDetails = {
            horizontal: [],
            vertical: []
        };

        // Latitude lines
        for (let lat = -0.8; lat <= 0.8; lat += 0.25) {
            const latRadius = planetR * Math.cos(lat * Math.PI / 2);
            const latY = planetR * lat;
            planetDetails.horizontal.push({
                x: 0, y: latY, z: latRadius,
                width: latRadius * 2.5,
                thickness: 0.15
            });
        }

        // Longitude lines
        for (let lon = 0; lon < 4; lon++) {
            planetDetails.vertical.push({
                x: planetR * 0.3 * Math.cos(lon * Math.PI / 2),
                y: 0,
                z: planetR * 0.3 * Math.sin(lon * Math.PI / 2),
                height: planetR * 1.8,
                thickness: 0.15
            });
        }

        addLineDetails(planetObj.group, new THREE.Vector3(), new THREE.Quaternion(), planetDetails);

        // Player
        const pBody = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5)), fixedRotation: true, linearDamping: 0.9 });
        pBody.position.set(0, planetR + 10, 0); world.addBody(pBody);
        const playerMesh = new THREE.Group();
        const pToon = createToonGroup(new THREE.BoxGeometry(1.2, 2, 1.2), 0xff3333, 0.1);
        playerMesh.add(pToon.group); scene.add(playerMesh);

        // Pickups
        const pickups = [];
        for (let i = 0; i < 4; i++) {
            const cell = createToonGroup(new THREE.SphereGeometry(1), 0xffaa00, 0.12);
            cell.group.name = `CELL_${i + 1}`;
            cell.group.position.setFromSphericalCoords(planetR + 1.2, Math.random() * Math.PI, Math.random() * Math.PI * 2);
            scene.add(cell.group); pickups.push(cell.group);

            const shard = createToonGroup(new THREE.OctahedronGeometry(0.9), 0xa020f0, 0.12);
            shard.group.name = `SHARD_${i + 1}`;
            shard.group.position.setFromSphericalCoords(planetR + 1.2, Math.random() * Math.PI, Math.random() * Math.PI * 2);
            scene.add(shard.group); pickups.push(shard.group);
        }

        // NPCs
        const npcMeshes = npcs.map(npc => {
            const grp = new THREE.Group();
            const pad = createToonGroup(new THREE.CylinderGeometry(2.5, 2.5, 0.2, 16), 0x222222, 0.05);
            grp.add(pad.group);
            const npcToon = createToonGroup(new THREE.CapsuleGeometry(1, 2), npc.color, 0.1);
            npcToon.group.position.y = 1.5; grp.add(npcToon.group);
            const p = new THREE.Vector3().setFromSphericalCoords(planetR, npc.pos[0] * Math.PI, npc.pos[1] * Math.PI * 2);
            grp.position.copy(p); grp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p.clone().normalize());
            scene.add(grp);
            return { mesh: grp, bodyMesh: npcToon.group, data: npc };
        });

        // Buildings with line details (windows/doors)
        for (let i = 0; i < 8; i++) {
            const h = Math.random() * 6 + 2;
            const bToon = createToonGroup(new THREE.BoxGeometry(3, h, 3), 0x333344, 0.05);
            const pos = new THREE.Vector3().setFromSphericalCoords(planetR + h / 2, Math.random() * Math.PI, Math.random() * Math.PI * 2);
            bToon.group.position.copy(pos);
            bToon.group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), pos.clone().normalize());
            scene.add(bToon.group);

            // Add window/door line details on front face
            const config = {
                horizontal: [],
                vertical: []
            };

            // Window frames
            const windowSpacing = 0.8;
            for (let wy = -h / 2 + 0.5; wy < h / 2 - 0.5; wy += windowSpacing) {
                config.vertical.push({ x: -0.8, y: wy, z: 1.55, height: 0.5 });
                config.vertical.push({ x: 0.8, y: wy, z: 1.55, height: 0.5 });
            }
            for (let wx = -0.6; wx <= 0.6; wx += windowSpacing) {
                config.horizontal.push({ x: wx, y: 0, z: 1.55, width: 0.5 });
            }

            // Door frame on taller buildings
            if (h > 4) {
                config.horizontal.push({ x: 0, y: -0.5, z: 1.55, width: 0.8 });
                config.vertical.push({ x: -0.4, y: -1.0, z: 1.55, height: 1.0 });
                config.vertical.push({ x: 0.4, y: -1.0, z: 1.55, height: 1.0 });
            }

            addLineDetails(bToon.group, pos, bToon.group.quaternion, config);

            const body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(1.5, h / 2, 1.5)) });
            body.position.copy(pos); body.quaternion.copy(bToon.group.quaternion); world.addBody(body);
        }

        // Atmosphere
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for (let i = 0; i < 1500; i++) {
            const v = new THREE.Vector3().randomDirection().multiplyScalar(Math.random() * 2000 + 100);
            starPos.push(v.x, v.y, v.z);
        }
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x88ccff, size: 1.5 })));

        // ===== LOGIC & RENDER =====
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let mouseTarget = null, camHeading = new THREE.Vector3(0, 0, 1), canJump = true;
        const uiSounds = { open: new Howl({ src: [SOUND.panelOpen], volume: 0.4 }), close: new Howl({ src: [SOUND.panelClose] }), click: new Howl({ src: [SOUND.buttonClick] }), questComplete: new Howl({ src: [SOUND.questDone] }), victory: new Howl({ src: [SOUND.victory] }), pickup: new Howl({ src: [SOUND.pickup] }) };
        const bgMusic = new Howl({ src: [SOUND.bgMusic], loop: true, volume: 0.35 });

        window.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space' && canJump && started) { const up = new THREE.Vector3().copy(pBody.position).normalize(); pBody.applyImpulse(new CANNON.Vec3(up.x * 12, up.y * 12, up.z * 12), pBody.position); canJump = false; } });
        window.addEventListener('keyup', e => keys[e.code] = false);
        window.addEventListener('mousedown', e => { if (!started || e.target.closest('.ui-toggle') || e.target.closest('.panel')) return; const m = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1); const r = new THREE.Raycaster(); r.setFromCamera(m, camera); const h = r.intersectObject(planet); if (h.length) mouseTarget = h[0].point; });

        document.getElementById('btn-start').onclick = () => { audioCtx.resume(); document.getElementById('wipe-overlay').classList.add('active'); setTimeout(() => document.getElementById('start-screen').style.display = 'none', 500); setTimeout(() => { started = true; bgMusic.play(); updateUI(); }, 1000); };

        function updateUI() {
            document.getElementById('inv-list').innerHTML = inventory.length ? inventory.map(i => `<div class="item">${i}</div>`).join('') : "0_CELLS";
            document.getElementById('quest-list').innerHTML = quests.map(q => `<div class="q-item ${q.cur >= q.tar ? 'q-done' : ''}"><b>${q.name}</b><br><small>${q.task} [${q.cur}/${q.tar}]</small></div>`).join('');
            quests.forEach(q => { if (!q.completed && q.cur >= q.tar) { q.completed = true; uiSounds.questComplete.play(); } });
            if (quests.every(q => q.cur >= q.tar) && !hasWon) { hasWon = true; setTimeout(() => { document.getElementById('wipe-overlay').classList.add('active'); setTimeout(() => document.getElementById('win-screen').style.display = 'flex', 500); uiSounds.victory.play(); }, 1500); }
        }

        function loop() {
            requestAnimationFrame(loop);
            world.step(1 / 60);
            const pPos = new THREE.Vector3().copy(pBody.position);
            const up = pPos.clone().normalize();
            pBody.applyForce(up.clone().multiplyScalar(-75), pBody.position);
            if (pPos.length() < planetR + 1.6) canJump = true;
            if (!started) { renderer.render(scene, camera); return; }

            // NPC bobbing & detection
            let nearestNpc = null, nearestDist = Infinity;
            npcMeshes.forEach(n => {
                n.bodyMesh.position.y = 1.5 + Math.sin(Date.now() * 0.002 + n.data.id) * 0.2;
                const d = pPos.distanceTo(n.mesh.position);
                if (d < 8 && d < nearestDist) { nearestDist = d; nearestNpc = n; }
            });
            activeNpc = nearestNpc;
            const prompt = document.getElementById('world-prompt');
            if (activeNpc && !isDialogueOpen && activeNpc.data.hasDialogue) {
                prompt.style.display = 'block'; prompt.innerText = `CONNECT_TO_${activeNpc.data.name}`;
                const sPos = activeNpc.mesh.position.clone().add(up.clone().multiplyScalar(5)).project(camera);
                prompt.style.left = (sPos.x * 0.5 + 0.5) * window.innerWidth + 'px'; prompt.style.top = (sPos.y * -0.5 + 0.5) * window.innerHeight + 'px';
            } else { prompt.style.display = 'none'; }

            // Pickups
            for (let i = pickups.length - 1; i >= 0; i--) {
                if (pPos.distanceTo(pickups[i].position) < 3) {
                    const name = pickups[i].name; inventory.push(name);
                    if (name.startsWith('CELL')) quests[1].cur++; if (name.startsWith('SHARD')) quests[2].cur++;
                    scene.remove(pickups[i]); pickups.splice(i, 1); uiSounds.pickup.play(); updateUI();
                }
            }

            // Move
            if (!isDialogueOpen) {
                const camFwd = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
                const camRgt = new THREE.Vector3().crossVectors(up, camFwd).normalize();
                let moveDir = new THREE.Vector3(0, 0, 0);
                if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(camFwd);
                if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(camFwd);
                if (keys['KeyA'] || keys['ArrowLeft']) moveDir.add(camRgt);
                if (keys['KeyD'] || keys['ArrowRight']) moveDir.sub(camRgt);
                if (mouseTarget) { const toM = mouseTarget.clone().sub(pPos).projectOnPlane(up); if (toM.length() > 2) moveDir.add(toM.normalize()); else mouseTarget = null; }
                if (moveDir.length() > 0) { moveDir.normalize(); camHeading.lerp(moveDir, 0.1).normalize(); pBody.velocity.set(moveDir.x * 18, moveDir.y * 18, moveDir.z * 18); }
            }

            playerMesh.position.copy(pPos); playerMesh.up.copy(up);
            playerMesh.lookAt(pPos.clone().add(camHeading.projectOnPlane(up).normalize()));
            const targetCam = pPos.clone().add(camHeading.clone().multiplyScalar(-30)).add(up.clone().multiplyScalar(16));
            camera.position.lerp(targetCam, 0.05); camera.up.copy(up); camera.lookAt(pPos);

            renderer.render(scene, camera);
        }
        loop();

        // UI Toggles
        document.getElementById('btn-quest-toggle').onclick = () => { document.getElementById('panel-quest').classList.toggle('open'); uiSounds.click.play(); };
        document.getElementById('btn-inv-toggle').onclick = () => { document.getElementById('panel-inv').classList.toggle('open'); uiSounds.click.play(); };
        document.getElementById('btn-actions-toggle').onclick = () => { document.getElementById('panel-actions').classList.toggle('open'); uiSounds.click.play(); };
    </script>
</body>

</html>
