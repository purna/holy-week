<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Historic Lewes - PixiJS v8 Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            position: relative;
            background-color: #1a1410;
            color: #f5ebe0;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 10px;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 512px;
            aspect-ratio: 1;
            background: #120f0d;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border-radius: 4px;
            overflow: hidden;
        }
        #game-container canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }

        #ui-controls-container {
            width: 100%;
            max-width: 512px;
            height: 120px;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 999;
        }
        .dpad {
            position: relative;
            width: 120px;
            height: 120px;
        }
        .btn {
            position: absolute;
            background: #2c2219;
            border: 2px solid #d4a373;
            color: #f5ebe0;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            touch-action: manipulation;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            cursor: pointer;
        }
        .btn:active {
            background: #d4a373;
            color: #2c2219;
        }
        #btn-up    { top: 0; left: 40px; width: 40px; height: 40px; }
        #btn-down  { bottom: 0; left: 40px; width: 40px; height: 40px; }
        #btn-left  { top: 40px; left: 0; width: 40px; height: 40px; }
        #btn-right { top: 40px; right: 0; width: 40px; height: 40px; }

        .action-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .action-count {
            font-size: 12px;
            margin-top: 4px;
            color: #d4a373;
            font-weight: bold;
        }

        #btn-action, #btn-action-prayer, #btn-action-heal {
            position: relative;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        #btn-action.disabled {
            background: #221a14;
            border-color: #44372c;
            color: #554438;
            opacity: 0.6;
            pointer-events: none;
        }
        #btn-action.active, #btn-action-prayer.active, #btn-action-heal.active {
            background: #00bbf9;
            border-color: #00f5d4;
            color: #fff;
            opacity: 1;
            box-shadow: 0 0 15px rgba(0, 187, 249, 0.7);
            transform: scale(1.05);
            cursor: pointer;
        }
        #hud {
            margin-top: 10px;
            text-align: center;
            color: #a79788;
            font-size: 11px;
            max-width: 512px;
            line-height: 1.4;
        }
        #lives-display {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #f87171;
            font-size: 24px;
            text-shadow: 1px 1px 2px #000;
            z-index: 10;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
            color: white;
        }
        .overlay h1 { font-size: 3em; color: #f87171; margin-bottom: 20px; }
        .overlay button {
            background: #d4a373;
            border: none;
            padding: 12px 30px;
            font-size: 1.2em;
            font-family: monospace;
            cursor: pointer;
            color: #1a1410;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="lives-display"></div>
</div>

<div id="game-over-screen" class="overlay" style="display: none;">
    <h1>GAME OVER</h1>
    <button id="btn-try-again">Try Again</button>
</div>

<div id="ui-controls-container">
    <div class="dpad">
        <div class="btn" id="btn-up">▲</div>
        <div class="btn" id="btn-left">◀</div>
        <div class="btn" id="btn-right">▶</div>
        <div class="btn" id="btn-down">▼</div>
    </div>
    <div class="action-group">
        <div id="btn-action" class="btn disabled">TALK</div>
    </div>
    <div class="action-group">
        <div id="btn-action-prayer" class="btn active">PRAY</div>
        <div id="prayer-count" class="action-count">x3</div>
    </div>
    <div class="action-group">
        <div id="btn-action-heal" class="btn active">HEAL</div>
        <div id="heal-count" class="action-count">x1</div>
    </div>
</div>

<div id="hud">
    <strong>Historic Lewes Engine v21 &mdash; PixiJS v8</strong><br>
    Fully Configurable Player, NPC, and Enemy Designs & Color Palettes.
</div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script>
(async () => {

// =====================================================================
// CONSTANTS & MAP PALETTE
// =====================================================================
const TILE_SIZE = 32;
const MAP_SIZE = 64;
const VIEW_WIDTH = 512;
const VIEW_HEIGHT = 512;

const PALETTE = {
    border_brown: '#4a3b2c',
    sand_light:   '#e9c46a',
    sand_dark:    '#dfb24c',
    sand_wave:    '#d4a373',

// =====================================================================
// PLAYER CONFIGURATION
// =====================================================================
const PLAYER_CONFIG = {

// =====================================================================

// =====================================================================
const NPC_CONFIG = {

// =====================================================================
// ENEMY CONFIGURATION & VISUAL PALETTES

                plumeColor:  '#dc2626',
                shieldColor: '#95a5a6',
                skinColor:   '#f5cba7'
            },
            {
                tunicColor:  '#7e22ce',
                armorColor:  '#581c87',
                helmetColor: '#eab308',
                plumeColor:  '#b91c1c',
                shieldColor: '#95a5a6',
                skinColor:   '#f5cba7'
            },
            {

                armorColor:  '#172554',
                helmetColor: '#475569',
                plumeColor:  '#3b82f6',

            }
        ],

        SADDUCEE: {
            outerRobe:   '#9333ea',
            innerRobe:   '#6b21a8',
            headwear:    '#4a235a',
            accentColor: '#f1c40f',
            skinColor:   '#f5cba7'
        },

        PHARISEE: {
            outerRobe:   '#0284c7',
            innerRobe:   '#0369a1',
            headwear:    '#1e40af',
            accentColor: '#0284c7',
            skinColor:   '#f5cba7'
        }
    }
};

const TILE_LEGEND = {
    '.': 0,
    '~': 1,
    '#': 2,
    '=': 3,
    'R': 4,
    'W': 5,
    'B': 6
};

const mapTemplate = [
    "################################################################",
    "###.......................######..........................######",
    "##.....=======.............####............=======.........#####",
    "##....==.....==.............##............==.....==.........####",
    "##...==.......==.........................==.......==.........###",
    "#...==.........==.......................==.........==..........#",
    "#...=...RRRR....=................-------=...RRRR....=..........#",
    "#...=...RWWWR...=...............---------=...RWWWR...=..........#",
    "#...=...RWWWR...=..............-----------=...RWWWR...=..........#",
    "#...=...RWWWR...=..............-----------=...RWWWR...=..........#",
    "#...==..RRRR...==.............-------------==..RRRR...==..........#",
    "##...==.......==.......#######~~~~~~~~~#####..==.......==..........##",
    "###...==.....==......###RRRRRR~~~~~~~~~RRR###...==.....==..........###",
    "####...=======......##RRRRRRRR~~~~~~~~~RRRRR##....=======..........####",
    "#####..............##RRRRRRRRR~~~~~~~~~RRRRRRR##...................#####",
    "######.............#RRRRRRRRRR~~~~~~~~~RRRRRRRR#...................######",
    "######.............#RRRRRRRRR~~~~~~~~~~~RRRRRRR#...................######",
    "######.............#RRRRRRRR~~~~~~~~~~~~~RRRRRR#...................######",
    "######.............#RRRRRRR~~~~~~~~~~~~~~~RRRRR#...................######",
    "######.............#RRRRRRR~~~~WWWWW~~~~~~RRRRR#...................######",
    "######.............#RRRRRRR~~~WWWWWWW~~~~~RRRRR#...................######",
    "######.............#RRRRRRR~~~WWWWWWW~~~~~RRRRR#...................######",
    "######.............#RRRRRRR~~~~WWWWW~~~~~~RRRRR#...................######",
    "######.............#RRRRRRR~~~~~~~~~~~~~~~RRRRR#...................######",
    "######.............#RRRRRRRR~~~~~~~~~~~~~RRRRRR#...................######",
    "######.............##RRRRRRRRR~~~~~~~~~RRRRRR##....................######",
    "#####...............##RRRRRRRRRRRRRRRRRRRRR##......................#####",
    "####.................###RRRRRRRRRRRRRRRRR###........................####",
    "###....................#####.=====.#####...........................###",
    "##..........................=.....=...............................##",
    "#...........................=.....=................................#",
    "#......======================.....======================...........#",
    "#.....==....................=.....=....................==..........#",
    "#....==.....................=.....=.....................==.........#",
    "#...==......................=.....=......................==........#",
    "#...=.......................=======.......................=........#",
    "#...=.....................................................=........#",
    "#...==...................................................==........#",
    "#....==.....................=======.....................==.........#",
    "#.....==....................=.....=....................==..........#",
    "#......======================.....======================...........#",
    "#...........................=.....=................................#",
    "#...........................=.....=................................#",
    "##..........................W.....W...............................##",
    "###........................WW.....WW..............................###",
    "####.....................####.....####.............................####",
    "#####...................#####.....#####............................#####",
    "######.................######.....######...........................######",
    "#######...............#######.....###..BBBBBBBBBBB.......#######",
    "########.............########.....##...B.........B......########",
    "#########...........#########.....#....B.........B.....#########",
    "##########.........##########..........B....R....B....##########",
    "###########.......###########..........B...RWR...B...###########",
    "############.....############..........B....R....B..############",
    "#############...#############..........B.........B.#############",
    "##############.##############..........BBBBBBBBBBB##############",
    "#############################..................#################",
    "############################....................################",
    "###########################......................###############",
    "##########################........................##############",
    "################_________..........................#############",
    "################________............................############",
    "################_______..............................###########",
    "################______................................##########",
    "################################################################"
];

// =====================================================================
// GAME STATE
// =====================================================================
let gameOver = false;
const levelMap = [];

const player = {
    x: PLAYER_CONFIG.startX,
    y: PLAYER_CONFIG.startY,
    renderX: PLAYER_CONFIG.startX * TILE_SIZE,
    renderY: PLAYER_CONFIG.startY * TILE_SIZE,
    startX: PLAYER_CONFIG.startX,
    startY: PLAYER_CONFIG.startY,
    facing: 'down',
    isMoving: false,
    lives: PLAYER_CONFIG.lives,
    prayers: PLAYER_CONFIG.prayers,
    heals: PLAYER_CONFIG.heals,
    invisibleUntil: 0
};

const npcs = [];
const enemies = [];
const CHASE_RADIUS = 8;
const INVISIBILITY_DURATION = 2000;

const camera = { x: player.renderX - VIEW_WIDTH / 2, y: player.renderY - VIEW_HEIGHT / 2 };
const particles = [];
const MAX_PARTICLES = 40;
let isDialogueOpen = false;

function initializeGame() {
    for (let r = 0; r < MAP_SIZE; r++) {
        levelMap[r] = [];
        for (let c = 0; c < MAP_SIZE; c++) {
            const token = mapTemplate[r][c];
            let parsedId = TILE_LEGEND[token] !== undefined ? TILE_LEGEND[token] : 0;

            if (parsedId === 0 || parsedId === 4) {
                let dx = c - 32;
                let dy = r - 16;
                let distToOasis = Math.sqrt(dx * dx + dy * dy);

                if (distToOasis > 6 && distToOasis < 15) {
                    let noiseSeed = Math.sin(c * 2.3) * Math.cos(r * 2.3);
                    if (noiseSeed > 0.62) {
                        parsedId = 2;
                    }
                }
            }
            levelMap[r][c] = parsedId;
        }
    }

    NPC_CONFIG.list.forEach(npcData => {
        npcs.push({
            x: npcData.x,
            y: npcData.y,
            name: npcData.name,
            location: npcData.location,
            animOffset: npcData.animOffset,
            visuals: Object.assign({}, NPC_CONFIG.defaultVisuals, npcData.visuals || {})
        });
    });

    for (let i = 0; i < MAX_PARTICLES; i++) {
        particles.push({
            x: Math.random() * VIEW_WIDTH,
            y: Math.random() * VIEW_HEIGHT,
            speed: 1.5 + Math.random() * 2,
            size: 2 + Math.floor(Math.random() * 2),
            opacity: 0.1 + Math.random() * 0.3
        });
    }
}

function updateLivesDisplay() {
    document.getElementById('lives-display').textContent = 'Lives: ' + player.lives;
}

function updateActionCounts() {
    document.getElementById('prayer-count').textContent = 'x' + player.prayers;
    document.getElementById('heal-count').textContent = 'x' + player.heals;
}

function findValidSpawnTile(nearX = null, nearY = null, maxRadius = 3) {
    let attempts = 0;
    while (attempts < 100) {
        let rx, ry;
        if (nearX !== null && nearY !== null) {
            rx = nearX + Math.floor(Math.random() * (maxRadius * 2 + 1)) - maxRadius;
            ry = nearY + Math.floor(Math.random() * (maxRadius * 2 + 1)) - maxRadius;
        } else {
            rx = Math.floor(Math.random() * MAP_SIZE);
            ry = Math.floor(Math.random() * MAP_SIZE);
        }

        if (isWalkable(rx, ry) && (Math.abs(rx - player.x) > 5 || Math.abs(ry - player.y) > 5)) {
            if (!enemies.some(e => Math.floor(e.x) === rx && Math.floor(e.y) === ry)) {
                return { x: rx, y: ry };
            }
        }
        attempts++;
    }
    return null;
}

function spawnSingleEnemy(type, posX, posY, groupId = null) {
    const variant = type === 'SOLDIER' ? Math.floor(Math.random() * ENEMY_CONFIG.visuals.SOLDIER.length) : 0;
    const typeDef = ENEMY_CONFIG.types[type];

    enemies.push({
        x: posX,
        y: posY,
        renderX: posX * TILE_SIZE,
        renderY: posY * TILE_SIZE,
        type: type,
        groupId: groupId,
        variant: variant,
        pattern: typeDef.pattern,
        speed: typeDef.speed,
        stoppedUntil: 0,
        moveTimer: 0,
        state: 'wander',
        dir: 'down',
        wanderDir: Math.floor(Math.random() * 4),
        isMoving: false
    });
}

function spawnEnemies() {
    enemies.length = 0;

    for (let g = 0; g < ENEMY_CONFIG.soldierGroupsCount; g++) {
        let center = findValidSpawnTile();
        if (center) {
            const groupSize = Math.floor(Math.random() * (ENEMY_CONFIG.soldierMaxPerGroup - ENEMY_CONFIG.soldierMinPerGroup + 1)) + ENEMY_CONFIG.soldierMinPerGroup;
            for (let i = 0; i < groupSize; i++) {
                // Reduced radius to 1 so soldiers spawn right next to each other
                let pos = findValidSpawnTile(center.x, center.y, 1) || center;
                spawnSingleEnemy('SOLDIER', pos.x, pos.y, g);
            }
        }
    }

    for (let i = 0; i < ENEMY_CONFIG.sadduceesCount; i++) {
        let pos = findValidSpawnTile();
        if (pos) spawnSingleEnemy('SADDUCEE', pos.x, pos.y);
    }

    for (let i = 0; i < ENEMY_CONFIG.phariseesCount; i++) {
        let pos = findValidSpawnTile();
        if (pos) spawnSingleEnemy('PHARISEE', pos.x, pos.y);
    }
}

function updateEnemies() {
    const now = Date.now();
    const chaseRadius = CHASE_RADIUS;
    const playerVisible = Date.now() > player.invisibleUntil;

    // Squad Alert System: If any soldier in a squad spots the player, the whole squad chases
    const alertedGroups = new Set();
    if (playerVisible) {
        enemies.forEach(enemy => {
            if (enemy.type === 'SOLDIER' && enemy.groupId !== null) {
                const dx = player.x - enemy.x;
                const dy = player.y - enemy.y;
                if (Math.sqrt(dx * dx + dy * dy) < chaseRadius) {
                    alertedGroups.add(enemy.groupId);
                }
            }
        });
    }

    enemies.forEach(enemy => {
        if (isDialogueOpen || now < enemy.stoppedUntil) {
            enemy.state = 'stopped';
            enemy.isMoving = false;
            return;
        }

        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (playerVisible && (dist < chaseRadius || (enemy.type === 'SOLDIER' && alertedGroups.has(enemy.groupId)))) {
            enemy.state = 'chase';
        } else {
            enemy.state = 'wander';
        }

        enemy.moveTimer = (enemy.moveTimer || 0) + 1;
        const chaseSpeedMult = enemy.state === 'chase' ? 1.8 : 1.0;
        const moveInterval = Math.floor(60 / (enemy.speed * 10 * chaseSpeedMult));

        if (enemy.moveTimer >= moveInterval) {
            enemy.moveTimer = 0;
            let mx = 0, my = 0;

            if (enemy.state === 'chase' && playerVisible) {
                const adx = Math.abs(dx);
                const ady = Math.abs(dy);

                if (adx >= ady) {
                    mx = dx > 0 ? 1 : -1;
                    if (!isWalkable(Math.floor(enemy.x) + mx, Math.floor(enemy.y))) {
                        mx = 0;
                        my = dy > 0 ? 1 : -1;
                        if (!isWalkable(Math.floor(enemy.x), Math.floor(enemy.y) + my)) {
                            my = 0;
                            mx = dx > 0 ? -1 : 1;
                            if (!isWalkable(Math.floor(enemy.x) + mx, Math.floor(enemy.y))) {
                                mx = 0;
                                my = dy > 0 ? -1 : 1;
                                if (!isWalkable(Math.floor(enemy.x), Math.floor(enemy.y) + my)) {
                                    mx = 0;
                                    my = 0;
                                }
                            }
                        }
                    }
                } else if (ady > 0) {
                    my = dy > 0 ? 1 : -1;
                    if (!isWalkable(Math.floor(enemy.x), Math.floor(enemy.y) + my)) {
                        my = 0;
                        mx = dx > 0 ? 1 : -1;
                        if (!isWalkable(Math.floor(enemy.x) + mx, Math.floor(enemy.y))) {
                            mx = 0;
                            my = dy > 0 ? -1 : 1;
                            if (!isWalkable(Math.floor(enemy.x), Math.floor(enemy.y) + my)) {
                                mx = 0;
                                my = 0;
                            }
                        }
                    }
                }
            } else {
                // Squad Cohesion: Soldiers stay tethered to their squad leader during wander
                let tethered = false;
                if (enemy.type === 'SOLDIER' && enemy.groupId !== null) {
                    const squadLeader = enemies.find(e => e.type === 'SOLDIER' && e.groupId === enemy.groupId);
                    if (squadLeader && squadLeader !== enemy) {
                        const ldx = squadLeader.x - enemy.x;
                        const ldy = squadLeader.y - enemy.y;
                        const distToLeader = Math.sqrt(ldx * ldx + ldy * ldy);

                        // If squadmate gets more than 1.5 tiles away, pull back toward squad leader
                        if (distToLeader > 1.5) {
                            tethered = true;
                            if (Math.abs(ldx) >= Math.abs(ldy)) {
                                mx = ldx > 0 ? 1 : -1;
                            } else {
                                my = ldy > 0 ? 1 : -1;
                            }
                        }
                    }
                }

                if (!tethered) {
                    const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
                    const pick = enemy.wanderDir || 0;
                    const dir = dirs[pick];
                    mx = dir[0];
                    my = dir[1];
                    enemy.wanderDir = (pick + 1 + Math.floor(Math.random() * 2)) % 4;
                }
            }

            const nx = Math.floor(enemy.x) + mx;
            const ny = Math.floor(enemy.y) + my;
            if (isWalkable(nx, ny)) {
                enemy.x += mx;
                enemy.y += my;
                enemy.isMoving = true;
                enemy.dir = mx !== 0 ? (mx > 0 ? 'right' : 'left') : (my > 0 ? 'down' : 'up');
            } else {
                enemy.isMoving = false;
                if (enemy.state === 'wander') {
                    enemy.wanderDir = Math.floor(Math.random() * 4);
                }
            }
        }

        enemy.renderX += (enemy.x * TILE_SIZE - enemy.renderX) * 0.15;
        enemy.renderY += (enemy.y * TILE_SIZE - enemy.renderY) * 0.15;
    });
}

function getStitchNoise(px, py) {
    const value = Math.sin(px * 12.9898 + py * 78.233) * 43758.5453123;
    return value - Math.floor(value);
}

function getTileAt(col, row) {
    if (col < 0 || col >= MAP_SIZE || row < 0 || row >= MAP_SIZE) return 2;
    return levelMap[row][col];
}

function getTileEdges(id, col, row) {
    const top = getTileAt(col, row - 1);
    const bottom = getTileAt(col, row + 1);
    const left = getTileAt(col - 1, row);
    const right = getTileAt(col + 1, row);

    return {
        top: top !== id,
        bottom: bottom !== id,
        left: left !== id,
        right: right !== id,
        topId: top,
        bottomId: bottom,
        leftId: left,
        rightId: right
    };
}

function getFrontNPC() {
    let lookX = player.x;
    let lookY = player.y;
    if (player.facing === 'up') lookY--;
    if (player.facing === 'down') lookY++;
    if (player.facing === 'left') lookX--;
    if (player.facing === 'right') lookX++;
    return npcs.find(n => n.x === lookX && n.y === lookY) || null;
}

// =====================================================================
// TILE RENDERING
// =====================================================================
function renderTileToCtx(octx, id, col, row, time) {
    const ts = TILE_SIZE;
    const tx = col * ts;
    const ty = row * ts;

    let baseColor = PALETTE.sand_light;
    if (id === 1) baseColor = PALETTE.water_deep;
    if (id === 2) baseColor = PALETTE.palm_trunk;
    if (id === 3) baseColor = PALETTE.sand_wave;
    if (id === 4) baseColor = PALETTE.roof_wood;
    if (id === 5) baseColor = PALETTE.clay_wall;
    if (id === 6) baseColor = PALETTE.bush_green;

    octx.fillStyle = baseColor;
    octx.fillRect(tx, ty, ts, ts);

    let isOuterEdge = (col === 0 || col === MAP_SIZE - 1 || row === 0 || row === MAP_SIZE - 1);
    let touchesSand = (getTileAt(col - 1, row) === 0 || getTileAt(col + 1, row) === 0 || getTileAt(col, row - 1) === 0 || getTileAt(col, row + 1) === 0);
    const edges = getTileEdges(id, col, row);

    for (let y = 0; y < ts; y += 2) {
        for (let x = 0; x < ts; x += 2) {
            const seed = getStitchNoise(col * ts + x, row * ts + y);

            switch (id) {
                case 0: {
                    let renderWetShore = false;
                    if (edges.left && edges.leftId === 1 && x < 6) renderWetShore = (seed > (x / 6));
                    if (edges.right && edges.rightId === 1 && x > 26) renderWetShore = (seed > ((ts - x) / 6));
                    if (edges.top && edges.topId === 1 && y < 6) renderWetShore = (seed > (y / 6));
                    if (edges.bottom && edges.bottomId === 1 && y > 26) renderWetShore = (seed > ((ts - y) / 8));

                    let renderPathEdge = false;
                    if (edges.left && edges.leftId === 3 && x < 6) renderPathEdge = (seed > (x / 7));
                    if (edges.right && edges.rightId === 3 && x > 26) renderPathEdge = (seed > ((ts - x) / 7));
                    if (edges.top && edges.topId === 3 && y < 6) renderPathEdge = (seed > (y / 7));
                    if (edges.bottom && edges.bottomId === 3 && y > 26) renderPathEdge = (seed > ((ts - y) / 7));

                    if (renderWetShore) {
                        octx.fillStyle = PALETTE.water_shore;
                        octx.fillRect(tx + x, ty + y, 2, 2);
                    } else if (renderPathEdge) {
                        octx.fillStyle = PALETTE.sand_wave;
                        octx.fillRect(tx + x, ty + y, 2, 2);
                    } else {
                        octx.fillStyle = (seed > 0.88) ? PALETTE.sand_dark : PALETTE.sand_light;
                        octx.fillRect(tx + x, ty + y, 2, 2);
                    }
                    break;
                }
                case 1: {
                    let renderWaterSand = false;
                    if (edges.left && edges.leftId !== 1 && x < 8) renderWaterSand = (seed > (x / 8));
                    if (edges.right && edges.rightId !== 1 && x > 24) renderWaterSand = (seed > ((ts - x) / 8));
                    if (edges.top && edges.topId !== 1 && y < 8) renderWaterSand = (seed > (y / 8));
                    if (edges.bottom && edges.bottomId !== 1 && y > 24) renderWaterSand = (seed > ((ts - y) / 8));

                    if (renderWaterSand) {
                        octx.fillStyle = (seed > 0.4) ? PALETTE.water_shore : PALETTE.sand_light;
                        octx.fillRect(tx + x, ty + y, 2, 2);
                    } else {
                        let dynamicWave = Math.sin((col * ts + x) * 0.08 + (row * ts + y) * 0.06 + (time / 800)) * 0.5 + 0.5;

                        if (dynamicWave > 0.40) {
                            if ((x + y) % 4 === 0 || seed > 0.52) {
                                octx.fillStyle = PALETTE.water_surf;
                            } else {
                                octx.fillStyle = PALETTE.water_deep;
                            }
                        } else {
                            if ((x + y) % 4 === 2 || seed > 0.75) {
                                octx.fillStyle = PALETTE.water_surf;
                            } else {
                                octx.fillStyle = PALETTE.water_deep;
                            }
                        }
                        octx.fillRect(tx + x, ty + y, 2, 2);
                    }
                    break;
                }
                case 2: {
                    let renderBorderBrown = false;
                    if (isOuterEdge) {
                        let distY = Math.min(row * ts + y, (MAP_SIZE * ts) - (row * ts + y));
                        let distX = Math.min(col * ts + x, (MAP_SIZE * ts) - (col * ts + x));
                        renderBorderBrown = (seed > (Math.min(distX, distY) / 18));
                    }

                    if (renderBorderBrown) {
                        octx.fillStyle = PALETTE.border_brown;
                        octx.fillRect(tx + x, ty + y, 2, 2);
                    } else {
                        if (touchesSand && (y > 24 || x < 8 || x > 24 || y < 8) && seed > 0.6) {
                            octx.fillStyle = PALETTE.sand_light;
                            octx.fillRect(tx + x, ty + y, 2, 2);
                        } else if (edges.bottom && edges.bottomId === 0 && y > 24 && seed > 0.5) {
                            octx.fillStyle = PALETTE.sand_light;
                            octx.fillRect(tx + x, ty + y, 2, 2);
                        } else if ((x - ts / 2) * (x - ts / 2) + (y - ts / 2) * (y - ts / 2) < 180) {
                            octx.fillStyle = (seed > 0.4) ? PALETTE.palm_leaf : '#2a3f2c';
                            octx.fillRect(tx + x, ty + y, 2, 2);
                        }
                    }
                    break;
                }
                case 3: {
                    let renderPathSand = false;
                    if (edges.left && edges.leftId === 0 && x < 8) renderPathSand = (seed > (x / 8));
                    if (edges.right && edges.rightId === 0 && x > 22) renderPathSand = (seed > ((ts - x) / 8));
                    if (edges.top && edges.topId === 0 && y < 8) renderPathSand = (seed > (y / 8));
                    if (edges.bottom && edges.bottomId === 0 && y > 22) renderPathSand = (seed > ((ts - y) / 8));

                    if (renderPathSand) {
                        octx.fillStyle = (seed > 0.5) ? PALETTE.sand_light : PALETTE.sand_dark;
                        octx.fillRect(tx + x, ty + y, 2, 2);
                    } else {
                        if (y % 8 === 0 || (x + (Math.floor(y / 8) % 2) * 8) % 16 === 0) {
                            octx.fillStyle = PALETTE.roof_wood;
                            octx.fillRect(tx + x, ty + y, 2, 2);
                        } else if (seed > 0.88) {
                            octx.fillStyle = PALETTE.clay_light;
                            octx.fillRect(tx + x, ty + y, 2, 2);
                        }
                    }
                    break;
                }
                case 4:
                    if (y % 6 === 0) { octx.fillStyle = '#4a2f27'; octx.fillRect(tx + x, ty + y, ts, 2); }
                    break;
                case 5: {
                    let wallEdgeSand = false;
                    if (edges.left && edges.leftId === 0 && x < 6) wallEdgeSand = (seed > (x / 7));
                    if (edges.right && edges.rightId === 0 && x > 26) wallEdgeSand = (seed > ((ts - x) / 7));
                    if (edges.top && edges.topId === 0 && y < 6) wallEdgeSand = (seed > (y / 7));
                    if (edges.bottom && edges.bottomId === 0 && y > 26) wallEdgeSand = (seed > ((ts - y) / 7));

                    if (wallEdgeSand) {
                        octx.fillStyle = (seed > 0.5) ? PALETTE.sand_light : PALETTE.sand_dark;
                        octx.fillRect(tx + x, ty + y, 2, 2);
                    } else if (y % 10 === 0) {
                        octx.fillStyle = PALETTE.clay_dark;
                        octx.fillRect(tx + x, ty + y, ts, 2);
                    } else if (seed > 0.7) {
                        octx.fillStyle = PALETTE.clay_light;
                        octx.fillRect(tx + x, ty + y, 2, 2);
                    }
                    break;
                }
                case 6:
                    if (seed > 0.45) { octx.fillStyle = '#3a5a40'; octx.fillRect(tx + x, ty + y, 2, 2); }
                    break;
            }
        }
    }
}

function isWalkable(gx, gy) {
    if (gx < 0 || gx >= MAP_SIZE || gy < 0 || gy >= MAP_SIZE) return false;
    const tile = levelMap[gy][gx];
    if (tile === 1 || tile === 2 || tile === 4 || tile === 5 || tile === 6) return false;
    if (npcs.some(n => n.x === gx && n.y === gy)) return false;
    if (enemies.some(e => Math.floor(e.x) === gx && Math.floor(e.y) === gy)) return false;
    return true;
}

function updateTalkButtonState() {
    const talkButton = document.getElementById('btn-action');
    if (getFrontNPC()) {
        talkButton.className = 'active';
    } else {
        talkButton.className = 'disabled';
    }
}

function movePlayer(dx, dy, dir) {
    player.facing = dir;
    if (isWalkable(player.x + dx, player.y + dy)) {
        player.x += dx;
        player.y += dy;
        player.isMoving = true;
    }
    updateTalkButtonState();
}

function triggerInteraction() {
    const targetNpc = getFrontNPC();
    if (targetNpc) {
        alert(`✨ EVENT TRIGGERED ✨\n\nYou successfully intercepted ${targetNpc.name} near ${targetNpc.location}!`);
        isDialogueOpen = true;
        setTimeout(() => {
            isDialogueOpen = false;
            player.invisibleUntil = Date.now() + INVISIBILITY_DURATION;
        }, 2000);
    }
}

function usePlayerAction(actionType) {
    if (actionType === 'prayer' && player.prayers > 0) {
        player.prayers--;
        enemies.forEach(e => {
            if (e.type === 'SADDUCEE' || e.type === 'PHARISEE') {
                e.stoppedUntil = Date.now() + 5000;
            }
        });
    } else if (actionType === 'heal' && player.heals > 0) {
        player.heals--;
        enemies.forEach(e => {
            if (e.type === 'SOLDIER') e.stoppedUntil = Date.now() + 5000;
        });
    }
    updateActionCounts();
}

function handlePlayerArrested() {
    isDialogueOpen = true;
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: black; opacity: 0; transition: opacity 0.2s; z-index: 500;';
    document.getElementById('game-container').appendChild(overlay);

    setTimeout(() => { overlay.style.opacity = '1'; }, 10);

    setTimeout(() => {
        player.x = player.startX;
        player.y = player.startY;
        player.invisibleUntil = Date.now() + INVISIBILITY_DURATION * 2;
        overlay.style.opacity = '0';
        setTimeout(() => {
            overlay.remove();
            isDialogueOpen = false;
        }, 200);
    }, 400);
}

function drawHumanoidGraphics(g, startX, startY, size, bounce, facing, visuals, isGhost = false) {
    const q = size / 4;
    const sx = startX;
    const sy = startY - bounce;

    g.clear();

    for (let i = 0; i < 4; i++) {
        const color = (i === 1) 
            ? (visuals.accentColor || PALETTE.pattern_brown)  
            : (visuals.bodyColor || PALETTE.sprite_white);    
        g.rect(sx, sy + (i * q), size, q).fill(color);
    }

    let eyeY = sy + q + 2;
    let eX1 = sx + 4;
    let eX2 = sx + 14;
    if (facing === 'left') { eX1 -= 2; eX2 -= 2; }
    if (facing === 'right') { eX1 += 2; eX2 += 2; }
    if (facing === 'up') eyeY -= 2;

    g.rect(eX1, eyeY, 4, 4).fill(visuals.eyeColor || '#ffffff');
    g.rect(eX2, eyeY, 4, 4).fill(visuals.eyeColor || '#ffffff');

    let pupilX1 = eX1 + 1;
    let pupilX2 = eX2 + 1;
    if (facing === 'right') { pupilX1 += 1; pupilX2 += 1; }
    if (facing === 'left') { pupilX1 -= 1; pupilX2 -= 1; }
    g.rect(pupilX1, eyeY + 1, 2, 2).fill(visuals.pupilColor || '#000000');
    g.rect(pupilX2, eyeY + 1, 2, 2).fill(visuals.pupilColor || '#000000');

    g.alpha = isGhost ? (PLAYER_CONFIG.visuals.ghostAlpha || 0.5) : 1.0;
}

function drawEnemyGraphics(g, enemy, bounce) {
    const ts = TILE_SIZE;
    const sx = enemy.renderX;
    const sy = enemy.renderY - bounce;
    const type = enemy.type;

    g.clear();

    if (type === 'SOLDIER') {
        const variantIndex = enemy.variant || 0;
        const vis = ENEMY_CONFIG.visuals.SOLDIER[variantIndex] || ENEMY_CONFIG.visuals.SOLDIER[0];

        g.rect(sx + 6, sy + 10, ts - 12, ts - 14).fill(vis.tunicColor);  
        g.rect(sx + 8, sy + 12, ts - 16, ts - 18).fill(vis.armorColor);  
        g.rect(sx + 10, sy + 4, ts - 20, 8).fill(vis.skinColor);         
        g.rect(sx + 8, sy + 2, ts - 16, 5).fill(vis.helmetColor);        
        g.rect(sx + 12, sy - 3, 4, 6).fill(vis.plumeColor);              
        g.rect(sx + ts - 12, sy + 14, 8, 10).fill(vis.shieldColor);     
        g.rect(sx + 12, sy + 6, 4, 4).fill(vis.skinColor);              
        g.rect(sx + ts - 16, sy + 6, 4, 4).fill(vis.skinColor);         
    } else if (type === 'SADDUCEE') {
        const vis = ENEMY_CONFIG.visuals.SADDUCEE;

        g.rect(sx + 8, sy + 8, ts - 16, ts - 12).fill(vis.outerRobe);   
        g.rect(sx + 10, sy + 10, ts - 20, ts - 16).fill(vis.innerRobe); 
        g.rect(sx + 12, sy + 4, ts - 24, 7).fill(vis.skinColor);         
        g.rect(sx + 14, sy - 5, ts - 28, 10).fill(vis.headwear);         
        g.rect(sx + 4, sy + 14, 6, 8).fill(vis.accentColor);             
        g.rect(sx + 14, sy + 6, 4, 3).fill(vis.skinColor);              
        g.rect(sx + ts - 18, sy + 6, 4, 3).fill(vis.skinColor);
    } else if (type === 'PHARISEE') {
        const vis = ENEMY_CONFIG.visuals.PHARISEE;

        g.rect(sx + 6, sy + 8, ts - 12, ts - 12).fill(vis.outerRobe);   
        g.rect(sx + 8, sy + 10, ts - 16, ts - 16).fill(vis.innerRobe); 
        g.rect(sx + 10, sy + 3, ts - 20, 8).fill(vis.skinColor);         
        g.rect(sx + 12, sy - 4, ts - 24, 8).fill(vis.headwear);         
        g.rect(sx + 4, sy + 14, ts - 8, 3).fill(vis.accentColor);        
        g.rect(sx + 12, sy + 5, 4, 3).fill(vis.skinColor);              
        g.rect(sx + ts - 16, sy + 5, 4, 3).fill(vis.skinColor);
    }
}

const mRadius = 48;

const mStartY = mCy - mRadius;

const minimapTerrain = new PIXI.Graphics();
minimapTerrain.mask = minimapMask;
minimapTerrain.rect(mCx - mRadius, mCy - mRadius, mRadius * 2, mRadius * 2).fill('#120f0d');
minimapTerrain.circle(mCx, mCy, mRadius * 0.4).stroke({ width: 1, color: 'rgba(212, 163, 115, 0.15)' });
minimapTerrain.circle(mCx, mCy, mRadius * 0.7).stroke({ width: 1, color: 'rgba(212, 163, 115, 0.15)' });
for (let r = 0; r < MAP_SIZE; r++) {
    for (let c = 0; c < MAP_SIZE; c++) {
        const id = levelMap[r][c];
        if (id === 3) {
            minimapTerrain.rect(mStartX + (c * pSize), mStartY + (r * pSize), pSize, pSize).fill('rgba(233, 196, 106, 0.35)');
        } else if (id === 1) {
            minimapTerrain.rect(mStartX + (c * pSize), mStartY + (r * pSize), pSize, pSize).fill('rgba(32, 72, 89, 0.6)');
        } else if (id === 5 || id === 4 || id === 2) {
            minimapTerrain.rect(mStartX + (c * pSize), mStartY + (r * pSize), pSize, pSize).fill('#1c1510');
        }
    }
}
minimapLayer.addChild(minimapTerrain);

const minimapDynamic = new PIXI.Graphics();
minimapDynamic.mask = new PIXI.Graphics().circle(mCx, mCy, mRadius).fill(0xffffff);
minimapLayer.addChild(minimapDynamic.mask);
minimapLayer.addChild(minimapDynamic);

function drawMinimapDynamic(time) {
    minimapDynamic.clear();

    npcs.forEach(n => {
        minimapDynamic.circle(mStartX + (n.x * pSize) + pSize / 2, mStartY + (n.y * pSize) + pSize / 2, 2.5).fill('#ff0055');
    });

    enemies.forEach(e => {
        minimapDynamic.circle(mStartX + (e.x * pSize) + pSize / 2, mStartY + (e.y * pSize) + pSize / 2, 2).fill('#dc2626');
    });

    const playerPulse = Math.abs(Math.sin(time / 180)) * 1.5;
    minimapDynamic.circle(mStartX + (player.x * pSize) + pSize / 2, mStartY + (player.y * pSize) + pSize / 2, 2.5 + playerPulse).fill(PLAYER_CONFIG.visuals.bodyColor);

    const sweepAngle = (time * 0.0025) % (Math.PI * 2);
    const sweepLX = mCx + Math.cos(sweepAngle) * mRadius;
    const sweepLY = mCy + Math.sin(sweepAngle) * mRadius;

    minimapDynamic.moveTo(mCx, mCy).lineTo(sweepLX, sweepLY).stroke({ width: 1.5, color: 'rgba(0, 245, 212, 0.3)' });
}

document.getElementById('btn-action-heal').addEventListener('pointerdown', (e) => { e.preventDefault(); usePlayerAction('heal'); });

// =====================================================================
// MAIN TICKER LOOP
// =====================================================================
app.ticker.add(() => {
    if (gameOver) return;

    const time = Date.now();

    let targetX = player.x * TILE_SIZE;
    let targetY = player.y * TILE_SIZE;

    player.renderX += (targetX - player.renderX) * 0.18;
    player.renderY += (targetY - player.renderY) * 0.18;

    if (Math.abs(targetX - player.renderX) < 0.2 && Math.abs(targetY - player.renderY) < 0.2) {
        player.renderX = targetX;
        player.renderY = targetY;
        player.isMoving = false;
    }

    let targetCamX = player.renderX - VIEW_WIDTH / 2 + TILE_SIZE / 2;
    let targetCamY = player.renderY - VIEW_HEIGHT / 2 + TILE_SIZE / 2;

    camera.x += (targetCamX - camera.x) * 0.1;
    camera.y += (targetCamY - camera.y) * 0.1;

    camera.x = Math.max(0, Math.min(camera.x, MAP_SIZE * TILE_SIZE - VIEW_WIDTH));
    camera.y = Math.max(0, Math.min(camera.y, MAP_SIZE * TILE_SIZE - VIEW_HEIGHT));

    world.position.set(-camera.x, -camera.y);

    updateEnemies();

    const activeTargetNPC = getFrontNPC();

    npcs.forEach(n => {
        let bounce = Math.abs(Math.sin((time / 200) + n.animOffset)) * 4;
        let nx = n.x * TILE_SIZE;
        let ny = n.y * TILE_SIZE;

        n.shadowG.clear();
        n.shadowG.rect(nx + 4, ny + 28, TILE_SIZE - 8, 4).fill('rgba(26, 20, 16, 0.4)');

        drawHumanoidGraphics(n.spriteG, nx + 4, ny + 4, TILE_SIZE - 8, bounce, 'down', n.visuals, false);

        if (n === activeTargetNPC) {
            const tagX = nx + TILE_SIZE / 2;
            const tagY = ny - bounce - 8;
            n.nameText.text = n.name;
            n.nameText.position.set(tagX, tagY);
            const textWidth = n.nameText.width;
            const textHeight = 14;
            const padX = 6, padY = 4;
            n.nameBg.clear();
            n.nameBg.rect(tagX - textWidth / 2 - padX, tagY - textHeight / 2 - padY, textWidth + padX * 2, textHeight + padY * 2)
                .fill('rgba(26, 20, 16, 0.85)')
                .stroke({ width: 1, color: '#00f5d4' });
            n.nameBg.visible = true;
            n.nameText.visible = true;
        } else {
            n.nameBg.visible = false;
            n.nameText.visible = false;
        }
    });

    let walkBounce = player.isMoving ? Math.abs(Math.sin(time * 0.015)) * 5 : 0;
    const isPlayerGhost = time < player.invisibleUntil;
    drawHumanoidGraphics(playerG, player.renderX + 4, player.renderY + 4, TILE_SIZE - 8, walkBounce, player.facing, PLAYER_CONFIG.visuals, isPlayerGhost);

    enemies.forEach(enemy => {
        let bounce = enemy.isMoving ? Math.abs(Math.sin((time / 150) + enemy.x)) * 4 : 0;
        drawEnemyGraphics(enemy.spriteG, enemy, bounce);

        if (Date.now() < enemy.stoppedUntil || enemy.state === 'stopped') {
            enemy.zzzText.position.set(enemy.renderX + TILE_SIZE / 2, enemy.renderY - bounce - 5);
            enemy.zzzText.visible = true;
        } else {
            enemy.zzzText.visible = false;
        }

        if (Date.now() > player.invisibleUntil && Math.abs(player.x - enemy.x) < 0.8 && Math.abs(player.y - enemy.y) < 0.8) {
            player.lives--;
            updateLivesDisplay();
            if (player.lives <= 0) {
                gameOver = true;
                document.getElementById('game-over-screen').style.display = 'flex';
            } else {
                handlePlayerArrested();
            }
        }
    });

    particlesG.clear();
    particles.forEach(p => {
        p.x -= p.speed;
        p.y += p.speed * 0.5;
        if (p.x < -10) { p.x = VIEW_WIDTH + 10; p.y = Math.random() * VIEW_HEIGHT; }
        if (p.y > VIEW_HEIGHT + 10) { p.y = -10; p.x = Math.random() * VIEW_WIDTH; }
        particlesG.rect(p.x, p.y, p.size * 2, p.size).fill({ color: '#dfb24c', alpha: p.opacity });
    });

    drawMinimapDynamic(time);
});

})();
</script>
