<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Historic Lewes - Advanced Oasis & Dither Loops</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            position: relative;
            background-color: #1a1410;
            color: #f5ebe0;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 10px;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 512px;
            aspect-ratio: 1;
            background: #120f0d;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border-radius: 4px;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }
        
        #ui-controls-container {
            width: 100%;
            max-width: 512px;
            height: 120px;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 999;
        }
        .dpad {
            position: relative;
            width: 120px;
            height: 120px;
        }
        .btn {
            position: absolute;
            background: #2c2219;
            border: 2px solid #d4a373;
            color: #f5ebe0;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            touch-action: manipulation;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            cursor: pointer;
        }
        .btn:active {
            background: #d4a373;
            color: #2c2219;
        }
        #btn-up    { top: 0; left: 40px; width: 40px; height: 40px; }
        #btn-down  { bottom: 0; left: 40px; width: 40px; height: 40px; }
        #btn-left  { top: 40px; left: 0; width: 40px; height: 40px; }
        #btn-right { top: 40px; right: 0; width: 40px; height: 40px; }
        
        #btn-action {
            position: relative;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        #btn-action.disabled {
            background: #221a14;
            border-color: #44372c;
            color: #554438;
            opacity: 0.6;
            pointer-events: none;
        }
        #btn-action.active {
            background: #00bbf9;
            border-color: #00f5d4;
            color: #fff;
            opacity: 1;
            box-shadow: 0 0 15px rgba(0, 187, 249, 0.7);
            transform: scale(1.05);
            cursor: pointer;
        }
        #hud {
            margin-top: 10px;
            text-align: center;
            color: #a79788;
            font-size: 11px;
            max-width: 512px;
            line-height: 1.4;
        }
        #lives-display {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #f87171;
            font-size: 24px;
            text-shadow: 1px 1px 2px #000;
            z-index: 10;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
            color: white;
        }
        .overlay h1 { font-size: 3em; color: #f87171; margin-bottom: 20px; }
        .overlay button {
            background: #d4a373;
            border: none;
            padding: 12px 30px;
            font-size: 1.2em;
            font-family: monospace;
            cursor: pointer;
            color: #1a1410;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="512" height="512"></canvas>
    <div id="lives-display"></div>
</div>

<div id="game-over-screen" class="overlay" style="display: none;">
    <h1>GAME OVER</h1>
    <button id="btn-try-again">Try Again</button>
</div>

<div id="ui-controls-container">
    <div class="dpad">
        <div class="btn" id="btn-up">▲</div>
        <div class="btn" id="btn-left">◀</div>
        <div class="btn" id="btn-right">▶</div>
        <div class="btn" id="btn-down">▼</div>
    </div>
    <div class="action-group">
        <div id="btn-action" class="btn disabled">TALK</div>
    </div>
    <div class="action-group">
        <div id="btn-action-prayer" class="btn active">PRAY</div>
        <div id="prayer-count" class="action-count">x3</div>
    </div>
    <div class="action-group">
        <div id="btn-action-heal" class="btn active">HEAL</div>
        <div id="heal-count" class="action-count">x1</div>
    </div>
</div>

<div id="hud">
    <strong>Historic Lewes Engine v20</strong><br>
    Oasis core expanded. High-frequency water wave animation with interwoven dual-shade texture dithering fully active.
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const TILE_SIZE = 32;
const MAP_SIZE = 64; 
const VIEW_WIDTH = canvas.width;  
const VIEW_HEIGHT = canvas.height;

    sand_light:   '#e9c46a',
    sand_dark:    '#dfb24c',
    sand_wave:    '#d4a373',
    clay_wall:    '#cd7f60',
    clay_dark:    '#b06548',
    clay_light:   '#de9678',
    roof_wood:    '#6e463b',
    water_deep:   '#204859',
    water_surf:   '#2e5d72',
    water_shore:  '#688880',
    palm_leaf:    '#3a5a40',
    palm_trunk:   '#a06a42',
    bush_green:   '#588157',
    pattern_brown:'#5c4033',
    sky_blue:     '#00bbf9',
    sprite_white: '#ffffff'
};

const TILE_LEGEND = {

    '=': 3, // Winding Lanes / Paths

    'W': 5, // Masonry Tower Walls
    'B': 6  // Foliage Hedges

const mapTemplate = [

    "##...==.......==.......#######~~~~~~~~~#####..==.......==..........##",
    "###...==.....==......###RRRRRR~~~~~~~~~RRR###...==.....==..........###",

    "#####...............##RRRRRRRRRRRRRRRRRRRRR##......................#####",

    "#.....==....................=.....=....................==..........#",
    "#......======================.....======================...........#",
    "#...........................=.....=................................#",
    "#...........................=.....=................................#",
    "##..........................W.....W...............................##",
    "###........................WW.....WW..............................###",
    "####.....................####.....####.............................####",
    "#####...................#####.....#####............................#####",
    "######.................######.....######...........................######",
    "#######...............#######.....###..BBBBBBBBBBB.......#######",
    "########.............########.....##...B.........B......########",
    "#########...........#########.....#....B.........B.....#########",
    "##########.........##########..........B....R....B....##########",
    "###########.......###########..........B...RWR...B...###########",
    "############.....############..........B....R....B..############",
    "#############...#############..........B.........B.#############",
    "##############.##############..........BBBBBBBBBBB##############",
    "#############################..................#################",
    "############################....................################",
    "###########################......................###############",
    "##########################........................##############",
    "#########################..........................#############",
    "########################............................############",
    "#######################..............................###########",
    "######################................................##########",
    "################################################################"
];

let gameOver = false;
const levelMap = [];

const player = { 
    x: 28,            
    y: 35, 
    renderX: 28 * TILE_SIZE, 
    renderY: 35 * TILE_SIZE,
    startX: 28,
    startY: 35,
    facing: 'down',
    isMoving: false,
    lives: 3,
    prayers: 3,
    heals: 1,
    invisibleUntil: 0
};

const npcs = [];
const enemies = [];
const ENEMY_TYPES = {
    SOLDIER: { color: '#dc2626', speed: 0.04, pattern: 'patrol' },
    SADDUCEE: { color: '#9333ea', speed: 0.03, pattern: 'wander' },
    PHARISEE: { color: '#0284c7', speed: 0.03, pattern: 'square' }
};
const CHASE_RADIUS = 8;
const INVISIBILITY_DURATION = 2000; // 2 seconds

const camera = { x: player.renderX - VIEW_WIDTH/2, y: player.renderY - VIEW_HEIGHT/2 };
const particles = [];
const MAX_PARTICLES = 40;

function initializeGame() {
    for (let r = 0; r < MAP_SIZE; r++) {
        levelMap[r] = [];
        for (let c = 0; c < MAP_SIZE; c++) {
            const token = mapTemplate[r][c];
            let parsedId = TILE_LEGEND[token] !== undefined ? TILE_LEGEND[token] : 0;
            
            // --- PROCEDURAL SHORELINE EXTRA PALM SEEDING ---
            // If the map spot is grass/sand and directly sits near the central oasis water zone:
            if (parsedId === 0 || parsedId === 4) {
                let dx = c - 32;
                let dy = r - 16;
                let distToOasis = Math.sqrt(dx*dx + dy*dy);
                
                // If within proximity frame of the lake basin, randomly spawn extra trees
                if (distToOasis > 6 && distToOasis < 15) {
                    let noiseSeed = Math.sin(c * 2.3) * Math.cos(r * 2.3);
                    if (noiseSeed > 0.62) {
                        parsedId = 2; // Inject dynamic extra palm tree asset code
                    }
                }
            }
            levelMap[r][c] = parsedId;
        }
    }
    
    npcs.push({ x: 28, y: 33, name: "Castle Curator", location: "the Keep Barbican", animOffset: 0 });
    npcs.push({ x: 42, y: 31, name: "Town Resident", location: "High Street Cut", animOffset: Math.PI / 3 });
    npcs.push({ x: 14, y: 31, name: "Local Sketcher", location: "the Western Lane Edge", animOffset: Math.PI / 1.5 });

    for (let i = 0; i < MAX_PARTICLES; i++) {
        particles.push({
            x: Math.random() * VIEW_WIDTH,
            y: Math.random() * VIEW_HEIGHT,
            speed: 1.5 + Math.random() * 2,
            size: 2 + Math.floor(Math.random() * 2),
            opacity: 0.1 + Math.random() * 0.3
        });
    }

}
initializeGame();
spawnEnemies(10);
updateLivesDisplay();
updateActionCounts();

function updateLivesDisplay() {
    document.getElementById('lives-display').textContent = 'Lives: ' + player.lives;
}

function updateActionCounts() {
    document.getElementById('prayer-count').textContent = 'x' + player.prayers;
    document.getElementById('heal-count').textContent = 'x' + player.heals;
}

function spawnEnemies(count) {
    const types = Object.keys(ENEMY_TYPES);
    for (let i = 0; i < count; i++) {
        let placed = false;
        while (!placed) {
            let rx = Math.floor(Math.random() * MAP_SIZE);
            let ry = Math.floor(Math.random() * MAP_SIZE);
            if (isWalkable(rx, ry) && (Math.abs(rx - player.x) > 5 || Math.abs(ry - player.y) > 5)) {
                const typeKey = types[Math.floor(Math.random() * types.length)];
                enemies.push({
                    x: rx,
                    y: ry,
                    renderX: rx * TILE_SIZE,
                    renderY: ry * TILE_SIZE,
                    type: typeKey,
                    pattern: ENEMY_TYPES[typeKey].pattern,
                    speed: ENEMY_TYPES[typeKey].speed,
                    stoppedUntil: 0,
                    moveTimer: 0,
                    state: 'wander',
                    dir: 'down',
                    wanderDir: Math.floor(Math.random() * 4),
                    isMoving: false
                });
                placed = true;
            }
        }
    }
}

function updateEnemies() {
    const now = Date.now();
    const chaseRadius = CHASE_RADIUS;
    
    enemies.forEach(enemy => {
        if (isDialogueOpen || now < enemy.stoppedUntil) {
            enemy.state = 'stopped';
            enemy.isMoving = false;
            return;
        }
        
        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const playerVisible = Date.now() > player.invisibleUntil;
        
        if (playerVisible && dist < chaseRadius) {
            enemy.state = 'chase';
        } else {
            enemy.state = 'wander';
        }
        
        enemy.moveTimer = (enemy.moveTimer || 0) + 1;
        const moveInterval = Math.floor(60 / (enemy.speed * 10));
        
        if (enemy.moveTimer >= moveInterval) {
            enemy.moveTimer = 0;
            let mx = 0, my = 0;
            
            if (enemy.state === 'chase' && playerVisible) {
                enemy.pathTimer = (enemy.pathTimer || 0) - 1;
                if (!enemy.path || enemy.path.length <= 1 || enemy.pathTimer <= 0) {
                    const sx = Math.floor(enemy.x);
                    const sy = Math.floor(enemy.y);
                    const ex = Math.floor(player.x);
                    const ey = Math.floor(player.y);
                    if (sx !== ex || sy !== ey) {
                        enemy.path = findPath(sx, sy, ex, ey);
                    } else {
                        enemy.path = null;
                    }
                    enemy.pathTimer = 20;
                }
                
                if (enemy.path && enemy.path.length > 1) {
                    const next = enemy.path[1];
                    mx = next.x - Math.floor(enemy.x);
                    my = next.y - Math.floor(enemy.y);
                } else {
                    const adx = Math.abs(dx);
                    const ady = Math.abs(dy);
                    if (adx > ady) {
                        mx = dx > 0 ? 1 : -1;
                    } else if (ady > 0) {
                        my = dy > 0 ? 1 : -1;
                    }
                }
            } else {
                const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
                const pick = enemy.wanderDir || 0;
                const dir = dirs[pick];
                mx = dir[0];
                my = dir[1];
                enemy.wanderDir = (pick + 1 + Math.floor(Math.random() * 2)) % 4;
            }
            
            const nx = Math.floor(enemy.x) + mx;
            const ny = Math.floor(enemy.y) + my;
            if (isWalkable(nx, ny)) {
                enemy.x += mx;
                enemy.y += my;
                enemy.isMoving = true;
                enemy.dir = mx !== 0 ? (mx > 0 ? 'right' : 'left') : (my > 0 ? 'down' : 'up');
            } else {
                enemy.isMoving = false;
                if (enemy.state === 'wander') {
                    enemy.wanderDir = Math.floor(Math.random() * 4);
                }
            }
        }
        
        enemy.renderX += (enemy.x * TILE_SIZE - enemy.renderX) * 0.15;
        enemy.renderY += (enemy.y * TILE_SIZE - enemy.renderY) * 0.15;
    });
}

function getStitchNoise(px, py) {
    const value = Math.sin(px * 12.9898 + py * 78.233) * 43758.5453123;
    return value - Math.floor(value);
}

function getTileAt(col, row) {
    if (col < 0 || col >= MAP_SIZE || row < 0 || row >= MAP_SIZE) return 2;
    return levelMap[row][col];
}

function findPath(startX, startY, endX, endY) {
    const open = [{x: startX, y: startY}];
    const closed = new Set();
    const cameFrom = new Map();
    const gScore = new Map();
    const fScore = new Map();
    const key = (x, y) => `${x},${y}`;
    const startKey = key(startX, startY);
    
    gScore.set(startKey, 0);
    fScore.set(startKey, Math.abs(startX - endX) + Math.abs(startY - endY));
    
    const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
    
    while (open.length > 0) {
        open.sort((a, b) => (fScore.get(key(a.x, a.y)) || Infinity) - (fScore.get(key(b.x, b.y)) || Infinity));
        const current = open.shift();
        const currentKey = key(current.x, current.y);
        
        if (current.x === endX && current.y === endY) {
            const path = [];
            let curr = currentKey;
            while (curr) {
                const [cx, cy] = curr.split(',').map(Number);
                path.unshift({x: cx, y: cy});
                curr = cameFrom.get(curr);
            }
            return path;
        }
        
        closed.add(currentKey);
        
        for (const [dx, dy] of dirs) {
            const nx = current.x + dx;
            const ny = current.y + dy;
            const neighborKey = key(nx, ny);
            
            if (closed.has(neighborKey)) continue;
            if (!isWalkable(nx, ny)) continue;
            
            const tentativeG = (gScore.get(currentKey) || 0) + 1;
            
            if (!open.some(n => n.x === nx && n.y === ny)) {
                open.push({x: nx, y: ny});
            } else if (tentativeG >= (gScore.get(neighborKey) || Infinity)) {
                continue;
            }
            
            cameFrom.set(neighborKey, currentKey);
            gScore.set(neighborKey, tentativeG);
            fScore.set(neighborKey, tentativeG + Math.abs(nx - endX) + Math.abs(ny - endY));
        }
    }
    
    return null;
}

function getTileEdges(id, col, row) {
    const top = getTileAt(col, row - 1);
    const bottom = getTileAt(col, row + 1);
    const left = getTileAt(col - 1, row);
    const right = getTileAt(col + 1, row);
    
    return {
        top: top !== id,
        bottom: bottom !== id,
        left: left !== id,
        right: right !== id,
        topId: top,
        bottomId: bottom,
        leftId: left,
        rightId: right
    };
}

function getFrontNPC() {
    let lookX = player.x;
    let lookY = player.y;
    if (player.facing === 'up') lookY--;
    if (player.facing === 'down') lookY++;
    if (player.facing === 'left') lookX--;
    if (player.facing === 'right') lookX++;
    return npcs.find(n => n.x === lookX && n.y === lookY) || null;
}

function renderTile(ctx, id, col, row, time, camX, camY) {
    const ts = TILE_SIZE;
    const tx = col * ts - camX;
    const ty = row * ts - camY;
    
    let baseColor = PALETTE.sand_light;
    if (id === 1) baseColor = PALETTE.water_deep;
    if (id === 2) baseColor = PALETTE.palm_trunk;
    if (id === 3) baseColor = PALETTE.sand_wave;
    if (id === 4) baseColor = PALETTE.roof_wood;
    if (id === 5) baseColor = PALETTE.clay_wall;
    if (id === 6) baseColor = PALETTE.bush_green;
    
    ctx.fillStyle = baseColor;
    ctx.fillRect(tx, ty, ts, ts);

    let isOuterEdge = (col === 0 || col === MAP_SIZE - 1 || row === 0 || row === MAP_SIZE - 1);
    let touchesSand = (getTileAt(col-1, row)===0 || getTileAt(col+1, row)===0 || getTileAt(col, row-1)===0 || getTileAt(col, row+1)===0);
    const edges = getTileEdges(id, col, row);

    for (let y = 0; y < ts; y += 2) {
        for (let x = 0; x < ts; x += 2) {
            const seed = getStitchNoise(col * ts + x, row * ts + y);
            
            switch(id) {
                case 0:
                    let renderWetShore = false;
                    if (edges.left && edges.leftId === 1 && x < 6)   renderWetShore = (seed > (x / 6));
                    if (edges.right && edges.rightId === 1 && x > 26) renderWetShore = (seed > ((ts - x) / 6));
                    if (edges.top && edges.topId === 1 && y < 6)   renderWetShore = (seed > (y / 6));
                    if (edges.bottom && edges.bottomId === 1 && y > 26) renderWetShore = (seed > ((ts - y) / 8));

                    let renderPathEdge = false;
                    if (edges.left && edges.leftId === 3 && x < 6)   renderPathEdge = (seed > (x / 7));
                    if (edges.right && edges.rightId === 3 && x > 26) renderPathEdge = (seed > ((ts - x) / 7));
                    if (edges.top && edges.topId === 3 && y < 6)   renderPathEdge = (seed > (y / 7));
                    if (edges.bottom && edges.bottomId === 3 && y > 26) renderPathEdge = (seed > ((ts - y) / 7));

                    if (renderWetShore) {
                        ctx.fillStyle = PALETTE.water_shore;
                        ctx.fillRect(tx + x, ty + y, 2, 2);
                    } else if (renderPathEdge) {
                        ctx.fillStyle = PALETTE.sand_wave;
                        ctx.fillRect(tx + x, ty + y, 2, 2);
                    } else {
                        ctx.fillStyle = (seed > 0.88) ? PALETTE.sand_dark : PALETTE.sand_light;
                        ctx.fillRect(tx + x, ty + y, 2, 2);
                    }
                    break;
                    
                case 1:
                    let renderWaterSand = false;
                    if (edges.left && edges.leftId !== 1 && x < 8)   renderWaterSand = (seed > (x / 8));
                    if (edges.right && edges.rightId !== 1 && x > 24) renderWaterSand = (seed > ((ts - x) / 8));
                    if (edges.top && edges.topId !== 1 && y < 8)   renderWaterSand = (seed > (y / 8));
                    if (edges.bottom && edges.bottomId !== 1 && y > 24) renderWaterSand = (seed > ((ts - y) / 8));

                    if (renderWaterSand) {
                        ctx.fillStyle = (seed > 0.4) ? PALETTE.water_shore : PALETTE.sand_light;
                        ctx.fillRect(tx + x, ty + y, 2, 2);
                    } else {
                        // --- ACCELERATED DI-SHADE DITHER SYSTEM ---
                        // Speed up oscillation parameter updates by dividing time index faster (time / 800)
                        let dynamicWave = Math.sin((col*ts + x) * 0.08 + (row*ts + y) * 0.06 + (time / 800)) * 0.5 + 0.5;
                        
                        // Weave dual shades together smoothly using a high-density alternating checker dither mask
                        if (dynamicWave > 0.40) {
                            if ((x + y) % 4 === 0 || seed > 0.52) {
                                ctx.fillStyle = PALETTE.water_surf;
                            } else {
                                ctx.fillStyle = PALETTE.water_deep;
                            }
                        } else {
                            if ((x + y) % 4 === 2 || seed > 0.75) {
                                ctx.fillStyle = PALETTE.water_surf;
                            } else {
                                ctx.fillStyle = PALETTE.water_deep;
                            }
                        }
                        ctx.fillRect(tx + x, ty + y, 2, 2);
                    }
                    break;
                    
                case 2:
                    let renderBorderBrown = false;
                    if (isOuterEdge) {
                        let distY = Math.min(row*ts + y, (MAP_SIZE * ts) - (row*ts + y));
                        let distX = Math.min(col*ts + x, (MAP_SIZE * ts) - (col*ts + x));
                        renderBorderBrown = (seed > (Math.min(distX, distY) / 18));
                    }

                    if (renderBorderBrown) {
                        ctx.fillStyle = PALETTE.border_brown;
                        ctx.fillRect(tx + x, ty + y, 2, 2);
                    } else {
                        if (touchesSand && (y > 24 || x < 8 || x > 24 || y < 8) && seed > 0.6) {
                            ctx.fillStyle = PALETTE.sand_light;
                            ctx.fillRect(tx + x, ty + y, 2, 2);
                        } else if (edges.bottom && edges.bottomId === 0 && y > 24 && seed > 0.5) {
                            ctx.fillStyle = PALETTE.sand_light;
                            ctx.fillRect(tx + x, ty + y, 2, 2);
                        } else if ((x - ts/2)*(x - ts/2) + (y - ts/2)*(y - ts/2) < 180) {
                            ctx.fillStyle = (seed > 0.4) ? PALETTE.palm_leaf : '#2a3f2c';
                            ctx.fillRect(tx + x, ty + y, 2, 2);
                        }
                    }
                    break;
                    
                case 3:
                    let renderPathSand = false;
                    if (edges.left && edges.leftId === 0 && x < 8)   renderPathSand = (seed > (x / 8));
                    if (edges.right && edges.rightId === 0 && x > 22) renderPathSand = (seed > ((ts - x) / 8));
                    if (edges.top && edges.topId === 0 && y < 8)   renderPathSand = (seed > (y / 8));
                    if (edges.bottom && edges.bottomId === 0 && y > 22) renderPathSand = (seed > ((ts - y) / 8));

                    if (renderPathSand) {
                        ctx.fillStyle = (seed > 0.5) ? PALETTE.sand_light : PALETTE.sand_dark;
                        ctx.fillRect(tx + x, ty + y, 2, 2);
                    } else {
                        if (y % 8 === 0 || (x + (Math.floor(y/8)%2)*8) % 16 === 0) {
                            ctx.fillStyle = PALETTE.roof_wood;
                            ctx.fillRect(tx + x, ty + y, 2, 2);
                        } else if (seed > 0.88) {
                            ctx.fillStyle = PALETTE.clay_light;
                            ctx.fillRect(tx + x, ty + y, 2, 2);
                        }
                    }
                    break;
                    
                case 4:
                    if (y % 6 === 0) { ctx.fillStyle = '#4a2f27'; ctx.fillRect(tx + x, ty + y, ts, 2); }
                    break;
                case 5:
                    let wallEdgeSand = false;
                    if (edges.left && edges.leftId === 0 && x < 6) wallEdgeSand = (seed > (x / 7));
                    if (edges.right && edges.rightId === 0 && x > 26) wallEdgeSand = (seed > ((ts - x) / 7));
                    if (edges.top && edges.topId === 0 && y < 6) wallEdgeSand = (seed > (y / 7));
                    if (edges.bottom && edges.bottomId === 0 && y > 26) wallEdgeSand = (seed > ((ts - y) / 7));
                    
                    if (wallEdgeSand) {
                        ctx.fillStyle = (seed > 0.5) ? PALETTE.sand_light : PALETTE.sand_dark;
                        ctx.fillRect(tx + x, ty + y, 2, 2);
                    } else if (y % 10 === 0) { 
                        ctx.fillStyle = PALETTE.clay_dark; 
                        ctx.fillRect(tx + x, ty + y, ts, 2); 
                    }
                    else if (seed > 0.7) { 
                        ctx.fillStyle = PALETTE.clay_light; 
                        ctx.fillRect(tx + x, ty + y, 2, 2); 
                    }
                    break;
                case 6:
                    if (seed > 0.45) { ctx.fillStyle = '#3a5a40'; ctx.fillRect(tx + x, ty + y, 2, 2); }
                    break;
            }
        }
    }
}

function updateTalkButtonState() {
    const talkButton = document.getElementById('btn-action');
    if (getFrontNPC()) {
        talkButton.className = 'active';
    } else {
        talkButton.className = 'disabled';
    }
}

function isWalkable(gx, gy) {
    if (gx < 0 || gx >= MAP_SIZE || gy < 0 || gy >= MAP_SIZE) return false;
    const tile = levelMap[gy][gx];
    if (tile === 1 || tile === 2 || tile === 4 || tile === 5 || tile === 6) return false;
    if (npcs.some(n => n.x === gx && n.y === gy)) return false;
    if (enemies.some(e => Math.floor(e.x) === gx && Math.floor(e.y) === gy)) return false;
    return true;
}

function movePlayer(dx, dy, dir) {
    player.facing = dir;
    if (isWalkable(player.x + dx, player.y + dy)) {
        player.x += dx;
        player.y += dy;
        player.isMoving = true;
    }
    updateTalkButtonState();
}

function triggerInteraction() {
    const targetNpc = getFrontNPC();
    if (targetNpc) {
        alert(`✨ EVENT TRIGGERED ✨\n\nYou successfully intercepted ${targetNpc.name} near ${targetNpc.location}!`);
        isDialogueOpen = true;
        setTimeout(() => {
            isDialogueOpen = false;
            player.invisibleUntil = Date.now() + INVISIBILITY_DURATION;
        }, 2000);
    }
}

function usePlayerAction(actionType) {
    if (actionType === 'prayer' && player.prayers > 0) {
        player.prayers--;
        enemies.forEach(e => {
            if (e.type === 'SADDUCEE' || e.type === 'PHARISEE') {
                e.stoppedUntil = Date.now() + 5000; // Stop for 5 seconds
            }
        });
    } else if (actionType === 'heal' && player.heals > 0) {
        player.heals--;
        enemies.forEach(e => {
            if (e.type === 'SOLDIER') e.stoppedUntil = Date.now() + 5000;
        });
    }
}

function handlePlayerArrested() {
    isDialogueOpen = true; // Pause enemy movement
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: black; opacity: 0; transition: opacity 0.2s; z-index: 500;';
    document.getElementById('game-container').appendChild(overlay);

    setTimeout(() => { overlay.style.opacity = '1'; }, 10);

    setTimeout(() => {
        player.x = player.startX;
        player.y = player.startY;
        player.invisibleUntil = Date.now() + INVISIBILITY_DURATION * 2; // Longer invisibility on respawn
        overlay.style.opacity = '0';
        setTimeout(() => {
            overlay.remove();
            isDialogueOpen = false;
        }, 200);
    }, 400);
}

document.getElementById('btn-try-again').addEventListener('click', () => location.reload());

window.addEventListener('keydown', e => {
    switch(e.key.toLowerCase()) {
        case 'arrowup':    case 'w': movePlayer(0, -1, 'up'); break;
        case 'arrowdown':  case 's': movePlayer(0, 1, 'down'); break;
        case 'arrowleft':  case 'a': movePlayer(-1, 0, 'left'); break;
        case 'arrowright': case 'd': movePlayer(1, 0, 'right'); break;
        case ' ': case 'enter': e.preventDefault(); triggerInteraction(); break;
    }
});

let isDialogueOpen = false;

const talkButton = document.getElementById('btn-action');
document.getElementById('btn-up').addEventListener('pointerdown', (e) => { e.preventDefault(); movePlayer(0, -1, 'up'); });
document.getElementById('btn-down').addEventListener('pointerdown', (e) => { e.preventDefault(); movePlayer(0, 1, 'down'); });
document.getElementById('btn-left').addEventListener('pointerdown', (e) => { e.preventDefault(); movePlayer(-1, 0, 'left'); });
document.getElementById('btn-right').addEventListener('pointerdown', (e) => { e.preventDefault(); movePlayer(1, 0, 'right'); });
talkButton.addEventListener('pointerdown', (e) => { e.preventDefault(); triggerInteraction(); });
document.getElementById('btn-action-prayer').addEventListener('pointerdown', (e) => { e.preventDefault(); usePlayerAction('prayer'); });
document.getElementById('btn-action-heal').addEventListener('pointerdown', (e) => { e.preventDefault(); usePlayerAction('heal'); });

function drawCustomPatternSprite(ctx, startX, startY, size, bounce, isPlayer, facing, camX, camY) {
    const q = size / 4; 
    const sx = startX - camX;
    const sy = startY - bounce - camY;

    for (let i = 0; i < 4; i++) {
        if (isPlayer) {
            ctx.globalAlpha = (Date.now() < player.invisibleUntil) ? 0.5 : 1.0;
            ctx.fillStyle = (i === 1) ? PALETTE.pattern_brown : PALETTE.sky_blue;
        }
        else ctx.fillStyle = (i === 1) ? PALETTE.pattern_brown : PALETTE.sprite_white;
        ctx.fillRect(sx, sy + (i * q), size, q);
    }

    ctx.fillStyle = '#ffffff'; 
    let eyeY = sy + q + 2; 
    let eX1 = sx + 4;
    let eX2 = sx + 14;
    if (facing === 'left')  { eX1 -= 2; eX2 -= 2; }
    if (facing === 'right') { eX1 += 2; eX2 += 2; }
    if (facing === 'up')    eyeY -= 2; 

    ctx.fillRect(eX1, eyeY, 4, 4);
    ctx.fillRect(eX2, eyeY, 4, 4);

    ctx.fillStyle = '#000000';
    let pupilX1 = eX1 + 1;
    let pupilX2 = eX2 + 1;
    if (facing === 'right') { pupilX1 += 1; pupilX2 += 1; }
    if (facing === 'left')  { pupilX1 -= 1; pupilX2 -= 1; }
    ctx.fillRect(pupilX1, eyeY + 1, 2, 2);
    ctx.fillRect(pupilX2, eyeY + 1, 2, 2);
    ctx.globalAlpha = 1.0;
}

function drawNPCNameTag(ctx, npc, bounce, camX, camY) {
    const nx = npc.x * TILE_SIZE + TILE_SIZE / 2 - camX;
    const ny = npc.y * TILE_SIZE - bounce - camY - 8;
    
    ctx.font = 'bold 11px monospace';
    const textWidth = ctx.measureText(npc.name).width;
    const padX = 6;
    const padY = 4;
    
    ctx.fillStyle = 'rgba(26, 20, 16, 0.85)';
    ctx.strokeStyle = '#00f5d4';
    ctx.lineWidth = 1;
    
    ctx.fillRect(nx - textWidth / 2 - padX, ny - 10 - padY, textWidth + padX * 2, 14 + padY * 2);
    ctx.strokeRect(nx - textWidth / 2 - padX, ny - 10 - padY, textWidth + padX * 2, 14 + padY * 2);
    
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText(npc.name, nx, ny + 3);
}

function drawEnemySprite(ctx, enemy, camX, camY) {
    const ts = TILE_SIZE;
    const sx = enemy.renderX - camX;
    const sy = enemy.renderY - camY;
    const type = enemy.type;
    
    ctx.save();
    
    if (type === 'SOLDIER') {
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(sx + 6, sy + 10, ts - 12, ts - 14);
        ctx.fillStyle = '#991b1b';
        ctx.fillRect(sx + 8, sy + 12, ts - 16, ts - 18);
        ctx.fillStyle = '#fca5a5';
        ctx.fillRect(sx + 10, sy + 4, ts - 20, 8);
        ctx.fillStyle = '#7f8c8d';
        ctx.fillRect(sx + 8, sy + 2, ts - 16, 5);
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(sx + 12, sy - 3, 4, 6);
        ctx.fillStyle = '#95a5a6';
        ctx.fillRect(sx + ts - 12, sy + 14, 8, 10);
        ctx.fillStyle = '#f5cba7';
        ctx.fillRect(sx + 12, sy + 6, 4, 4);
        ctx.fillRect(sx + ts - 16, sy + 6, 4, 4);
    } else if (type === 'SADDUCEE') {
        ctx.fillStyle = '#9333ea';
        ctx.fillRect(sx + 8, sy + 8, ts - 16, ts - 12);
        ctx.fillStyle = '#6b21a8';
        ctx.fillRect(sx + 10, sy + 10, ts - 20, ts - 16);
        ctx.fillStyle = '#f5cba7';
        ctx.fillRect(sx + 12, sy + 4, ts - 24, 7);
        ctx.fillStyle = '#4a235a';
        ctx.fillRect(sx + 14, sy - 5, ts - 28, 10);
        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(sx + 4, sy + 14, 6, 8);
        ctx.fillStyle = '#f5cba7';
        ctx.fillRect(sx + 14, sy + 6, 4, 3);
        ctx.fillRect(sx + ts - 18, sy + 6, 4, 3);
    } else if (type === 'PHARISEE') {
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(sx + 6, sy + 8, ts - 12, ts - 12);
        ctx.fillStyle = '#0369a1';
        ctx.fillRect(sx + 8, sy + 10, ts - 16, ts - 16);
        ctx.fillStyle = '#f5cba7';
        ctx.fillRect(sx + 10, sy + 3, ts - 20, 8);
        ctx.fillStyle = '#1e40af';
        ctx.fillRect(sx + 12, sy - 4, ts - 24, 8);
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(sx + 4, sy + 14, ts - 8, 3);
        ctx.fillStyle = '#f5cba7';
        ctx.fillRect(sx + 12, sy + 5, 4, 3);
        ctx.fillRect(sx + ts - 16, sy + 5, 4, 3);
    }
    
    ctx.restore();
}

function drawTrackingMinimap(ctx, time) {
    const mRadius = 48; 
    const cx = VIEW_WIDTH - mRadius - 16; 
    const cy = mRadius + 16;
    const pSize = (mRadius * 2) / MAP_SIZE; 

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, mRadius + 3, 0, Math.PI * 2);
    ctx.fillStyle = '#2c2219';
    ctx.strokeStyle = '#d4a373';
    ctx.lineWidth = 3;
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, mRadius, 0, Math.PI * 2);
    ctx.clip();

    ctx.fillStyle = '#120f0d';
    ctx.fillRect(cx - mRadius, cy - mRadius, mRadius * 2, mRadius * 2);

    ctx.strokeStyle = 'rgba(212, 163, 115, 0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, mRadius * 0.4, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, mRadius * 0.7, 0, Math.PI * 2); ctx.stroke();

    const startX = cx - mRadius;
    const startY = cy - mRadius;

    for (let r = 0; r < MAP_SIZE; r++) {
        for (let c = 0; c < MAP_SIZE; c++) {
            const id = levelMap[r][c];
            if (id === 3) {
                ctx.fillStyle = 'rgba(233, 196, 106, 0.35)';
                ctx.fillRect(startX + (c * pSize), startY + (r * pSize), pSize, pSize);
            } else if (id === 1) {
                // Highlight the expanded water pool inside radar displays in a distinctive blue tint
                ctx.fillStyle = 'rgba(32, 72, 89, 0.6)';
                ctx.fillRect(startX + (c * pSize), startY + (r * pSize), pSize, pSize);
            } else if (id === 5 || id === 4 || id === 2) {
                ctx.fillStyle = '#1c1510';
                ctx.fillRect(startX + (c * pSize), startY + (r * pSize), pSize, pSize);
            }
        }
    }

    npcs.forEach(n => {
        ctx.beginPath();
        ctx.arc(startX + (n.x * pSize) + pSize/2, startY + (n.y * pSize) + pSize/2, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = '#ff0055'; 
        ctx.fill();
    });

    let playerPulse = Math.abs(Math.sin(time / 180)) * 1.5;
    ctx.beginPath();
    ctx.arc(startX + (player.x * pSize) + pSize/2, startY + (player.y * pSize) + pSize/2, 2.5 + playerPulse, 0, Math.PI * 2);
    ctx.fillStyle = PALETTE.sky_blue; 
    ctx.fill();

    let sweepAngle = (time * 0.0025) % (Math.PI * 2);
    let sweepLX = cx + Math.cos(sweepAngle) * mRadius;
    let sweepLY = cy + Math.sin(sweepAngle) * mRadius;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(sweepLX, sweepLY);
    ctx.strokeStyle = 'rgba(0, 245, 212, 0.3)'; 
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
}

function mainLoop() {
    if (gameOver) return;

    const time = Date.now();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let targetX = player.x * TILE_SIZE;
    let targetY = player.y * TILE_SIZE;
    
    player.renderX += (targetX - player.renderX) * 0.18;
    player.renderY += (targetY - player.renderY) * 0.18;
    
    if (Math.abs(targetX - player.renderX) < 0.2 && Math.abs(targetY - player.renderY) < 0.2) {
        player.renderX = targetX;
        player.renderY = targetY;
        player.isMoving = false;
    }

    let targetCamX = player.renderX - VIEW_WIDTH / 2 + TILE_SIZE / 2;
    let targetCamY = player.renderY - VIEW_HEIGHT / 2 + TILE_SIZE / 2;
    
    camera.x += (targetCamX - camera.x) * 0.1;
    camera.y += (targetCamY - camera.y) * 0.1;

    camera.x = Math.max(0, Math.min(camera.x, MAP_SIZE * TILE_SIZE - VIEW_WIDTH));
    camera.y = Math.max(0, Math.min(camera.y, MAP_SIZE * TILE_SIZE - VIEW_HEIGHT));

    let startCol = Math.floor(camera.x / TILE_SIZE);
    let endCol = Math.min(MAP_SIZE - 1, Math.ceil((camera.x + VIEW_WIDTH) / TILE_SIZE));
    let startRow = Math.floor(camera.y / TILE_SIZE);
    let endRow = Math.min(MAP_SIZE - 1, Math.ceil((camera.y + VIEW_HEIGHT) / TILE_SIZE));

    for (let r = startRow; r <= endRow; r++) {
        for (let c = startCol; c <= endCol; c++) {
            renderTile(ctx, levelMap[r][c], c, r, time, camera.x, camera.y);
        }
    }

    updateEnemies();

    const activeTargetNPC = getFrontNPC();

    npcs.forEach(n => {
        let bounce = Math.abs(Math.sin((time / 200) + n.animOffset)) * 4;
        let nx = n.x * TILE_SIZE;
        let ny = n.y * TILE_SIZE;

        ctx.fillStyle = 'rgba(26, 20, 16, 0.4)';
        ctx.fillRect(nx + 4 - camera.x, ny + 28 - camera.y, TILE_SIZE - 8, 4);
        drawCustomPatternSprite(ctx, nx + 4, ny + 4, TILE_SIZE - 8, bounce, false, 'down', camera.x, camera.y);
        
        if (n === activeTargetNPC) {
            drawNPCNameTag(ctx, n, bounce, camera.x, camera.y);
        }
    });

    let walkBounce = player.isMoving ? Math.abs(Math.sin(time * 0.015)) * 5 : 0;
    drawCustomPatternSprite(ctx, player.renderX + 4, player.renderY + 4, TILE_SIZE - 8, walkBounce, true, player.facing, camera.x, camera.y);

    enemies.forEach(enemy => {
        let bounce = enemy.isMoving ? Math.abs(Math.sin((time / 150) + enemy.x)) * 4 : 0;
        drawEnemySprite(ctx, enemy, camera.x, camera.y);

        if (Date.now() < enemy.stoppedUntil || enemy.state === 'stopped') {
            ctx.fillStyle = 'rgba(0, 255, 255, 0.7)';
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('Zzz', enemy.renderX + TILE_SIZE/2 - camera.x, enemy.renderY - bounce - camera.y - 5);
        }

        if (Date.now() > player.invisibleUntil && Math.abs(player.x - enemy.x) < 0.8 && Math.abs(player.y - enemy.y) < 0.8) {
            player.lives--;
            updateLivesDisplay();
            if (player.lives <= 0) {
                gameOver = true;
                document.getElementById('game-over-screen').style.display = 'flex';
            } else {
                handlePlayerArrested();
            }
        }
    });

    ctx.fillStyle = '#dfb24c'; 
    particles.forEach(p => {
        p.x -= p.speed;
        p.y += p.speed * 0.5;
        if (p.x < -10) { p.x = VIEW_WIDTH + 10; p.y = Math.random() * VIEW_HEIGHT; }
        if (p.y > VIEW_HEIGHT + 10) { p.y = -10; p.x = Math.random() * VIEW_WIDTH; }
        ctx.globalAlpha = p.opacity;
        ctx.fillRect(p.x, p.y, p.size * 2, p.size);
    });
    ctx.globalAlpha = 1.0;

    drawTrackingMinimap(ctx, time);

    requestAnimationFrame(mainLoop);
}

requestAnimationFrame(mainLoop);
</script>
