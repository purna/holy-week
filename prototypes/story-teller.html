<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Before the Rooster Crows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0d1b2a; --bg2:#1b3a4b; --accent:#ff8c42; --accent2:#ffd166;
    --ink:#f4ead9; --panel-bg: rgba(12,16,28,0.55);
    --dur: .6s;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    font-family:'Fredoka', sans-serif; color:var(--ink);
    background:#0d1b2a;
  }
  body{
    background: radial-gradient(120% 140% at 20% 0%, var(--bg2) 0%, var(--bg1) 60%);
    transition: background var(--dur) ease;
  }

  /* ---------- title screen ---------- */
  #title-screen{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:2rem;
    background: radial-gradient(120% 140% at 50% 20%, #1b3a4b 0%, #0a1420 70%);
    transition: opacity .8s ease, visibility .8s;
  }
  #title-screen.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  #title-screen h1{
    font-family:'Cinzel', serif; font-weight:900; font-size: clamp(2rem, 6vw, 4rem);
    margin:0 0 .3em; letter-spacing:.02em;
    background: linear-gradient(90deg, #ffd166, #ff8c42);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 0 24px rgba(255,140,66,.35));
  }
  #title-screen p{ font-size:1.1rem; opacity:.85; max-width:32em; line-height:1.5; margin:0 0 2.2em;}
  .rooster-mark{ font-size:3rem; margin-bottom:.4em; animation: bob 3s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(-3deg);} 50%{transform:translateY(-10px) rotate(3deg);} }

  .btn{
    font-family:'Fredoka', sans-serif; font-weight:600; font-size:1.05rem;
    border:none; cursor:pointer; color:#1b1206;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    padding:.9em 2em; border-radius:100px;
    box-shadow: 0 6px 0 rgba(0,0,0,.25), 0 10px 24px rgba(255,140,66,.35);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{ transform: translateY(-2px); box-shadow: 0 8px 0 rgba(0,0,0,.25), 0 14px 28px rgba(255,140,66,.45);}
  .btn:active{ transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.25);}

  /* ---------- story stage ---------- */
  #stage{ position:fixed; inset:0; opacity:0; transition:opacity .8s ease; }
  #stage.visible{ opacity:1; }

  #chapter-banner{
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; padding-top: 2.4vh;
    pointer-events:none; text-align:center;
  }
  #chapter-eyebrow{
    font-family:'Cinzel',serif; font-size:.78rem; letter-spacing:.35em; text-transform:uppercase;
    color:var(--accent2); opacity:.85; margin-bottom:.3em;
  }
  #chapter-title{
    font-family:'Cinzel', serif; font-weight:700; font-size: clamp(1.1rem, 3vw, 2rem);
    text-shadow: 0 2px 18px rgba(0,0,0,.6);
  }

  #track{
    height:100%; display:flex; overflow-x:hidden; scroll-behavior:auto;
  }
  .panel{
    min-width:100vw; height:100%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    padding: 4vh 6vw; position:relative;
  }
  .card{
    max-width: 640px; width:100%;
    background: var(--panel-bg);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 28px;
    padding: 2.4em 2.2em;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    opacity:0; transform: translateY(18px) scale(.98);
    transition: opacity .5s ease, transform .5s ease;
  }
  .panel.active .card{ opacity:1; transform:translateY(0) scale(1); }

  .speaker{
    font-family:'Cinzel', serif; font-weight:700; font-size:.95rem; letter-spacing:.12em;
    text-transform:uppercase; margin-bottom:.5em; display:inline-block;
    padding:.25em .9em; border-radius:100px;
  }
  .speaker.narrator{ color:#c9c2b4; font-style:italic; letter-spacing:.08em; background:none; padding:0;}
  .speaker.peter{ color:#1b1206; background:linear-gradient(90deg,#ffb56b,#ff7a45); }
  .speaker.jesus{ color:#3a2c0d; background:linear-gradient(90deg,#fff3c9,#ffd166); }
  .speaker.john{ color:#092b2b; background:linear-gradient(90deg,#8fe3d8,#4bb7ab); }
  .speaker.voice{ color:#2c1b3a; background:linear-gradient(90deg,#e0c9ff,#b98cf0); }

  .line-text{
    font-size: clamp(1.15rem, 2.4vw, 1.6rem); line-height:1.5; font-weight:500;
  }
  .line-text.narrator-text{ font-style:italic; opacity:.9; }
  .flavor{
    font-size:.95rem; opacity:.75; font-style:italic; margin-bottom:.6em; display:block;
  }

  /* choice buttons */
  .choice-row{ display:flex; gap:.8em; margin-top:1.4em; flex-wrap:wrap; }
  .choice-btn{
    font-family:'Fredoka'; font-weight:600; font-size:1rem; cursor:pointer;
    background: rgba(255,255,255,.08); color:var(--ink);
    border:1.5px solid rgba(255,255,255,.25); border-radius:16px;
    padding:.8em 1.3em; transition: all .15s ease; flex:1; min-width:140px;
  }
  .choice-btn:hover{ background: rgba(255,255,255,.18); border-color:var(--accent2); transform: translateY(-2px); }
  .choice-btn:disabled{ opacity:.4; cursor:default; transform:none; }

  .continue-hint{
    margin-top:1.2em; font-size:.85rem; opacity:.6; display:flex; align-items:center; gap:.4em;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:.4;} 50%{opacity:.9;} }

  /* end-of-act panel */
  .end-card{ text-align:center; }
  .end-card .chapter-close{ font-family:'Cinzel',serif; font-size:1.4rem; margin-bottom:.6em; }
  .end-card p{ opacity:.8; margin-bottom:1.6em; }

  /* ---------- nav controls ---------- */
  .edge-btn{
    position:absolute; top:0; bottom:0; width:14%; z-index:15;
    background:none; border:none; cursor:pointer;
    display:flex; align-items:center; color:var(--ink); opacity:0;
    transition:opacity .25s ease;
  }
  .edge-btn:hover, .edge-btn:focus-visible{ opacity:.9; }
  .edge-btn.left{ left:0; justify-content:flex-start; padding-left:1vw; }
  .edge-btn.right{ right:0; justify-content:flex-end; padding-right:1vw; }
  .edge-btn svg{ width:34px; height:34px; filter: drop-shadow(0 2px 8px rgba(0,0,0,.6)); }

  /* ---------- progress thread ---------- */
  #thread-wrap{
    position:absolute; left:0; right:0; bottom: 3.2vh; z-index:20;
    display:flex; flex-direction:column; align-items:center; pointer-events:none;
  }
  #thread{ position:relative; width:min(70vw,520px); height:2px; background:rgba(255,255,255,.2); border-radius:2px; }
  #thread-fill{ position:absolute; left:0; top:0; height:100%; background:var(--accent2); border-radius:2px; transition: width .4s ease; }
  #thread-marker{
    position:absolute; top:50%; transform:translate(-50%,-50%); font-size:1.1rem;
    transition: left .4s ease; filter: drop-shadow(0 0 6px rgba(255,209,102,.7));
  }
  #act-dots{ display:flex; gap:.5em; margin-top:.7em; }
  .act-dot{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.25); transition: background .3s ease, transform .3s ease; }
  .act-dot.done{ background:var(--accent2); }
  .act-dot.current{ background:var(--accent); transform:scale(1.4); }

  /* particles */
  #particles{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:5; }
  .particle{
    position:absolute; bottom:-5%; border-radius:50%; opacity:.7;
    animation: rise linear infinite;
  }
  @keyframes rise{
    0%{ transform: translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.8; }
    100%{ transform: translateY(-110vh) translateX(var(--drift,20px)); opacity:0; }
  }

  @media (max-width: 640px){
    .edge-btn{ width:20%; }
    .card{ padding:1.8em 1.4em; border-radius:20px; }
  }

  @media (prefers-reduced-motion: reduce){
    .particle, .rooster-mark, .continue-hint{ animation:none !important; }
    .card{ transition:none; }
  }
</style>
</head>
<body>

<div id="title-screen">
  <div class="rooster-mark">🐓</div>
  <h1>Before the Rooster Crows</h1>
  <p>A story about running away, getting caught, and getting a second chance.<br>
  Scroll or tap the arrows to move through each chapter — the story will still find its way, no matter what you choose.</p>
  <button class="btn" id="start-btn">Begin the Story</button>
</div>

<div id="stage">
  <div id="particles"></div>
  <div id="chapter-banner">
    <div id="chapter-eyebrow">Act <span id="act-num">1</span> — <span id="act-label">Dialogue Escaping</span></div>
    <div id="chapter-title">The Garden Runs Wild</div>
  </div>

  <button class="edge-btn left" id="prev-btn" aria-label="Previous">
    <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="edge-btn right" id="next-btn" aria-label="Next">
    <svg viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div id="track"></div>

  <div id="thread-wrap">
    <div id="thread">
      <div id="thread-fill"></div>
      <div id="thread-marker">🐓</div>
    </div>
    <div id="act-dots"></div>
  </div>
</div>

<script>
(function(){

  const MOODS = {
    escape:   { bg1:'#0d1b2a', bg2:'#1b3a4b', accent:'#ff8c42', accent2:'#ffd166', particle:'#ffd166', shape:'circle' },
    trapped:  { bg1:'#210a0a', bg2:'#4a1a1a', accent:'#e85d4a', accent2:'#ffb199', particle:'#ff9166', shape:'circle' },
    mission:  { bg1:'#7a3d1e', bg2:'#ffb15e', accent:'#0f5e5a', accent2:'#ffe9b0', particle:'#fff4d6', shape:'circle' },
    reflect:  { bg1:'#241a3d', bg2:'#5c4e86', accent:'#a58bd8', accent2:'#f4ead9', particle:'#e7defc', shape:'circle' }
  };

  const ACTS = [
    {
      key:'escape', label:'Dialogue Escaping', title:'The Garden Runs Wild',
      lines:[
        {speaker:'narrator', text:"Midnight in the garden of Gethsemane. The olive trees stand still — until they don't."},
        {speaker:'narrator', text:'Torchlight flickers through the branches. Boots pound against soft earth.'},
        {speaker:'john', text:'Peter — soldiers! Run!'},
        {speaker:'peter', text:"I'm not leaving him. Not tonight."},
        {speaker:'narrator', text:'But the crowd surges forward, swords catching the moonlight, and even the boldest feet start moving.'},
        {speaker:'peter', text:'...Wait for me!'},
        {speaker:'narrator', text:'One by one, the disciples scatter into the dark like startled sparrows. Only Peter turns back to look.'}
      ]
    },
    {
      key:'trapped', label:'Feeling Trapped', title:'Circle of Firelight',
      lines:[
        {speaker:'narrator', text:"Peter follows at a distance, slipping into the high priest's courtyard where guards warm their hands by a fire."},
        {speaker:'narrator', text:'He sits. He waits. He tries very hard to look like he belongs.'},
        {speaker:'voice', text:"Wait... I know you. You were with him — the Nazarene."},
        {type:'choice',
          prompt:'What does Peter do?',
          options:[
            {label:'Shrug it off', flavor:'He shrugs, keeping his eyes on the fire.'},
            {label:'Look away fast', flavor:'He turns his face from the light.'}
          ],
          result:{speaker:'peter', text:"Woman, I don't know him."}
        },
        {speaker:'narrator', text:'The words are out before he can stop them. Denial number one.'},
        {speaker:'voice', text:"You're one of them too — I saw you!"},
        {type:'choice',
          prompt:'What does Peter do this time?',
          options:[
            {label:'Stay very quiet', flavor:'He presses his lips shut, heart hammering.'},
            {label:'Speak up fast', flavor:'He answers before he can think better of it.'}
          ],
          result:{speaker:'peter', text:'I am NOT one of them.'}
        },
        {speaker:'narrator', text:'Denial number two. The fire crackles like it knows something.'},
        {speaker:'voice', text:"Surely you're one of them — you even talk like a Galilean!"},
        {type:'choice',
          prompt:'One more time — what does Peter do?',
          options:[
            {label:'Deny it calmly', flavor:'He forces his voice to stay level.'},
            {label:'Deny it loudly', flavor:'He raises his voice so everyone can hear.'}
          ],
          result:{speaker:'peter', text:"I don't know the man! I swear it!"}
        },
        {speaker:'narrator', text:'Far off, a rooster crows into the grey morning. Peter freezes mid-breath.'},
        {speaker:'narrator', text:'Across the courtyard, Jesus turns. For one second, their eyes meet.'},
        {speaker:'narrator', text:'Peter walks out into the dark alone, and finally lets himself cry.'}
      ]
    },
    {
      key:'mission', label:'The Mission', title:'Fish, Fire, and a Second Chance',
      lines:[
        {speaker:'narrator', text:"Weeks later. Dawn breaks pink over the Sea of Galilee. Peter's back to fishing — nets empty, same as always."},
        {speaker:'voice', text:'Friends — have you caught anything?'},
        {speaker:'peter', text:'Not a thing, all night.'},
        {speaker:'voice', text:'Try the other side of the boat.'},
        {speaker:'narrator', text:'They do. The net fills so fast it nearly tears apart.'},
        {speaker:'john', text:"Peter... it's him."},
        {speaker:'narrator', text:"Peter doesn't wait for the boat. He jumps straight into the water, clothes and all."},
        {speaker:'jesus', text:'Simon, son of John — do you love me?'},
        {speaker:'peter', text:'Yes, Lord. You know I do.'},
        {speaker:'jesus', text:'Then feed my sheep.'},
        {speaker:'narrator', text:'Three questions by the fire. Three answers. Three denials, undone one at a time.'},
        {speaker:'jesus', text:'Follow me.'}
      ]
    },
    {
      key:'reflect', label:'Reflection', title:'What the Water Remembers',
      lines:[
        {speaker:'narrator', text:'The sun climbs higher. The fire crackles low — same as that other fire, weeks ago.'},
        {speaker:'peter', text:"I said I didn't know you. Three times."},
        {speaker:'narrator', text:"But the tide doesn't ask what you did last night — only what you'll do with today."},
        {speaker:'peter', text:'Feed your sheep. I can do that.'},
        {speaker:'narrator', text:'And for the rest of his life, that is exactly what he did.'}
      ]
    }
  ];

  let actIndex = 0, lineIndex = 0;
  let panelsMeta = []; // {resolved:bool} for choice panels
  const track = document.getElementById('track');
  const stage = document.getElementById('stage');
  const titleScreen = document.getElementById('title-screen');
  const chapterEyebrow = document.getElementById('act-num');
  const actLabel = document.getElementById('act-label');
  const chapterTitle = document.getElementById('chapter-title');
  const threadFill = document.getElementById('thread-fill');
  const threadMarker = document.getElementById('thread-marker');
  const actDotsEl = document.getElementById('act-dots');

  function setMood(key){
    const m = MOODS[key];
    document.documentElement.style.setProperty('--bg1', m.bg1);
    document.documentElement.style.setProperty('--bg2', m.bg2);
    document.documentElement.style.setProperty('--accent', m.accent);
    document.documentElement.style.setProperty('--accent2', m.accent2);
    document.body.style.background = `radial-gradient(120% 140% at 20% 0%, ${m.bg2} 0%, ${m.bg1} 60%)`;
    spawnParticles(m.particle);
  }

  function spawnParticles(color){
    const holder = document.getElementById('particles');
    holder.innerHTML = '';
    const count = window.innerWidth < 640 ? 12 : 22;
    for(let i=0;i<count;i++){
      const p = document.createElement('span');
      p.className='particle';
      const size = 3 + Math.random()*5;
      p.style.width = size+'px'; p.style.height = size+'px';
      p.style.left = (Math.random()*100)+'%';
      p.style.background = color;
      p.style.setProperty('--drift', (Math.random()*60-30)+'px');
      p.style.animationDuration = (7+Math.random()*8)+'s';
      p.style.animationDelay = (Math.random()*10)+'s';
      holder.appendChild(p);
    }
  }

  function buildActDots(){
    actDotsEl.innerHTML = '';
    ACTS.forEach((a,i)=>{
      const d = document.createElement('div');
      d.className = 'act-dot' + (i<actIndex?' done':'') + (i===actIndex?' current':'');
      actDotsEl.appendChild(d);
    });
  }

  function renderAct(){
    const act = ACTS[actIndex];
    setMood(act.key);
    chapterEyebrow.textContent = actIndex+1;
    actLabel.textContent = act.label;
    chapterTitle.textContent = act.title;
    buildActDots();

    track.innerHTML = '';
    panelsMeta = [];
    lineIndex = 0;

    act.lines.forEach((line, i)=>{
      const panel = document.createElement('div');
      panel.className = 'panel';
      panel.dataset.index = i;

      if(line.type === 'choice'){
        panel.innerHTML = renderChoiceCard(line);
        panelsMeta.push({resolved:false, isChoice:true});
      } else {
        panel.innerHTML = renderLineCard(line);
        panelsMeta.push({resolved:true, isChoice:false});
      }
      track.appendChild(panel);
    });

    // end-of-act panel
    const endPanel = document.createElement('div');
    endPanel.className = 'panel';
    const isLast = actIndex === ACTS.length - 1;
    endPanel.innerHTML = `
      <div class="card end-card">
        <div class="chapter-close">${isLast ? 'The End' : 'End of Chapter '+(actIndex+1)}</div>
        <p>${isLast ? 'Thanks for reading Peter\'s story all the way to the sunrise.' : 'The story is ready to move on, whenever you are.'}</p>
        <button class="btn" id="cta-btn">${isLast ? 'Read It Again' : 'Next Chapter →'}</button>
      </div>`;
    panelsMeta.push({resolved:true, isChoice:false, isEnd:true});
    track.appendChild(endPanel);

    document.getElementById('cta-btn').addEventListener('click', ()=>{
      if(isLast){
        actIndex = 0;
        renderAct();
        goTo(0);
      } else {
        actIndex++;
        renderAct();
        goTo(0);
      }
    });

    goTo(0, true);
  }

  function renderLineCard(line){
    const isNarrator = line.speaker === 'narrator';
    return `
      <div class="card">
        ${isNarrator ? `<span class="speaker narrator">Narrator</span>` : `<span class="speaker ${line.speaker}">${labelFor(line.speaker)}</span>`}
        <div class="line-text ${isNarrator?'narrator-text':''}">${line.text}</div>
      </div>`;
  }

  function renderChoiceCard(line){
    return `
      <div class="card">
        <span class="speaker voice">?</span>
        <div class="line-text">${line.prompt}</div>
        <div class="choice-row">
          ${line.options.map((o,idx)=>`<button class="choice-btn" data-choice="${idx}">${o.label}</button>`).join('')}
        </div>
      </div>`;
  }

  function labelFor(speaker){
    const map = {peter:'Peter', jesus:'Jesus', john:'John', voice:'A Voice'};
    return map[speaker] || speaker;
  }

  function resolveChoice(panel, line, choiceIdx){
    const opt = line.options[choiceIdx];
    panel.querySelector('.card').innerHTML = `
      <span class="speaker ${line.result.speaker}">${labelFor(line.result.speaker)}</span>
      <span class="flavor">${opt.flavor}</span>
      <div class="line-text">${line.result.text}</div>
      <div class="continue-hint">Scroll or tap right to continue →</div>`;
    const idx = parseInt(panel.dataset.index,10);
    panelsMeta[idx].resolved = true;
  }

  track.addEventListener('click', (e)=>{
    if(e.target.matches('.choice-btn')){
      const panel = e.target.closest('.panel');
      const idx = parseInt(panel.dataset.index,10);
      const line = ACTS[actIndex].lines[idx];
      resolveChoice(panel, line, e.target.dataset.choice);
      setTimeout(()=> goNext(), 550);
    }
  });

  function updateThread(){
    const total = panelsMeta.length - 1;
    const pct = total > 0 ? (lineIndex/total)*100 : 0;
    threadFill.style.width = pct+'%';
    threadMarker.style.left = pct+'%';
    document.querySelectorAll('.panel').forEach((p,i)=> p.classList.toggle('active', i===lineIndex));
  }

  function goTo(idx, instant){
    idx = Math.max(0, Math.min(panelsMeta.length-1, idx));
    lineIndex = idx;
    track.scrollTo({ left: idx * window.innerWidth, behavior: instant ? 'auto' : 'smooth' });
    updateThread();
  }

  function goNext(){
    if(panelsMeta[lineIndex] && panelsMeta[lineIndex].isChoice && !panelsMeta[lineIndex].resolved) return;
    if(lineIndex < panelsMeta.length - 1) goTo(lineIndex+1);
  }
  function goPrev(){
    if(lineIndex > 0) goTo(lineIndex-1);
  }

  // --- input handling ---
  document.getElementById('next-btn').addEventListener('click', goNext);
  document.getElementById('prev-btn').addEventListener('click', goPrev);

  window.addEventListener('keydown', (e)=>{
    if(titleScreen && !titleScreen.classList.contains('hidden')) return;
    if(e.key === 'ArrowRight') goNext();
    if(e.key === 'ArrowLeft') goPrev();
  });

  let wheelLock = false;
  stage.addEventListener('wheel', (e)=>{
    e.preventDefault();
    if(wheelLock) return;
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if(Math.abs(delta) < 12) return;
    wheelLock = true;
    if(delta > 0) goNext(); else goPrev();
    setTimeout(()=> wheelLock = false, 420);
  }, {passive:false});

  let touchStartX = null;
  stage.addEventListener('touchstart', (e)=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
  stage.addEventListener('touchend', (e)=>{
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40){ dx < 0 ? goNext() : goPrev(); }
    touchStartX = null;
  }, {passive:true});

  window.addEventListener('resize', ()=> goTo(lineIndex, true));

  document.getElementById('start-btn').addEventListener('click', ()=>{
    titleScreen.classList.add('hidden');
    stage.classList.add('visible');
    renderAct();
  });

})();
</script>
</body>
</html>
