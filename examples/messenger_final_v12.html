<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Messenger 3D - Dual UI Stable</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
     <style>



/* ===== VARIABLES ===== */ 
:root {
    --bg-main: #010105;
    --panel-bg: rgba(0, 10, 20, 0.88);
    --accent-primary: #00f2ff;
    --accent-secondary: #ffaa00;
    --accent-success: #00ffaa;
    --text-main: #ffffff;
    --glow-soft: 0 0 10px rgba(0,242,255,0.3);
    --glow-strong: 0 0 20px rgba(0,242,255,0.6);
    --shadow-panel: 0 8px 25px rgba(0,0,0,0.6);
}

/* ===== BASE ===== */
body {
    margin: 0;
    overflow: hidden;
    background: var(--bg-main);
    font-family: 'Courier New', monospace;
    text-transform: uppercase;
    user-select: none;
}

/* ===== PANELS ===== */
.panel {
    color: var(--text-main);
    background: var(--panel-bg);
    padding: 12px;
    border: 1px solid var(--accent-primary);
    backdrop-filter: blur(10px);
    width: 200px;
    transform-origin: right center;
    transform: scale(0.85);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.25s ease, opacity 0.2s ease;
    box-shadow: var(--shadow-panel), var(--glow-soft);
}
.panel.open {
    transform: scale(1);
    opacity: 1;
    pointer-events: auto;
}
#panel-quest { border-right: 4px solid var(--accent-primary); }
#panel-inv { border-right: 4px solid var(--accent-secondary); }

#inv-anchor { position: relative; }
#panel-inv {
    position: absolute;
    bottom: calc(100% + 10px);
    right: 0;
}

/* ===== BUTTONS ===== */
.ui-toggle {
    padding: 12px 16px;
    background: rgba(0,10,20,0.8);
    border: 1px solid var(--accent-primary);
    color: var(--accent-primary);
    cursor: pointer;
    font-size: 1.2em;
    border-radius: 4px;
    transition: transform 0.12s ease, background 0.2s, box-shadow 0.2s;
    box-shadow: var(--glow-soft);
}
.ui-toggle:hover {
    background: rgba(0,242,255,0.2);
    box-shadow: var(--glow-strong);
}
.ui-toggle:active {
    transform: scale(0.9);
}
.ui-toggle.active {
    background: rgba(0,242,255,0.3);
    border-color: var(--accent-success);
    color: var(--accent-success);
}

/* ===== SIDEBAR ===== */
#right-sidebar {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px;
    pointer-events: none;
    z-index: 500;
}
#sidebar-top, #sidebar-bottom {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    pointer-events: auto;
}
.sidebar-row {
    display: flex;
    gap: 8px;
}

/* ===== TEXT ===== */
h3 {
    margin: 0 0 10px 0;
    font-size: 0.8em;
    color: var(--accent-secondary);
    opacity: 0.6;
    border-bottom: 1px solid #333;
}
.item {
    font-size: 0.8em;
    margin: 5px 0;
    color: var(--accent-secondary);
    border-left: 2px solid var(--accent-secondary);
    padding-left: 5px;
}
.q-item {
    font-size: 0.8em;
    margin: 12px 0;
    border-bottom: 1px solid #111;
    padding-bottom: 5px;
}
.q-done {
    color: var(--accent-success);
    text-decoration: line-through;
    opacity: 0.4;
}

/* ===== INTERACT PROMPT ===== */
#npc-indicator-container { position: absolute; top: 0; left: 0; pointer-events: none; width: 100%; height: 100%; z-index: 100; }
.interact-prompt {
    position: absolute; background: #ffaa00; color: black;
    padding: 8px 16px; font-weight: bold; border-radius: 4px;
    font-size: 0.8em; transform: translate(-50%, -50%);
    display: none; cursor: pointer; pointer-events: auto;
    box-shadow: 0 0 20px #ffaa00; border: 1px solid white;
    z-index: 200;
}

.npc-bubble {
    position: absolute; background: rgba(0, 5, 10, 0.95); color: #00f2ff;
    padding: 12px 18px; border: 1px solid #00f2ff; border-radius: 2px;
    font-size: 0.85em; text-align: center; transform: translate(-50%, -100%);
    display: none; width: 220px; box-shadow: 0 0 15px rgba(0,242,255,0.3);
    z-index: 150;
}
.npc-bubble::after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 10px solid #00f2ff; }

#local-dialogue-box {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    width: 750px; max-width: 90%; background: rgba(0, 5, 15, 0.98);
    border: 1px solid #00f2ff; border-top: 4px solid #00f2ff;
    padding: 30px; color: white; display: none; z-index: 100;
}
.npc-name-tag { color: #ffaa00; font-size: 1.2em; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid #333; display: block; }
#bubble-text { margin-bottom: 25px; line-height: 1.6; font-size: 1.1em; text-transform: none; min-height: 60px; }
.choice-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice-btn {
    background: rgba(0,242,255,0.05); border: 1px solid #00f2ff55;
    color: #00f2ff; text-align: left; padding: 15px;
    cursor: pointer; font-family: inherit; transition: 0.2s; font-size: 0.9em;
}
.choice-btn:hover { background: rgba(0,242,255,0.2); border-color: #00f2ff; }

button#btn-start, button#btn-replay { background:#ffaa00; border:none; padding:15px 40px; cursor:pointer; font-weight:bold; font-size:1.2em; color: black; }
button#btn-replay { background:#00ffaa; color:#000; }

/* ===== WIPE TRANSITION ===== */
#wipe-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #010105; z-index: 2000; pointer-events: none;
    transform: translateX(-100%);
}
#wipe-overlay.active { animation: wipe-in 1s ease-in-out forwards; }
#wipe-overlay.out { animation: wipe-out 1s ease-in-out forwards; }
@keyframes wipe-in {
    0%   { transform: translateX(-100%); }
    50%  { transform: translateX(0); }
    100% { transform: translateX(100%); }
}
@keyframes wipe-out {
    0%   { transform: translateX(100%); }
    50%  { transform: translateX(0); }
    100% { transform: translateX(-100%); }
}

/* ===== LOCATION BOX ===== */
#loc-box {
    position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none; display: none; z-index: 150;

}
 #loc-name {
     font-size: 2.8em; color: var(--accent-secondary);
     margin: 0; text-shadow: 0 0 20px #000;
 }

 /* ===== NPC INTERACTION ===== */
 #npc-indicator-container {
     position: absolute; top: 0; left: 0;
     pointer-events: none; width: 100%; height: 100%; z-index: 600;
 }

 }

 }

 /* Retained from original: overlay screens */
 .overlay {
     position: absolute; top:0; left:0; width:100%; height:100%;
     display:flex; flex-direction:column; align-items:center; justify-content:center;
     color:white; z-index:1000; text-align:center; background:rgba(0,0,0,0.95);
 }

#start-screen h1{
    color: var(--accent-secondary);
    font-size: 4em;
    margin: 0;
    letter-spacing: 10px;
}

#start-screen p{
    color: var(--accent-secondary);

}

#win-screen h1{
    color: var(--accent-success);

    margin: 0;
    letter-spacing: 10px;
}
 #win-screen p{
     color: var(--accent-success);
     font-size: 1.2em;
     margin:20px 0; opacity:0.8; letter-spacing:2px;
 }

 /* ===== NPC INTERACTION ===== */

     </style>

</head>
<body>
    <div id="start-screen" class="overlay">
        <h1 >MESSENGER</h1>
        <p>DELIVER THE SIGNAL</p>
       <button id="btn-start">SYNC INTERFACE</button>
       </div>

       <!-- Win / Mission Complete Screen -->
       <div id="win-screen" class="overlay hidden" style="display:none;">
           <div id="win-content">
               <h1 >MISSION COMPLETE</h1>
               <p></p>All objectives fulfilled. Signal delivered.</p>
               <button id="btn-replay">REINITIALIZE</button>
           </div>
       </div>

       <!-- ── Right sidebar: flex column, top/bottom sections ── -->
       <div id="right-sidebar">

           <!-- TOP: Quest button + panel -->
           <div id="sidebar-top">
                <div class="sidebar-row">
                    <div id="panel-quest" class="panel">
                        <h3>MISSION</h3><div id="quest-list"></div>
                    </div>
                    <button id="btn-quest-toggle" class="ui-toggle" title="Toggle Quest Log">
                        <i class="fas fa-list-check"></i>
                    </button>
                </div>
            </div>

            <!-- BOTTOM: Inventory, Sound -->
            <div id="sidebar-bottom">
                <div class="sidebar-row" id="inv-anchor">
                    <div id="panel-inv" class="panel">
                        <h3>STORAGE</h3><div id="inv-list">0_CELLS</div>
                    </div>
                    <button id="btn-inv-toggle" class="ui-toggle" title="Toggle Inventory">
                        <i class="fas fa-boxes-stacked"></i>
                    </button>
                </div>
               <div class="sidebar-row">
                   <button id="btn-sound-toggle" class="ui-toggle" title="Toggle Music">
                       <i class="fas fa-volume-up"></i>
                   </button>
               </div>
           </div>

       </div>

       <div id="npc-indicator-container">
           <div id="world-prompt" class="interact-prompt">CONNECT_TO_ECHO</div>
       </div>

       <!-- Location name display -->
       <div id="loc-box">
           <h2 id="loc-name">LOC_NAME</h2>
       </div>

       <!-- Simple bubble for non-dialogue NPCs -->
       <div id="npc-bubble" class="npc-bubble"></div>

       <div id="local-dialogue-box">
           <span id="npc-name-display" class="npc-name-tag">NAME_ID</span>
           <div id="bubble-text">...</div>
           <div id="bubble-choices" class="choice-container"></div>
       </div>

        <!-- Wipe transition overlay -->
        <div id="wipe-overlay"></div>

        <!-- Script loading: Robust CDN + Global Access -->
        <script src="https://unpkg.com/inkjs@2.2.1/dist/ink.js"></script>
        <script>console.log('Ink runtime loaded:', !!window.ink, !!window.inkjs);</script>
        <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js" } }</script>

        <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        // ===== AUDIO CONFIG (update filenames here) =====
        const SOUND = {

            // Sound folder
            basePath: './assets/sounds/',
            // UI sounds
            panelOpen:   'panel_open.mp3',
            panelClose:  'panel_close.mp3',
            buttonClick: 'button_click.mp3',
            questDone:   'quest_complete.mp3',
            victory:     'victory_fanfare.mp3',
            pickup:      'pickup.mp3',
            // Ambient
            birds:       'bird_song.mp3',
            // Music
            bgMusic:     'bg_music.mp3',
            // NPC-specific (by ID)
            npc: {
                1: { enter: 'echo_enter.mp3',   exit: 'echo_exit.mp3'   },
                2: { enter: 'horizon_enter.mp3', exit: 'horizon_exit.mp3' }
            }
        };

        let started = false;
        let inkStory = null;
        let isDialogueOpen = false;
        let storyData = null;
        let npcStories = {}; // Store loaded stories by NPC ID

        // Audio Context for Jump Sound
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const playBeep = (f, t="sine", d=0.1) => {
            if(audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = t; osc.frequency.setValueAtTime(f, audioCtx.currentTime);
            g.gain.setValueAtTime(0.05, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + d);
        };

        // NPC Configuration (multiple NPCs supported)
        const npcs = [
            { id: 1, name: "UNIT-01 ECHO", color: 0x00f2ff, pos: [0.1, 0.1], storyFile: './NPC_UNIT_ECHO_1.json', hasDialogue: true },
            { id: 2, name: "UNIT-02 HORIZON", color: 0xffaa00, pos: [0.6, 2.2], storyFile: './NPC_UNIT_ECHO_2.json', hasDialogue: true },
            { id: 3, name: "SPIRE_MINOR", color: 0x00ffaa, pos: [1.2, 0.3], hasDialogue: false, bubbleMsg: "The Spire awaits..." }
        ];

        // Location system
        const locations = [
            { name: "LOC_NORTH_SPIRE", pos: [0.1, 0.5], r: 15, questId: 0 },
            { name: "LOC_SOUTH_SPIRE", pos: [0.9, 2.5], r: 15 } // No quest tied
        ];
        let activeLoc = null;

        // Track visited NPCs for quest
        const visitedNpcs = new Set();
        let lastNearNpcId = null; // for onExit detection

        // Load all NPC Ink stories at startup (only for NPCs with dialogue)
        async function loadAllStories() {
            for (const npc of npcs) {
                if (!npc.hasDialogue || !npc.storyFile) continue;
                try {
                    const response = await fetch(npc.storyFile);
                    if (response.ok) {
                        npcStories[npc.id] = await response.json();
                        console.log(`Loaded story for ${npc.name}`);
                    }
                } catch (e) {
                    console.error(`Failed to load story for ${npc.name}:`, e);
                }
            }
        }
        loadAllStories();

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);
        scene.fog = new THREE.FogExp2(0x020205, 0.008);
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const sun = new THREE.DirectionalLight(0xffffff, 2.5);
        sun.position.set(100, 200, 100);
        sun.castShadow = true;
        sun.shadow.camera.left = -100;
        sun.shadow.camera.right = 100;
        sun.shadow.camera.top = 100;
        sun.shadow.camera.bottom = -100;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 500;
        sun.shadow.mapSize.width = 2048;
         sun.shadow.mapSize.height = 2048;
         scene.add(sun);
         scene.add(new THREE.AmbientLight(0x404040, 1.5));


        const world = new CANNON.World();
        world.solver.iterations = 15;
        const planetR = 50;

        // --- RICHER SCENE ELEMENTS ---

        // 1. Star Field
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<1500; i++) {
            const v = new THREE.Vector3().randomDirection().multiplyScalar(Math.random() * 2000 + 100);
            starPos.push(v.x, v.y, v.z);
        }
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0x88ccff, size: 1.5, transparent: true, opacity: 0.8}));
        scene.add(stars);

        // 2. Crystal Clusters
        for(let i=0; i<15; i++) {
            const pos = new THREE.Vector3().setFromSphericalCoords(planetR, Math.random()*Math.PI, Math.random()*Math.PI*2);
            const cluster = new THREE.Group();
            const count = Math.floor(Math.random() * 4) + 2;
            for(let j=0; j<count; j++) {
                const crys = new THREE.Mesh(new THREE.ConeGeometry(0.8, 4 + Math.random()*3, 5), new THREE.MeshStandardMaterial({color: 0x00f2ff, emissive: 0x004444, transparent: true, opacity: 0.9}));
                crys.position.set((Math.random()-0.5)*2, 2, (Math.random()-0.5)*2);
                crys.rotation.set((Math.random()-0.5)*0.6, Math.random()*Math.PI, (Math.random()-0.5)*0.6);
                crys.castShadow = true; crys.receiveShadow = true;
                cluster.add(crys);
            }
            cluster.position.copy(pos);
            cluster.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), pos.clone().normalize());
            scene.add(cluster);
        }

        // 3. Relay Towers with Decorative Rings
        for(let i=0; i<6; i++) {
            const pos = new THREE.Vector3().setFromSphericalCoords(planetR, Math.random()*Math.PI, Math.random()*Math.PI*2);
            const tower = new THREE.Group();
            
            const base = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2, 10, 8), new THREE.MeshStandardMaterial({color: 0x333344}));
            base.position.y = 5; base.castShadow = true; base.receiveShadow = true;
            
            const orb = new THREE.Mesh(new THREE.SphereGeometry(1.5), new THREE.MeshStandardMaterial({color: 0xffaa00, emissive: 0x663300}));
            orb.position.y = 11;
            
            const ring = new THREE.Mesh(new THREE.TorusGeometry(3.5, 0.2, 8, 24), new THREE.MeshBasicMaterial({color: 0xffaa00}));
            ring.position.y = 8; ring.rotation.x = Math.PI/2;
            
            tower.add(base, orb, ring);
            tower.position.copy(pos);
            tower.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), pos.clone().normalize());
            scene.add(tower);

            const body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(1.5, 5, 1.5)) });
            body.position.copy(pos); body.quaternion.copy(tower.quaternion);
            world.addBody(body);
        }

         // System Arrays
        const inventory = [];
        const quests = [
            { id: 'RECON', name: 'NORTH_RECON', task: 'Reach the North Spire', cur: 0, tar: 1, completed: false },
            { id: 'CELLS', name: 'CELL_RECOVERY', task: 'Collect Data Cells', cur: 0, tar: 3, completed: false },
            { id: 'SHARDS', name: 'SIGNAL_FRAGMENTS', task: 'Collect Purple Shards', cur: 0, tar: 3, completed: false },
            { id: 'VISIT', name: 'VISIT_HORIZON', task: 'Contact UNIT-02 HORIZON', cur: 0, tar: 1, completed: false }
        ];

        const planet = new THREE.Mesh(new THREE.IcosahedronGeometry(planetR, 5), new THREE.MeshToonMaterial({ color: 0x1a251a }));
        planet.receiveShadow = true;
        scene.add(planet);
        world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetR) }));

        const pBody = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5)), fixedRotation: true, linearDamping: 0.9 });
        pBody.position.set(0, planetR + 10, 0);
        world.addBody(pBody);
        const playerMesh = new THREE.Group();
        const pVis = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 1.2), new THREE.MeshToonMaterial({ color: 0xff3333 }));
        pVis.castShadow = true;
        playerMesh.add(pVis);
        scene.add(playerMesh);

        // --- ITEMS: Data Cells & Signal Shards ---
        const pickups = [];
        // Data Cells (orange spheres) - 4
        for(let i=0; i<4; i++) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(1), new THREE.MeshToonMaterial({ color: 0xffaa00 }));
            m.name = `CELL_${i+1}`;
            m.position.setFromSphericalCoords(planetR + 1.2, Math.random()*Math.PI, Math.random()*Math.PI*2);
            m.castShadow = true; scene.add(m); pickups.push(m);
        }
        // Signal Shards (purple octahedrons) - 4
        for(let i=0; i<4; i++) {
            const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.9), new THREE.MeshStandardMaterial({ color: 0xa020f0, emissive: 0x4a0080 }));
            m.name = `SHARD_${i+1}`;
            m.position.setFromSphericalCoords(planetR + 1.2, Math.random()*Math.PI, Math.random()*Math.PI*2);
            m.castShadow = true; scene.add(m); pickups.push(m);
        }

        // --- WORLD PRIMITIVES (collidable buildings) with shadows ---
        const buildings = [];
        for(let i=0; i<8; i++) {
            const h = Math.random()*6 + 2;
            const m = new THREE.Mesh(new THREE.BoxGeometry(3, h, 3), new THREE.MeshToonMaterial({ color: 0x333344 }));
            const pos = new THREE.Vector3().setFromSphericalCoords(planetR + h/2, Math.random()*Math.PI, Math.random()*Math.PI*2);
            m.position.copy(pos);
            m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), pos.clone().normalize());
            m.castShadow = true;
            m.receiveShadow = true;
            scene.add(m);
            const body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(1.5, h/2, 1.5)) });
            body.position.copy(pos);
            body.quaternion.copy(m.quaternion);
            world.addBody(body);
            buildings.push(m);
        }

        // --- NPCS (With Base Pads) ---
        const npcMeshes = npcs.map(npc => {
            const grp = new THREE.Group();
            
            // Base Pad
            const pad = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 0.2, 16), new THREE.MeshStandardMaterial({color: 0x222222, emissive: 0x111111}));
            grp.add(pad);

            // NPC Body
            const m = new THREE.Mesh(new THREE.CapsuleGeometry(1, 2), new THREE.MeshToonMaterial({ color: npc.color }));
            m.position.y = 1.5; m.castShadow = true;
            grp.add(m);

            const p = new THREE.Vector3().setFromSphericalCoords(planetR, npc.pos[0]*Math.PI, npc.pos[1]*Math.PI*2);
            grp.position.copy(p);
            grp.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), p.clone().normalize());
            scene.add(grp);
            
            return { mesh: grp, bodyMesh: m, data: npc };
        });

        // --- INPUTS & CAMERA CONTROL ---
        const keys = {};
        let mouseTarget = null;
        let camHeading = new THREE.Vector3(0, 0, 1);
        let canJump = true;
        let activeNpc = null;
        let hasWon = false;

        // --- AUDIO ENGINE (uses SOUND config) ---
        let uiSounds = {};
        let ambientSounds = {};
        let npcInteractionSounds = {};

        // Initialize only if Howler is available
        if (typeof Howler !== 'undefined') {
            uiSounds = {
                open:   new Howl({ src: [SOUND.panelOpen],   volume: 0.4 }),
                close:  new Howl({ src: [SOUND.panelClose],  volume: 0.3 }),
                click:  new Howl({ src: [SOUND.buttonClick], volume: 0.5 }),
                questComplete: new Howl({ src: [SOUND.questDone],  volume: 0.7 }),
                victory: new Howl({ src: [SOUND.victory],    volume: 0.8 }),
                pickup: new Howl({ src: [SOUND.pickup],     volume: 0.5 })
            };

            ambientSounds = {
                birds: new Howl({ src: [SOUND.birds], loop: true, volume: 0, autoplay: false })
            };
        }

        const playNpcSound = (npcId, type) => {
            if (typeof Howler === 'undefined') return;
            const npcCfg = SOUND.npc[npcId];
            if (!npcCfg || !npcCfg[type]) return;
            const key = `${npcId}_${type}`;
            if (!npcInteractionSounds[key]) {
                npcInteractionSounds[key] = new Howl({ src: [npcCfg[type]], volume: 0.6 });
            }
            npcInteractionSounds[key].play();
        };

        ambientSounds = {
            birds: new Howl({ src: [SOUND.birds], loop: true, volume: 0, autoplay: false })
        };
        


        // Background Music via Howler (if available)
        let musicEnabled = true;
        let bgMusic = null;
        if (typeof Howler !== 'undefined') {
            bgMusic = new Howl({
                src: [SOUND.bgMusic],
                loop: true,
                volume: 0.35,
                autoplay: false
            });
        }

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            // Jump Logic
            if(e.code === 'Space' && canJump && started) {
                const up = new THREE.Vector3().copy(pBody.position).normalize();
                pBody.applyImpulse(new CANNON.Vec3(up.x * 12, up.y * 12, up.z * 12), pBody.position);
                canJump = false;
                playBeep(300, "sine", 0.05);
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

         const raycaster = new THREE.Raycaster();
         const mouse = new THREE.Vector2();
         window.addEventListener('mousedown', e => {
             if(!started) return;
             // Ignore clicks on UI elements
             if (e.target.closest('.ui-toggle') || e.target.closest('.panel') || e.target.closest('.overlay') || e.target.closest('#wipe-overlay')) return;
             mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
             mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
             raycaster.setFromCamera(mouse, camera);
             const hits = raycaster.intersectObject(planet);
             if(hits.length) mouseTarget = hits[0].point;
         });

        // Ink text processing: strip control markers
        function stripInkMarkers(s) {
            if (!s) return '';
            const rawLines = s.split(/\r?\n/);
            const out = [];
            for (let line of rawLines) {
                let l = (line || '').trim();
                if (l === '#' || l === '/#') continue;
                if (l.startsWith('^')) l = l.slice(1).trim();
                if (l.startsWith('#')) l = l.slice(1).trim();
                if (l) out.push(l);
            }
            return out.join('\n');
        }

        const updateUI = () => {
            document.getElementById('inv-list').innerHTML = inventory.length ? inventory.map(i => `<div class="item">${i}</div>`).join('') : "0_CELLS";
            document.getElementById('quest-list').innerHTML = quests.map(q => `<div class="q-item ${q.cur>=q.tar?'q-done':''}"><b>${q.name}</b><br><small>${q.task} [${q.cur}/${q.tar}]</small></div>`).join('');

            // Check for quest completions (only trigger once per quest)
            quests.forEach(q => {
                if (!q.completed && q.cur >= q.tar) {
                    q.completed = true;
                    uiSounds.questComplete.play();
                }
            });

            checkWinCondition();
        };

        // Check if all quests are complete, trigger win screen
        const checkWinCondition = () => {
            if (hasWon) return;
            const allDone = quests.every(q => q.cur >= q.tar);
            if (allDone) {
                hasWon = true;
                setTimeout(() => triggerWinSequence(), 1500); // 1.5s delay after last quest completes
            }
        };


        const triggerWinSequence = () => {
            // Disable player movement and hide any open UI
            isDialogueOpen = true;
            pBody.sleep();
            mouseTarget = null;
            document.getElementById('local-dialogue-box').style.display = 'none';
            // Hide panels
            panelInv.classList.remove('open');
            panelQuest.classList.remove('open');
            // Pause music
            if (bgMusic) bgMusic.pause();
            // Play victory
            uiSounds.victory.play();

            const wipe = document.getElementById('wipe-overlay');
            wipe.classList.add('active'); // wipe in (left → right, 1s)

            // At the moment the wipe fully covers the screen (500ms), reveal win screen behind
            setTimeout(() => {
                document.getElementById('win-screen').style.display = 'flex';
            }, 500);
        };

        const continueStory = () => {
            const textEl = document.getElementById('bubble-text');
            const choiceEl = document.getElementById('bubble-choices');
            let txt = "";
            while(inkStory.canContinue) txt += inkStory.Continue();
            
            const cleaned = stripInkMarkers(txt);
            console.log('Cleaned:', cleaned);
            textEl.innerHTML = cleaned;
            choiceEl.innerHTML = "";
            inkStory.currentChoices.forEach(c => {
                const b = document.createElement('button');
                b.className = "choice-btn"; b.innerText = c.text;
                b.onclick = () => { inkStory.ChooseChoiceIndex(c.index); continueStory(); };
                choiceEl.appendChild(b);
            });
            if(inkStory.currentChoices.length === 0 && !inkStory.canContinue) {
                const b = document.createElement('button');
                b.className = "choice-btn"; b.innerText = "[CLOSE CONNECTION]";
                b.onclick = () => {
                    document.getElementById('local-dialogue-box').style.display = 'none';
                    isDialogueOpen = false;
                    pBody.wakeUp();
                    pBody.velocity.set(0,0,0);
                    mouseTarget = null;
                    // Play NPC onExit sound
                    if (activeNpc) playNpcSound(activeNpc.data.id, 'onExit');
                };
                choiceEl.appendChild(b);
            }
        };

        const worldPrompt = document.getElementById('world-prompt');
        worldPrompt.onclick = () => {
            // Detect Ink runtime (inkjs UMD exposes window.inkjs or window.ink)
            const inkLib = (() => {
                if (typeof window.inkjs !== 'undefined' && window.inkjs.Story) return window.inkjs;
                if (typeof window.ink !== 'undefined' && window.ink.Story) return window.ink;
                return null;
            })();
            if (!inkLib) { console.error("INK_RUNTIME_NOT_FOUND", { hasInkjs: !!window.inkjs, hasInk: !!window.ink }); return; }

            if (!activeNpc || !npcStories[activeNpc.data.id]) {
                console.error("No NPC or story data not loaded yet");
                return;
            }

            // Freeze player physics when dialogue starts
            pBody.sleep();
            mouseTarget = null;

            // Track NPC visit for quest (only first time)
            if (activeNpc.data.id === 2 && !visitedNpcs.has(2)) {
                visitedNpcs.add(2);
                quests[2].cur = 1;
                updateUI();
            }

            isDialogueOpen = true;
            worldPrompt.style.display = 'none';
            document.getElementById('local-dialogue-box').style.display = 'block';

            // Play NPC onEnter sound
            playNpcSound(activeNpc.data.id, 'onEnter');

            try {
                inkStory = new inkLib.Story(npcStories[activeNpc.data.id]);
                document.getElementById('npc-name-display').innerText = activeNpc.data.name;
                continueStory();
            } catch (e) { console.error("STORY_INIT_ERROR", e); }
        };

        document.getElementById('btn-start').onclick = () => {
            const wipe = document.getElementById('wipe-overlay');
            wipe.classList.add('active');
            audioCtx.resume();
            if (uiSounds.click) uiSounds.click.play();
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
            }, 500);
            setTimeout(() => {
                started = true;
                updateUI();
                if (bgMusic) bgMusic.play();
                if (ambientSounds.birds) {
                    ambientSounds.birds.play();
                    ambientSounds.birds.fade(0, 0.15, 3000);
                }
            }, 1000);
        };

        document.getElementById('btn-replay').onclick = () => { if (uiSounds.click) uiSounds.click.play(); location.reload(); };

        // UI Panel Toggle Buttons
         const btnQuest = document.getElementById('btn-quest-toggle');
         const btnInv = document.getElementById('btn-inv-toggle');
         const panelQuest = document.getElementById('panel-quest');
         const panelInv = document.getElementById('panel-inv');

         btnQuest.onclick = (e) => {
             e.stopPropagation();
             if (uiSounds.click) uiSounds.click.play();
             const isOpen = panelQuest.classList.contains('open');
             panelQuest.classList.toggle('open', !isOpen);
             btnQuest.classList.toggle('active', !isOpen);
             panelInv.classList.remove('open');
             btnInv.classList.remove('active');
             if (!isOpen && uiSounds.open) uiSounds.open.play(); else if (isOpen && uiSounds.close) uiSounds.close.play();
         };


          // Sound toggle button (bottom right)
          const btnSound = document.getElementById('btn-sound-toggle');
          btnSound.onclick = (e) => {
              e.stopPropagation();
              uiSounds.click.play();
              musicEnabled = !musicEnabled;
              if (bgMusic) {
                  bgMusic.mute(!musicEnabled);
                  if (musicEnabled) bgMusic.play();
              }
              btnSound.innerHTML = musicEnabled
                  ? '<i class="fas fa-volume-up"></i>'
                  : '<i class="fas fa-volume-off"></i>';
          };

        function loop() {
            requestAnimationFrame(loop);
            world.step(1/60);
            const pPos = new THREE.Vector3().copy(pBody.position);
            const up = pPos.clone().normalize();

            // Gravity
            pBody.applyForce(up.clone().multiplyScalar(-75), pBody.position);

            // Ground check for Jump
            if(pPos.length() < planetR + 1.6) canJump = true;

            if(!started) { renderer.render(scene, camera); return; }

            // 1. NPC Interaction (find nearest, animate bobbing)
            let nearestNpc = null;
            let nearestDist = Infinity;
            for (const npcObj of npcMeshes) {
                // Bobbing animation
                npcObj.bodyMesh.position.y = 1.5 + Math.sin(Date.now() * 0.002 + npcObj.data.id) * 0.2;
                const dist = pPos.distanceTo(npcObj.mesh.position);
                if (dist < 8 && dist < nearestDist) {
                    nearestDist = dist;
                    nearestNpc = npcObj;
                }
            }
            activeNpc = nearestNpc;

            if (activeNpc && !isDialogueOpen && activeNpc.data.hasDialogue) {
                worldPrompt.style.display = 'block';
                worldPrompt.innerText = `CONNECT_TO_${activeNpc.data.name}`;
                const up = pPos.clone().normalize();
                const sPos = activeNpc.mesh.position.clone().add(up.clone().multiplyScalar(5)).project(camera);
                worldPrompt.style.left = (sPos.x * 0.5 + 0.5) * window.innerWidth + 'px';
                worldPrompt.style.top = (sPos.y * -0.5 + 0.5) * window.innerHeight + 'px';

                // onEnter sound once when first approaching
                if (lastNearNpcId !== activeNpc.data.id) {
                    playNpcSound(activeNpc.data.id, 'enter');
                    lastNearNpcId = activeNpc.data.id;
                }
            } else {
                worldPrompt.style.display = 'none';
                if (lastNearNpcId !== null && !isDialogueOpen) {
                    playNpcSound(lastNearNpcId, 'exit');
                    lastNearNpcId = null;
                }
            }

            // 1a. Location Detection
            let curLoc = null;
            for (const loc of locations) {
                const lp = new THREE.Vector3().setFromSphericalCoords(planetR, loc.pos[0]*Math.PI, loc.pos[1]*Math.PI*2);
                if (pPos.distanceTo(lp) < loc.r) curLoc = loc;
            }
            if (curLoc && activeLoc !== curLoc) {
                activeLoc = curLoc;
                document.getElementById('loc-name').innerText = curLoc.name.replace('LOC_', '').replace('_', ' ');
                document.getElementById('loc-box').style.display = 'block';
                if (curLoc.questId !== undefined && quests[curLoc.questId].cur < quests[curLoc.questId].tar) {
                    quests[curLoc.questId].cur = 1;
                    updateUI();
                }
            } else if (!curLoc) {
                document.getElementById('loc-box').style.display = 'none';
                activeLoc = null;
            }

            // 1c. Pickup Collection
            for(let i=pickups.length-1; i>=0; i--) {
                if(pPos.distanceTo(pickups[i].position) < 3) {
                    const itemName = pickups[i].name; // e.g. "CELL_1" or "SHARD_1"
                    inventory.push(itemName);
                    scene.remove(pickups[i]);
                    pickups.splice(i,1);

                    // Handle quest progression
                    if (itemName.startsWith('CELL') && quests[1].cur < quests[1].tar) {
                        quests[1].cur++;
                        if (quests[1].cur === quests[1].tar && uiSounds.questComplete) uiSounds.questComplete.play();
                    }
                    if (itemName.startsWith('SHARD') && quests[2].cur < quests[2].tar) {
                        quests[2].cur++;
                        if (quests[2].cur === quests[2].tar && uiSounds.questComplete) uiSounds.questComplete.play();
                    }

                    if (uiSounds.pickup) uiSounds.pickup.play();
                    updateUI();
                }
            }

            // 1b. Non-Dialogue NPC Bubble (show above NPC)
            const bubbleEl = document.getElementById('npc-bubble');
            let nonDialogueNpc = null;
            for (const npcObj of npcMeshes) {
                if (!npcObj.data.hasDialogue && pPos.distanceTo(npcObj.mesh.position) < 10) {
                    nonDialogueNpc = npcObj;
                    break;
                }
            }
            if (nonDialogueNpc) {
                const up = pPos.clone().normalize();
                const sPos = nonDialogueNpc.mesh.position.clone().add(up.clone().multiplyScalar(4)).project(camera);
                bubbleEl.style.left = (sPos.x * 0.5 + 0.5) * window.innerWidth + 'px';
                bubbleEl.style.top = (sPos.y * -0.5 + 0.5) * window.innerHeight + 'px';
                const txt = nonDialogueNpc.data.bubbleMsg || nonDialogueNpc.data.name.replace('_', ' ');
                bubbleEl.innerHTML = `<b>${txt}</b>`;
                bubbleEl.style.display = 'block';
            } else {
                bubbleEl.style.display = 'none';
            }

            // 2. Movement (Camera-relative or Mouse-targeted)
            let moveDir = new THREE.Vector3(0,0,0);
            if(!isDialogueOpen) {
                const camFwd = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
                const camRgt = new THREE.Vector3().crossVectors(up, camFwd).normalize();
                if(keys['KeyW'] || keys['ArrowUp']) moveDir.add(camFwd);
                if(keys['KeyS'] || keys['ArrowDown']) moveDir.sub(camFwd);
                if(keys['KeyA'] || keys['ArrowLeft']) moveDir.add(camRgt);
                if(keys['KeyD'] || keys['ArrowRight']) moveDir.sub(camRgt);
                if(mouseTarget) {
                    const toMouse = mouseTarget.clone().sub(pPos).projectOnPlane(up);
                    if(toMouse.length() > 2) moveDir.add(toMouse.normalize());
                    else mouseTarget = null;
                }

                if(moveDir.length() > 0) {
                    moveDir.normalize();
                    camHeading.lerp(moveDir, 0.1).normalize();
                    pBody.velocity.set(moveDir.x*18, moveDir.y*18, moveDir.z*18);
                }
            } else {
                pBody.velocity.set(0,0,0);
            }

            // 3. Player Alignment
            playerMesh.position.copy(pPos);
            playerMesh.up.copy(up);
            playerMesh.lookAt(pPos.clone().add(camHeading.projectOnPlane(up).normalize()));

            // 4. Camera Follow (offset from player based on heading)
            camera.up.copy(up);
            const targetCamPos = pPos.clone()
                .add(camHeading.clone().multiplyScalar(-30))
                .add(up.clone().multiplyScalar(16))
                .add(new THREE.Vector3().crossVectors(up, camHeading).multiplyScalar(8));
            camera.position.lerp(targetCamPos, 0.05);
            camera.lookAt(pPos.clone().add(camHeading.clone().multiplyScalar(5)));

            renderer.render(scene, camera);
        }
        loop();
    </script>
</body>
</html>
