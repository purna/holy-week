<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Collisions Enabled</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(0, 0, 0, 0.6); padding: 15px; border-radius: 8px;
            pointer-events: none; border-left: 4px solid #44ccff;
        }
        .key { border: 1px solid white; padding: 2px 6px; border-radius: 4px; margin: 0 2px; font-size: 0.8em; }
    </style>
</head>
<body>
    <div id="ui">
        <div><span class="key">WASD</span> / <span class="key">Arrows</span></div>
        <div style="margin-top: 8px;">Buildings now have <b>Colliders</b></div>
        <div style="margin-top: 8px; color: #44ccff;">Character Anchored to Top-Half</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        // --- 1. SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa3d5ff);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 2. PHYSICS ---
        const world = new CANNON.World();
        world.gravity.set(0, 0, 0);

        // --- 3. THE PLANET ---
        const planetRadius = 30;
        const planetBody = new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetRadius) });
        world.addBody(planetBody);

        const planetMesh = new THREE.Mesh(
            new THREE.IcosahedronGeometry(planetRadius, 5),
            new THREE.MeshStandardMaterial({ color: 0x55aa55, flatShading: true })
        );
        scene.add(planetMesh);

        // --- 4. BUILDINGS WITH COLLIDERS ---
        for (let i = 0; i < 40; i++) {
            const h = Math.random() * 4 + 2;
            const w = 2; // Width
            const d = 2; // Depth
            
            // Visual Mesh
            const bMesh = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d), 
                new THREE.MeshStandardMaterial({ color: 0xcccccc })
            );
            
            // Calculate Spherical Position
            const phi = Math.acos(-1 + (2 * i) / 40);
            const theta = Math.sqrt(40 * Math.PI) * phi;
            const pos = new THREE.Vector3().setFromSphericalCoords(planetRadius + h/2, phi, theta);
            
            bMesh.position.copy(pos);
            const upVec = pos.clone().normalize();
            bMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), upVec);
            scene.add(bMesh);

            // Physics Body (Static)
            const bBody = new CANNON.Body({
                mass: 0, // Static objects don't move
                shape: new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2))
            });
            bBody.position.set(pos.x, pos.y, pos.z);
            // Copy orientation from mesh to body
            bBody.quaternion.set(bMesh.quaternion.x, bMesh.quaternion.y, bMesh.quaternion.z, bMesh.quaternion.w);
            world.addBody(bBody);
        }

        // --- 5. PLAYER ---
        const playerBody = new CANNON.Body({
            mass: 1,
            shape: new CANNON.Box(new CANNON.Vec3(0.4, 0.8, 0.4)),
            fixedRotation: true,
            linearDamping: 0.9 // Helps character stop more cleanly
        });
        playerBody.position.set(0, planetRadius + 5, 0);
        world.addBody(playerBody);

        const playerMesh = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 1.6, 0.8),
            new THREE.MeshStandardMaterial({ color: 0xff4444 })
        );
        scene.add(playerMesh);

        // --- 6. LIGHTING ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(50, 100, 50);
        scene.add(sun);

        // --- 7. INPUTS ---
        const keys = {};
        const mouse = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        let isMouseDown = false;

        window.onkeydown = (e) => {
            const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
            keys[key] = true;
        };
        window.onkeyup = (e) => {
            const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
            keys[key] = false;
        };
        window.onmousedown = () => isMouseDown = true;
        window.onmouseup = () => isMouseDown = false;
        window.onmousemove = (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        };

        // --- 8. UPDATE LOOP ---
        const dummy = new THREE.Object3D();

        function update() {
            requestAnimationFrame(update);
            world.step(1/60);

            const pPos = new THREE.Vector3().copy(playerBody.position);
            const up = pPos.clone().normalize();

            // Gravity
            playerBody.applyForce(up.clone().multiplyScalar(-30), playerBody.position);

            dummy.position.copy(pPos);
            dummy.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);

            let moveDir = new THREE.Vector3(0, 0, 0);
            const forward = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
            const right = new THREE.Vector3().crossVectors(up, forward).normalize();
            
            if (keys.w || keys.ArrowUp) moveDir.add(forward);
            if (keys.s || keys.ArrowDown) moveDir.sub(forward);
            if (keys.a || keys.ArrowLeft) moveDir.add(right);
            if (keys.d || keys.ArrowRight) moveDir.sub(right);

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(planetMesh);
            if (intersects.length > 0 && isMouseDown) {
                const targetPoint = intersects[0].point;
                const mouseDir = new THREE.Vector3().subVectors(targetPoint, pPos).projectOnPlane(up).normalize();
                moveDir.add(mouseDir);
            }

            if (moveDir.length() > 0) {
                moveDir.normalize();
                const lookTarget = pPos.clone().add(moveDir);
                dummy.lookAt(lookTarget);
                playerMesh.quaternion.slerp(dummy.quaternion, 0.15);

                const v = moveDir.multiplyScalar(6); // Slow speed as requested
                playerBody.velocity.x = v.x;
                playerBody.velocity.y = v.y;
                playerBody.velocity.z = v.z;
            } else {
                // Friction-like stop
                playerBody.velocity.x *= 0.9;
                playerBody.velocity.y *= 0.9;
                playerBody.velocity.z *= 0.9;
                playerMesh.quaternion.slerp(dummy.quaternion, 0.1);
            }

            // --- CAMERA ---
            const camDist = 14; 
            const targetCamPos = pPos.clone()
                .add(up.clone().multiplyScalar(3)) 
                .add(forward.clone().multiplyScalar(-camDist));
            
            camera.position.lerp(targetCamPos, 0.05);
            
            // Character anchored to Top-Half (Looking below the player)
            const lookAtOffset = up.clone().multiplyScalar(-4); 
            camera.lookAt(pPos.clone().add(lookAtOffset));

            playerMesh.position.copy(playerBody.position);
            renderer.render(scene, camera);
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };

        update();
    </script>
</body>
</html>
