<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - High Visibility World</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050510; font-family: sans-serif; text-transform: uppercase; letter-spacing: 1px; }
        .overlay { position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; z-index:1000; text-align:center; transition: opacity 0.5s; background:rgba(0,0,0,0.85); }
        .panel { position:absolute; color:white; background:rgba(0,10,20,0.9); padding:15px; border-radius:4px; border: 1px solid #00f2ff; backdrop-filter: blur(10px); }
        #panel-quest { top:20px; right:20px; width:220px; border-right: 4px solid #00f2ff; }
        #panel-inv { top:20px; left:20px; width:180px; border-left: 4px solid #ffaa00; }
        #msg-box { position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.95); color: #00f2ff; padding: 20px; border: 1px solid #00f2ff; display:none; width: 80%; max-width: 500px; text-align: center; box-shadow: 0 0 20px rgba(0,242,255,0.2); }
        #loc-box { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; display:none; }
        #loc-name { font-size: 2.5em; color: #ffaa00; margin: 0; text-shadow: 0 0 15px rgba(255,170,0,0.5); }
        #loc-desc { color: white; font-size: 1em; opacity: 0.8; }
        h3 { margin: 0 0 10px 0; font-size: 0.9em; color: #ffaa00; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .item { font-size: 0.85em; margin: 5px 0; color: #ffaa00; }
        .q-item { font-size: 0.85em; margin: 8px 0; }
        .q-done { color: #00ffaa; text-decoration: line-through; opacity: 0.6; }
        button { background:#ffaa00; border:none; padding:15px 40px; cursor:pointer; font-weight:bold; font-size:1.2em; color: black; box-shadow: 0 4px 0 #b37700; }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #b37700; }
        .spinner { width:40px; height:40px; border:4px solid #333; border-top-color:#ffaa00; border-radius:50%; animation:s 1s linear infinite; }
        @keyframes s { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-screen" class="overlay"><div class="spinner"></div></div>
    
    <div id="start-screen" class="overlay">
        <h1 style="color:#ffaa00; font-size:4em; margin:0;">MESSENGER</h1>
        <p style="margin-bottom:30px; opacity:0.7;">LIT TERRAIN INITIALIZED // VERSION 4.1</p>
        <button id="btn-start">INITIALIZE MISSION</button>
    </div>

    <div id="panel-inv" class="panel">
        <h3>STORAGE_UNIT</h3>
        <div id="inv-list">EMPTY</div>
    </div>

    <div id="panel-quest" class="panel">
        <h3>MISSION_LOG</h3>
        <div id="quest-list"></div>
    </div>

    <div id="msg-box"></div>
    <div id="loc-box">
        <h2 id="loc-name"></h2>
        <div id="loc-desc"></div>
    </div>

    <div id="win-screen" class="overlay" style="display:none;">
        <h1 style="color:#00ffaa">DATA SYNC COMPLETE</h1>
        <button onclick="location.reload()">REBOOT</button>
    </div>

    <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js" } }</script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        let started = false;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING (The Fix for Black Screen) ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);
        
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(100, 200, 100);
        scene.add(sun);

        // --- AUDIO ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const playBeep = (freq, type="sine", dur=0.1) => {
            if(audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        };

        // --- PHYSICS ---
        const world = new CANNON.World();
        world.solver.iterations = 15;
        const planetR = 50;

        // --- WORLD DATA ---
        const questData = [
            { id: 'q_scout', name: 'Planetary Recon', task: 'Visit the North Spire', status: 0, tar: 1 },
            { id: 'q_collect', name: 'Sample Recovery', task: 'Collect Data Modules', status: 0, tar: 3 }
        ];
        const inventory = [];

        const npcs = [
            { name: "Unit-01 (Echo)", msg: "System status nominal. I've highlighted the North Spire on your map.", pos: [0.1, 0.1, 0.1], color: 0x00f2ff, sound: 600 },
            { name: "Archive-Bot", msg: "Scanning... Found encrypted signals near the Crystal Fields.", pos: [0.7, 0.4, 0.2], color: 0xffaa00, sound: 400 }
        ];

        const locations = [
            { name: "THE NORTH SPIRE", desc: "A derelict transmission tower piercing the atmosphere.", pos: [0.1, 0.5, 0.5], r: 15 },
            { name: "CRYSTAL FIELDS", desc: "Shattered geometry humming with ancient energy.", pos: [0.8, 0.8, 0.1], r: 20 }
        ];

        // --- PLANET CREATION (Using Lit Materials) ---
        const groundMat = new THREE.MeshToonMaterial({ color: 0x224433 });
        const planetMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(planetR, 5), groundMat);
        scene.add(planetMesh);
        
        // Add a wireframe helper to see the terrain better
        const wire = new THREE.Mesh(new THREE.IcosahedronGeometry(planetR + 0.1, 5), new THREE.MeshBasicMaterial({ color: 0x00ffaa, wireframe: true, transparent: true, opacity: 0.05 }));
        scene.add(wire);

        world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetR) }));

        // Buildings / Obstacles
        const collidables = [];
        for(let i=0; i<40; i++) {
            const h = Math.random()*6+4;
            const bMat = new THREE.MeshToonMaterial({ color: 0x444455 });
            const m = new THREE.Mesh(new THREE.BoxGeometry(4, h, 4), bMat);
            const pos = new THREE.Vector3().setFromSphericalCoords(planetR, Math.random()*Math.PI, Math.random()*Math.PI*2);
            m.position.copy(pos);
            m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), pos.clone().normalize());
            scene.add(m); collidables.push(m);
            const body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(2, h/2, 2)) });
            body.position.copy(pos); body.quaternion.copy(m.quaternion);
            world.addBody(body);
        }

        // NPCs
        const npcObjects = [];
        npcs.forEach(data => {
            const m = new THREE.Mesh(new THREE.CapsuleGeometry(1, 2, 4, 8), new THREE.MeshToonMaterial({ color: data.color }));
            const p = new THREE.Vector3().setFromSphericalCoords(planetR + 1.5, data.pos[0]*Math.PI, data.pos[1]*Math.PI*2);
            m.position.copy(p);
            m.up.copy(p.clone().normalize());
            m.lookAt(new THREE.Vector3(0,0,0)); m.rotateX(Math.PI/2);
            scene.add(m);
            npcObjects.push({ mesh: m, data });
        });

        // --- PLAYER ---
        const pBody = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5)), fixedRotation: true, linearDamping: 0.9 });
        pBody.position.set(0, planetR + 15, 0); 
        world.addBody(pBody);
        
        const playerGroup = new THREE.Group();
        const pVis = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 1.2), new THREE.MeshToonMaterial({ color: 0xff3333 }));
        playerGroup.add(pVis);
        scene.add(playerGroup);

        // --- CORE LOOP ---
        const keys = {};
        let camHeading = new THREE.Vector3(0, 0, 1);
        let activeLoc = null;
        let activeNpc = null;

        const updateUI = () => {
            document.getElementById('inv-list').innerHTML = inventory.length ? inventory.map(i => `<div class="item">ID_${i}</div>`).join('') : "EMPTY";
            document.getElementById('quest-list').innerHTML = questData.map(q => `<div class="q-item ${q.status>=q.tar?'q-done':''}">[${q.name}]<br><small>${q.task} (${q.status}/${q.tar})</small></div>`).join('');
        };

        window.onkeydown = (e) => keys[e.code] = true;
        window.onkeyup = (e) => keys[e.code] = false;

        document.getElementById('btn-start').onclick = () => {
            audioCtx.resume();
            document.getElementById('start-screen').style.display = 'none';
            started = true; updateUI();
        };

        window.onload = () => document.getElementById('loading-screen').style.display = 'none';

        function loop() {
            requestAnimationFrame(loop);
            world.step(1/60);
            const pPos = new THREE.Vector3().copy(pBody.position);
            const up = pPos.clone().normalize();
            pBody.applyForce(up.clone().multiplyScalar(-70), pBody.position);

            if(!started) { renderer.render(scene, camera); return; }

            // NPC/Loc Proximity
            let foundNpc = null;
            npcObjects.forEach(obj => { if(pPos.distanceTo(obj.mesh.position) < 6) foundNpc = obj; });
            if(foundNpc && activeNpc !== foundNpc) {
                activeNpc = foundNpc;
                const box = document.getElementById('msg-box');
                box.innerHTML = `<b style="color:${foundNpc.data.color.toString(16)}">${foundNpc.data.name}:</b><br>${foundNpc.data.msg}`;
                box.style.display = 'block';
                playBeep(foundNpc.data.sound, "square", 0.15);
            } else if (!foundNpc) {
                activeNpc = null;
                document.getElementById('msg-box').style.display = 'none';
            }

            let currentLoc = null;
            locations.forEach(loc => {
                const lPos = new THREE.Vector3().setFromSphericalCoords(planetR, loc.pos[0]*Math.PI, loc.pos[1]*Math.PI*2);
                if(pPos.distanceTo(lPos) < loc.r) currentLoc = loc;
            });
            if(currentLoc && activeLoc !== currentLoc) {
                activeLoc = currentLoc;
                document.getElementById('loc-name').innerText = activeLoc.name;
                document.getElementById('loc-desc').innerText = activeLoc.desc;
                document.getElementById('loc-box').style.display = 'block';
                playBeep(800, "sine", 0.1);
                if(activeLoc.name === "THE NORTH SPIRE" && questData[0].status === 0) { questData[0].status = 1; updateUI(); }
            } else if (!currentLoc) {
                activeLoc = null;
                document.getElementById('loc-box').style.display = 'none';
            }

            // Movement Logic
            const camFwd = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
            const camRgt = new THREE.Vector3().crossVectors(up, camFwd).normalize();
            let moveDir = new THREE.Vector3(0,0,0);
            if(keys['KeyW'] || keys['ArrowUp']) moveDir.add(camFwd);
            if(keys['KeyS'] || keys['ArrowDown']) moveDir.sub(camFwd);
            if(keys['KeyA'] || keys['ArrowLeft']) moveDir.add(camRgt);
            if(keys['KeyD'] || keys['ArrowRight']) moveDir.sub(camRgt);

            if(moveDir.length() > 0) {
                moveDir.normalize();
                camHeading.lerp(moveDir, 0.1).normalize();
                pBody.velocity.set(moveDir.x*16, moveDir.y*16, moveDir.z*16);
            }

            // Alignment & Camera
            playerGroup.position.copy(pPos);
            playerGroup.up.copy(up);
            playerGroup.lookAt(pPos.clone().add(camHeading.projectOnPlane(up).normalize()));

            const targetCam = pPos.clone()
                .add(camHeading.clone().multiplyScalar(-28))
                .add(up.clone().multiplyScalar(15))
                .add(new THREE.Vector3().crossVectors(up, camHeading).multiplyScalar(8));
            
            camera.position.lerp(targetCam, 0.05);
            camera.lookAt(pPos.clone().add(camHeading.clone().multiplyScalar(6)));

            renderer.render(scene, camera);
        }
        loop();
    </script>
</body>
</html>
