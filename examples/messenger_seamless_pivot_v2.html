<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Seamless Pivot</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: sans-serif; }
        .overlay { position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; z-index:1000; text-align:center; transition: opacity 0.5s; }
        #loading-screen { background:#000; }
        #start-screen { background:rgba(0,0,0,0.8); backdrop-filter:blur(10px); display:none; }
        #win-screen { background:rgba(0,30,60,0.9); backdrop-filter:blur(8px); display:none; }
        #ui-main, #quest-log { position:absolute; top:20px; color:white; background:rgba(0,0,0,0.7); padding:15px; border-radius:8px; display:none; }
        #ui-main { left:20px; border-left:4px solid #ffaa00; }
        #quest-log { right:20px; width:200px; border-right:4px solid #00f2ff; }
        h1 { font-size:3.5em; color:#ffaa00; letter-spacing:5px; margin:0; }
        button { background:#ffaa00; border:none; padding:15px 40px; cursor:pointer; border-radius:50px; font-weight:bold; font-size:1.2em; margin-top:20px; }
        .complete { text-decoration:line-through; color:#00ffaa; opacity:0.6; }
        .spinner { width:40px; height:40px; border:4px solid #333; border-top-color:#ffaa00; border-radius:50%; animation:s 1s linear infinite; }
        @keyframes s { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-screen" class="overlay"><div class="spinner"></div></div>
    <div id="start-screen" class="overlay">
        <h1>MESSENGER</h1>
        <button id="btn-start">START MISSION</button>
        <p style="color:#aaa; margin-top:10px;">A/D to Rotate Pivot • W/S to Glide</p>
    </div>
    <div id="win-screen" class="overlay">
        <h1 style="color:#00f2ff">MISSION COMPLETE</h1>
        <button onclick="location.reload()">REPLAY</button>
    </div>
    <div id="ui-main"><b>MESSENGER</b></div>
    <div id="quest-log"><div id="quest-list"></div></div>

    <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js" } }</script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        let started = false;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 3000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- PHYSICS ---
        const world = new CANNON.World();
        const groundMat = new CANNON.Material();
        const slipperMat = new CANNON.Material();
        world.addContactMaterial(new CANNON.ContactMaterial(groundMat, slipperMat, { friction:0, restitution:0.1 }));

        const skyMat = new THREE.ShaderMaterial({
            side: THREE.BackSide,
            uniforms: { t: { value: new THREE.Color(0x0077ff) }, b: { value: new THREE.Color(0xffaa00) } },
            vertexShader: `varying vec3 vP; void main(){vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
            fragmentShader: `varying vec3 vP; uniform vec3 t; uniform vec3 b; void main(){float h=normalize(vP).y*0.5+0.5; gl_FragColor=vec4(mix(b,t,h),1.0);}`
        });
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(1000), skyMat));

        const toon = (c) => new THREE.ShaderMaterial({
            uniforms: { uC: { value: new THREE.Color(c) }, uS: { value: new THREE.Vector3(1,1,0.5).normalize() } },
            vertexShader: `varying vec3 vN; void main(){vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
            fragmentShader: `varying vec3 vN; uniform vec3 uC; uniform vec3 uS; void main(){float d=dot(vN,uS); float s=d>0.5?1.0:(d>0.1?0.6:0.3); gl_FragColor=vec4(uC*s,1.0);}`
        });

        const planetR = 40;
        const planetMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(planetR, 5), toon(0x66cc66));
        scene.add(planetMesh);
        world.addBody(new CANNON.Body({ mass:0, shape:new CANNON.Sphere(planetR), material:groundMat }));

        const colls = [planetMesh];
        for(let i=0; i<40; i++){
            const h = Math.random()*5+3;
            const m = new THREE.Mesh(new THREE.BoxGeometry(3,h,3), toon(0xdddddd));
            m.position.setFromSphericalCoords(planetR, Math.random()*Math.PI, Math.random()*Math.PI*2);
            m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), m.position.clone().normalize());
            scene.add(m); colls.push(m);
            const b = new CANNON.Body({ mass:0 }); b.addShape(new CANNON.Box(new CANNON.Vec3(1.5, h/2, 1.5)));
            b.position.copy(m.position); b.quaternion.copy(m.quaternion); world.addBody(b);
        }

        // --- QUESTS ---
        const state = { inv: [], won: false, quests: [{id:'h', t:'Heal People', c:0, tar:3}, {id:'r', t:'Retrieve Relic', c:0, tar:1, req:'Keycard'}] };
        const actors = [];
        const spawn = (c, ty, id, p) => {
            const m = new THREE.Mesh(new THREE.SphereGeometry(1.2), toon(c));
            m.position.copy(p); scene.add(m); actors.push({ m, ty, id, a:true });
        };
        for(let i=0; i<3; i++) spawn(0x00ccff,'h','p', new THREE.Vector3().setFromSphericalCoords(planetR+1.5, Math.random()*Math.PI, Math.random()*Math.PI*2));
        spawn(0xffff00,'i','Keycard', new THREE.Vector3().setFromSphericalCoords(planetR+1.5, 0.8, 0.8));
        spawn(0xff00ff,'r','r', new THREE.Vector3().setFromSphericalCoords(planetR+1.5, -0.8, -0.8));

        const ui = () => {
            document.getElementById('quest-list').innerHTML = state.quests.map(q=>`<div class="${q.c>=q.tar?'complete':''}">• ${q.t} ${q.c}/${q.tar}</div>`).join('');
            if(state.quests.every(q=>q.c>=q.tar)){ state.won=true; document.getElementById('win-screen').style.display='flex'; }
        };

        // --- PLAYER ---
        const player = new THREE.Group();
        player.add(new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), toon(0xff4444)));
        player.add(new THREE.Mesh(new THREE.BoxGeometry(1.1, 2.1, 1.1), new THREE.MeshBasicMaterial({color:0, side:THREE.BackSide})));
        scene.add(player);
        const pBody = new CANNON.Body({ mass:1, shape:new CANNON.Box(new CANNON.Vec3(0.5,1,0.5)), material:slipperMat, linearDamping:0.9 });
        pBody.position.set(0, planetR+5, 0); world.addBody(pBody);

        // --- SEAMLESS PIVOT MOVEMENT STATE ---
        const keys = {};
        const dummy = new THREE.Object3D();
        const camPivot = new THREE.Vector3();
        let camHeading = new THREE.Vector3(0, 0, 1); 
        let zoomVal = 0;

        window.onkeydown=(e)=>keys[e.code]=true;
        window.onkeyup=(e)=>keys[e.code]=false;

        window.onload=()=>{ setTimeout(()=>{ document.getElementById('loading-screen').style.display='none'; document.getElementById('start-screen').style.display='flex'; }, 1200); };
        document.getElementById('btn-start').onclick=()=>{
            document.getElementById('start-screen').style.opacity='0';
            setTimeout(()=>{ 
                document.getElementById('start-screen').style.display='none';
                document.getElementById('ui-main').style.display='block'; document.getElementById('quest-log').style.display='block';
                started = true; ui();
            }, 500);
        };

        function loop() {
            requestAnimationFrame(loop);
            if(!started || state.won) { renderer.render(scene, camera); return; }

            world.step(1/60);
            const pPos = new THREE.Vector3().copy(pBody.position);
            const up = pPos.clone().normalize();
            pBody.applyForce(up.clone().multiplyScalar(-40), pBody.position);

            actors.forEach(a=>{
                if(a.a && pPos.distanceTo(a.m.position)<2.5){
                    if(a.ty==='h'){ state.quests[0].c++; a.a=false; scene.remove(a.m); }
                    if(a.ty==='i'){ state.inv.push(a.id); a.a=false; scene.remove(a.m); }
                    if(a.ty==='r' && state.inv.includes('Keycard')){ state.quests[1].c++; a.a=false; scene.remove(a.m); }
                    ui();
                }
            });

            // 1. SEAMLESS PIVOT LOGIC
            const viewForward = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
            const viewRight = new THREE.Vector3().crossVectors(up, viewForward).normalize();

            // Rotate the pivot (camHeading) even when not moving to prevent jumps
            const turnSpeed = 0.045;
            if (keys['KeyA'] || keys['ArrowLeft']) camHeading.add(viewRight.clone().multiplyScalar(turnSpeed)).normalize();
            if (keys['KeyD'] || keys['ArrowRight']) camHeading.sub(viewRight.clone().multiplyScalar(turnSpeed)).normalize();

            // 2. MOVEMENT ON PIVOT
            let moveDir = new THREE.Vector3(0, 0, 0);
            if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(camHeading);
            if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(camHeading);

            if (moveDir.length() > 0) {
                const speed = 12;
                pBody.velocity.set(moveDir.x * speed, moveDir.y * speed, moveDir.z * speed);
                zoomVal = THREE.MathUtils.lerp(zoomVal, 1, 0.05);
            } else {
                pBody.velocity.scale(0.9, pBody.velocity);
                zoomVal = THREE.MathUtils.lerp(zoomVal, 0, 0.03);
            }

            // 3. CHARACTER ORIENTATION
            player.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);
            dummy.position.set(0,0,0);
            dummy.lookAt(camHeading); // Character always faces the pivot
            player.quaternion.multiply(dummy.quaternion);

            // 4. DYNAMIC CHASE CAMERA (TOP THIRD CONSTRAINT)
            const dynamicDist = 28 - (zoomVal * 6);
            const dynamicHeight = 14 - (zoomVal * 3);

            camPivot.lerp(pPos, 0.04);
            const curFwd = camHeading.clone().normalize();
            const curRgt = new THREE.Vector3().crossVectors(up, curFwd).normalize();

            const targetCamPos = camPivot.clone()
                .add(curFwd.clone().multiplyScalar(-dynamicDist)) 
                .add(up.clone().multiplyScalar(dynamicHeight))              
                .add(curRgt.clone().multiplyScalar(8)); 

            camera.position.lerp(targetCamPos, 0.04);
            
            const lookTarget = camPivot.clone()
                .add(curFwd.clone().multiplyScalar(8))
                .add(curRgt.clone().multiplyScalar(3))
                .sub(up.clone().multiplyScalar(4));
            
            camera.lookAt(lookTarget);

            player.position.copy(pBody.position);
            renderer.render(scene, camera);
        }
        loop();
    </script>
</body>
</html>
