<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Ink.js Dialogue System</title>
    <style>
        body { margin: 0; overflow: hidden; background: #010105; font-family: 'Courier New', Courier, monospace; text-transform: uppercase; user-select: none; }
        .overlay { position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; z-index:1000; text-align:center; background:rgba(0,0,0,0.95); }
        
        .panel { position:absolute; color:white; background:rgba(0,10,20,0.9); padding:15px; border: 1px solid #00f2ff; backdrop-filter: blur(10px); pointer-events: none; z-index: 10; }
        #panel-inv { top:20px; left:20px; width:200px; border-left: 4px solid #ffaa00; }
        #panel-quest { top:20px; right:20px; width:240px; border-right: 4px solid #00f2ff; }
        
        /* Floating Ink UI Bubble */
        #npc-ui-container { position: absolute; top: 0; left: 0; pointer-events: none; width: 100%; height: 100%; z-index: 5; }
        .npc-bubble { 
            position: absolute; background: rgba(0, 5, 10, 0.98); color: #00f2ff; 
            padding: 15px; border: 1px solid #00f2ff; border-radius: 4px;
            font-size: 0.85em; transform: translate(-50%, -100%);
            display: none; width: 280px; box-shadow: 0 0 20px rgba(0,242,255,0.4);
            pointer-events: auto; /* Allow clicking choices */
        }
        .npc-name { color: #ffaa00; font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid #333; display: block; }
        .choice-btn { 
            display: block; width: 100%; background: none; border: 1px solid #333; 
            color: #aaa; text-align: left; padding: 5px 8px; margin-top: 5px; 
            cursor: pointer; font-family: inherit; font-size: 0.9em;
        }
        .choice-btn:hover { background: rgba(0,242,255,0.1); color: #00f2ff; border-color: #00f2ff; }

        #loc-box { position: absolute; top: 18%; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; display:none; }
        #loc-name { font-size: 2.8em; color: #ffaa00; margin: 0; text-shadow: 0 0 20px #000; }
        
        button#btn-start { background:#ffaa00; border:none; padding:15px 40px; cursor:pointer; font-weight:bold; font-size:1.2em; color: black; box-shadow: 0 4px 0 #b37700; }
    </style>
</head>
<body>
    <div id="start-screen" class="overlay">
        <h1 style="color:#ffaa00; font-size:4em; margin:0; letter-spacing:10px;">MESSENGER</h1>
        <p style="margin-bottom:30px; opacity:0.5;">INK_DIALOGUE_INTEGRATION // V11.0</p>
        <button id="btn-start">INITIALIZE ENGINE</button>
    </div>

    <div id="panel-inv" class="panel"><h3>STORAGE_UNIT</h3><div id="inv-list">0_CELLS</div></div>
    <div id="panel-quest" class="panel"><h3>MISSION_LOG</h3><div id="quest-list"></div></div>
    
    <div id="npc-ui-container">
        <div id="npc-bubble" class="npc-bubble">
            <span id="bubble-name" class="npc-name"></span>
            <div id="bubble-text"></div>
            <div id="bubble-choices"></div>
        </div>
    </div>

    <div id="loc-box"><h2 id="loc-name"></h2></div>

    <!-- INK.JS LIBRARY -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/inkjs/2.2.1/ink.min.js"></script>

    <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js" } }</script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        let started = false;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const sun = new THREE.DirectionalLight(0xffffff, 2.5);
        sun.position.set(100, 200, 100);
        sun.castShadow = true;
        sun.shadow.camera.left = -150; sun.shadow.camera.right = 150;
        sun.shadow.camera.top = 150; sun.shadow.camera.bottom = -150;
        sun.shadow.mapSize.width = 2048; sun.shadow.mapSize.height = 2048;
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0x404040, 1.5));

        const world = new CANNON.World();
        const planetR = 50;

        // --- WORLD ---
        const planet = new THREE.Mesh(new THREE.IcosahedronGeometry(planetR, 5), new THREE.MeshToonMaterial({ color: 0x1a251a }));
        planet.receiveShadow = true;
        scene.add(planet);
        world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetR) }));

        // INK DIALOGUE DATA (Placeholder for JSON files)
        const inkStorySource = {
            'NPC_UNIT_ECHO': {
                content: `
                    Welcome back, Messenger. # name: Unit-01 Echo
                    * [Status report?]
                        Systems are at 84%. The Signal Spire is offline.
                        * * [How do I fix it?]
                            Find the Data Cells. They are scattered across the North Quadrant. -> END
                    * [Who are you?]
                        I am the last stable echo of this planet's core. -> END
                `
            }
        };

        let currentStory = null;

        const npcs = [{ name: "NPC_UNIT_ECHO", pos: [0.1, 0.1, 0.1], color: 0x00f2ff }];
        const npcObjs = npcs.map(d => {
            const m = new THREE.Mesh(new THREE.CapsuleGeometry(1, 2, 4), new THREE.MeshToonMaterial({ color: d.color }));
            const p = new THREE.Vector3().setFromSphericalCoords(planetR + 1.5, d.pos[0]*Math.PI, d.pos[1]*Math.PI*2);
            m.position.copy(p); m.up.copy(p.clone().normalize()); m.lookAt(0,0,0); m.rotateX(Math.PI/2);
            m.castShadow = true; scene.add(m); return { mesh: m, data: d };
        });

        // PLAYER
        const pBody = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5)), fixedRotation: true, linearDamping: 0.9 });
        pBody.position.set(0, planetR + 10, 0); world.addBody(pBody);
        const playerMesh = new THREE.Group();
        const pVis = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 1.2), new THREE.MeshToonMaterial({ color: 0xff3333 }));
        pVis.castShadow = true; playerMesh.add(pVis); scene.add(playerMesh);

        const keys = {};
        let camHeading = new THREE.Vector3(0, 0, 1);
        let activeNpc = null;

        window.addEventListener('keydown', e => { 
            keys[e.code] = true;
            if(e.code === 'Space' && started) {
                const up = new THREE.Vector3().copy(pBody.position).normalize();
                pBody.applyImpulse(new CANNON.Vec3(up.x * 12, up.y * 12, up.z * 12), pBody.position);
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        // --- DIALOGUE UI CONTROLLER ---
        const startDialogue = (npcId) => {
            if(!inkStorySource[npcId]) return;
            // In a real scenario, you'd load the JSON here: 
            // story = new inkjs.Story(loadedJson);
            // For now, we simulate with a simple text parser or placeholder
            document.getElementById('bubble-name').innerText = npcId.replace('NPC_', '');
            document.getElementById('bubble-text').innerText = "SYSTEM CONNECTED: INITIALIZING INK_RUNTIME...";
            document.getElementById('bubble-choices').innerHTML = "<button class='choice-btn'>[Begin Sync]</button>";
            
            // To be replaced with full InkJS logic:
            // currentStory = new inkjs.Story(inkStorySource[npcId].json);
            // continueStory();
        };

        document.getElementById('btn-start').onclick = () => { started = true; document.getElementById('start-screen').style.display='none'; };

        function loop() {
            requestAnimationFrame(loop);
            world.step(1/60);
            const pPos = new THREE.Vector3().copy(pBody.position);
            const up = pPos.clone().normalize();
            pBody.applyForce(up.clone().multiplyScalar(-75), pBody.position);

            if(!started) { renderer.render(scene, camera); return; }

            // NPC Dialogue Radius
            let foundNpc = null;
            npcObjs.forEach(o => { if(pPos.distanceTo(o.mesh.position) < 8) foundNpc = o; });
            const bubble = document.getElementById('npc-bubble');
            if(foundNpc) {
                const screenPos = foundNpc.mesh.position.clone().add(up.clone().multiplyScalar(4)).project(camera);
                bubble.style.left = (screenPos.x * 0.5 + 0.5) * window.innerWidth + 'px';
                bubble.style.top = (screenPos.y * -0.5 + 0.5) * window.innerHeight + 'px';
                bubble.style.display = 'block';
                if(activeNpc !== foundNpc) {
                    activeNpc = foundNpc;
                    startDialogue(activeNpc.data.name);
                }
            } else { bubble.style.display = 'none'; activeNpc = null; }

            // Movement & Horizon Lock
            const camFwd = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
            const camRgt = new THREE.Vector3().crossVectors(up, camFwd).normalize();
            let moveDir = new THREE.Vector3(0,0,0);
            if(keys['KeyW'] || keys['ArrowUp']) moveDir.add(camFwd);
            if(keys['KeyS'] || keys['ArrowDown']) moveDir.sub(camFwd);
            if(keys['KeyA'] || keys['ArrowLeft']) moveDir.add(camRgt);
            if(keys['KeyD'] || keys['ArrowRight']) moveDir.sub(camRgt);

            if(moveDir.length() > 0) {
                moveDir.normalize();
                camHeading.lerp(moveDir, 0.1).normalize();
                pBody.velocity.set(moveDir.x*18, moveDir.y*18, moveDir.z*18);
            }

            playerMesh.position.copy(pPos);
            playerMesh.up.copy(up);
            playerMesh.lookAt(pPos.clone().add(camHeading.projectOnPlane(up).normalize()));
            camera.up.copy(up);

            const targetCamPos = pPos.clone()
                .add(camHeading.clone().multiplyScalar(-30))
                .add(up.clone().multiplyScalar(16))
                .add(new THREE.Vector3().crossVectors(up, camHeading).multiplyScalar(8));
            
            camera.position.lerp(targetCamPos, 0.05);
            camera.lookAt(pPos.clone().add(camHeading.clone().multiplyScalar(5)));

            renderer.render(scene, camera);
        }
        loop();
        window.onresize = () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
    </script>
</body>
</html>
