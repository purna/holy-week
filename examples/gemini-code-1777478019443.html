<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Messenger 3D - Audio Enhanced</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
     <style>
/* ===== VARIABLES ===== */ 
:root {
    --bg-main: #010105;
    --panel-bg: rgba(0, 10, 20, 0.88);
    --accent-primary: #00f2ff;
    --accent-secondary: #ffaa00;
    --accent-success: #00ffaa;
    --text-main: #ffffff;
    --glow-soft: 0 0 10px rgba(0,242,255,0.3);
    --glow-strong: 0 0 20px rgba(0,242,255,0.6);
    --shadow-panel: 0 8px 25px rgba(0,0,0,0.6);
}

/* ===== BASE ===== */
body {
    margin: 0;
    overflow: hidden;
    background: var(--bg-main);
    font-family: 'Courier New', monospace;
    text-transform: uppercase;
    user-select: none;
}

/* ===== PANELS ===== */
.panel {
    color: var(--text-main);
    background: var(--panel-bg);
    padding: 12px;
    border: 1px solid var(--accent-primary);
    backdrop-filter: blur(10px);
    width: 200px;
    transform-origin: right center;
    transform: scale(0.85);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.25s ease, opacity 0.2s ease;
    box-shadow: var(--shadow-panel), var(--glow-soft);
}
.panel.open {
    transform: scale(1);
    opacity: 1;
    pointer-events: auto;
}
#panel-quest { border-right: 4px solid var(--accent-primary); }
#panel-inv { border-right: 4px solid var(--accent-secondary); }

#inv-anchor { position: relative; }
#panel-inv {
    position: absolute;
    bottom: calc(100% + 10px);
    right: 0;
}

/* ===== BUTTONS ===== */
.ui-toggle {
    padding: 12px 16px;
    background: rgba(0,10,20,0.8);
    border: 1px solid var(--accent-primary);
    color: var(--accent-primary);
    cursor: pointer;
    font-size: 1.2em;
    border-radius: 4px;
    transition: transform 0.12s ease, background 0.2s, box-shadow 0.2s;
    box-shadow: var(--glow-soft);
}
.ui-toggle:hover {
    background: rgba(0,242,255,0.2);
    box-shadow: var(--glow-strong);
}
.ui-toggle:active {
    transform: scale(0.9);
}
.ui-toggle.active {
    background: rgba(0,242,255,0.3);
    border-color: var(--accent-success);
    color: var(--accent-success);
}

/* ===== SIDEBAR ===== */
#right-sidebar {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px;
    pointer-events: none;
    z-index: 500;
}
#sidebar-top, #sidebar-bottom {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    pointer-events: auto;
}
.sidebar-row {
    display: flex;
    gap: 8px;
}

/* ===== TEXT ===== */
h3 {
    margin: 0 0 10px 0;
    font-size: 0.8em;
    color: var(--accent-secondary);
    opacity: 0.6;
    border-bottom: 1px solid #333;
}
.item {
    font-size: 0.8em;
    margin: 5px 0;
    color: var(--accent-secondary);
    border-left: 2px solid var(--accent-secondary);
    padding-left: 5px;
}
.q-item {
    font-size: 0.8em;
    margin: 12px 0;
    border-bottom: 1px solid #111;
    padding-bottom: 5px;
}
.q-done {
    color: var(--accent-success);
    text-decoration: line-through;
    opacity: 0.4;
}

/* ===== INTERACT PROMPT ===== */
#npc-indicator-container { position: absolute; top: 0; left: 0; pointer-events: none; width: 100%; height: 100%; z-index: 100; }
.interact-prompt {
    position: absolute; background: #ffaa00; color: black;
    padding: 8px 16px; font-weight: bold; border-radius: 4px;
    font-size: 0.8em; transform: translate(-50%, -50%);
    display: none; cursor: pointer; pointer-events: auto;
    box-shadow: 0 0 20px #ffaa00; border: 1px solid white;
    z-index: 200;
}

.npc-bubble {
    position: absolute; background: rgba(0, 5, 10, 0.95); color: #00f2ff;
    padding: 12px 18px; border: 1px solid #00f2ff; border-radius: 2px;
    font-size: 0.85em; text-align: center; transform: translate(-50%, -100%);
    display: none; width: 220px; box-shadow: 0 0 15px rgba(0,242,255,0.3);
    z-index: 150;
}
.npc-bubble::after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 10px solid #00f2ff; }

#local-dialogue-box {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    width: 750px; max-width: 90%; background: rgba(0, 5, 15, 0.98);
    border: 1px solid #00f2ff; border-top: 4px solid #00f2ff;
    padding: 30px; color: white; display: none; z-index: 100;
}
.npc-name-tag { color: #ffaa00; font-size: 1.2em; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid #333; display: block; }
#bubble-text { margin-bottom: 25px; line-height: 1.6; font-size: 1.1em; text-transform: none; min-height: 60px; }
.choice-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice-btn {
    background: rgba(0,242,255,0.05); border: 1px solid #00f2ff55;
    color: #00f2ff; text-align: left; padding: 15px;
    cursor: pointer; font-family: inherit; transition: 0.2s; font-size: 0.9em;
}
.choice-btn:hover { background: rgba(0,242,255,0.2); border-color: #00f2ff; }

button#btn-start, button#btn-replay { background:#ffaa00; border:none; padding:15px 40px; cursor:pointer; font-weight:bold; font-size:1.2em; color: black; }
button#btn-replay { background:#00ffaa; color:#000; }

/* ===== WIPE TRANSITION ===== */
#wipe-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #010105; z-index: 2000; pointer-events: none;
    transform: translateX(-100%);
}
#wipe-overlay.active { animation: wipe-in 1s ease-in-out forwards; }
#wipe-overlay.out { animation: wipe-out 1s ease-in-out forwards; }
@keyframes wipe-in {
    0%   { transform: translateX(-100%); }
    50%  { transform: translateX(0); }
    100% { transform: translateX(100%); }
}
@keyframes wipe-out {
    0%   { transform: translateX(100%); }
    50%  { transform: translateX(0); }
    100% { transform: translateX(-100%); }
}

/* ===== LOCATION BOX ===== */
#loc-box {
    position: absolute; top: 18%; left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none; display: none; z-index: 150;
}
 #loc-name {
     font-size: 2.8em; color: var(--accent-secondary);
     margin: 0; text-shadow: 0 0 20px #000;
 }

 .overlay {
     position: absolute; top:0; left:0; width:100%; height:100%;
     display:flex; flex-direction:column; align-items:center; justify-content:center;
     color:white; z-index:1000; text-align:center; background:rgba(0,0,0,0.95);
 }

#start-screen h1{
    color: var(--accent-secondary);
    font-size: 4em;
    margin: 0;
    letter-spacing: 10px;
}

#start-screen p{
    color: var(--accent-secondary);
    font-size: 1.2em;
    margin-bottom:30px; opacity:0.6; letter-spacing:3px;
}

#win-screen h1{
    color: var(--accent-success);
    font-size: 4em;
    margin: 0;
    letter-spacing: 10px;
}
 #win-screen p{
     color: var(--accent-success);
     font-size: 1.2em;
     margin:20px 0; opacity:0.8; letter-spacing:2px;
 }
     </style>
</head>
<body>
    <div id="start-screen" class="overlay">
        <h1>MESSENGER</h1>
        <p>DELIVER THE SIGNAL</p>
       <button id="btn-start">SYNC INTERFACE</button>
    </div>

    <div id="win-screen" class="overlay" style="display:none;">
        <div id="win-content">
            <h1>MISSION COMPLETE</h1>
            <p>All objectives fulfilled. Signal delivered.</p>
            <button id="btn-replay">REINITIALIZE</button>
        </div>
    </div>

    <div id="right-sidebar">
        <div id="sidebar-top">
             <div class="sidebar-row">
                 <div id="panel-quest" class="panel">
                     <h3>MISSION</h3><div id="quest-list"></div>
                 </div>
                 <button id="btn-quest-toggle" class="ui-toggle" title="Toggle Quest Log">
                     <i class="fas fa-list-check"></i>
                 </button>
             </div>
         </div>

         <div id="sidebar-bottom">
             <div class="sidebar-row" id="inv-anchor">
                 <div id="panel-inv" class="panel">
                     <h3>STORAGE</h3><div id="inv-list">0_CELLS</div>
                 </div>
                 <button id="btn-inv-toggle" class="ui-toggle" title="Toggle Inventory">
                     <i class="fas fa-boxes-stacked"></i>
                 </button>
             </div>
            <div class="sidebar-row">
                <button id="btn-sound-toggle" class="ui-toggle" title="Toggle Music">
                    <i class="fas fa-volume-up"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="npc-indicator-container">
        <div id="world-prompt" class="interact-prompt">CONNECT_TO_ECHO</div>
    </div>

    <div id="loc-box">
        <h2 id="loc-name">LOC_NAME</h2>
    </div>

    <div id="npc-bubble" class="npc-bubble"></div>

    <div id="local-dialogue-box">
        <span id="npc-name-display" class="npc-name-tag">NAME_ID</span>
        <div id="bubble-text">...</div>
        <div id="bubble-choices" class="choice-container"></div>
    </div>

    <div id="wipe-overlay"></div>

    <script src="https://unpkg.com/inkjs@2.2.1/dist/ink.js"></script>
    <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js" } }</script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        let started = false;
        let gameWon = false;
        let inkStory = null;
        let isDialogueOpen = false;
        let npcStories = {}; 

        // --- AUDIO ENGINE ---
        const uiSounds = {
            open: new Howl({ src: ['panel_open.mp3'], volume: 0.4 }),
            close: new Howl({ src: ['panel_close.mp3'], volume: 0.3 }),
            click: new Howl({ src: ['button_click.mp3'], volume: 0.5 }),
            questComplete: new Howl({ src: ['quest_complete.mp3'], volume: 0.7 }),
            victory: new Howl({ src: ['victory_fanfare.mp3'], volume: 0.8 })
        };

        const ambientSounds = {
            birds: new Howl({ src: ['bird_song.mp3'], loop: true, volume: 0, autoplay: false })
        };

        const npcInteractionSounds = {}; 

        const playNpcSound = (npcId, type) => {
            const npc = npcs.find(n => n.id === npcId);
            if (!npc || !npc.audio || !npc.audio[type]) return;
            const key = `${npcId}_${type}`;
            if (!npcInteractionSounds[key]) {
                npcInteractionSounds[key] = new Howl({ src: [npc.audio[type]], volume: 0.6 });
            }
            npcInteractionSounds[key].play();
        };

        // --- CONFIG ---
        const npcs = [
            { 
                id: 1, name: "UNIT-01 ECHO", color: 0x00f2ff, pos: [0.1, 0.1], 
                storyFile: './NPC_UNIT_ECHO_1.json', hasDialogue: true,
                audio: { onEnter: 'echo_enter.mp3', onExit: 'echo_exit.mp3' } 
            },
            { 
                id: 2, name: "UNIT-02 HORIZON", color: 0xffaa00, pos: [0.6, 2.2], 
                storyFile: './NPC_UNIT_ECHO_2.json', hasDialogue: true,
                audio: { onEnter: 'horizon_enter.mp3', onExit: 'horizon_exit.mp3' } 
            },
            { id: 3, name: "SPIRE_MINOR", color: 0x00ffaa, pos: [1.2, 0.3], hasDialogue: false, bubbleMsg: "The Spire awaits..." }
        ];

        const birdNode = new THREE.Vector3().setFromSphericalCoords(52, 0.5 * Math.PI, 0.2 * Math.PI); 

        const locations = [
            { name: "LOC_NORTH_SPIRE", pos: [0.1, 0.5], r: 15, questId: 'RECON' },
            { name: "LOC_SOUTH_SPIRE", pos: [0.9, 2.5], r: 15 }
        ];

        // --- CORE LOGIC ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const world = new CANNON.World();
        const planetR = 50;

        const inventory = [];
        const quests = [
            { id: 'RECON', name: 'NORTH_RECON', task: 'Reach the North Spire', cur: 0, tar: 1, completed: false },
            { id: 'CELLS', name: 'CELL_RECOVERY', task: 'Collect Data Cells', cur: 0, tar: 3, completed: false },
            { id: 'VISIT', name: 'VISIT_HORIZON', task: 'Contact UNIT-02 HORIZON', cur: 0, tar: 1, completed: false }
        ];

        const planet = new THREE.Mesh(new THREE.IcosahedronGeometry(planetR, 5), new THREE.MeshToonMaterial({ color: 0x1a251a }));
        planet.receiveShadow = true;
        scene.add(planet);
        world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetR) }));

        const pBody = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5)), fixedRotation: true, linearDamping: 0.9 });
        pBody.position.set(0, planetR + 10, 0);
        world.addBody(pBody);
        const playerMesh = new THREE.Group();
        const pVis = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 1.2), new THREE.MeshToonMaterial({ color: 0xff3333 }));
        pVis.castShadow = true;
        playerMesh.add(pVis);
        scene.add(playerMesh);

        // --- PICKUPS ---
        const pickups = [];
        for(let i=0; i<6; i++) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshToonMaterial({ color: 0xffaa00 }));
            m.name = `ITEM_DATA_CELL_${i+1}`;
            m.position.setFromSphericalCoords(planetR + 1, Math.random()*Math.PI, Math.random()*Math.PI*2);
            scene.add(m);
            pickups.push(m);
        }

        const npcMeshes = npcs.map(npc => {
            const m = new THREE.Mesh(new THREE.CapsuleGeometry(1, 2), new THREE.MeshToonMaterial({ color: npc.color }));
            const p = new THREE.Vector3().setFromSphericalCoords(planetR + 1.5, npc.pos[0]*Math.PI, npc.pos[1]*Math.PI*2);
            m.position.copy(p);
            m.up.copy(p.clone().normalize());
            m.lookAt(0,0,0); m.rotateX(Math.PI/2);
            scene.add(m);
            return { mesh: m, data: npc };
        });

        const keys = {};
        let camHeading = new THREE.Vector3(0, 0, 1);
        let activeNpc = null;
        let musicEnabled = true;
        let bgMusic = new Howl({ src: ['bg_music.mp3'], loop: true, volume: 0.3 });

        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => keys[e.code] = false);

        const updateQuestProgress = (id, amount = 1) => {
            const q = quests.find(x => x.id === id);
            if(q && !q.completed) {
                q.cur = Math.min(q.tar, q.cur + amount);
                if(q.cur >= q.tar) {
                    q.completed = true;
                    uiSounds.questComplete.play(); // QUEST COMPLETION SOUND
                }
                updateUI();
                checkWinCondition();
            }
        };

        const checkWinCondition = () => {
            if(quests.every(q => q.completed) && !gameWon) {
                gameWon = true;
                bgMusic.stop();
                uiSounds.victory.play(); // WIN SOUND
                document.getElementById('win-screen').style.display = 'flex';
            }
        };

        const updateUI = () => {
            document.getElementById('inv-list').innerHTML = inventory.length ? inventory.map(i => `<div class="item">${i}</div>`).join('') : "0_CELLS";
            document.getElementById('quest-list').innerHTML = quests.map(q => `<div class="q-item ${q.completed?'q-done':''}"><b>${q.name}</b><br><small>${q.task} [${q.cur}/${q.tar}]</small></div>`).join('');
        };

        const continueStory = () => {
            const textEl = document.getElementById('bubble-text');
            const choiceEl = document.getElementById('bubble-choices');
            let txt = "";
            while(inkStory.canContinue) txt += inkStory.Continue();
            textEl.innerHTML = txt;
            choiceEl.innerHTML = "";
            inkStory.currentChoices.forEach(c => {
                const b = document.createElement('button');
                b.className = "choice-btn"; b.innerText = c.text;
                b.onclick = () => { uiSounds.click.play(); inkStory.ChooseChoiceIndex(c.index); continueStory(); };
                choiceEl.appendChild(b);
            });
            if(!inkStory.canContinue && inkStory.currentChoices.length === 0) {
                const b = document.createElement('button');
                b.className = "choice-btn"; b.innerText = "[CLOSE]";
                b.onclick = () => {
                    playNpcSound(activeNpc.data.id, 'onExit');
                    document.getElementById('local-dialogue-box').style.display = 'none';
                    isDialogueOpen = false;
                    pBody.wakeUp();
                    if(activeNpc.data.id === 2) updateQuestProgress('VISIT');
                };
                choiceEl.appendChild(b);
            }
        };

        document.getElementById('world-prompt').onclick = () => {
            if (!activeNpc) return;
            playNpcSound(activeNpc.data.id, 'onEnter');
            pBody.sleep();
            isDialogueOpen = true;
            document.getElementById('local-dialogue-box').style.display = 'block';
            const inkLib = window.inkjs || window.ink;
            inkStory = new inkLib.Story(npcStories[activeNpc.data.id]);
            document.getElementById('npc-name-display').innerText = activeNpc.data.name;
            continueStory();
        };

        document.querySelectorAll('button, .ui-toggle').forEach(btn => {
            btn.addEventListener('click', () => uiSounds.click.play());
        });

        const togglePanel = (panel, btn) => {
            const isOpen = panel.classList.contains('open');
            if (isOpen) {
                uiSounds.close.play();
                panel.classList.remove('open');
                btn.classList.remove('active');
            } else {
                uiSounds.open.play();
                panel.classList.add('open');
                btn.classList.add('active');
            }
        };

        document.getElementById('btn-quest-toggle').onclick = () => togglePanel(document.getElementById('panel-quest'), document.getElementById('btn-quest-toggle'));
        document.getElementById('btn-inv-toggle').onclick = () => togglePanel(document.getElementById('panel-inv'), document.getElementById('btn-inv-toggle'));

        document.getElementById('btn-start').onclick = () => {
            document.getElementById('start-screen').style.display = 'none';
            started = true;
            bgMusic.play();
            ambientSounds.birds.play();
            updateUI();
        };

        document.getElementById('btn-replay').onclick = () => { location.reload(); };

        // --- MAIN LOOP ---
        function loop() {
            requestAnimationFrame(loop);
            world.step(1/60);
            const pPos = new THREE.Vector3().copy(pBody.position);
            const up = pPos.clone().normalize();
            pBody.applyForce(up.clone().multiplyScalar(-75), pBody.position);

            if(!started || gameWon) return;

            // Spatial Audio Proximity
            const distToBird = pPos.distanceTo(birdNode);
            const birdVol = Math.max(0, 1 - (distToBird / 30)); 
            ambientSounds.birds.volume(birdVol * 0.6);

            // Pickup & Location Logic
            pickups.forEach((m, i) => {
                if(m.visible && pPos.distanceTo(m.position) < 3) {
                    m.visible = false;
                    inventory.push(m.name);
                    updateQuestProgress('CELLS');
                    updateUI();
                }
            });

            locations.forEach(loc => {
                const lPos = new THREE.Vector3().setFromSphericalCoords(planetR, loc.pos[0]*Math.PI, loc.pos[1]*Math.PI*2);
                if(pPos.distanceTo(lPos) < loc.r) {
                    if(loc.questId) updateQuestProgress(loc.questId);
                }
            });

            // NPC interaction
            let nearestNpc = null;
            npcMeshes.forEach(n => {
                if (pPos.distanceTo(n.mesh.position) < 8) nearestNpc = n;
            });
            activeNpc = nearestNpc;
            const prompt = document.getElementById('world-prompt');
            if (activeNpc && !isDialogueOpen && activeNpc.data.hasDialogue) {
                prompt.style.display = 'block';
                const sPos = activeNpc.mesh.position.clone().add(up.clone().multiplyScalar(4)).project(camera);
                prompt.style.left = (sPos.x * 0.5 + 0.5) * window.innerWidth + 'px';
                prompt.style.top = (sPos.y * -0.5 + 0.5) * window.innerHeight + 'px';
            } else prompt.style.display = 'none';

            // Movement Logic
            if(!isDialogueOpen) {
                const camFwd = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
                const camRgt = new THREE.Vector3().crossVectors(up, camFwd).normalize();
                let moveDir = new THREE.Vector3(0,0,0);
                if(keys['KeyW']) moveDir.add(camFwd);
                if(keys['KeyS']) moveDir.sub(camFwd);
                if(keys['KeyA']) moveDir.add(camRgt);
                if(keys['KeyD']) moveDir.sub(camRgt);
                if(moveDir.length() > 0) {
                    moveDir.normalize();
                    pBody.velocity.set(moveDir.x*18, moveDir.y*18, moveDir.z*18);
                    camHeading.lerp(moveDir, 0.1);
                }
            }

            playerMesh.position.copy(pPos);
            playerMesh.up.copy(up);
            playerMesh.lookAt(pPos.clone().add(camHeading.projectOnPlane(up).normalize()));

            camera.up.copy(up);
            const tCam = pPos.clone().add(camHeading.clone().multiplyScalar(-30)).add(up.clone().multiplyScalar(15));
            camera.position.lerp(tCam, 0.05);
            camera.lookAt(pPos);

            renderer.render(scene, camera);
        }

        async function init() {
            for (const n of npcs) {
                if (n.storyFile) {
                    const r = await fetch(n.storyFile);
                    npcStories[n.id] = await r.json();
                }
            }
            loop();
        }
        init();
    </script>
</body>
</html>
