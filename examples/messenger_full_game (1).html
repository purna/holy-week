<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Complete Experience</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Overlays */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; z-index: 1000; text-align: center; transition: opacity 0.5s;
        }

        #loading-screen { background: #000; }
        #start-screen { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); }
        #win-screen { background: rgba(0, 30, 60, 0.9); backdrop-filter: blur(8px); display: none; }

        /* UI Elements */
        #ui-main {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px;
            pointer-events: none; border-left: 4px solid #ffaa00; display: none;
        }
        #quest-log {
            position: absolute; top: 20px; right: 20px; color: white;
            background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px;
            width: 200px; border-right: 4px solid #00f2ff; display: none;
        }

        h1 { font-size: 3.5em; margin: 0; letter-spacing: 5px; color: #ffaa00; text-shadow: 0 0 20px rgba(255,170,0,0.5); }
        .spinner { width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid #ffaa00; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        button {
            background: #ffaa00; border: none; padding: 15px 40px; 
            color: black; font-weight: bold; cursor: pointer; border-radius: 50px;
            font-size: 1.2em; transition: transform 0.2s, background 0.2s;
        }
        button:hover { background: #ffcc00; transform: scale(1.05); }
        
        .quest-item { margin-bottom: 8px; font-size: 0.9em; }
        .complete { text-decoration: line-through; color: #00ffaa; opacity: 0.6; }
    </style>
</head>
<body>

    <!-- 1. LOADING SCREEN -->
    <div id="loading-screen" class="overlay">
        <div class="spinner"></div>
        <p>INITIALIZING PLANETARY DATA...</p>
    </div>

    <!-- 2. START SCREEN -->
    <div id="start-screen" class="overlay" style="display:none;">
        <h1>MESSENGER</h1>
        <p style="margin: 20px 0 40px; opacity: 0.8;">RESTORE THE RELIC. HEAL THE PEOPLE.</p>
        <button id="start-button">START MISSION</button>
        <p style="margin-top: 30px; font-size: 0.8em; color: #aaa;">WASD to walk • Click to glide • Mouse to steer</p>
    </div>

    <!-- 3. WIN SCREEN -->
    <div id="win-screen" class="overlay">
        <h1 style="color: #00f2ff;">MISSION SUCCESS</h1>
        <p>All objectives cleared. The atmosphere is stabilizing.</p>
        <button onclick="location.reload()">REPLAY</button>
    </div>

    <!-- 4. IN-GAME UI -->
    <div id="ui-main">
        <b style="color: #ffaa00;">MESSENGER PROTOTYPE</b>
    </div>

    <div id="quest-log">
        <b style="color: #00f2ff;">OBJECTIVES</b>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.2); margin: 10px 0;">
        <div id="quest-list"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        let gameStarted = false;

        // --- 1. ENGINE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 2. ASSETS & WORLD ---
        const world = new CANNON.World();
        const groundMat = new CANNON.Material();
        const slipperMat = new CANNON.Material();
        world.addContactMaterial(new CANNON.ContactMaterial(groundMat, slipperMat, { friction: 0, restitution: 0.1 }));

        const skyMat = new THREE.ShaderMaterial({
            side: THREE.BackSide,
            uniforms: { top: { value: new THREE.Color(0x0077ff) }, bot: { value: new THREE.Color(0xffaa00) } },
            vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `varying vec3 vPos; uniform vec3 top; uniform vec3 bot; void main() { float h = normalize(vPos).y * 0.5 + 0.5; gl_FragColor = vec4(mix(bot, top, h), 1.0); }`
        });
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(800), skyMat));

        const createToonMat = (color) => new THREE.ShaderMaterial({
            uniforms: { uColor: { value: new THREE.Color(color) }, uSun: { value: new THREE.Vector3(1, 1, 0.5).normalize() } },
            vertexShader: `varying vec3 vN; void main() { vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `varying vec3 vN; uniform vec3 uColor; uniform vec3 uSun; void main() { float d = dot(vN, uSun); float c = d > 0.5 ? 1.0 : (d > 0.1 ? 0.6 : 0.3); gl_FragColor = vec4(uColor * c, 1.0); }`
        });

        const planetRadius = 30;
        const planetMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(planetRadius, 5), createToonMat(0x66cc66));
        scene.add(planetMesh);
        world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetRadius), material: groundMat }));

        const collidables = [planetMesh];
        for(let i=0; i<40; i++) {
            const h = Math.random()*4+2;
            const m = new THREE.Mesh(new THREE.BoxGeometry(2,h,2), createToonMat(0xdddddd));
            m.position.setFromSphericalCoords(planetRadius, Math.random()*Math.PI, Math.random()*Math.PI*2);
            m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), m.position.clone().normalize());
            scene.add(m); collidables.push(m);
            const b = new CANNON.Body({ mass:0 }); b.addShape(new CANNON.Box(new CANNON.Vec3(1, h/2, 1)));
            b.position.copy(m.position); b.quaternion.copy(m.quaternion); world.addBody(b);
        }

        // --- 3. QUESTS ---
        const state = { inventory: [], won: false, quests: [
            { id: 'heal', title: 'Heal People', cur: 0, tar: 3 },
            { id: 'relic', title: 'Find Ancient Relic', cur: 0, tar: 1, req: 'Keycard' }
        ]};

        const questActors = [];
        const spawnActor = (color, type, id, pos) => {
            const m = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), createToonMat(color));
            m.position.copy(pos); scene.add(m);
            questActors.push({ mesh: m, type, id, active: true });
        };

        for(let i=0; i<3; i++) spawnActor(0x00ccff, 'heal', 'p', new THREE.Vector3().setFromSphericalCoords(planetRadius+1.2, Math.random()*Math.PI, Math.random()*Math.PI*2));
        spawnActor(0xffff00, 'item', 'Keycard', new THREE.Vector3().setFromSphericalCoords(planetRadius+1.2, 0.7, 0.7));
        spawnActor(0xff00ff, 'relic', 'relic', new THREE.Vector3().setFromSphericalCoords(planetRadius+1.2, -0.7, -0.7));

        const updateUI = () => {
            const list = document.getElementById('quest-list');
            list.innerHTML = state.quests.map(q => `
                <div class="quest-item ${q.cur >= q.tar ? 'complete' : ''}">
                    ${q.title} (${q.cur}/${q.tar})
                    ${q.req && !state.inventory.includes(q.req) && q.cur < q.tar ? '<br><small style="color:#ff4444">Required: ' + q.req + '</small>' : ''}
                </div>
            `).join('');
            
            if(state.quests.every(q => q.cur >= q.tar)) {
                state.won = true;
                document.getElementById('win-screen').style.display = 'flex';
            }
        };

        // --- 4. PLAYER ---
        const playerGroup = new THREE.Group();
        playerGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.6, 0.8), createToonMat(0xff4444)));
        playerGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.7, 0.9), new THREE.MeshBasicMaterial({color:0, side:THREE.BackSide})));
        scene.add(playerGroup);
        const playerBody = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.4,0.8,0.4)), material: slipperMat, linearDamping: 0.9 });
        playerBody.position.set(0, planetRadius+5, 0); world.addBody(playerBody);

        const keys = {};
        let targetPt = null;
        window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
        window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;
        window.onmousedown = (e) => {
            if(!gameStarted) return;
            const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
            const ray = new THREE.Raycaster(); ray.setFromCamera(mouse, camera);
            const h = ray.intersectObjects(collidables);
            if(h.length>0) targetPt = h[0].point;
        };

        let lastDir = new THREE.Vector3(0,0,1), camS = new THREE.Vector3();

        // --- 5. INITIALIZATION ---
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('start-screen').style.display = 'flex';
            }, 1500);
        };

        document.getElementById('start-button').onclick = () => {
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('ui-main').style.display = 'block';
                document.getElementById('quest-log').style.display = 'block';
                gameStarted = true;
                updateUI();
            }, 500);
        };

        // --- 6. GAME LOOP ---
        function loop() {
            requestAnimationFrame(loop);
            if(!gameStarted || state.won) {
                // Keep camera floating even if not started
                renderer.render(scene, camera);
                return;
            }

            world.step(1/60);
            const pPos = new THREE.Vector3().copy(playerBody.position);
            const up = pPos.clone().normalize();
            playerBody.applyForce(up.clone().multiplyScalar(-30), playerBody.position);

            // Trigger detection
            questActors.forEach(a => {
                if(a.active && pPos.distanceTo(a.mesh.position) < 2.2) {
                    if(a.type==='heal') { state.quests[0].cur++; a.active=false; scene.remove(a.mesh); }
                    if(a.type==='item') { state.inventory.push(a.id); a.active=false; scene.remove(a.mesh); }
                    if(a.type==='relic' && state.inventory.includes('Keycard')) { state.quests[1].cur++; a.active=false; scene.remove(a.mesh); }
                    updateUI();
                }
            });

            // Movement logic
            let move = new THREE.Vector3();
            const fwd = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
            const rgt = new THREE.Vector3().crossVectors(up, fwd).normalize();

            if(keys.w || keys.arrowup) move.add(fwd);
            if(keys.s || keys.arrowdown) move.sub(fwd);
            if(keys.a || keys.arrowleft) move.add(rgt);
            if(keys.d || keys.arrowright) move.sub(rgt);
            
            if(targetPt) {
                const to = new THREE.Vector3().subVectors(targetPt, pPos);
                if(to.length()>0.6) move.add(to.projectOnPlane(up).normalize()); else targetPt = null;
            }

            if(move.length()>0) {
                move.normalize(); lastDir.lerp(move, 0.05);
                playerBody.velocity.set(move.x*13, move.y*13, move.z*13);
                const d = new THREE.Object3D(); d.position.copy(pPos);
                d.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), up);
                d.lookAt(pPos.clone().add(move)); playerGroup.quaternion.slerp(d.quaternion, 0.12);
            }

            // Cinematic Camera
            const camT = pPos.clone().add(lastDir.clone().normalize().multiplyScalar(-11)).add(up.multiplyScalar(6.5)).add(rgt.multiplyScalar(5.5));
            camS.lerp(camT, 0.03); camera.position.lerp(camS, 0.05);
            camera.lookAt(pPos.clone().add(lastDir.clone().multiplyScalar(4.5)).sub(up.clone().multiplyScalar(2)));

            playerGroup.position.copy(playerBody.position);
            renderer.render(scene, camera);
        }
        loop();
    </script>
</body>
</html>
