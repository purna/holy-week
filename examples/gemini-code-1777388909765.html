<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Smooth Point & Click</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px;
            pointer-events: none; border-left: 4px solid #ffaa00;
        }
        .key { border: 1px solid white; padding: 2px 6px; border-radius: 4px; margin: 0 2px; font-size: 0.8em; }
    </style>
</head>
<body>
    <div id="ui">
        <b style="color: #ffaa00;">Cinematic Movement</b><br>
        <div style="margin-top: 5px;"><span class="key">Click</span> to walk slowly</div>
        <div style="margin-top: 10px; font-size: 0.9em; opacity: 0.8;">
            - Slowed Rotation & Acceleration<br>
            - Horizon Locked Camera
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        // --- SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa3d5ff);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const world = new CANNON.World();
        world.gravity.set(0, 0, 0);

        const planetRadius = 60;
        const planetMesh = new THREE.Mesh(
            new THREE.IcosahedronGeometry(planetRadius, 6),
            new THREE.MeshStandardMaterial({ color: 0x55aa55, flatShading: true })
        );
        scene.add(planetMesh);
        world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetRadius) }));

        // Player
        const playerBody = new CANNON.Body({
            mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5)), 
            fixedRotation: true, linearDamping: 0.9 
        });
        playerBody.position.set(0, planetRadius + 3, 0);
        world.addBody(playerBody);

        const playerMesh = new THREE.Mesh(
            new THREE.BoxGeometry(1, 2, 1),
            new THREE.MeshStandardMaterial({ color: 0xff4444 })
        );
        scene.add(playerMesh);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        // Inputs
        const keys = {};
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let targetPoint = null;

        window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
        window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;
        
        window.onmousedown = (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObject(planetMesh);
            if (hits.length > 0) targetPoint = hits[0].point;
        };

        const dummy = new THREE.Object3D();
        const camPivot = new THREE.Vector3(); 
        let camHeading = new THREE.Vector3(0, 0, 1);
        let currentMoveVector = new THREE.Vector3(0, 0, 0);

        function update() {
            requestAnimationFrame(update);
            world.step(1/60);

            const pPos = new THREE.Vector3().copy(playerBody.position);
            const up = pPos.clone().normalize();
            playerBody.applyForce(up.clone().multiplyScalar(-40), playerBody.position);

            const camForward = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
            const camRight = new THREE.Vector3().crossVectors(up, camForward).normalize();

            let inputDir = new THREE.Vector3(0, 0, 0);
            
            // 1. Keyboard Input
            if (keys.w) inputDir.add(camForward);
            if (keys.s) inputDir.sub(camForward);
            if (keys.a) inputDir.add(camRight.clone().multiplyScalar(0.4));
            if (keys.d) inputDir.sub(camRight.clone().multiplyScalar(0.4));

            // 2. Smooth Click Navigation
            if (targetPoint) {
                const toTarget = new THREE.Vector3().subVectors(targetPoint, pPos).projectOnPlane(up);
                const distance = toTarget.length();
                
                if (distance > 1.0) {
                    // Normalize and add to the intent
                    inputDir.add(toTarget.normalize());
                } else {
                    targetPoint = null; // Close enough, stop
                }
            }

            // 3. Slow Down the Response
            if (inputDir.length() > 0) {
                inputDir.normalize();
                // Lerp the move vector so the player doesn't snap to a new direction instantly
                currentMoveVector.lerp(inputDir, 0.05); 
                
                const speed = 5; // Slowed down significantly
                playerBody.velocity.set(
                    currentMoveVector.x * speed, 
                    currentMoveVector.y * speed, 
                    currentMoveVector.z * speed
                );

                // Rotate player mesh slowly
                playerMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);
                dummy.position.set(0,0,0);
                dummy.lookAt(currentMoveVector);
                playerMesh.quaternion.multiply(dummy.quaternion);
                
                // Camera follows this smoothed heading
                if (!keys.s) camHeading.lerp(currentMoveVector, 0.02);
            } else {
                playerBody.velocity.scale(0.9, playerBody.velocity);
                currentMoveVector.set(0,0,0);
            }

            // 4. Horizon-Lock Camera
            camPivot.lerp(pPos, 0.03);
            const curFwd = camHeading.clone().normalize();
            const curRgt = new THREE.Vector3().crossVectors(up, curFwd).normalize();

            const targetCamPos = camPivot.clone()
                .add(curFwd.clone().multiplyScalar(-24)) 
                .add(up.clone().multiplyScalar(12))              
                .add(curRgt.clone().multiplyScalar(9)); 

            camera.position.lerp(targetCamPos, 0.04);
            camera.lookAt(camPivot.clone().add(curFwd.multiplyScalar(10)).sub(up.multiplyScalar(5)));

            playerMesh.position.copy(playerBody.position);
            renderer.render(scene, camera);
        }
        update();
    </script>
</body>
</html>
