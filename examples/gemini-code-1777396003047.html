<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - The Quest Mission</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: sans-serif; }
        /* UI Panels from Source */
        .overlay { position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; z-index:1000; text-align:center; transition: opacity 0.5s; }
        #loading-screen { background:#000; }
        #start-screen { background:rgba(0,0,0,0.8); backdrop-filter:blur(10px); display:none; }
        #win-screen { background:rgba(0,30,60,0.9); backdrop-filter:blur(8px); display:none; }
        #ui-main, #quest-log { position:absolute; top:20px; color:white; background:rgba(0,0,0,0.7); padding:15px; border-radius:8px; display:none; }
        #ui-main { left:20px; border-left:4px solid #ffaa00; }
        #quest-log { right:20px; width:220px; border-right:4px solid #00f2ff; }
        h1 { font-size:3.5em; color:#ffaa00; letter-spacing:5px; margin:0; }
        button { background:#ffaa00; border:none; padding:15px 40px; cursor:pointer; border-radius:50px; font-weight:bold; font-size:1.2em; margin-top:20px; color: black; }
        .complete { text-decoration:line-through; color:#00ffaa; opacity:0.6; }
        .spinner { width:40px; height:40px; border:4px solid #333; border-top-color:#ffaa00; border-radius:50%; animation:s 1s linear infinite; }
        @keyframes s { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-screen" class="overlay"><div class="spinner"></div></div>
    <div id="start-screen" class="overlay">
        <h1>MESSENGER</h1>
        <button id="btn-start">START MISSION</button>
        <p style="color:#aaa; margin-top:10px;">A/D to Rotate Pivot • W/S to Glide</p>
    </div>
    <div id="win-screen" class="overlay">
        <h1 style="color:#00f2ff">MISSION COMPLETE</h1>
        <button onclick="location.reload()">REPLAY</button>
    </div>
    <div id="ui-main"><b>MESSENGER OPS</b></div>
    <div id="quest-log"><div id="quest-list"></div></div>

    <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js" } }</script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        let started = false;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 4000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 1. SHADERS & VISUALS ---
        const toon = (c) => new THREE.ShaderMaterial({
            uniforms: { uC: { value: new THREE.Color(c) }, uS: { value: new THREE.Vector3(1,1,0.5).normalize() } },
            vertexShader: `varying vec3 vN; void main(){vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
            fragmentShader: `varying vec3 vN; uniform vec3 uC; uniform vec3 uS; void main(){float d=dot(vN,uS); float s=d>0.5?1.0:(d>0.1?0.6:0.3); gl_FragColor=vec4(uC*s,1.0);}`
        });

        // Skybox
        const skyMat = new THREE.ShaderMaterial({
            side: THREE.BackSide,
            uniforms: { t: { value: new THREE.Color(0x0077ff) }, b: { value: new THREE.Color(0xffaa00) } },
            vertexShader: `varying vec3 vP; void main(){vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
            fragmentShader: `varying vec3 vP; uniform vec3 t; uniform vec3 b; void main(){float h=normalize(vP).y*0.5+0.5; gl_FragColor=vec4(mix(b,t,h),1.0);}`
        });
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(2000), skyMat));

        // --- 2. PHYSICS & PLANET ---
        const world = new CANNON.World();
        const planetR = 60;
        const planetMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(planetR, 6), toon(0x66cc66));
        scene.add(planetMesh);
        const planetBody = new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetR) });
        world.addBody(planetBody);

        // --- 3. QUEST SYSTEM & ACTORS ---
        const state = { 
            inv: [], 
            won: false, 
            quests: [
                {id:'h', t:'Heal Citizens', c:0, tar:3}, 
                {id:'r', t:'Retrieve Ancient Relic', c:0, tar:1, req:'AccessKey'}
            ] 
        };

        const actors = [];
        const spawnActor = (color, type, id, pos) => {
            const m = new THREE.Mesh(new THREE.SphereGeometry(1.5), toon(color));
            m.position.copy(pos);
            scene.add(m);
            actors.push({ m, type, id, active: true });
        };

        // Randomly scatter quest items
        for(let i=0; i<3; i++) {
            const p = new THREE.Vector3().setFromSphericalCoords(planetR+1.5, Math.random()*Math.PI, Math.random()*Math.PI*2);
            spawnActor(0x00ccff, 'h', 'citizen', p);
        }
        spawnActor(0xffff00, 'i', 'AccessKey', new THREE.Vector3().setFromSphericalCoords(planetR+1.5, 1.2, 0.5));
        spawnActor(0xff00ff, 'r', 'relic', new THREE.Vector3().setFromSphericalCoords(planetR+1.5, -1.0, -0.8));

        const updateUI = () => {
            document.getElementById('quest-list').innerHTML = state.quests.map(q => 
                `<div class="${q.c >= q.tar ? 'complete' : ''}">• ${q.t} ${q.c}/${q.tar}</div>`
            ).join('');
            if(state.quests.every(q => q.c >= q.tar)) { 
                state.won = true; 
                document.getElementById('win-screen').style.display = 'flex'; 
            }
        };

        // --- 4. PLAYER ---
        const playerBody = new CANNON.Body({ 
            mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5)), 
            linearDamping: 0.9, fixedRotation: true 
        });
        playerBody.position.set(0, planetR + 5, 0);
        world.addBody(playerBody);

        const playerMesh = new THREE.Group();
        playerMesh.add(new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), toon(0xff4444)));
        scene.add(playerMesh);

        // --- 5. CONTROLS & CAMERA ---
        const keys = {};
        const dummy = new THREE.Object3D();
        const camPivot = new THREE.Vector3();
        let camHeading = new THREE.Vector3(0, 0, 1);
        let zoomVal = 0;

        window.onkeydown = (e) => keys[e.code] = true;
        window.onkeyup = (e) => keys[e.code] = false;

        // UI Handlers
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('start-screen').style.display = 'flex';
            }, 1000);
        };
        document.getElementById('btn-start').onclick = () => {
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('ui-main').style.display = 'block';
                document.getElementById('quest-log').style.display = 'block';
                started = true;
                updateUI();
            }, 500);
        };

        function loop() {
            requestAnimationFrame(loop);
            world.step(1/60);

            const pPos = new THREE.Vector3().copy(playerBody.position);
            const up = pPos.clone().normalize();
            playerBody.applyForce(up.clone().multiplyScalar(-60), playerBody.position);

            if (!started || state.won) {
                playerMesh.position.copy(pPos);
                playerMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);
                renderer.render(scene, camera);
                return;
            }

            // Quest Proximity Check
            actors.forEach(a => {
                if(a.active && pPos.distanceTo(a.m.position) < 3) {
                    if(a.type === 'h') { state.quests[0].c++; a.active = false; scene.remove(a.m); }
                    if(a.type === 'i') { state.inv.push(a.id); a.active = false; scene.remove(a.m); }
                    if(a.type === 'r' && state.inv.includes('AccessKey')) { state.quests[1].c++; a.active = false; scene.remove(a.m); }
                    updateUI();
                }
            });

            // "Zero-Jump" Movement Logic
            const viewForward = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
            const viewRight = new THREE.Vector3().crossVectors(up, viewForward).normalize();

            if (keys['KeyA'] || keys['ArrowLeft']) camHeading.add(viewRight.clone().multiplyScalar(0.04)).normalize();
            if (keys['KeyD'] || keys['ArrowRight']) camHeading.sub(viewRight.clone().multiplyScalar(0.04)).normalize();

            let moveDir = new THREE.Vector3(0, 0, 0);
            if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(camHeading);
            if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(camHeading);

            if (moveDir.length() > 0) {
                const speed = 10;
                playerBody.velocity.set(moveDir.x * speed, moveDir.y * speed, moveDir.z * speed);
                zoomVal = THREE.MathUtils.lerp(zoomVal, 1, 0.05);
            } else {
                playerBody.velocity.scale(0.9, playerBody.velocity);
                zoomVal = THREE.MathUtils.lerp(zoomVal, 0, 0.03);
            }

            // Orientation
            playerMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);
            dummy.position.set(0,0,0);
            dummy.lookAt(camHeading);
            playerMesh.quaternion.multiply(dummy.quaternion);

            // Horizon-Lock Camera
            const dynamicDist = 28 - (zoomVal * 6);
            const dynamicHeight = 14 - (zoomVal * 3);
            camPivot.lerp(pPos, 0.04);
            const curFwd = camHeading.clone().normalize();
            const curRgt = new THREE.Vector3().crossVectors(up, curFwd).normalize();

            const targetCamPos = camPivot.clone()
                .add(curFwd.clone().multiplyScalar(-dynamicDist)) 
                .add(up.clone().multiplyScalar(dynamicHeight))              
                .add(curRgt.clone().multiplyScalar(8)); 

            camera.position.lerp(targetCamPos, 0.04);
            camera.lookAt(camPivot.clone().add(curFwd.clone().multiplyScalar(8)).sub(up.clone().multiplyScalar(4)));

            playerMesh.position.copy(pPos);
            renderer.render(scene, camera);
        }
        loop();
    </script>
</body>
</html>
