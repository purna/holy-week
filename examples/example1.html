<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger-Style 3D Spherical Walker</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            border-left: 4px solid #ff4444;
        }
        .key {
            display: inline-block;
            border: 1px solid white;
            padding: 2px 6px;
            border-radius: 4px;
            margin: 0 2px;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> to Walk</div>
        <div style="margin-top: 8px;">Click anywhere to lock mouse & rotate</div>
        <div style="margin-top: 8px; color: #aaa; font-size: 0.9em;">Character anchored to top of screen</div>
    </div>

    <!-- Import Map for Modern JS Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        // --- 1. INITIALIZATION ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 2. PHYSICS WORLD ---
        const world = new CANNON.World();
        // Gravity is calculated dynamically per-frame, so we keep global gravity at 0
        world.gravity.set(0, 0, 0); 

        // --- 3. THE PLANET ---
        const planetRadius = 15;
        const planetBody = new CANNON.Body({
            mass: 0, // static
            shape: new CANNON.Sphere(planetRadius)
        });
        world.addBody(planetBody);

        const planetMesh = new THREE.Mesh(
            new THREE.IcosahedronGeometry(planetRadius, 4),
            new THREE.MeshStandardMaterial({ 
                color: 0x66bb66, 
                flatShading: true,
                wireframe: false 
            })
        );
        scene.add(planetMesh);

        // Add some "buildings" (simple boxes) around the planet for scale
        for (let i = 0; i < 20; i++) {
            const boxGeo = new THREE.BoxGeometry(1, Math.random() * 3 + 1, 1);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
            const boxMesh = new THREE.Mesh(boxGeo, boxMat);
            
            // Random position on sphere surface
            const phi = Math.acos(-1 + (2 * i) / 20);
            const theta = Math.sqrt(20 * Math.PI) * phi;
            
            boxMesh.position.setFromSphericalCoords(planetRadius, phi, theta);
            boxMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), boxMesh.position.clone().normalize());
            scene.add(boxMesh);
        }

        // --- 4. THE PLAYER ---
        const playerHeight = 1.6;
        const playerBody = new CANNON.Body({
            mass: 1,
            shape: new CANNON.Box(new CANNON.Vec3(0.4, playerHeight/2, 0.4)),
            fixedRotation: true // Prevent tipping over
        });
        playerBody.position.set(0, planetRadius + 5, 0);
        world.addBody(playerBody);

        const playerMesh = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, playerHeight, 0.8),
            new THREE.MeshStandardMaterial({ color: 0xff4444 })
        );
        scene.add(playerMesh);

        // --- 5. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(10, 20, 10);
        scene.add(sun);

        // --- 6. INPUTS & MOUSE LOOK ---
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        let yaw = 0;   // Horizontal rotation
        let pitch = 0.6; // Vertical rotation
        window.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement) {
                yaw -= e.movementX * 0.005;
                pitch = Math.max(0.1, Math.min(1.4, pitch + e.movementY * 0.005));
            }
        });
        window.addEventListener('mousedown', () => document.body.requestPointerLock());

        // --- 7. GAME LOOP ---
        const clock = new THREE.Clock();

        function update() {
            const delta = Math.min(clock.getDelta(), 0.1);
            world.step(1/60);

            const pPos = new THREE.Vector3().copy(playerBody.position);
            const upVec = pPos.clone().normalize();

            // A. Dynamic Spherical Gravity
            const gravityStrength = 20;
            const gravityForce = upVec.clone().multiplyScalar(-gravityStrength);
            playerBody.applyForce(new CANNON.Vec3(gravityForce.x, gravityForce.y, gravityForce.z), playerBody.position);

            // B. Align Player Mesh to Sphere Normal
            playerMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), upVec);

            // C. Camera Positioning (Orbit relative to Player Up-Vector)
            const camDistance = 12;
            const camOffset = new THREE.Vector3(
                Math.sin(yaw) * Math.cos(pitch),
                Math.sin(pitch),
                Math.cos(yaw) * Math.cos(pitch)
            ).multiplyScalar(camDistance);

            // Rotate the offset so it's always relative to the player's orientation on the planet
            camOffset.applyQuaternion(playerMesh.quaternion);
            const targetCamPos = pPos.clone().add(camOffset);
            camera.position.lerp(targetCamPos, 0.1);

            // D. Top-of-Screen Focus
            // Instead of looking at the player, look at the ground BEHIND the player
            // This forces the player character to appear in the upper portion of the screen
            const verticalFocusShift = 3.5; 
            const lookTarget = pPos.clone().sub(upVec.clone().multiplyScalar(verticalFocusShift));
            camera.lookAt(lookTarget);

            // E. Movement (Camera-Relative)
            if (keys.w || keys.s || keys.a || keys.d) {
                // Determine 'Forward' based on camera look direction projected onto the sphere's tangent plane
                const forward = pPos.clone().sub(camera.position).projectOnPlane(upVec).normalize();
                const right = new THREE.Vector3().crossVectors(upVec, forward).normalize();

                let moveDir = new THREE.Vector3(0, 0, 0);
                if (keys.w) moveDir.add(forward);
                if (keys.s) moveDir.sub(forward);
                if (keys.a) moveDir.add(right);
                if (keys.d) moveDir.sub(right);

                moveDir.normalize().multiplyScalar(7);
                playerBody.velocity.set(moveDir.x, moveDir.y, moveDir.z);
            } else {
                // Apply "friction" to stop sliding
                playerBody.velocity.set(0, 0, 0);
            }

            // Sync Mesh
            playerMesh.position.copy(playerBody.position);

            renderer.render(scene, camera);
            requestAnimationFrame(update);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        update();
    </script>
</body>
</html>
