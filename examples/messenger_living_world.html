<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Living World</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: sans-serif; text-transform: uppercase; letter-spacing: 1px; }
        .overlay { position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; z-index:1000; text-align:center; transition: opacity 0.5s; background:rgba(0,0,0,0.8); }
        
        /* UI Panels */
        .panel { position:absolute; color:white; background:rgba(0,10,20,0.85); padding:15px; border-radius:4px; border: 1px solid #00f2ff; backdrop-filter: blur(5px); }
        #panel-quest { top:20px; right:20px; width:220px; border-right: 4px solid #00f2ff; }
        #panel-inv { top:20px; left:20px; width:180px; border-left: 4px solid #ffaa00; }
        
        /* Interaction Popups */
        #msg-box { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #00f2ff; padding: 20px; border: 1px solid #00f2ff; display:none; max-width: 400px; text-align: center; }
        #loc-box { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; display:none; }
        #loc-name { font-size: 2em; color: #ffaa00; margin: 0; text-shadow: 0 0 10px #000; }
        #loc-desc { color: white; font-size: 0.9em; }

        h3 { margin: 0 0 10px 0; font-size: 0.9em; color: #aaa; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .item { font-size: 0.85em; margin: 5px 0; color: #ffaa00; }
        .q-item { font-size: 0.85em; margin: 8px 0; }
        .q-done { color: #00ffaa; text-decoration: line-through; opacity: 0.6; }

        button { background:#ffaa00; border:none; padding:15px 40px; cursor:pointer; border-radius:2px; font-weight:bold; font-size:1.2em; color: black; }
        .spinner { width:40px; height:40px; border:4px solid #333; border-top-color:#ffaa00; border-radius:50%; animation:s 1s linear infinite; }
        @keyframes s { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-screen" class="overlay"><div class="spinner"></div></div>
    
    <div id="start-screen" class="overlay">
        <h1 style="color:#ffaa00; font-size:4em; margin:0;">MESSENGER</h1>
        <p style="margin-bottom:30px; opacity:0.7;">System Version 4.0 // Living World</p>
        <button id="btn-start">INITIALIZE MISSION</button>
    </div>

    <!-- UI Panels -->
    <div id="panel-inv" class="panel">
        <h3>STORAGE_UNIT</h3>
        <div id="inv-list">EMPTY</div>
    </div>

    <div id="panel-quest" class="panel">
        <h3>MISSION_LOG</h3>
        <div id="quest-list"></div>
    </div>

    <!-- Feedback UI -->
    <div id="msg-box"></div>
    <div id="loc-box">
        <h2 id="loc-name"></h2>
        <div id="loc-desc"></div>
    </div>

    <div id="win-screen" class="overlay" style="display:none;">
        <h1 style="color:#00ffaa">DATA SYNC COMPLETE</h1>
        <button onclick="location.reload()">REBOOT</button>
    </div>

    <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js" } }</script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        let started = false;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 4000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- AUDIO ENGINE (Synthesized) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const playBeep = (freq, type="sine", dur=0.1) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        };

        // --- PHYSICS ---
        const world = new CANNON.World();
        world.solver.iterations = 15;
        const planetR = 50;

        // --- WORLD DATA ---
        const questData = [
            { id: 'q_scout', name: 'Planetary Recon', task: 'Visit the North Spire', status: 0, tar: 1 },
            { id: 'q_collect', name: 'Sample Recovery', task: 'Collect Data Modules', status: 0, tar: 3 }
        ];
        const inventory = [];

        const npcs = [
            { name: "Unit-01 (Echo)", msg: "System status nominal. Welcome to the Spire, Messenger.", pos: [0, 1, 0.5], color: 0x00f2ff, sound: 600 },
            { name: "Archive-Bot", msg: "I require the Data Modules found in the Crystal Fields.", pos: [0.7, 0.2, 0.7], color: 0xffaa00, sound: 400 }
        ];

        const locations = [
            { name: "THE NORTH SPIRE", desc: "A derelict transmission tower piercing the atmosphere.", pos: [0.95, 0.1, 0], r: 12 },
            { name: "CRYSTAL FIELDS", desc: "Shattered geometry humming with ancient energy.", pos: [-0.5, -0.5, 0.7], r: 15 }
        ];

        // --- WORLD CREATION ---
        const toon = (c) => new THREE.ShaderMaterial({
            uniforms: { uC: { value: new THREE.Color(c) }, uS: { value: new THREE.Vector3(1,1,0.5).normalize() } },
            vertexShader: `varying vec3 vN; void main(){vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
            fragmentShader: `varying vec3 vN; uniform vec3 uC; uniform vec3 uS; void main(){float d=dot(vN,uS); float s=d>0.5?1.0:(d>0.1?0.6:0.3); gl_FragColor=vec4(uC*s,1.0);}`
        });

        const planetMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(planetR, 5), toon(0x222233));
        scene.add(planetMesh);
        world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetR) }));

        // Spawn Locations & NPCs
        const npcObjects = [];
        npcs.forEach(data => {
            const m = new THREE.Mesh(new THREE.CapsuleGeometry(1, 2, 4, 8), toon(data.color));
            const p = new THREE.Vector3().setFromSphericalCoords(planetR + 1.5, data.pos[0]*Math.PI, data.pos[1]*Math.PI*2);
            m.position.copy(p);
            m.up.copy(p.clone().normalize());
            m.lookAt(new THREE.Vector3(0,0,0)); // Flip to stand upright
            m.rotateX(Math.PI/2);
            scene.add(m);
            npcObjects.push({ mesh: m, data });
        });

        // --- PLAYER ---
        const pBody = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5)), fixedRotation: true, linearDamping: 0.9 });
        pBody.position.set(0, planetR + 10, 0); 
        world.addBody(pBody);
        const playerGroup = new THREE.Group();
        const pVis = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), toon(0xff4444));
        pVis.add(new THREE.Mesh(new THREE.BoxGeometry(1.1, 2.1, 1.1), new THREE.MeshBasicMaterial({color:0, side:THREE.BackSide})));
        playerGroup.add(pVis);
        scene.add(playerGroup);

        // --- CONTROLLER & UI UPDATES ---
        const keys = {};
        let camHeading = new THREE.Vector3(0, 0, 1);
        let activeLoc = null;
        let activeNpc = null;

        const updateUI = () => {
            document.getElementById('inv-list').innerHTML = inventory.length ? inventory.map(i => `<div class="item">ID_${i}</div>`).join('') : "EMPTY";
            document.getElementById('quest-list').innerHTML = questData.map(q => `<div class="q-item ${q.status>=q.tar?'q-done':''}">[${q.name}]<br><small>${q.task} (${q.status}/${q.tar})</small></div>`).join('');
        };

        window.onkeydown = (e) => keys[e.code] = true;
        window.onkeyup = (e) => keys[e.code] = false;

        document.getElementById('btn-start').onclick = () => {
            audioCtx.resume();
            document.getElementById('start-screen').style.display = 'none';
            started = true; updateUI();
        };

        window.onload = () => document.getElementById('loading-screen').style.display = 'none';

        function loop() {
            requestAnimationFrame(loop);
            world.step(1/60);
            const pPos = new THREE.Vector3().copy(pBody.position);
            const up = pPos.clone().normalize();
            pBody.applyForce(up.clone().multiplyScalar(-60), pBody.position);

            if(!started) { renderer.render(scene, camera); return; }

            // --- NPC & LOCATION PROXIMITY ---
            let foundNpc = null;
            npcObjects.forEach(obj => {
                if(pPos.distanceTo(obj.mesh.position) < 5) foundNpc = obj;
            });

            if(foundNpc && activeNpc !== foundNpc) {
                activeNpc = foundNpc;
                const box = document.getElementById('msg-box');
                box.innerHTML = `<b>${foundNpc.data.name}:</b><br>${foundNpc.data.msg}`;
                box.style.display = 'block';
                playBeep(foundNpc.data.sound, "square", 0.15);
            } else if (!foundNpc) {
                activeNpc = null;
                document.getElementById('msg-box').style.display = 'none';
            }

            let currentLoc = null;
            locations.forEach(loc => {
                const lPos = new THREE.Vector3().setFromSphericalCoords(planetR, loc.pos[0]*Math.PI, loc.pos[1]*Math.PI*2);
                if(pPos.distanceTo(lPos) < loc.r) currentLoc = loc;
            });

            if(currentLoc && activeLoc !== currentLoc) {
                activeLoc = currentLoc;
                document.getElementById('loc-name').innerText = activeLoc.name;
                document.getElementById('loc-desc').innerText = activeLoc.desc;
                document.getElementById('loc-box').style.display = 'block';
                playBeep(800, "sine", 0.05);
                // Quest update check
                if(activeLoc.name === "THE NORTH SPIRE" && questData[0].status === 0) { questData[0].status = 1; updateUI(); }
            } else if (!currentLoc) {
                activeLoc = null;
                document.getElementById('loc-box').style.display = 'none';
            }

            // --- MOVEMENT ---
            const camFwd = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
            const camRgt = new THREE.Vector3().crossVectors(up, camFwd).normalize();
            let moveDir = new THREE.Vector3(0,0,0);
            if(keys['KeyW'] || keys['ArrowUp']) moveDir.add(camFwd);
            if(keys['KeyS'] || keys['ArrowDown']) moveDir.sub(camFwd);
            if(keys['KeyA'] || keys['ArrowLeft']) moveDir.add(camRgt);
            if(keys['KeyD'] || keys['ArrowRight']) moveDir.sub(camRgt);

            if(moveDir.length() > 0) {
                moveDir.normalize();
                camHeading.lerp(moveDir, 0.1).normalize();
                pBody.velocity.set(moveDir.x*15, moveDir.y*15, moveDir.z*15);
            }

            // --- PERPENDICULAR ORIENTATION ---
            playerGroup.position.copy(pPos);
            playerGroup.up.copy(up);
            playerGroup.lookAt(pPos.clone().add(camHeading.projectOnPlane(up).normalize()));

            // --- CINEMATIC CAMERA ---
            const targetCam = pPos.clone().add(camHeading.clone().multiplyScalar(-25)).add(up.clone().multiplyScalar(14)).add(new THREE.Vector3().crossVectors(up, camHeading).multiplyScalar(8));
            camera.position.lerp(targetCam, 0.05);
            camera.lookAt(pPos.clone().add(camHeading.clone().multiplyScalar(5)).sub(up.clone().multiplyScalar(2)));

            renderer.render(scene, camera);
        }
        loop();
    </script>
</body>
</html>
