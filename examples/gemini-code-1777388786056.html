<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Top of the World</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px;
            pointer-events: none; border-left: 4px solid #ffaa00;
        }
        .key { border: 1px solid white; padding: 2px 6px; border-radius: 4px; margin: 0 2px; font-size: 0.8em; }
    </style>
</head>
<body>
    <div id="ui">
        <b style="color: #ffaa00;">Horizon Lock Mode</b><br>
        <div style="margin-top: 5px;"><span class="key">WASD</span> / <span class="key">Arrows</span></div>
        <div style="margin-top: 5px;"><span class="key">Click</span> to Move</div>
        <div style="margin-top: 10px; font-size: 0.9em; opacity: 0.8;">
            - Framing: Top Third of Sphere Only<br>
            - Camera: High-Inertia Cinematic Glide<br>
            - Physics: Synced Backward Movement
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        // --- 1. CORE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa3d5ff);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 2. PHYSICS ---
        const world = new CANNON.World();
        world.gravity.set(0, 0, 0);

        // --- 3. THE PLANET (Radius 60) ---
        const planetRadius = 60;
        const planetBody = new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetRadius) });
        world.addBody(planetBody);

        const planetMesh = new THREE.Mesh(
            new THREE.IcosahedronGeometry(planetRadius, 6),
            new THREE.MeshStandardMaterial({ color: 0x55aa55, flatShading: true })
        );
        scene.add(planetMesh);

        // Populate with Landmarks
        const collidableObjects = [planetMesh];
        for (let i = 0; i < 150; i++) {
            const h = Math.random() * 6 + 3;
            const bMesh = new THREE.Mesh(new THREE.BoxGeometry(3, h, 3), new THREE.MeshStandardMaterial({ color: 0x888888 }));
            const phi = Math.acos(-1 + (2 * i) / 150);
            const theta = Math.sqrt(150 * Math.PI) * phi;
            const pos = new THREE.Vector3().setFromSphericalCoords(planetRadius + h/2, phi, theta);
            bMesh.position.copy(pos);
            bMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), pos.clone().normalize());
            scene.add(bMesh);
            collidableObjects.push(bMesh);

            const bBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(1.5, h/2, 1.5)) });
            bBody.position.copy(pos);
            bBody.quaternion.copy(bMesh.quaternion);
            world.addBody(bBody);
        }

        // --- 4. PLAYER ---
        const playerBody = new CANNON.Body({
            mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5)), 
            fixedRotation: true, linearDamping: 0.95 
        });
        playerBody.position.set(0, planetRadius + 5, 0);
        world.addBody(playerBody);

        const playerMesh = new THREE.Mesh(
            new THREE.BoxGeometry(1, 2, 1),
            new THREE.MeshStandardMaterial({ color: 0xff4444 })
        );
        scene.add(playerMesh);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(100, 200, 100); scene.add(sun);

        // --- 5. INPUTS ---
        const keys = {};
        const mouse = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        let targetPoint = null;

        window.onkeydown = (e) => keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true;
        window.onkeyup = (e) => keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false;
        window.onmousedown = (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(collidableObjects);
            if (hits.length > 0) targetPoint = hits[0].point;
        };

        // --- 6. CINEMATIC TRACKING ---
        const dummy = new THREE.Object3D();
        const camPivot = new THREE.Vector3(); 
        let camHeading = new THREE.Vector3(0, 0, 1); 

        function update() {
            requestAnimationFrame(update);
            world.step(1/60);

            const pPos = new THREE.Vector3().copy(playerBody.position);
            const upVector = pPos.clone().normalize();

            // Heavy Gravity
            playerBody.applyForce(upVector.clone().multiplyScalar(-50), playerBody.position);

            // Movement Logic
            const camForward = pPos.clone().sub(camera.position).projectOnPlane(upVector).normalize();
            const camRight = new THREE.Vector3().crossVectors(upVector, camForward).normalize();

            let moveDir = new THREE.Vector3(0, 0, 0);
            const isMovingBackward = (keys.s || keys.arrowdown);

            // Speed Balancing
            const runSpeed = 7;
            const turnFactor = 0.4; // Slower left/right turns
            const backSpeedSync = 5.2; // Synced to keep player at top third

            if (keys.w || keys.arrowup) moveDir.add(camForward.clone().multiplyScalar(runSpeed));
            if (isMovingBackward) moveDir.sub(camForward.clone().multiplyScalar(backSpeedSync));
            if (keys.a || keys.arrowleft) moveDir.add(camRight.clone().multiplyScalar(runSpeed * turnFactor));
            if (keys.d || keys.arrowright) moveDir.sub(camRight.clone().multiplyScalar(runSpeed * turnFactor));

            if (targetPoint) {
                const toTarget = new THREE.Vector3().subVectors(targetPoint, pPos);
                if (toTarget.length() > 1.5) moveDir.add(toTarget.projectOnPlane(upVector).normalize().multiplyScalar(runSpeed));
                else targetPoint = null;
            }

            if (moveDir.length() > 0) {
                playerBody.velocity.set(moveDir.x, moveDir.y, moveDir.z);
                
                if (!isMovingBackward) {
                    camHeading.lerp(moveDir.clone().normalize(), 0.02); 
                }

                // ALWAYS PERPENDICULAR ORIENTATION
                playerMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), upVector);
                dummy.position.set(0, 0, 0);
                dummy.lookAt(moveDir.clone().projectOnPlane(upVector));
                playerMesh.quaternion.multiply(dummy.quaternion);
            } else {
                playerBody.velocity.scale(0.9, playerBody.velocity);
            }

            // --- HORIZON-LOCK CINEMATIC CAMERA ---
            camPivot.lerp(pPos, 0.03); 
            const currentForward = camHeading.clone().normalize();
            const currentRight = new THREE.Vector3().crossVectors(upVector, currentForward).normalize();

            // Position camera far back and high to crop the "sides/bottom"
            const camDist = 24; 
            const camHeight = 12; 
            const camSideOffset = 9; 

            const targetCamPos = camPivot.clone()
                .add(currentForward.clone().multiplyScalar(-camDist)) 
                .add(upVector.clone().multiplyScalar(camHeight))              
                .add(currentRight.clone().multiplyScalar(camSideOffset)); 

            camera.position.lerp(targetCamPos, 0.04);

            // Look deep into the horizon and 'down' to hide the bottom/sides
            const lookTarget = camPivot.clone()
                .add(currentForward.clone().multiplyScalar(10)) 
                .add(currentRight.clone().multiplyScalar(4))   
                .sub(upVector.clone().multiplyScalar(5)); // High downward tilt to keep top-third in focus

            camera.lookAt(lookTarget);

            playerMesh.position.copy(playerBody.position);
            renderer.render(scene, camera);
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
        update();
    </script>
</body>
</html>
