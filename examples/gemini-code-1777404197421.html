<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Shadows Enabled</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: sans-serif; }
        .overlay { position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; z-index:1000; text-align:center; transition: opacity 0.5s; }
        #ui-main { position:absolute; top:20px; left:20px; color:white; background:rgba(0,0,0,0.8); padding:15px; border-radius:8px; display:none; border: 1px solid #ffaa00; }
        button { background:#ffaa00; border:none; padding:15px 40px; cursor:pointer; border-radius:50px; font-weight:bold; margin-top:20px; }
    </style>
</head>
<body>
    <div id="start-screen" class="overlay">
        <h1>MESSENGER</h1>
        <button id="btn-start">START MISSION</button>
    </div>
    <div id="ui-main"><b>SHADOW OPS ENABLED</b></div>

    <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js" } }</script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        let started = false;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 3000);
        
        // --- RENDERER WITH SHADOWS ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Enable shadow maps
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Softer shadow edges
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING WITH SHADOW CASTING ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambient);

        const sun = new THREE.DirectionalLight(0xffffff, 1.5);
        sun.position.set(50, 100, 50);
        sun.castShadow = true; 
        
        // Setup shadow properties for the sun
        sun.shadow.mapSize.width = 2048; 
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 500;
        sun.shadow.camera.left = -100;
        sun.shadow.camera.right = 100;
        sun.shadow.camera.top = 100;
        sun.shadow.camera.bottom = -100;
        scene.add(sun);

        // --- PHYSICS & WORLD ---
        const world = new CANNON.World();
        const planetR = 40;
        
        // Standard Material for better shadow response
        const mat = (col) => new THREE.MeshStandardMaterial({ color: col, flatShading: true });

        const planetMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(planetR, 5), mat(0x55aa55));
        planetMesh.receiveShadow = true; // Planet catches shadows
        scene.add(planetMesh);
        world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetR) }));

        // Primitives
        const collidables = [planetMesh];
        for(let i=0; i<40; i++){
            const h = Math.random() * 5 + 2;
            const m = new THREE.Mesh(new THREE.BoxGeometry(3, h, 3), mat(0x888888));
            const pos = new THREE.Vector3().setFromSphericalCoords(planetR, Math.random()*Math.PI, Math.random()*Math.PI*2);
            m.position.copy(pos);
            m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), pos.clone().normalize());
            
            m.castShadow = true;   // Objects cast shadows
            m.receiveShadow = true; // Objects can have shadows cast on them
            
            scene.add(m); collidables.push(m);
            const b = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(1.5, h/2, 1.5)) });
            b.position.copy(pos); b.quaternion.copy(m.quaternion);
            world.addBody(b);
        }

        // --- PLAYER ---
        const pBody = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5)), fixedRotation: true, linearDamping: 0.9 });
        pBody.position.set(0, planetR + 5, 0);
        world.addBody(pBody);
        
        const playerMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), mat(0xff4444));
        playerMesh.castShadow = true; // Player casts a shadow
        scene.add(playerMesh);

        // --- INPUTS ---
        const keys = {};
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let clickTarget = null;
        let camHeading = new THREE.Vector3(0, 0, 1);
        const dummy = new THREE.Object3D();

        window.onkeydown = (e) => { keys[e.code] = true; clickTarget = null; };
        window.onkeyup = (e) => keys[e.code] = false;
        window.onmousedown = (e) => {
            if(!started) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(collidables);
            if (hits.length > 0) clickTarget = hits[0].point;
        };

        document.getElementById('btn-start').onclick = () => {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-main').style.display = 'block';
            started = true;
        };

        function loop() {
            requestAnimationFrame(loop);
            world.step(1/60);

            const pPos = new THREE.Vector3().copy(pBody.position);
            const up = pPos.clone().normalize();
            pBody.applyForce(up.clone().multiplyScalar(-60), pBody.position); 

            if (started) {
                // Move sun light to stay near player for shadow performance
                sun.position.copy(pPos).add(up.clone().multiplyScalar(50)).add(new THREE.Vector3(20, 20, 20));
                sun.target.position.copy(pPos);
                sun.target.updateMatrixWorld();

                const camFwd = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
                const camRgt = new THREE.Vector3().crossVectors(up, camFwd).normalize();

                let moveDir = new THREE.Vector3(0, 0, 0);
                if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(camFwd);
                if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(camFwd);
                if (keys['KeyA'] || keys['ArrowLeft']) moveDir.add(camRgt);
                if (keys['KeyD'] || keys['ArrowRight']) moveDir.sub(camRgt);

                if (clickTarget) {
                    const toClick = clickTarget.clone().sub(pPos).projectOnPlane(up);
                    if (toClick.length() > 1.5) moveDir.add(toClick.normalize());
                    else clickTarget = null;
                }

                if (moveDir.length() > 0) {
                    moveDir.normalize();
                    camHeading.lerp(moveDir, 0.1).normalize();
                    const speed = 10; // Capped speed for sync
                    pBody.velocity.set(moveDir.x * speed, moveDir.y * speed, moveDir.z * speed);
                } else {
                    pBody.velocity.scale(0.9, pBody.velocity);
                }

                // Perpendicular alignment
                playerMesh.position.copy(pPos);
                playerMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);
                dummy.position.set(0, 0, 0);
                dummy.lookAt(camHeading);
                playerMesh.quaternion.multiply(dummy.quaternion);

                // Camera
                const targetCam = pPos.clone().add(camHeading.clone().multiplyScalar(-25)).add(up.clone().multiplyScalar(12));
                camera.position.lerp(targetCam, 0.05);
                camera.lookAt(pPos);
            }

            renderer.render(scene, camera);
        }
        loop();
    </script>
</body>
</html>
