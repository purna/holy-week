<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Zero-Jump Rotation</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px;
            pointer-events: none; border-left: 4px solid #ffaa00;
        }
        .key { border: 1px solid white; padding: 2px 6px; border-radius: 4px; margin: 0 2px; font-size: 0.8em; }
    </style>
</head>
<body>
    <div id="ui">
        <b style="color: #ffaa00;">Seamless Pivot Controls</b><br>
        <div style="margin-top: 5px;"><span class="key">A/D</span> or <span class="key">Arrows</span> to Rotate Pivot</div>
        <div style="margin-top: 5px;"><span class="key">W/S</span> to Move on Pivot</div>
        <div style="margin-top: 10px; font-size: 0.9em; opacity: 0.8;">
            - No movement jumps<br>
            - Dynamic Camera Zoom<br>
            - Horizon Lock
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa3d5ff);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const world = new CANNON.World();
        world.gravity.set(0, 0, 0);

        const planetRadius = 60;
        const planetMesh = new THREE.Mesh(
            new THREE.IcosahedronGeometry(planetRadius, 6),
            new THREE.MeshStandardMaterial({ color: 0x55aa55, flatShading: true })
        );
        scene.add(planetMesh);
        world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetRadius) }));

        // Obstacles
        const collidables = [planetMesh];
        const geo = new THREE.BoxGeometry(4, 4, 4);
        for (let i = 0; i < 60; i++) {
            const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x888888 }));
            const phi = Math.acos(-1 + (2 * i) / 60);
            const theta = Math.sqrt(60 * Math.PI) * phi;
            const pos = new THREE.Vector3().setFromSphericalCoords(planetRadius + 2, phi, theta);
            m.position.copy(pos);
            m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), pos.clone().normalize());
            scene.add(m);
            collidables.push(m);
            const b = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(2, 2, 2)) });
            b.position.copy(pos); b.quaternion.copy(m.quaternion);
            world.addBody(b);
        }

        const playerBody = new CANNON.Body({
            mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5)), 
            fixedRotation: true, linearDamping: 0.9 
        });
        playerBody.position.set(0, planetRadius + 3, 0);
        world.addBody(playerBody);

        const playerMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshStandardMaterial({ color: 0xff4444 }));
        scene.add(playerMesh);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(100, 200, 100); scene.add(sun);

        const keys = {};
        window.onkeydown = (e) => keys[e.code] = true;
        window.onkeyup = (e) => keys[e.code] = false;

        const dummy = new THREE.Object3D();
        const camPivot = new THREE.Vector3(); 
        let camHeading = new THREE.Vector3(0, 0, 1); // This acts as our "forward" intent
        let zoomAmount = 0;

        function update() {
            requestAnimationFrame(update);
            world.step(1/60);

            const pPos = new THREE.Vector3().copy(playerBody.position);
            const up = pPos.clone().normalize();
            playerBody.applyForce(up.clone().multiplyScalar(-40), playerBody.position);

            // Calculate local vectors based on the current camera view
            const viewForward = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
            const viewRight = new THREE.Vector3().crossVectors(up, viewForward).normalize();

            // 1. ROTATION LOGIC (A/D or Arrows)
            // We update camHeading even if W/S aren't pressed to prevent jumping
            const turnStrength = 0.04;
            if (keys['KeyA'] || keys['ArrowLeft']) {
                camHeading.add(viewRight.clone().multiplyScalar(turnStrength)).normalize();
            }
            if (keys['KeyD'] || keys['ArrowRight']) {
                camHeading.sub(viewRight.clone().multiplyScalar(turnStrength)).normalize();
            }

            // 2. TRANSLATION LOGIC (W/S or Arrows)
            let moveDir = new THREE.Vector3(0, 0, 0);
            const isMoving = (keys['KeyW'] || keys['ArrowUp'] || keys['KeyS'] || keys['ArrowDown']);
            
            if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(camHeading);
            if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(camHeading);

            if (moveDir.length() > 0) {
                const speed = 6;
                playerBody.velocity.set(moveDir.x * speed, moveDir.y * speed, moveDir.z * speed);
                zoomAmount = THREE.MathUtils.lerp(zoomAmount, 1, 0.05);
            } else {
                playerBody.velocity.scale(0.9, playerBody.velocity);
                zoomAmount = THREE.MathUtils.lerp(zoomAmount, 0, 0.03);
            }

            // 3. APPLY ORIENTATION TO MESH
            playerMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);
            dummy.position.set(0,0,0);
            // Character always faces the camHeading (the current pivot)
            dummy.lookAt(camHeading);
            playerMesh.quaternion.multiply(dummy.quaternion);

            // 4. DYNAMIC ZOOM CAMERA
            const dynamicDist = 26 - (zoomAmount * 8);
            const dynamicHeight = 13 - (zoomAmount * 3);

            camPivot.lerp(pPos, 0.03);
            const curFwd = camHeading.clone().normalize();
            const curRgt = new THREE.Vector3().crossVectors(up, curFwd).normalize();

            const targetCamPos = camPivot.clone()
                .add(curFwd.clone().multiplyScalar(-dynamicDist)) 
                .add(up.clone().multiplyScalar(dynamicHeight))              
                .add(curRgt.clone().multiplyScalar(9)); 

            camera.position.lerp(targetCamPos, 0.04);
            
            // Look ahead of the current heading
            const lookTarget = camPivot.clone()
                .add(curFwd.clone().multiplyScalar(10))
                .add(curRgt.clone().multiplyScalar(4))
                .sub(up.clone().multiplyScalar(5));
            
            camera.lookAt(lookTarget);

            playerMesh.position.copy(playerBody.position);
            renderer.render(scene, camera);
        }
        update();
    </script>
</body>
</html>
