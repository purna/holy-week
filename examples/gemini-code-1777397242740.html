<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Final Stable Build</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: sans-serif; }
        .overlay { position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; z-index:1000; text-align:center; transition: opacity 0.5s; }
        #loading-screen { background:#000; }
        #start-screen { background:rgba(0,0,0,0.8); backdrop-filter:blur(10px); display:none; }
        #win-screen { background:rgba(0,30,60,0.9); backdrop-filter:blur(8px); display:none; }
        #ui-main, #quest-log { position:absolute; top:20px; color:white; background:rgba(0,0,0,0.7); padding:15px; border-radius:8px; display:none; }
        #ui-main { left:20px; border-left:4px solid #ffaa00; }
        #quest-log { right:20px; width:220px; border-right:4px solid #00f2ff; }
        h1 { font-size:3.5em; color:#ffaa00; letter-spacing:5px; margin:0; }
        button { background:#ffaa00; border:none; padding:15px 40px; cursor:pointer; border-radius:50px; font-weight:bold; font-size:1.2em; margin-top:20px; color: black; }
        .complete { text-decoration:line-through; color:#00ffaa; opacity:0.6; }
        .spinner { width:40px; height:40px; border:4px solid #333; border-top-color:#ffaa00; border-radius:50%; animation:s 1s linear infinite; }
        @keyframes s { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-screen" class="overlay"><div class="spinner"></div></div>
    <div id="start-screen" class="overlay">
        <h1>MESSENGER</h1>
        <button id="btn-start">START MISSION</button>
        <p style="color:#aaa; margin-top:10px;">A/D or Arrows to Rotate • W/S to Move</p>
    </div>
    <div id="win-screen" class="overlay">
        <h1 style="color:#00f2ff">MISSION COMPLETE</h1>
        <button onclick="location.reload()">REPLAY</button>
    </div>
    <div id="ui-main"><b>MESSENGER OPS</b></div>
    <div id="quest-log"><div id="quest-list"></div></div>

    <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js" } }</script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        let started = false;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 4000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- SHADERS ---
        const toon = (c) => new THREE.ShaderMaterial({
            uniforms: { uC: { value: new THREE.Color(c) }, uS: { value: new THREE.Vector3(1,1,0.5).normalize() } },
            vertexShader: `varying vec3 vN; void main(){vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
            fragmentShader: `varying vec3 vN; uniform vec3 uC; uniform vec3 uS; void main(){float d=dot(vN,uS); float s=d>0.5?1.0:(d>0.1?0.6:0.3); gl_FragColor=vec4(uC*s,1.0);}`
        });

        const skyMat = new THREE.ShaderMaterial({
            side: THREE.BackSide,
            uniforms: { t: { value: new THREE.Color(0x0077ff) }, b: { value: new THREE.Color(0xffaa00) } },
            vertexShader: `varying vec3 vP; void main(){vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
            fragmentShader: `varying vec3 vP; uniform vec3 t; uniform vec3 b; void main(){float h=normalize(vP).y*0.5+0.5; gl_FragColor=vec4(mix(b,t,h),1.0);}`
        });
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(2000), skyMat));

        // --- PHYSICS & PLANET ---
        const world = new CANNON.World();
        const planetR = 60;
        const planetMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(planetR, 6), toon(0x66cc66));
        scene.add(planetMesh);
        world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetR) }));

        // --- COLLIDABLES ---
        const collidables = [planetMesh];
        const geometries = [new THREE.BoxGeometry(4,4,4), new THREE.SphereGeometry(2.5,16,16), new THREE.ConeGeometry(3,6,4)];
        for (let i = 0; i < 60; i++) {
            const type = Math.floor(Math.random() * 3);
            const m = new THREE.Mesh(geometries[type], toon(0x888888));
            const pos = new THREE.Vector3().setFromSphericalCoords(planetR, Math.random()*Math.PI, Math.random()*Math.PI*2);
            m.position.copy(pos);
            const up = pos.clone().normalize();
            m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), up);
            scene.add(m); collidables.push(m);
            let shape = type === 0 ? new CANNON.Box(new CANNON.Vec3(2,2,2)) : (type === 1 ? new CANNON.Sphere(2.5) : new CANNON.Cylinder(0.1, 3, 6, 4));
            const body = new CANNON.Body({ mass: 0, shape: shape });
            body.position.copy(pos); body.quaternion.copy(m.quaternion);
            world.addBody(body);
        }

        // --- QUESTS ---
        const state = { inv: [], won: false, quests: [{id:'h', t:'Heal Citizens', c:0, tar:3}, {id:'r', t:'Retrieve Relic', c:0, tar:1, req:'Key'}]};
        const actors = [];
        const spawn = (col, type, id, pos) => {
            const m = new THREE.Mesh(new THREE.SphereGeometry(1.5), toon(col));
            m.position.copy(pos.clone().normalize().multiplyScalar(planetR + 1.5));
            m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), pos.clone().normalize());
            scene.add(m); actors.push({ m, type, id, active: true });
        };
        for(let i=0; i<3; i++) spawn(0x00ccff,'h','c', new THREE.Vector3().setFromSphericalCoords(planetR, Math.random()*Math.PI, Math.random()*Math.PI*2));
        spawn(0xffff00,'i','Key', new THREE.Vector3().setFromSphericalCoords(planetR, 1.2, 0.5));
        spawn(0xff00ff,'r','r', new THREE.Vector3().setFromSphericalCoords(planetR, -1.0, -0.8));

        const ui = () => {
            document.getElementById('quest-list').innerHTML = state.quests.map(q => `<div class="${q.c>=q.tar?'complete':''}">• ${q.t} ${q.c}/${q.tar}</div>`).join('');
            if(state.quests.every(q => q.c>=q.tar)) { state.won = true; document.getElementById('win-screen').style.display = 'flex'; }
        };

        // --- PLAYER ---
        const pBody = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5)), linearDamping: 0.9, fixedRotation: true });
        pBody.position.set(0, planetR + 10, 0);
        world.addBody(pBody);
        const player = new THREE.Group();
        player.add(new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), toon(0xff4444)));
        scene.add(player);

        // --- LOOP ---
        const keys = {};
        const dummy = new THREE.Object3D();
        let camHeading = new THREE.Vector3(0,0,1), zoom = 0;
        window.onkeydown = (e) => keys[e.code] = true;
        window.onkeyup = (e) => keys[e.code] = false;
        document.getElementById('btn-start').onclick = () => { document.getElementById('start-screen').style.display = 'none'; document.getElementById('ui-main').style.display = 'block'; document.getElementById('quest-log').style.display = 'block'; started = true; ui(); };
        window.onload = () => setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 1000);

        function loop() {
            requestAnimationFrame(loop);
            world.step(1/60);
            const pPos = new THREE.Vector3().copy(pBody.position);
            const up = pPos.clone().normalize();
            pBody.applyForce(up.clone().multiplyScalar(-60), pBody.position);

            if (started && !state.won) {
                actors.forEach(a => { if(a.active && pPos.distanceTo(a.m.position) < 4) { 
                    if(a.type==='h'){state.quests[0].c++; a.active=false; scene.remove(a.m);}
                    if(a.type==='i'){state.inv.push(a.id); a.active=false; scene.remove(a.m);}
                    if(a.type==='r' && state.inv.includes('Key')){state.quests[1].c++; a.active=false; scene.remove(a.m);}
                    ui();
                }});

                const viewFwd = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
                const viewRgt = new THREE.Vector3().crossVectors(up, viewFwd).normalize();
                if (keys['KeyA'] || keys['ArrowLeft']) camHeading.add(viewRgt.clone().multiplyScalar(0.045)).normalize();
                if (keys['KeyD'] || keys['ArrowRight']) camHeading.sub(viewRgt.clone().multiplyScalar(0.045)).normalize();

                let mDir = new THREE.Vector3(0,0,0);
                if (keys['KeyW'] || keys['ArrowUp']) mDir.add(camHeading);
                if (keys['KeyS'] || keys['ArrowDown']) mDir.sub(camHeading);
                if (mDir.length() > 0) { pBody.velocity.set(mDir.x*12, mDir.y*12, mDir.z*12); zoom = THREE.MathUtils.lerp(zoom, 1, 0.05); }
                else { pBody.velocity.scale(0.9, pBody.velocity); zoom = THREE.MathUtils.lerp(zoom, 0, 0.03); }
            }

            // REINFORCED PERPENDICULAR ORIENTATION
            player.position.copy(pPos);
            player.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), up);
            dummy.lookAt(camHeading);
            player.quaternion.multiply(dummy.quaternion);

            const dDist = 30 - (zoom * 6), dHeight = 15 - (zoom * 4);
            const curFwd = camHeading.clone().normalize();
            const targetCam = pPos.clone().add(curFwd.multiplyScalar(-dDist)).add(up.multiplyScalar(dHeight));
            camera.position.lerp(targetCam, 0.04);
            camera.lookAt(pPos.clone().add(camHeading.clone().multiplyScalar(8)).sub(up.clone().multiplyScalar(4)));
            renderer.render(scene, camera);
        }
        loop();
    </script>
</body>
</html>
