<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Fixed Orientation</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: sans-serif; }
        .overlay { position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; z-index:1000; text-align:center; }
        #loading-screen { background:#000; }
        #start-screen { background:rgba(0,0,0,0.8); backdrop-filter:blur(10px); display:none; }
        #win-screen { background:rgba(0,30,60,0.9); backdrop-filter:blur(8px); display:none; }
        #ui-main, #quest-log { position:absolute; top:20px; color:white; background:rgba(0,0,0,0.7); padding:15px; border-radius:8px; display:none; }
        #ui-main { left:20px; border-left:4px solid #ffaa00; }
        #quest-log { right:20px; width:200px; border-right:4px solid #00f2ff; }
        h1 { font-size:3.5em; color:#ffaa00; letter-spacing:5px; margin:0; }
        button { background:#ffaa00; border:none; padding:15px 40px; cursor:pointer; border-radius:50px; font-weight:bold; font-size:1.2em; margin-top:20px; }
        .complete { text-decoration:line-through; color:#00ffaa; opacity:0.6; }
        .spinner { width:40px; height:40px; border:4px solid #333; border-top-color:#ffaa00; border-radius:50%; animation:s 1s linear infinite; }
        @keyframes s { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-screen" class="overlay"><div class="spinner"></div></div>
    <div id="start-screen" class="overlay">
        <h1>MESSENGER</h1>
        <button id="btn-start">START MISSION</button>
    </div>
    <div id="win-screen" class="overlay">
        <h1 style="color:#00f2ff">SUCCESS</h1>
        <button onclick="location.reload()">REPLAY</button>
    </div>
    <div id="ui-main"><b>MESSENGER</b></div>
    <div id="quest-log"><div id="quest-list"></div></div>

    <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js" } }</script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        let started = false;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- WORLD ---
        const world = new CANNON.World();
        const groundMat = new CANNON.Material();
        const slipperMat = new CANNON.Material();
        world.addContactMaterial(new CANNON.ContactMaterial(groundMat, slipperMat, { friction:0, restitution:0.1 }));

        const skyMat = new THREE.ShaderMaterial({
            side: THREE.BackSide,
            uniforms: { t: { value: new THREE.Color(0x0077ff) }, b: { value: new THREE.Color(0xffaa00) } },
            vertexShader: `varying vec3 vP; void main(){vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
            fragmentShader: `varying vec3 vP; uniform vec3 t; uniform vec3 b; void main(){float h=normalize(vP).y*0.5+0.5; gl_FragColor=vec4(mix(b,t,h),1.0);}`
        });
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(800), skyMat));

        const toon = (c) => new THREE.ShaderMaterial({
            uniforms: { uC: { value: new THREE.Color(c) }, uS: { value: new THREE.Vector3(1,1,0.5).normalize() } },
            vertexShader: `varying vec3 vN; void main(){vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
            fragmentShader: `varying vec3 vN; uniform vec3 uC; uniform vec3 uS; void main(){float d=dot(vN,uS); float s=d>0.5?1.0:(d>0.1?0.6:0.3); gl_FragColor=vec4(uC*s,1.0);}`
        });

        const planetR = 30;
        const planetMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(planetR, 5), toon(0x66cc66));
        scene.add(planetMesh);
        world.addBody(new CANNON.Body({ mass:0, shape:new CANNON.Sphere(planetR), material:groundMat }));

        const colls = [planetMesh];
        for(let i=0; i<30; i++){
            const h = Math.random()*4+2;
            const m = new THREE.Mesh(new THREE.BoxGeometry(2,h,2), toon(0xdddddd));
            m.position.setFromSphericalCoords(planetR, Math.random()*Math.PI, Math.random()*Math.PI*2);
            m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), m.position.clone().normalize());
            scene.add(m); colls.push(m);
            const b = new CANNON.Body({ mass:0 }); b.addShape(new CANNON.Box(new CANNON.Vec3(1, h/2, 1)));
            b.position.copy(m.position); b.quaternion.copy(m.quaternion); world.addBody(b);
        }

        // --- QUESTS ---
        const state = { inv: [], won: false, quests: [{id:'h', t:'Heal People', c:0, tar:3}, {id:'r', t:'Relic', c:0, tar:1, req:'Key'}] };
        const actors = [];
        const spawn = (c, ty, id, p) => {
            const m = new THREE.Mesh(new THREE.SphereGeometry(1), toon(c));
            m.position.copy(p); scene.add(m); actors.push({ m, ty, id, a:true });
        };
        for(let i=0; i<3; i++) spawn(0x00ccff,'h','p', new THREE.Vector3().setFromSphericalCoords(planetR+1.2, Math.random()*Math.PI, Math.random()*Math.PI*2));
        spawn(0xffff00,'i','Key', new THREE.Vector3().setFromSphericalCoords(planetR+1.2, 0.7, 0.7));
        spawn(0xff00ff,'r','r', new THREE.Vector3().setFromSphericalCoords(planetR+1.2, -0.7, -0.7));

        const ui = () => {
            document.getElementById('quest-list').innerHTML = state.quests.map(q=>`<div class="${q.c>=q.tar?'complete':''}">- ${q.t} ${q.c}/${q.tar}</div>`).join('');
            if(state.quests.every(q=>q.c>=q.tar)){ state.won=true; document.getElementById('win-screen').style.display='flex'; }
        };

        // --- PLAYER ---
        const player = new THREE.Group();
        player.add(new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.6, 0.8), toon(0xff4444)));
        player.add(new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.7, 0.9), new THREE.MeshBasicMaterial({color:0, side:THREE.BackSide})));
        scene.add(player);
        const pBody = new CANNON.Body({ mass:1, shape:new CANNON.Box(new CANNON.Vec3(0.4,0.8,0.4)), material:slipperMat, linearDamping:0.9 });
        pBody.position.set(0, planetR+5, 0); world.addBody(pBody);

        // --- CONTROLS ---
        const keys = {};
        let targetPt = null;
        window.onkeydown=(e)=>keys[e.key.toLowerCase()]=true;
        window.onkeyup=(e)=>keys[e.key.toLowerCase()]=false;
        window.onmousedown=(e)=>{
            if(!started) return;
            const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
            const ray = new THREE.Raycaster(); ray.setFromCamera(mouse, camera);
            const h = ray.intersectObjects(colls);
            if(h.length>0) targetPt = h[0].point;
        };

        let lastDir = new THREE.Vector3(0,0,1), camS = new THREE.Vector3();

        window.onload=()=>{ setTimeout(()=>{ document.getElementById('loading-screen').style.display='none'; document.getElementById('start-screen').style.display='flex'; }, 1000); };
        document.getElementById('btn-start').onclick=()=>{
            document.getElementById('start-screen').style.display='none';
            document.getElementById('ui-main').style.display='block'; document.getElementById('quest-log').style.display='block';
            started = true; ui();
        };

        function loop() {
            requestAnimationFrame(loop);
            if(!started || state.won) { renderer.render(scene, camera); return; }

            world.step(1/60);
            const pPos = new THREE.Vector3().copy(pBody.position);
            const up = pPos.clone().normalize();
            pBody.applyForce(up.clone().multiplyScalar(-30), pBody.position);

            actors.forEach(a=>{
                if(a.a && pPos.distanceTo(a.m.position)<2.2){
                    if(a.ty==='h'){ state.quests[0].c++; a.a=false; scene.remove(a.m); }
                    if(a.ty==='i'){ state.inv.push(a.id); a.a=false; scene.remove(a.m); }
                    if(a.ty==='r' && state.inv.includes('Key')){ state.quests[1].c++; a.a=false; scene.remove(a.m); }
                    ui();
                }
            });

            // FIXED: Spherical Movement & Orientation
            let move = new THREE.Vector3();
            const fwd = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
            const rgt = new THREE.Vector3().crossVectors(up, fwd).normalize();

            if(keys.w || keys.arrowup) move.add(fwd);
            if(keys.s || keys.arrowdown) move.sub(fwd);
            if(keys.a || keys.arrowleft) move.add(rgt);
            if(keys.d || keys.arrowright) move.sub(rgt);
            if(targetPt){
                const to = new THREE.Vector3().subVectors(targetPt, pPos);
                if(to.length()>0.6) move.add(to.projectOnPlane(up).normalize()); else targetPt = null;
            }

            if(move.length() > 0) {
                move.normalize();
                lastDir.lerp(move, 0.08); // Rotate player heading smoothly
                pBody.velocity.set(move.x*13, move.y*13, move.z*13);

                // FIXED: Matrix Align for Surface Normal + Heading
                const matrix = new THREE.Matrix4();
                matrix.lookAt(new THREE.Vector3(0,0,0), move, up);
                player.quaternion.slerp(new THREE.Quaternion().setFromRotationMatrix(matrix), 0.15);
            }

            // FIXED: Camera "Top Third" Constraint
            // We lock camera to follow behind the player but high enough to always see the top curvature.
            const camDist = 14; 
            const camHeight = 9; 
            const camT = pPos.clone()
                .add(lastDir.clone().normalize().multiplyScalar(-camDist)) 
                .add(up.multiplyScalar(camHeight))
                .add(rgt.multiplyScalar(5)); // Rule of Thirds offset

            camS.lerp(camT, 0.03); 
            camera.position.lerp(camS, 0.05);

            // Look at a point well ahead of the player to keep the horizon low in the frame
            const lookPoint = pPos.clone()
                .add(lastDir.clone().multiplyScalar(6))
                .add(up.clone().multiplyScalar(-2)); // Subtle tilt down for "top-down" sense
            camera.lookAt(lookPoint);

            player.position.copy(pBody.position);
            renderer.render(scene, camera);
        }
        loop();
    </script>
</body>
</html>
