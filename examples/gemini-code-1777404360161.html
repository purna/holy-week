<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Ultimate Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: sans-serif; }
        #ui { position:absolute; top:20px; left:20px; color:white; background:rgba(0,0,0,0.8); padding:15px; border-radius:8px; border:1px solid #ffaa00; pointer-events:none; }
    </style>
</head>
<body>
    <div id="ui"><b>MESSENGER</b><br>WASD to Move • Click Sphere to Walk</div>

    <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js" } }</script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        // --- SCENE & RENDERER ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- LIGHTS ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.castShadow = true;
        sun.shadow.mapSize.set(1024, 1024);
        scene.add(sun);

        // --- PHYSICS WORLD ---
        const world = new CANNON.World();
        const planetR = 50;
        
        // Planet
        const planetMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(planetR, 5), new THREE.MeshStandardMaterial({color: 0x44aa44}));
        planetMesh.receiveShadow = true;
        scene.add(planetMesh);
        world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetR) }));

        // Primitives
        const collidables = [planetMesh];
        for(let i=0; i<30; i++){
            const m = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 4), new THREE.MeshStandardMaterial({color: 0x888888}));
            const pos = new THREE.Vector3().setFromSphericalCoords(planetR, Math.random()*Math.PI, Math.random()*Math.PI*2);
            m.position.copy(pos);
            m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), pos.clone().normalize());
            m.castShadow = true; m.receiveShadow = true;
            scene.add(m); collidables.push(m);
            const b = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(2,2,2)) });
            b.position.copy(pos); b.quaternion.copy(m.quaternion);
            world.addBody(b);
        }

        // --- PLAYER ---
        const pBody = new CANNON.Body({ 
            mass: 1, 
            shape: new CANNON.Sphere(1), // Sphere physics = No tripping
            linearDamping: 0.9,
            fixedRotation: true 
        });
        pBody.position.set(0, planetR + 5, 0);
        world.addBody(pBody);
        
        const player = new THREE.Group();
        const box = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshStandardMaterial({color: 0xff4444}));
        box.position.y = 1; // Visual feet on ground
        box.castShadow = true;
        player.add(box);
        scene.add(player);

        // --- CONTROLS ---
        const keys = {};
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let clickTarget = null;
        let camHeading = new THREE.Vector3(0, 0, 1);
        const dummy = new THREE.Object3D();

        window.onkeydown = (e) => { keys[e.code] = true; clickTarget = null; };
        window.onkeyup = (e) => keys[e.code] = false;
        window.onmousedown = (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObject(planetMesh);
            if (hits.length > 0) clickTarget = hits[0].point;
        };

        function loop() {
            requestAnimationFrame(loop);
            world.step(1/60);

            const pPos = new THREE.Vector3().copy(pBody.position);
            const up = pPos.clone().normalize();
            pBody.applyForce(up.clone().multiplyScalar(-60), pBody.position); 

            // Camera View Vectors
            const camFwd = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
            const camRgt = new THREE.Vector3().crossVectors(up, camFwd).normalize();

            let moveDir = new THREE.Vector3(0, 0, 0);
            
            // Keyboard logic
            if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(camFwd);
            if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(camFwd);
            if (keys['KeyA'] || keys['ArrowLeft']) moveDir.add(camRgt);
            if (keys['KeyD'] || keys['ArrowRight']) moveDir.sub(camRgt);

            // Click logic (Limited to Keyboard speed)
            if (clickTarget) {
                const toTarget = clickTarget.clone().sub(pPos).projectOnPlane(up);
                if (toTarget.length() > 1.5) {
                    moveDir.add(toTarget.normalize());
                } else {
                    clickTarget = null;
                }
            }

            // Apply movement
            if (moveDir.length() > 0) {
                moveDir.normalize();
                camHeading.lerp(moveDir, 0.1).normalize();
                const speed = 12;
                pBody.velocity.set(moveDir.x * speed, moveDir.y * speed, moveDir.z * speed);
            } else {
                pBody.velocity.scale(0.9, pBody.velocity);
            }

            // Final Mesh Alignment
            player.position.copy(pPos);
            player.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);
            dummy.position.set(0,0,0);
            dummy.lookAt(camHeading);
            player.quaternion.multiply(dummy.quaternion);

            // Camera Follow
            const targetCam = pPos.clone()
                .add(camHeading.clone().multiplyScalar(-25))
                .add(up.clone().multiplyScalar(15));
            camera.position.lerp(targetCam, 0.05);
            camera.lookAt(pPos);

            // Sun Follow
            sun.position.copy(pPos).add(up.clone().multiplyScalar(50)).add(new THREE.Vector3(10,10,10));
            sun.target.position.copy(pPos);

            renderer.render(scene, camera);
        }
        loop();
    </script>
</body>
</html>
