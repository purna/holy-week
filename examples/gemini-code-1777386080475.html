<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Final Cinematic Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px;
            pointer-events: none; border-left: 4px solid #ffaa00;
        }
        .key { border: 1px solid white; padding: 2px 6px; border-radius: 4px; margin: 0 2px; font-size: 0.8em; }
    </style>
</head>
<body>
    <div id="ui">
        <b style="color: #ffaa00;">Cinematic Messenger Mechanics</b><br>
        <div style="margin-top: 5px;"><span class="key">WASD</span> or <span class="key">Arrows</span> to Walk</div>
        <div style="margin-top: 5px;">Hold <span class="key">Left Click</span> to Follow Mouse</div>
        <div style="margin-top: 10px; font-size: 0.9em; opacity: 0.8;">
            - Character: Bottom-Left Anchor<br>
            - View: Top of the World<br>
            - Physics: Collisions & Spherical Gravity
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        // --- 1. CORE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa3d5ff);
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 2. PHYSICS ---
        const world = new CANNON.World();
        world.gravity.set(0, 0, 0);

        // --- 3. THE PLANET ---
        const planetRadius = 30;
        const planetBody = new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetRadius) });
        world.addBody(planetBody);

        const planetMesh = new THREE.Mesh(
            new THREE.IcosahedronGeometry(planetRadius, 5),
            new THREE.MeshStandardMaterial({ color: 0x55aa55, flatShading: true })
        );
        scene.add(planetMesh);

        // Landmarks with Colliders
        const collidableObjects = [planetMesh];
        for (let i = 0; i < 60; i++) {
            const h = Math.random() * 5 + 2;
            const bMesh = new THREE.Mesh(new THREE.BoxGeometry(2, h, 2), new THREE.MeshStandardMaterial({ color: 0x999999 }));
            const phi = Math.acos(-1 + (2 * i) / 60);
            const theta = Math.sqrt(60 * Math.PI) * phi;
            const pos = new THREE.Vector3().setFromSphericalCoords(planetRadius + h/2, phi, theta);
            
            bMesh.position.copy(pos);
            const upVec = pos.clone().normalize();
            bMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), upVec);
            scene.add(bMesh);
            collidableObjects.push(bMesh);

            const bBody = new CANNON.Body({
                mass: 0,
                shape: new CANNON.Box(new CANNON.Vec3(1, h/2, 1))
            });
            bBody.position.copy(pos);
            bBody.quaternion.copy(bMesh.quaternion);
            world.addBody(bBody);
        }

        // --- 4. PLAYER ---
        const playerBody = new CANNON.Body({
            mass: 1, 
            shape: new CANNON.Box(new CANNON.Vec3(0.4, 0.8, 0.4)), 
            fixedRotation: true,
            linearDamping: 0.9 
        });
        playerBody.position.set(0, planetRadius + 3, 0);
        world.addBody(playerBody);

        const playerMesh = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 1.6, 0.8),
            new THREE.MeshStandardMaterial({ color: 0xff4444 })
        );
        scene.add(playerMesh);

        // --- 5. LIGHTING ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(50, 100, 50);
        scene.add(sun);

        // --- 6. INPUTS ---
        const keys = {};
        const mouse = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        let isMouseDown = false;

        window.onkeydown = (e) => {
            const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
            keys[key] = true;
        };
        window.onkeyup = (e) => {
            const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
            keys[key] = false;
        };
        window.onmousemove = (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        };
        window.onmousedown = () => isMouseDown = true;
        window.onmouseup = () => isMouseDown = false;

        // --- 7. ANIMATION LOOP ---
        const dummy = new THREE.Object3D();
        let lastMoveDir = new THREE.Vector3(0, 0, 1);

        function update() {
            requestAnimationFrame(update);
            world.step(1/60);

            const pPos = new THREE.Vector3().copy(playerBody.position);
            const up = pPos.clone().normalize();

            // Dynamic Gravity
            playerBody.applyForce(up.clone().multiplyScalar(-30), playerBody.position);

            // Movement Calculation
            let moveDir = new THREE.Vector3(0, 0, 0);
            
            const camForward = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
            const camRight = new THREE.Vector3().crossVectors(up, camForward).normalize();

            if (keys.w || keys.arrowup) moveDir.add(camForward);
            if (keys.s || keys.arrowdown) moveDir.sub(camForward);
            if (keys.a || keys.arrowleft) moveDir.add(camRight);
            if (keys.d || keys.arrowright) moveDir.sub(camRight);

            // Fixed Mouse Follow
            if (isMouseDown) {
                raycaster.setFromCamera(mouse, camera);
                const hits = raycaster.intersectObjects(collidableObjects);
                if (hits.length > 0) {
                    const targetPoint = hits[0].point;
                    const mouseTarget = new THREE.Vector3().subVectors(targetPoint, pPos).projectOnPlane(up).normalize();
                    moveDir.add(mouseTarget);
                }
            }

            if (moveDir.length() > 0) {
                moveDir.normalize();
                lastMoveDir.copy(moveDir);
                
                const speed = 10;
                playerBody.velocity.set(moveDir.x * speed, moveDir.y * speed, moveDir.z * speed);
                
                dummy.position.copy(pPos);
                dummy.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);
                dummy.lookAt(pPos.clone().add(moveDir));
                playerMesh.quaternion.slerp(dummy.quaternion, 0.15);
            } else {
                // Friction-like stop
                playerBody.velocity.scale(0.9, playerBody.velocity);
            }

            // --- CINEMATIC RULE OF THIRDS CAMERA ---
            const currentForward = lastMoveDir.clone();
            const currentRight = new THREE.Vector3().crossVectors(up, currentForward).normalize();

            const targetCamPos = pPos.clone()
                .add(currentForward.clone().multiplyScalar(-10)) 
                .add(up.clone().multiplyScalar(5))              
                .add(currentRight.clone().multiplyScalar(5));    

            camera.position.lerp(targetCamPos, 0.03);

            const lookAtPoint = pPos.clone()
                .add(currentForward.clone().multiplyScalar(4)) 
                .add(currentRight.clone().multiplyScalar(2))   
                .sub(up.clone().multiplyScalar(2));          

            camera.lookAt(lookAtPoint);

            playerMesh.position.copy(playerBody.position);
            renderer.render(scene, camera);
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };

        update();
    </script>
</body>
</html>
