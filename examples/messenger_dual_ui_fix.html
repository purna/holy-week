<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Ink Runtime Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background: #010105; font-family: 'Courier New', Courier, monospace; text-transform: uppercase; user-select: none; }
        .overlay { position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; z-index:1000; text-align:center; background:rgba(0,0,0,0.95); }
        .panel { position:absolute; color:white; background:rgba(0,10,20,0.8); padding:12px; border: 1px solid #00f2ff; backdrop-filter: blur(10px); pointer-events: none; z-index: 10; }
        #panel-inv { top:20px; left:20px; width:180px; border-left: 4px solid #ffaa00; }
        #panel-quest { top:20px; right:20px; width:220px; border-right: 4px solid #00f2ff; }
        
        #npc-indicator-container { position: absolute; top: 0; left: 0; pointer-events: none; width: 100%; height: 100%; z-index: 5; }
        .interact-prompt { 
            position: absolute; background: #ffaa00; color: black; 
            padding: 5px 12px; font-weight: bold; border-radius: 20px;
            font-size: 0.75em; transform: translate(-50%, -50%);
            display: none; cursor: pointer; pointer-events: auto;
            box-shadow: 0 0 15px #ffaa00; border: 2px solid white;
        }

        #local-dialogue-box {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 700px; max-width: 90%; background: rgba(0, 5, 15, 0.95);
            border: 1px solid #00f2ff; border-top: 4px solid #00f2ff;
            padding: 25px; color: white; display: none; z-index: 100;
        }
        .npc-name-tag { color: #ffaa00; font-size: 1.2em; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #333; display: block; }
        #bubble-text { margin-bottom: 20px; line-height: 1.6; font-size: 1.1em; text-transform: none; }
        .choice-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .choice-btn { 
            background: rgba(0,242,255,0.05); border: 1px solid #00f2ff55; 
            color: #00f2ff; text-align: left; padding: 12px;
            cursor: pointer; font-family: inherit; transition: 0.2s;
        }
        .choice-btn:hover { background: rgba(0,242,255,0.2); border-color: #00f2ff; }
        button#btn-start { background:#ffaa00; border:none; padding:15px 40px; cursor:pointer; font-weight:bold; font-size:1.2em; color: black; }
    </style>
</head>
<body>
    <div id="start-screen" class="overlay">
        <h1 style="color:#ffaa00; font-size:4em; margin:0;">MESSENGER</h1>
        <button id="btn-start">SYNC ENGINE</button>
    </div>

    <div id="panel-inv" class="panel"><h3>STORAGE</h3><div id="inv-list">0_CELLS</div></div>
    <div id="panel-quest" class="panel"><h3>MISSION</h3><div id="quest-list"></div></div>
    
    <div id="npc-indicator-container">
        <div id="world-prompt" class="interact-prompt">CLICK TO INTERACT</div>
    </div>

    <div id="local-dialogue-box">
        <span id="npc-name-display" class="npc-name-tag"></span>
        <div id="bubble-text">Initializing connection...</div>
        <div id="bubble-choices" class="choice-container"></div>
    </div>

    <!-- SWITCHING TO UNPKG FOR BETTER MODULE COMPATIBILITY -->
    <script src="https://unpkg.com/inkjs@2.2.1/dist/ink.js"></script>
    <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js" } }</script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        let started = false;
        let inkStory = null;
        let isDialogueOpen = false;
        let storyData = null;

        // Load the Ink story JSON at startup
        async function loadStory() {
            try {
                const response = await fetch('./NPC_UNIT_ECHO.json');
                if (!response.ok) throw new Error('Failed to load story');
                storyData = await response.json();
            } catch (e) {
                console.error("Failed to load Ink story:", e);
            }
        }
        loadStory();

        // Ink text processing: strip control markers and sanitize HTML tags
        function stripInkMarkers(s) {
            if (!s) return '';
            const rawLines = s.split(/\r?\n/);
            const out = [];
            for (let line of rawLines) {
                let l = (line || '').trim();
                if (l === '#' || l === '/#') continue;
                if (l.startsWith('^')) l = l.slice(1).trim();
                if (l.startsWith('#')) l = l.slice(1).trim();
                if (l) out.push(l);
            }
            return out.join('\n');
        }

        function sanitizeAllowedHtml(dirty) {
            if (!dirty) return '';
            const allowedTags = ['b','strong','i','em','br','p','a','ul','ol','li','span'];
            const allowedAttrs = { 'a': ['href','target','rel'], 'span': ['class'] };

            const container = document.createElement('div');
            container.innerHTML = dirty;

            function cleanNode(node) {
                if (node.nodeType === Node.COMMENT_NODE) { node.remove(); return; }
                if (node.nodeType === Node.ELEMENT_NODE) {
                    const tag = node.tagName.toLowerCase();
                    if (!allowedTags.includes(tag)) {
                        const parent = node.parentNode;
                        while (node.firstChild) parent.insertBefore(node.firstChild, node);
                        parent.removeChild(node);
                        return;
                    }
                    const attrs = Array.from(node.attributes || []);
                    for (const attr of attrs) {
                        const name = attr.name.toLowerCase();
                        const allowedForTag = allowedAttrs[tag] || [];
                        if (!allowedForTag.includes(name)) {
                            node.removeAttribute(attr.name);
                        } else if (tag === 'a' && name === 'href') {
                            const val = node.getAttribute('href') || '';
                            if (/^\s*javascript:/i.test(val) || /^\s*data:/i.test(val)) {
                                node.removeAttribute('href');
                            } else {
                                node.setAttribute('rel','noopener');
                                node.setAttribute('target','_blank');
                            }
                        }
                    }
                }
                let child = node.firstChild;
                while (child) { const next = child.nextSibling; cleanNode(child); child = next; }
            }

            // Sanitize children only, not the container itself
            Array.from(container.childNodes).forEach(child => cleanNode(child));
            return container.innerHTML;
        }

        const continueStory = () => {
            const textEl = document.getElementById('bubble-text');
            const choiceEl = document.getElementById('bubble-choices');
            let txt = "";
            while(inkStory.canContinue) txt += inkStory.Continue();
            const cleaned = stripInkMarkers(txt);
            console.log('Cleaned:', cleaned);
            textEl.innerHTML = cleaned;
            choiceEl.innerHTML = "";
            inkStory.currentChoices.forEach(c => {
                const b = document.createElement('button');
                b.className = "choice-btn"; b.innerText = c.text;
                b.onclick = () => { inkStory.ChooseChoiceIndex(c.index); continueStory(); };
                choiceEl.appendChild(b);
            });
            if(inkStory.currentChoices.length === 0 && !inkStory.canContinue) {
                const b = document.createElement('button');
                b.className = "choice-btn"; b.innerText = "[Close Connection]";
                b.onclick = () => { 
                    document.getElementById('local-dialogue-box').style.display = 'none';
                    isDialogueOpen = false;
                };
                choiceEl.appendChild(b);
            }
        };

        const worldPrompt = document.getElementById('world-prompt');
        worldPrompt.onclick = () => {
            // FIX: Check if inkjs exists on window object
            const inkRuntime = window.inkjs || (window.ink ? { Story: window.ink.Story } : null);
            
            if (!inkRuntime) {
                alert("Ink.js not loaded yet. Please wait a moment or check your internet connection.");
                return;
            }

            isDialogueOpen = true;
            worldPrompt.style.display = 'none';
            document.getElementById('local-dialogue-box').style.display = 'block';
            
            try {
                if (!storyData) { console.error("Story data not loaded"); return; }
                inkStory = new inkRuntime.Story(storyData);
                document.getElementById('npc-name-display').innerText = "UNIT-01 ECHO";
                continueStory();
            } catch (e) {
                console.error("Ink Error:", e);
            }
        };

        // Standard Setup (Redacted for brevity, same as dual_ui)
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        const sun = new THREE.DirectionalLight(0xffffff, 2);
        sun.position.set(10, 20, 10);
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0x404040));
        const world = new CANNON.World();
        const planetR = 50;
        const planet = new THREE.Mesh(new THREE.IcosahedronGeometry(planetR, 4), new THREE.MeshToonMaterial({color: 0x1a251a}));
        scene.add(planet);
        world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetR) }));
        const pBody = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5)), fixedRotation: true });
        pBody.position.set(0, planetR + 5, 0);
        world.addBody(pBody);
        const playerMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshToonMaterial({color: 0xff3333}));
        scene.add(playerMesh);
        const npcPos = new THREE.Vector3().setFromSphericalCoords(planetR + 1, 0.1, 0.1);
        const npcMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 1), new THREE.MeshToonMaterial({color: 0x00f2ff}));
        npcMesh.position.copy(npcPos);
        scene.add(npcMesh);

        document.getElementById('btn-start').onclick = () => { started = true; document.getElementById('start-screen').style.display='none'; };

        function loop() {
            requestAnimationFrame(loop);
            world.step(1/60);
            const pPos = new THREE.Vector3().copy(pBody.position);
            const up = pPos.clone().normalize();
            pBody.applyForce(up.clone().multiplyScalar(-50), pBody.position);
            if(!started) { renderer.render(scene, camera); return; }

            const dist = pPos.distanceTo(npcPos);
            if(dist < 8 && !isDialogueOpen) {
                worldPrompt.style.display = 'block';
                const sPos = npcPos.clone().add(up.clone().multiplyScalar(4)).project(camera);
                worldPrompt.style.left = (sPos.x * 0.5 + 0.5) * window.innerWidth + 'px';
                worldPrompt.style.top = (sPos.y * -0.5 + 0.5) * window.innerHeight + 'px';
            } else { worldPrompt.style.display = 'none'; }

            if(!isDialogueOpen) {
                pBody.velocity.set(0,0,0);
                // Basic movement simplified for this fix
                if(window.event && window.event.type === 'keydown') { /* movement logic */ }
            }

            playerMesh.position.copy(pPos);
            playerMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);
            camera.position.lerp(pPos.clone().add(up.clone().multiplyScalar(20)), 0.05);
            camera.lookAt(pPos);
            renderer.render(scene, camera);
        }
        loop();
    </script>
</body>
</html>
