<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Ramp Test Build</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: sans-serif; }
        #ui { position:absolute; top:20px; left:20px; color:white; background:rgba(0,0,0,0.8); padding:15px; border-radius:8px; border:1px solid #ffaa00; pointer-events:none; }
    </style>
</head>
<body>
    <div id="ui"><b>MESSENGER RAMP TEST</b><br>WASD to Move • Physics Ramps Added</div>

    <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js" } }</script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        scene.add(sun);

        const world = new CANNON.World();
        const planetR = 50;
        
        // Materials for friction
        const groundMat = new CANNON.Material("ground");
        const playerMat = new CANNON.Material("player");
        world.addContactMaterial(new CANNON.ContactMaterial(groundMat, playerMat, { friction: 0.5, restitution: 0.1 }));

        // Planet
        const planetMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(planetR, 5), new THREE.MeshStandardMaterial({color: 0x44aa44}));
        planetMesh.receiveShadow = true;
        scene.add(planetMesh);
        world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetR), material: groundMat }));

        // --- RAMP GENERATOR ---
        const collidables = [planetMesh];
        for(let i=0; i<15; i++) {
            const rampGroup = new THREE.Group();
            const rw=6, rh=2, rd=12;
            const rampMesh = new THREE.Mesh(new THREE.BoxGeometry(rw, rh, rd), new THREE.MeshStandardMaterial({color: 0xccaa00}));
            
            // Random position on sphere
            const pos = new THREE.Vector3().setFromSphericalCoords(planetR, Math.random()*Math.PI, Math.random()*Math.PI*2);
            const up = pos.clone().normalize();
            
            // Slope the ramp: Rotate it slightly on its local X axis
            rampMesh.rotation.x = -0.3; 
            rampMesh.position.set(0, rh/2, 0); // Lift so bottom is at group origin
            rampMesh.castShadow = rampMesh.receiveShadow = true;
            
            rampGroup.position.copy(pos);
            rampGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), up);
            rampGroup.add(rampMesh);
            scene.add(rampGroup);
            collidables.push(rampMesh);

            // Physics Ramp
            const rBody = new CANNON.Body({ mass: 0, material: groundMat });
            const rShape = new CANNON.Box(new CANNON.Vec3(rw/2, rh/2, rd/2));
            rBody.addShape(rShape, new CANNON.Vec3(0, rh/2, 0), new CANNON.Quaternion().setFromAxisAngle(new CANNON.Vec3(1,0,0), -0.3));
            rBody.position.copy(pos);
            rBody.quaternion.copy(rampGroup.quaternion);
            world.addBody(rBody);
        }

        // --- PLAYER ---
        const pBody = new CANNON.Body({ 
            mass: 5, 
            shape: new CANNON.Sphere(1), 
            material: playerMat,
            linearDamping: 0.6, 
            fixedRotation: true 
        });
        pBody.position.set(0, planetR + 5, 0);
        world.addBody(pBody);
        
        const player = new THREE.Group();
        const box = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 1.2), new THREE.MeshStandardMaterial({color: 0xff4444}));
        box.position.y = 1; 
        box.castShadow = true;
        player.add(box);
        scene.add(player);

        const keys = {};
        let camHeading = new THREE.Vector3(0, 0, 1);
        const dummy = new THREE.Object3D();

        window.onkeydown = (e) => keys[e.code] = true;
        window.onkeyup = (e) => keys[e.code] = false;

        function loop() {
            requestAnimationFrame(loop);
            world.step(1/60);

            const pPos = new THREE.Vector3().copy(pBody.position);
            const up = pPos.clone().normalize();
            
            // Gravity toward center
            const gravityForce = up.clone().multiplyScalar(-180);
            pBody.applyForce(new CANNON.Vec3(gravityForce.x, gravityForce.y, gravityForce.z), pBody.position);

            const camFwd = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
            const camRgt = new THREE.Vector3().crossVectors(up, camFwd).normalize();

            let moveDir = new THREE.Vector3(0, 0, 0);
            if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(camFwd);
            if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(camFwd);
            if (keys['KeyA'] || keys['ArrowLeft']) moveDir.add(camRgt);
            if (keys['KeyD'] || keys['ArrowRight']) moveDir.sub(camRgt);

            if (moveDir.length() > 0) {
                moveDir.normalize();
                camHeading.lerp(moveDir, 0.1).normalize();
                const speed = 15;
                pBody.velocity.x = moveDir.x * speed;
                pBody.velocity.y = moveDir.y * speed;
                pBody.velocity.z = moveDir.z * speed;
            } else {
                pBody.velocity.x *= 0.9;
                pBody.velocity.y *= 0.9;
                pBody.velocity.z *= 0.9;
            }

            // Orientation
            player.position.copy(pPos);
            player.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);
            dummy.position.set(0,0,0);
            dummy.lookAt(camHeading);
            player.quaternion.multiply(dummy.quaternion);

            // Camera & Sun
            camera.position.lerp(pPos.clone().add(camHeading.clone().multiplyScalar(-25)).add(up.clone().multiplyScalar(15)), 0.05);
            camera.lookAt(pPos);
            sun.position.copy(pPos).add(up.clone().multiplyScalar(50));
            sun.target.position.copy(pPos);

            renderer.render(scene, camera);
        }
        loop();
    </script>
</body>
</html>
