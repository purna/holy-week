<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Ultimate Cinematic Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px;
            pointer-events: none; border-left: 4px solid #ffaa00;
        }
        .key { border: 1px solid white; padding: 2px 6px; border-radius: 4px; margin: 0 2px; font-size: 0.8em; }
    </style>
</head>
<body>
    <div id="ui">
        <b style="color: #ffaa00;">Cinematic Messenger Mechanics</b><br>
        <div style="margin-top: 5px;"><span class="key">WASD</span> or <span class="key">Arrows</span></div>
        <div style="margin-top: 5px;"><span class="key">Click</span> to Move to Point</div>
        <div style="margin-top: 10px; font-size: 0.9em; opacity: 0.8;">
            - World Radius: 60 (Large Scale)<br>
            - Camera: High Inertia Ease-In-Out<br>
            - Framing: Stable Rule of Thirds
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        // --- 1. CORE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa3d5ff);
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 3000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 2. PHYSICS ---
        const world = new CANNON.World();
        world.gravity.set(0, 0, 0);

        // --- 3. THE PLANET (Radius 60) ---
        const planetRadius = 60;
        const planetBody = new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetRadius) });
        world.addBody(planetBody);

        const planetMesh = new THREE.Mesh(
            new THREE.IcosahedronGeometry(planetRadius, 6),
            new THREE.MeshStandardMaterial({ color: 0x55aa55, flatShading: true })
        );
        scene.add(planetMesh);

        // Populate with Landmarks and Colliders
        const collidableObjects = [planetMesh];
        for (let i = 0; i < 150; i++) {
            const h = Math.random() * 6 + 3;
            const bMesh = new THREE.Mesh(new THREE.BoxGeometry(3, h, 3), new THREE.MeshStandardMaterial({ color: 0x888888 }));
            const phi = Math.acos(-1 + (2 * i) / 150);
            const theta = Math.sqrt(150 * Math.PI) * phi;
            const pos = new THREE.Vector3().setFromSphericalCoords(planetRadius + h/2, phi, theta);
            
            bMesh.position.copy(pos);
            bMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), pos.clone().normalize());
            scene.add(bMesh);
            collidableObjects.push(bMesh);

            const bBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(1.5, h/2, 1.5)) });
            bBody.position.copy(pos);
            bBody.quaternion.copy(bMesh.quaternion);
            world.addBody(bBody);
        }

        // --- 4. PLAYER ---
        const playerBody = new CANNON.Body({
            mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5)), 
            fixedRotation: true, linearDamping: 0.95 
        });
        playerBody.position.set(0, planetRadius + 5, 0);
        world.addBody(playerBody);

        const playerMesh = new THREE.Mesh(
            new THREE.BoxGeometry(1, 2, 1),
            new THREE.MeshStandardMaterial({ color: 0xff4444 })
        );
        scene.add(playerMesh);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(100, 200, 100);
        scene.add(sun);

        // --- 5. INPUTS ---
        const keys = {};
        const mouse = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        let targetPoint = null;

        window.onkeydown = (e) => keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true;
        window.onkeyup = (e) => keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false;
        
        window.onmousedown = (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(collidableObjects);
            if (hits.length > 0) targetPoint = hits[0].point;
        };

        // --- 6. CINEMATIC TRACKING ---
        const dummy = new THREE.Object3D();
        const camPivot = new THREE.Vector3(); 
        let camHeading = new THREE.Vector3(0, 0, 1); 

        function update() {
            requestAnimationFrame(update);
            world.step(1/60);

            const pPos = new THREE.Vector3().copy(playerBody.position);
            const up = pPos.clone().normalize();

            // Spherical Gravity
            playerBody.applyForce(up.clone().multiplyScalar(-35), playerBody.position);

            // Movement Logic
            let moveDir = new THREE.Vector3(0, 0, 0);
            const camForward = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
            const camRight = new THREE.Vector3().crossVectors(up, camForward).normalize();

            const isMovingBackward = (keys.s || keys.arrowdown);

            if (keys.w || keys.arrowup) moveDir.add(camForward);
            if (isMovingBackward) moveDir.sub(camForward);
            if (keys.a || keys.arrowleft) moveDir.add(camRight);
            if (keys.d || keys.arrowright) moveDir.sub(camRight);

            if (targetPoint) {
                const toTarget = new THREE.Vector3().subVectors(targetPoint, pPos);
                if (toTarget.length() > 1.0) moveDir.add(toTarget.projectOnPlane(up).normalize());
                else targetPoint = null;
            }

            if (moveDir.length() > 0) {
                moveDir.normalize();
                
                // Stable Camera: Only update heading if not reversing
                if (!isMovingBackward) {
                    camHeading.lerp(moveDir, 0.03); 
                }
                
                const speed = 6; // Slower player speed
                playerBody.velocity.set(moveDir.x * speed, moveDir.y * speed, moveDir.z * speed);
                
                dummy.position.copy(pPos);
                dummy.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);
                dummy.lookAt(pPos.clone().add(moveDir));
                playerMesh.quaternion.slerp(dummy.quaternion, 0.08);
            } else {
                playerBody.velocity.scale(0.92, playerBody.velocity);
            }

            // --- DELAYED CINEMATIC CAMERA ---
            camPivot.lerp(pPos, 0.04); // Position delay

            const currentForward = camHeading.clone().normalize();
            const currentRight = new THREE.Vector3().crossVectors(up, currentForward).normalize();

            // Target Anchor: Behind, Above, and Side-offset (Rule of Thirds)
            const targetCamPos = camPivot.clone()
                .add(currentForward.clone().multiplyScalar(-18)) 
                .add(up.clone().multiplyScalar(8))              
                .add(currentRight.clone().multiplyScalar(7)); 

            camera.position.lerp(targetCamPos, 0.05); // Ease-in-out movement

            // Look Target trails the pivot to maintain bottom-corner framing
            const lookTarget = camPivot.clone()
                .add(currentForward.clone().multiplyScalar(6)) 
                .add(currentRight.clone().multiplyScalar(3))   
                .sub(up.clone().multiplyScalar(3));

            camera.lookAt(lookTarget);

            playerMesh.position.copy(playerBody.position);
            renderer.render(scene, camera);
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };

        update();
    </script>
</body>
</html>
