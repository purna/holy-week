<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Dynamic Zoom & Primitives</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px;
            pointer-events: none; border-left: 4px solid #ffaa00;
        }
        .key { border: 1px solid white; padding: 2px 6px; border-radius: 4px; margin: 0 2px; font-size: 0.8em; }
    </style>
</head>
<body>
    <div id="ui">
        <b style="color: #ffaa00;">Cinematic Primitives</b><br>
        <div style="margin-top: 5px;"><span class="key">WASD / Arrows</span> or <span class="key">Click</span></div>
        <div style="margin-top: 10px; font-size: 0.9em; opacity: 0.8;">
            - Zoom: In (Moving) / Out (Idle)<br>
            - World: Collidable Shapes<br>
            - View: Horizon Locked
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        // --- 1. CORE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa3d5ff);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const world = new CANNON.World();
        world.gravity.set(0, 0, 0);

        // --- 2. PLANET ---
        const planetRadius = 60;
        const planetMesh = new THREE.Mesh(
            new THREE.IcosahedronGeometry(planetRadius, 6),
            new THREE.MeshStandardMaterial({ color: 0x55aa55, flatShading: true })
        );
        scene.add(planetMesh);
        world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetRadius) }));

        // --- 3. PRIMITIVES (Collidables) ---
        const collidables = [planetMesh];
        const geometries = [
            new THREE.BoxGeometry(4, 4, 4),
            new THREE.SphereGeometry(2.5, 16, 16),
            new THREE.ConeGeometry(3, 6, 4) // Pyramid
        ];

        for (let i = 0; i < 100; i++) {
            const type = Math.floor(Math.random() * 3);
            const mesh = new THREE.Mesh(geometries[type], new THREE.MeshStandardMaterial({ color: 0x888888 }));
            
            const phi = Math.acos(-1 + (2 * i) / 100);
            const theta = Math.sqrt(100 * Math.PI) * phi;
            const pos = new THREE.Vector3().setFromSphericalCoords(planetRadius + 1, phi, theta);
            
            mesh.position.copy(pos);
            const up = pos.clone().normalize();
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);
            scene.add(mesh);
            collidables.push(mesh);

            let shape;
            if (type === 0) shape = new CANNON.Box(new CANNON.Vec3(2, 2, 2));
            else if (type === 1) shape = new CANNON.Sphere(2.5);
            else shape = new CANNON.Cylinder(0.1, 3, 6, 4);

            const body = new CANNON.Body({ mass: 0, shape: shape });
            body.position.copy(pos);
            body.quaternion.copy(mesh.quaternion);
            world.addBody(body);
        }

        // --- 4. PLAYER ---
        const playerBody = new CANNON.Body({
            mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5)), 
            fixedRotation: true, linearDamping: 0.9 
        });
        playerBody.position.set(0, planetRadius + 3, 0);
        world.addBody(playerBody);

        const playerMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshStandardMaterial({ color: 0xff4444 }));
        scene.add(playerMesh);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(100, 200, 100); scene.add(sun);

        // --- 5. INPUTS ---
        const keys = {};
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let targetPoint = null;

        window.onkeydown = (e) => keys[e.code] = true;
        window.onkeyup = (e) => keys[e.code] = false;
        window.onmousedown = (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(collidables);
            if (hits.length > 0) targetPoint = hits[0].point;
        };

        // --- 6. CAMERA & MOTION VARS ---
        const dummy = new THREE.Object3D();
        const camPivot = new THREE.Vector3(); 
        let camHeading = new THREE.Vector3(0, 0, 1);
        let currentMoveVector = new THREE.Vector3(0, 0, 0);
        
        let zoomAmount = 0; // 0 is stationary, 1 is full speed
        let targetZoom = 0;

        function update() {
            requestAnimationFrame(update);
            world.step(1/60);

            const pPos = new THREE.Vector3().copy(playerBody.position);
            const up = pPos.clone().normalize();
            playerBody.applyForce(up.clone().multiplyScalar(-40), playerBody.position);

            const camForward = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
            const camRight = new THREE.Vector3().crossVectors(up, camForward).normalize();

            let inputDir = new THREE.Vector3(0, 0, 0);
            if (keys['KeyW'] || keys['ArrowUp']) inputDir.add(camForward);
            if (keys['KeyS'] || keys['ArrowDown']) inputDir.sub(camForward);
            if (keys['KeyA'] || keys['ArrowLeft']) inputDir.add(camRight.clone().multiplyScalar(0.4));
            if (keys['KeyD'] || keys['ArrowRight']) inputDir.sub(camRight.clone().multiplyScalar(0.4));

            if (targetPoint) {
                const toTarget = new THREE.Vector3().subVectors(targetPoint, pPos).projectOnPlane(up);
                if (toTarget.length() > 1.0) inputDir.add(toTarget.normalize());
                else targetPoint = null;
            }

            if (inputDir.length() > 0) {
                inputDir.normalize();
                currentMoveVector.lerp(inputDir, 0.05);
                
                const speed = 5.5; 
                playerBody.velocity.set(currentMoveVector.x * speed, currentMoveVector.y * speed, currentMoveVector.z * speed);

                playerMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);
                dummy.position.set(0,0,0);
                dummy.lookAt(currentMoveVector);
                playerMesh.quaternion.multiply(dummy.quaternion);
                
                if (!(keys['KeyS'] || keys['ArrowDown'])) camHeading.lerp(currentMoveVector, 0.02);
                targetZoom = 1; // Moving
            } else {
                playerBody.velocity.scale(0.9, playerBody.velocity);
                currentMoveVector.set(0,0,0);
                targetZoom = 0; // Stationary
            }

            // --- SMOOTH ZOOM LOGIC ---
            zoomAmount = THREE.MathUtils.lerp(zoomAmount, targetZoom, 0.03); // Cinematic ease in-out

            // FOV narrows (zooms in) when moving: 60 (stationary) -> 50 (moving)
            camera.fov = 60 - (zoomAmount * 10);
            camera.updateProjectionMatrix();

            // Camera moves closer when moving: Dist 26 -> 18
            const dynamicDist = 26 - (zoomAmount * 8);
            const dynamicHeight = 13 - (zoomAmount * 3);

            camPivot.lerp(pPos, 0.03);
            const curFwd = camHeading.clone().normalize();
            const curRgt = new THREE.Vector3().crossVectors(up, curFwd).normalize();

            const targetCamPos = camPivot.clone()
                .add(curFwd.clone().multiplyScalar(-dynamicDist)) 
                .add(up.clone().multiplyScalar(dynamicHeight))              
                .add(curRgt.clone().multiplyScalar(9)); 

            camera.position.lerp(targetCamPos, 0.04);
            camera.lookAt(camPivot.clone().add(curFwd.multiplyScalar(10)).sub(up.multiplyScalar(5)));

            playerMesh.position.copy(playerBody.position);
            renderer.render(scene, camera);
        }
        update();
    </script>
</body>
</html>
