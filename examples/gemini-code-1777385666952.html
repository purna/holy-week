<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Smooth Cinematic Follow</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px;
            pointer-events: none; border-left: 4px solid #ffaa00;
        }
        .key { border: 1px solid white; padding: 2px 6px; border-radius: 4px; margin: 0 2px; font-size: 0.8em; }
    </style>
</head>
<body>
    <div id="ui">
        <b style="color: #ffaa00;">Cinematic Follow</b><br>
        <div style="margin-top: 5px;"><span class="key">WASD</span> / <span class="key">Arrows</span></div>
        <div style="margin-top: 8px; font-size: 0.9em; opacity: 0.8;">
            - Character: Bottom-Left Anchor<br>
            - Motion: Ease-In-Out Glide
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        // --- 1. CORE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa3d5ff);
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 2. PHYSICS ---
        const world = new CANNON.World();
        world.gravity.set(0, 0, 0);

        const planetRadius = 30;
        const planetMesh = new THREE.Mesh(
            new THREE.IcosahedronGeometry(planetRadius, 5),
            new THREE.MeshStandardMaterial({ color: 0x55aa55, flatShading: true })
        );
        scene.add(planetMesh);
        world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetRadius) }));

        // Buildings with Colliders
        for (let i = 0; i < 50; i++) {
            const h = Math.random() * 4 + 2;
            const bMesh = new THREE.Mesh(new THREE.BoxGeometry(2, h, 2), new THREE.MeshStandardMaterial({ color: 0xcccccc }));
            const phi = Math.acos(-1 + (2 * i) / 50);
            const theta = Math.sqrt(50 * Math.PI) * phi;
            const pos = new THREE.Vector3().setFromSphericalCoords(planetRadius + h/2, phi, theta);
            bMesh.position.copy(pos);
            bMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), pos.clone().normalize());
            scene.add(bMesh);

            const bBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(1, h/2, 1)) });
            bBody.position.copy(pos);
            bBody.quaternion.copy(bMesh.quaternion);
            world.addBody(bBody);
        }

        // --- 3. PLAYER ---
        const playerBody = new CANNON.Body({ 
            mass: 1, 
            shape: new CANNON.Box(new CANNON.Vec3(0.4, 0.8, 0.4)), 
            fixedRotation: true, 
            linearDamping: 0.9 
        });
        playerBody.position.set(0, planetRadius + 3, 0);
        world.addBody(playerBody);

        const playerMesh = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 1.6, 0.8), 
            new THREE.MeshStandardMaterial({ color: 0xff4444 })
        );
        scene.add(playerMesh);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(50, 100, 50); scene.add(sun);

        // --- 4. INPUTS ---
        const keys = {};
        window.onkeydown = (e) => keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true;
        window.onkeyup = (e) => keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false;

        const dummy = new THREE.Object3D();
        let lastValidForward = new THREE.Vector3(0, 0, 1);

        function update() {
            requestAnimationFrame(update);
            world.step(1/60);

            const pPos = new THREE.Vector3().copy(playerBody.position);
            const up = pPos.clone().normalize();
            playerBody.applyForce(up.clone().multiplyScalar(-30), playerBody.position);

            // --- MOVEMENT CALCULATIONS ---
            // We use the last valid camera direction to keep movement consistent
            const camDir = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
            const camRight = new THREE.Vector3().crossVectors(up, camDir).normalize();
            
            let moveDir = new THREE.Vector3(0, 0, 0);
            if (keys.w || keys.ArrowUp) moveDir.add(camDir);
            if (keys.s || keys.ArrowDown) moveDir.sub(camDir);
            if (keys.a || keys.ArrowLeft) moveDir.add(camRight);
            if (keys.d || keys.ArrowRight) moveDir.sub(camRight);

            if (moveDir.length() > 0) {
                moveDir.normalize();
                lastValidForward.lerp(moveDir, 0.05); // Smoothly transition the "forward" reference
                
                playerBody.velocity.set(moveDir.x * 6, moveDir.y * 6, moveDir.z * 6);
                
                dummy.position.copy(pPos);
                dummy.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);
                dummy.lookAt(pPos.clone().add(moveDir));
                playerMesh.quaternion.slerp(dummy.quaternion, 0.1);
            }

            // --- CINEMATIC FIXED-OFFSET CAMERA ---
            // To prevent "switching," we calculate the camera's target relative to the character's orientation
            // but use heavy damping (lerp) to smooth out the transition.
            
            const currentRight = new THREE.Vector3().crossVectors(up, lastValidForward).normalize();

            // Desired Camera Position:
            // 1. Behind the movement (-12)
            // 2. Above the sphere (6)
            // 3. Offset Right (5) -> Pushes character to the Left
            const targetCamPos = pPos.clone()
                .add(lastValidForward.clone().multiplyScalar(-12))
                .add(up.clone().multiplyScalar(6))
                .add(currentRight.clone().multiplyScalar(5));

            // The Ease In-Out: A lower lerp value (0.03) creates that heavy, gliding cinematic feel
            camera.position.lerp(targetCamPos, 0.03);

            // Look Target: Lead the character and look slightly down
            const lookTarget = pPos.clone()
                .add(lastValidForward.clone().multiplyScalar(5))
                .add(currentRight.clone().multiplyScalar(2))
                .add(up.clone().multiplyScalar(-3));

            camera.lookAt(lookTarget);

            playerMesh.position.copy(playerBody.position);
            renderer.render(scene, camera);
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
        update();
    </script>
</body>
</html>
