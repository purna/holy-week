<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Ink Runtime Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background: #010105; font-family: 'Courier New', Courier, monospace; text-transform: uppercase; user-select: none; }
        .overlay { position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; z-index:1000; text-align:center; background:rgba(0,0,0,0.95); }
        .panel { position:absolute; color:white; background:rgba(0,10,20,0.9); padding:15px; border: 1px solid #00f2ff; backdrop-filter: blur(10px); pointer-events: none; z-index: 10; }
        #panel-inv { top:20px; left:20px; width:200px; border-left: 4px solid #ffaa00; }
        #panel-quest { top:20px; right:20px; width:240px; border-right: 4px solid #00f2ff; }
        
        #npc-ui-container { position: absolute; top: 0; left: 0; pointer-events: none; width: 100%; height: 100%; z-index: 5; }
        .npc-bubble { 
            position: absolute; background: rgba(0, 5, 10, 0.98); color: #00f2ff; 
            padding: 15px; border: 1px solid #00f2ff; border-radius: 4px;
            font-size: 0.85em; transform: translate(-50%, -100%);
            display: none; width: 280px; box-shadow: 0 0 20px rgba(0,242,255,0.4);
            pointer-events: auto;
        }
        .npc-name { color: #ffaa00; font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid #333; display: block; }
        #bubble-text { margin-bottom: 10px; line-height: 1.4; }
        .choice-btn { 
            display: block; width: 100%; background: rgba(255,255,255,0.05); border: 1px solid #333; 
            color: #00f2ff; text-align: left; padding: 8px; margin-top: 5px; 
            cursor: pointer; font-family: inherit; font-size: 0.9em; transition: 0.2s;
        }
        .choice-btn:hover { background: rgba(0,242,255,0.2); border-color: #00f2ff; }
        button#btn-start { background:#ffaa00; border:none; padding:15px 40px; cursor:pointer; font-weight:bold; font-size:1.2em; color: black; }
    </style>
</head>
<body>
    <div id="start-screen" class="overlay">
        <h1 style="color:#ffaa00; font-size:4em; margin:0; letter-spacing:10px;">MESSENGER</h1>
        <button id="btn-start">INITIALIZE RUNTIME</button>
    </div>

    <div id="panel-inv" class="panel"><h3>STORAGE_UNIT</h3><div id="inv-list">0_CELLS</div></div>
    <div id="panel-quest" class="panel"><h3>MISSION_LOG</h3><div id="quest-list"></div></div>
    
    <div id="npc-ui-container">
        <div id="npc-bubble" class="npc-bubble">
            <span id="bubble-name" class="npc-name"></span>
            <div id="bubble-text"></div>
            <div id="bubble-choices"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/inkjs/2.2.1/ink.min.js"></script>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
        import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

        let story = null;
        let activeNpcId = null;
        let storyData = null;

        // Load the Ink story JSON at startup
        async function loadStory() {
            try {
                const response = await fetch('./NPC_UNIT_ECHO.json');
                if (!response.ok) throw new Error('Failed to load story');
                storyData = await response.json();
            } catch (e) {
                console.error("Failed to load Ink story:", e);
            }
        }
        loadStory();

        // Ink text processing: strip control markers and sanitize HTML tags
        function stripInkMarkers(s) {
            if (!s) return '';
            const rawLines = s.split(/\r?\n/);
            const out = [];
            for (let line of rawLines) {
                let l = (line || '').trim();
                if (l === '#' || l === '/#') continue;
                if (l.startsWith('^')) l = l.slice(1).trim();
                if (l.startsWith('#')) l = l.slice(1).trim();
                if (l) out.push(l);
            }
            return out.join('\n');
        }

        function sanitizeAllowedHtml(dirty) {
            if (!dirty) return '';
            const allowedTags = ['b','strong','i','em','br','p','a','ul','ol','li','span'];
            const allowedAttrs = { 'a': ['href','target','rel'], 'span': ['class'] };

            const container = document.createElement('div');
            container.innerHTML = dirty;

            function cleanNode(node) {
                if (node.nodeType === Node.COMMENT_NODE) { node.remove(); return; }
                if (node.nodeType === Node.ELEMENT_NODE) {
                    const tag = node.tagName.toLowerCase();
                    if (!allowedTags.includes(tag)) {
                        const parent = node.parentNode;
                        while (node.firstChild) parent.insertBefore(node.firstChild, node);
                        parent.removeChild(node);
                        return;
                    }
                    const attrs = Array.from(node.attributes || []);
                    for (const attr of attrs) {
                        const name = attr.name.toLowerCase();
                        const allowedForTag = allowedAttrs[tag] || [];
                        if (!allowedForTag.includes(name)) {
                            node.removeAttribute(attr.name);
                        } else if (tag === 'a' && name === 'href') {
                            const val = node.getAttribute('href') || '';
                            if (/^\s*javascript:/i.test(val) || /^\s*data:/i.test(val)) {
                                node.removeAttribute('href');
                            } else {
                                node.setAttribute('rel','noopener');
                                node.setAttribute('target','_blank');
                            }
                        }
                    }
                }
                let child = node.firstChild;
                while (child) { const next = child.nextSibling; cleanNode(child); child = next; }
            }

            Array.from(container.childNodes).forEach(child => cleanNode(child));
            return container.innerHTML;
        }

        const continueStory = () => {
            const textElement = document.getElementById('bubble-text');
            const choicesElement = document.getElementById('bubble-choices');
            
            let content = "";
            while(story.canContinue) {
                content += story.Continue();
            }
            const cleaned = stripInkMarkers(content);
            console.log('Cleaned:', cleaned);
            textElement.innerHTML = cleaned;
            
            choicesElement.innerHTML = "";
            story.currentChoices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "choice-btn";
                btn.innerText = choice.text;
                btn.onclick = () => {
                    story.ChooseChoiceIndex(choice.index);
                    continueStory();
                };
                choicesElement.appendChild(btn);
            });

            if (story.currentChoices.length === 0 && !story.canContinue) {
                const closeBtn = document.createElement('button');
                closeBtn.className = "choice-btn";
                closeBtn.innerText = "[End Transmission]";
                closeBtn.onclick = () => { document.getElementById('npc-bubble').style.display = 'none'; };
                choicesElement.appendChild(closeBtn);
            }
        };

        const startDialogue = (npcId) => {
            if (!storyData) {
                console.error("Story data not loaded yet");
                return;
            }
            try {
                story = new inkjs.Story(storyData);
                document.getElementById('bubble-name').innerText = npcId.replace('NPC_', '');
                continueStory();
            } catch (e) {
                console.error("Ink Story Error:", e);
                document.getElementById('bubble-text').innerText = "ERROR: DIALOGUE_DATA_CORRUPT";
            }
        };

        // --- STANDARD ENGINE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        const sun = new THREE.DirectionalLight(0xffffff, 2);
        sun.position.set(10, 20, 10);
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0x404040));

        const world = new CANNON.World();
        const planetR = 50;
        const planet = new THREE.Mesh(new THREE.IcosahedronGeometry(planetR, 4), new THREE.MeshToonMaterial({color: 0x1a251a}));
        scene.add(planet);
        world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetR) }));

        const pBody = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5)), fixedRotation: true });
        pBody.position.set(0, planetR + 5, 0);
        world.addBody(pBody);
        const playerMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshToonMaterial({color: 0xff3333}));
        scene.add(playerMesh);

        const npcPos = new THREE.Vector3().setFromSphericalCoords(planetR + 1, 0.1, 0.1);
        const npcMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 1), new THREE.MeshToonMaterial({color: 0x00f2ff}));
        npcMesh.position.copy(npcPos);
        scene.add(npcMesh);

        let started = false;
        document.getElementById('btn-start').onclick = () => { started = true; document.getElementById('start-screen').style.display='none'; };

        function loop() {
            requestAnimationFrame(loop);
            world.step(1/60);
            const pPos = new THREE.Vector3().copy(pBody.position);
            const up = pPos.clone().normalize();
            pBody.applyForce(up.clone().multiplyScalar(-50), pBody.position);

            if(!started) return;

            // Dialogue Trigger
            if(pPos.distanceTo(npcPos) < 6) {
                if(activeNpcId === null) {
                    activeNpcId = "NPC_UNIT_ECHO";
                    document.getElementById('npc-bubble').style.display = 'block';
                    startDialogue(activeNpcId);
                }
                // Update UI Position
                const screenPos = npcPos.clone().add(up.clone().multiplyScalar(3)).project(camera);
                const bubble = document.getElementById('npc-bubble');
                bubble.style.left = (screenPos.x * 0.5 + 0.5) * window.innerWidth + 'px';
                bubble.style.top = (screenPos.y * -0.5 + 0.5) * window.innerHeight + 'px';
            } else {
                activeNpcId = null;
                document.getElementById('npc-bubble').style.display = 'none';
            }

            playerMesh.position.copy(pPos);
            playerMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);
            camera.position.lerp(pPos.clone().add(up.clone().multiplyScalar(15)).add(new THREE.Vector3(10,0,10)), 0.05);
            camera.lookAt(pPos);
            renderer.render(scene, camera);
        }
        loop();
    </script>
</body>
</html>
