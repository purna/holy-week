<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - Quest & Style Integration</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: sans-serif; }
        #ui-main {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px;
            pointer-events: none; border-left: 4px solid #ffaa00;
        }
        #quest-log {
            position: absolute; top: 20px; right: 20px; color: white;
            background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px;
            width: 220px; border-right: 4px solid #00f2ff;
        }
        .quest-item { margin-bottom: 10px; font-size: 0.9em; }
        .complete { text-decoration: line-through; color: #00ffaa; opacity: 0.6; }
        .key { border: 1px solid white; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; }
    </style>
</head>
<body>
    <div id="ui-main">
        <b style="color: #ffaa00;">Messenger Prototype</b><br>
        <div style="margin-top: 5px;"><span class="key">WASD</span> or <span class="key">Arrows</span></div>
        <div style="margin-top: 5px;"><span class="key">Click</span> to Move</div>
    </div>

    <div id="quest-log">
        <b style="color: #00f2ff;">Quest Log</b>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.2); margin: 10px 0;">
        <div id="quest-list"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        // --- 1. CORE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 2. STYLIZED SKYBOX ---
        const skyMat = new THREE.ShaderMaterial({
            side: THREE.BackSide,
            uniforms: { top: { value: new THREE.Color(0x0077ff) }, bot: { value: new THREE.Color(0xffaa00) } },
            vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `varying vec3 vPos; uniform vec3 top; uniform vec3 bot; void main() { float h = normalize(vPos).y * 0.5 + 0.5; gl_FragColor = vec4(mix(bot, top, h), 1.0); }`
        });
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(800, 32, 32), skyMat));

        // --- 3. PHYSICS ---
        const world = new CANNON.World();
        world.gravity.set(0, 0, 0);
        const groundMat = new CANNON.Material("ground");
        const slipperMat = new CANNON.Material("slippery");
        world.addContactMaterial(new CANNON.ContactMaterial(groundMat, slipperMat, { friction: 0, restitution: 0.1 }));

        // --- 4. TOON SHADER ---
        const createToonMat = (color) => new THREE.ShaderMaterial({
            uniforms: { uColor: { value: new THREE.Color(color) }, uSun: { value: new THREE.Vector3(1, 1, 0.5).normalize() } },
            vertexShader: `varying vec3 vN; void main() { vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `varying vec3 vN; uniform vec3 uColor; uniform vec3 uSun; void main() { float d = dot(vN, uSun); float c = d > 0.5 ? 1.0 : (d > 0.1 ? 0.6 : 0.3); gl_FragColor = vec4(uColor * c, 1.0); }`
        });

        // --- 5. THE PLANET & WORLD ---
        const planetRadius = 30;
        const planetMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(planetRadius, 5), createToonMat(0x66cc66));
        scene.add(planetMesh);
        const planetBody = new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetRadius), material: groundMat });
        world.addBody(planetBody);

        const collidables = [planetMesh];
        const prims = [new THREE.BoxGeometry(2,2,2), new THREE.CylinderGeometry(1,1,3), new THREE.SphereGeometry(1.5)];
        for(let i=0; i<40; i++) {
            const m = new THREE.Mesh(prims[i%3], createToonMat(0xdddddd));
            m.position.setFromSphericalCoords(planetRadius, Math.random()*Math.PI, Math.random()*Math.PI*2);
            m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), m.position.clone().normalize());
            scene.add(m); collidables.push(m);
            const b = new CANNON.Body({ mass:0, material: groundMat });
            b.addShape(new CANNON.Box(new CANNON.Vec3(1.5,1.5,1.5)));
            b.position.copy(m.position); b.quaternion.copy(m.quaternion);
            world.addBody(b);
        }

        // --- 6. QUEST SYSTEM & ITEMS ---
        const state = { inventory: [], quests: [
            { id: 'heal', title: 'Heal Injured People', cur: 0, tar: 3 },
            { id: 'relic', title: 'Ancient Relic', cur: 0, tar: 1, req: 'Keycard' }
        ]};

        const questActors = [];
        const spawnActor = (color, type, id, pos) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), createToonMat(color));
            m.position.copy(pos);
            m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), pos.clone().normalize());
            scene.add(m);
            questActors.push({ mesh: m, type, id, active: true });
        };

        // Spawn Quests
        for(let i=0; i<3; i++) {
            const p = new THREE.Vector3().setFromSphericalCoords(planetRadius+1, Math.random()*Math.PI, Math.random()*Math.PI*2);
            spawnActor(0x00ccff, 'heal', 'person', p);
        }
        spawnActor(0xffff00, 'item', 'Keycard', new THREE.Vector3().setFromSphericalCoords(planetRadius+1, 0.5, 0.5));
        spawnActor(0xff00ff, 'relic', 'relic', new THREE.Vector3().setFromSphericalCoords(planetRadius+1, -0.5, -0.5));

        const updateUI = () => {
            const list = document.getElementById('quest-list');
            list.innerHTML = state.quests.map(q => `
                <div class="quest-item ${q.cur >= q.tar ? 'complete' : ''}">
                    ${q.title} (${q.cur}/${q.tar})<br>
                    ${q.req && !state.inventory.includes(q.req) ? '<small style="color:red">Needs: ' + q.req + '</small>' : ''}
                </div>
            `).join('');
        };
        updateUI();

        // --- 7. PLAYER & PARTICLES ---
        const playerGroup = new THREE.Group();
        playerGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.6, 0.8), createToonMat(0xff4444)));
        playerGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.7, 0.9), new THREE.MeshBasicMaterial({color:0, side:THREE.BackSide})));
        scene.add(playerGroup);
        const playerBody = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.4, 0.8, 0.4)), fixedRotation: true, material: slipperMat, linearDamping: 0.9 });
        playerBody.position.set(0, planetRadius+10, 0);
        world.addBody(playerBody);

        const particles = [];
        const createDust = (pos) => {
            for(let i=0; i<8; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,0.3), new THREE.MeshBasicMaterial({color:0xffffff}));
                p.position.copy(pos);
                p.userData = { v: new THREE.Vector3((Math.random()-0.5)*0.2, 0.2, (Math.random()-0.5)*0.2), l: 1.0 };
                scene.add(p); particles.push(p);
            }
        };

        // --- 8. INPUTS & LOOP ---
        const keys = {};
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let targetPt = null;
        window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
        window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;
        window.onmousedown = (e) => {
            mouse.x = (e.clientX/window.innerWidth)*2-1; mouse.y = -(e.clientY/window.innerHeight)*2+1;
            raycaster.setFromCamera(mouse, camera);
            const h = raycaster.intersectObjects(collidables);
            if(h.length>0) targetPt = h[0].point;
        };

        let lastDir = new THREE.Vector3(0,0,1);
        let camSmooth = new THREE.Vector3();
        let inAir = true;

        function loop() {
            requestAnimationFrame(loop);
            world.step(1/60);
            const pPos = new THREE.Vector3().copy(playerBody.position);
            const up = pPos.clone().normalize();
            playerBody.applyForce(up.clone().multiplyScalar(-30), playerBody.position);

            // Impact Check
            if(inAir && pPos.length() - planetRadius < 1.2) { createDust(pPos); inAir = false; }
            if(pPos.length() - planetRadius > 1.5) inAir = true;

            // Trigger Check
            questActors.forEach(a => {
                if(a.active && pPos.distanceTo(a.mesh.position) < 2) {
                    if(a.type === 'heal') { state.quests[0].cur++; a.active = false; scene.remove(a.mesh); }
                    if(a.type === 'item') { state.inventory.push(a.id); a.active = false; scene.remove(a.mesh); }
                    if(a.type === 'relic' && state.inventory.includes('Keycard')) { state.quests[1].cur++; a.active = false; scene.remove(a.mesh); }
                    updateUI();
                }
            });

            // Movement (Your Glide Logic)
            let move = new THREE.Vector3();
            const fwd = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
            const rgt = new THREE.Vector3().crossVectors(up, fwd).normalize();

            if(keys.w || keys.arrowup) move.add(fwd);
            if(keys.s || keys.arrowdown) move.sub(fwd);
            if(keys.a || keys.arrowleft) move.add(rgt);
            if(keys.d || keys.arrowright) move.sub(rgt);

            if(targetPt) {
                const to = new THREE.Vector3().subVectors(targetPt, pPos);
                if(to.length() > 0.5) move.add(to.projectOnPlane(up).normalize()); else targetPt = null;
            }

            if(move.length() > 0) {
                move.normalize(); lastDir.lerp(move, 0.05);
                playerBody.velocity.set(move.x*12, move.y*12, move.z*12);
                const d = new THREE.Object3D(); d.position.copy(pPos);
                d.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), up);
                d.lookAt(pPos.clone().add(move));
                playerGroup.quaternion.slerp(d.quaternion, 0.1);
            }

            // Cinematic Camera
            const camTarget = pPos.clone().add(lastDir.clone().normalize().multiplyScalar(-10)).add(up.multiplyScalar(6)).add(rgt.multiplyScalar(5));
            camSmooth.lerp(camTarget, 0.03);
            camera.position.lerp(camSmooth, 0.05);
            camera.lookAt(pPos.clone().add(lastDir.clone().multiplyScalar(4)).sub(up.clone().multiplyScalar(2)));

            // Particles
            for(let i=particles.length-1; i>=0; i--) {
                particles[i].position.add(particles[i].userData.v);
                particles[i].userData.l -= 0.02;
                particles[i].scale.setScalar(particles[i].userData.l);
                if(particles[i].userData.l <= 0) { scene.remove(particles[i]); particles.splice(i,1); }
            }

            playerGroup.position.copy(playerBody.position);
            renderer.render(scene, camera);
        }
        loop();
    </script>
</body>
</html>
