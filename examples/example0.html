<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spherical Walker</title>
    <style>
        body { margin: 0; overflow: hidden; background: #e0e0e0; }
        #instructions {
            position: absolute; top: 10px; left: 10px;
            font-family: sans-serif; background: rgba(255,255,255,0.8);
            padding: 10px; border-radius: 5px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="instructions">WASD to Walk | Mouse to Rotate Camera</div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        // --- SETUP SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 7);
        scene.add(light, new THREE.AmbientLight(0x404040));

        // --- PHYSICS WORLD ---
        const world = new CANNON.World();
        world.gravity.set(0, 0, 0); // We calculate custom gravity per frame

        // --- THE PLANET ---
        const planetRadius = 10;
        const planetGeo = new THREE.IcosahedronGeometry(planetRadius, 4);
        const planetMat = new THREE.MeshStandardMaterial({ color: 0x66bb66, flatShading: true });
        const planetMesh = new THREE.Mesh(planetGeo, planetMat);
        scene.add(planetMesh);

        const planetBody = new CANNON.Body({
            mass: 0, // static
            shape: new CANNON.Sphere(planetRadius)
        });
        world.addBody(planetBody);

        // --- THE PLAYER ---
        const playerSize = { w: 0.5, h: 1.5, d: 0.5 };
        const playerGeo = new THREE.BoxGeometry(playerSize.w, playerSize.h, playerSize.d);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0xff4444 });
        const playerMesh = new THREE.Mesh(playerGeo, playerMat);
        scene.add(playerMesh);

        const playerBody = new CANNON.Body({
            mass: 1,
            shape: new CANNON.Box(new CANNON.Vec3(playerSize.w/2, playerSize.h/2, playerSize.d/2)),
            fixedRotation: true // Prevents the player from tipping over
        });
        playerBody.position.set(0, planetRadius + 5, 0);
        world.addBody(playerBody);

        // --- INPUTS & CAMERA ---
        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        let camYaw = 0;
        let camPitch = 0.5;
        window.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement) {
                camYaw -= e.movementX * 0.005;
                camPitch = Math.max(0.1, Math.min(1.4, camPitch + e.movementY * 0.005));
            }
        });
        window.addEventListener('click', () => document.body.requestPointerLock());

        // --- ANIMATION LOOP ---
        const moveSpeed = 5;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            world.step(1/60);

            // 1. SPHERICAL GRAVITY
            const playerPos = new THREE.Vector3().copy(playerBody.position);
            const gravityDir = playerPos.clone().normalize().negate();
            const gravityStrength = 15;
            playerBody.applyForce(
                new CANNON.Vec3(gravityDir.x * gravityStrength, gravityDir.y * gravityStrength, gravityDir.z * gravityStrength),
                playerBody.position
            );

            // 2. ALIGN MESH TO SPHERE SURFACE
            const upVec = playerPos.clone().normalize();
            playerMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), upVec);
            
            // 3. CAMERA CALCULATION (Relative to player's Up)
            const camOffset = new THREE.Vector3(
                Math.sin(camYaw) * Math.cos(camPitch),
                Math.sin(camPitch),
                Math.cos(camYaw) * Math.cos(camPitch)
            ).multiplyScalar(10);
            
            // Rotate the camera offset based on player's orientation on the sphere
            camOffset.applyQuaternion(playerMesh.quaternion);
            camera.position.lerp(playerPos.clone().add(camOffset), 0.1);
            camera.lookAt(playerPos);

            // 4. MOVEMENT (Camera-Relative)
            if (keys.w || keys.s || keys.a || keys.d) {
                const forward = new THREE.Vector3().subVectors(playerPos, camera.position);
                // Project forward onto the tangent plane of the sphere
                forward.projectOnPlane(upVec).normalize();
                const right = new THREE.Vector3().crossVectors(upVec, forward).normalize();

                let moveVec = new THREE.Vector3(0, 0, 0);
                if (keys.w) moveVec.add(forward);
                if (keys.s) moveVec.sub(forward);
                if (keys.a) moveVec.add(right);
                if (keys.d) moveVec.sub(right);

                moveVec.normalize().multiplyScalar(moveSpeed);
                playerBody.velocity.x = moveVec.x;
                playerBody.velocity.y = moveVec.y;
                playerBody.velocity.z = moveVec.z;
            }

            // Sync Mesh to Body
            playerMesh.position.copy(playerBody.position);
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
