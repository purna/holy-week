<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger 3D - The Final Polish</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 8px;
            pointer-events: none; border-left: 4px solid #00f2ff;
        }
    </style>
</head>
<body>
    <div id="ui">
        <b style="color: #00f2ff;">Messenger Style: Final Polish</b><br>
        <div style="margin-top: 5px;">WASD/Arrows + Mouse Follow</div>
        <div style="margin-top: 10px; font-size: 0.85em;">
            - Toon Shaded Environment<br>
            - Impact Dust Particles<br>
            - Stylized Gradient Sky
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "cannon": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon';

        // --- 1. SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 2. STYLIZED GRADIENT SKY ---
        const skyGeo = new THREE.SphereGeometry(500, 32, 32);
        const skyMat = new THREE.ShaderMaterial({
            side: THREE.BackSide,
            uniforms: {
                topColor: { value: new THREE.Color(0x0077ff) },
                bottomColor: { value: new THREE.Color(0xffaa00) }
            },
            vertexShader: `
                varying vec3 vWorldPosition;
                void main() {
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vWorldPosition;
                uniform vec3 topColor;
                uniform vec3 bottomColor;
                void main() {
                    float h = normalize(vWorldPosition).y;
                    gl_FragColor = vec4(mix(bottomColor, topColor, max(h, 0.0)), 1.0);
                }
            `
        });
        scene.add(new THREE.Mesh(skyGeo, skyMat));

        // --- 3. PHYSICS & MATERIALS ---
        const world = new CANNON.World();
        world.gravity.set(0, 0, 0);
        const groundMat = new CANNON.Material("ground");
        const slipperMat = new CANNON.Material("slippery");
        world.addContactMaterial(new CANNON.ContactMaterial(groundMat, slipperMat, { friction: 0, restitution: 0.1 }));

        // --- 4. TOON SHADER UTILS ---
        const createToonMat = (color) => new THREE.ShaderMaterial({
            uniforms: { uColor: { value: new THREE.Color(color) }, uLightPos: { value: new THREE.Vector3(1, 1, 0.5).normalize() } },
            vertexShader: `varying vec3 vNormal; void main() { vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `varying vec3 vNormal; uniform vec3 uColor; uniform vec3 uLightPos; void main() { float d = dot(vNormal, uLightPos); float c = d > 0.5 ? 1.0 : (d > 0.1 ? 0.6 : 0.3); gl_FragColor = vec4(uColor * c, 1.0); }`
        });

        // --- 5. WORLD GENERATION ---
        const planetRadius = 30;
        const planetMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(planetRadius, 5), createToonMat(0x66cc66));
        scene.add(planetMesh);
        world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(planetRadius), material: groundMat }));

        const prims = [new THREE.BoxGeometry(2,2,2), new THREE.CylinderGeometry(1,1,3), new THREE.SphereGeometry(1.5)];
        for(let i=0; i<60; i++) {
            const mesh = new THREE.Mesh(prims[i%3], createToonMat(0xdddddd));
            mesh.position.setFromSphericalCoords(planetRadius, Math.random()*Math.PI, Math.random()*Math.PI*2);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), mesh.position.clone().normalize());
            scene.add(mesh);
            const body = new CANNON.Body({ mass:0, material: groundMat });
            body.addShape(new CANNON.Box(new CANNON.Vec3(1.5,1.5,1.5)));
            body.position.copy(mesh.position); body.quaternion.copy(mesh.quaternion);
            world.addBody(body);
        }

        // --- 6. PLAYER & PARTICLES ---
        const playerGroup = new THREE.Group();
        playerGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.6, 0.8), createToonMat(0xff4444)));
        playerGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.7, 0.9), new THREE.MeshBasicMaterial({color:0, side:THREE.BackSide})));
        scene.add(playerGroup);
        const playerBody = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.4, 0.8, 0.4)), fixedRotation: true, material: slipperMat });
        playerBody.position.set(0, planetRadius+10, 0);
        world.addBody(playerBody);

        const particles = [];
        const createImpact = (pos) => {
            for(let i=0; i<10; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.2), new THREE.MeshBasicMaterial({color:0xffffff}));
                p.position.copy(pos);
                p.userData.vel = new THREE.Vector3((Math.random()-0.5)*0.2, Math.random()*0.2, (Math.random()-0.5)*0.2);
                p.userData.life = 1.0;
                scene.add(p);
                particles.push(p);
            }
        };

        // --- 7. CONTROLS & LOOP ---
        const keys = {};
        window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
        window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;
        let wasInAir = true;

        function update() {
            requestAnimationFrame(update);
            world.step(1/60);
            const pPos = new THREE.Vector3().copy(playerBody.position);
            const up = pPos.clone().normalize();
            playerBody.applyForce(up.clone().multiplyScalar(-30), playerBody.position);

            // Impact Detection
            const dist = pPos.length() - planetRadius;
            if(wasInAir && dist < 1.1) { createImpact(pPos); wasInAir = false; }
            if(dist > 1.5) wasInAir = true;

            // Movement
            let moveDir = new THREE.Vector3(0,0,0);
            const fwd = pPos.clone().sub(camera.position).projectOnPlane(up).normalize();
            const rgt = new THREE.Vector3().crossVectors(up, fwd).normalize();
            if(keys.w || keys.arrowup) moveDir.add(fwd);
            if(keys.s || keys.arrowdown) moveDir.sub(fwd);
            if(keys.a || keys.arrowleft) moveDir.add(rgt);
            if(keys.d || keys.arrowright) moveDir.sub(rgt);
            
            if(moveDir.length()>0) {
                moveDir.normalize();
                playerBody.velocity.set(moveDir.x*12, moveDir.y*12, moveDir.z*12);
                const dummy = new THREE.Object3D();
                dummy.position.copy(pPos);
                dummy.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), up);
                dummy.lookAt(pPos.clone().add(moveDir));
                playerGroup.quaternion.slerp(dummy.quaternion, 0.15);
            } else { playerBody.velocity.set(0,0,0); }

            // Camera Rule-of-Thirds
            const targetCam = pPos.clone().add(fwd.multiplyScalar(-10)).add(up.multiplyScalar(6)).add(rgt.multiplyScalar(5));
            camera.position.lerp(targetCam, 0.04);
            camera.lookAt(pPos.clone().add(fwd.multiplyScalar(5)).sub(up.multiplyScalar(2)));

            // Particle Update
            for(let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.position.add(p.userData.vel);
                p.userData.life -= 0.02;
                p.scale.setScalar(p.userData.life);
                if(p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
            }

            playerGroup.position.copy(playerBody.position);
            renderer.render(scene, camera);
        }
        update();
    </script>
</body>
</html>
